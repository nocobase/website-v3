# CMS（cms.aliyun.nocobase.com）的工作流把文章推送到 html/_src/blog/cms/ 后，重新生成博客和客户案例页面并提交回来。
# 用 GITHUB_TOKEN 提交的改动不会再次触发工作流，不会循环。
name: Build blog from CMS

on:
  push:
    branches: [main, cms-sync-test]
    paths:
      - 'html/_src/blog/cms/**'
      - 'html/_src/blog/cms_import.mjs'
      - 'html/_src/blog/gen_blog.py'
      - '.github/workflows/cms-blog.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cms-blog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install marked
        run: cd doc && npm ci
      - name: Import CMS articles and generate pages
        working-directory: html/_src
        run: |
          node blog/cms_import.mjs
          python3 blog/gen_blog.py ..
      - name: Commit generated pages
        run: |
          git add html/_src/blog/posts.json html/blog.html html/blog html/customers.html html/customers
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit -m "blog: regenerate from CMS (${GITHUB_SHA::7})"
          for i in 1 2 3; do git pull --rebase -q && git push && exit 0; sleep 5; done
          exit 1
