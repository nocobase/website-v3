<style>
  .crm-wireframe {
    box-sizing: border-box;
    max-width: 680px;
    margin: 0 auto;
    padding: 16px;
    border: 1px solid #b6b6b6;
    border-radius: 8px;
    background: #f5f5f5;
    color: #292929;
    font: 14px/1.5 system-ui, sans-serif;
  }
  .crm-wireframe .entries {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 215px), 1fr));
    gap: 12px;
  }
  .crm-wireframe .screen {
    padding: 12px;
    border: 1px solid #888;
    border-radius: 5px;
    background: white;
  }
  .crm-wireframe .screen-title { display: block; margin-bottom: 8px; }
  .crm-wireframe .controls { display: flex; flex-wrap: wrap; gap: 6px; }
  .crm-wireframe .controls span {
    padding: 3px 8px;
    border: 1px solid #bbb;
    border-radius: 3px;
    font-size: 12px;
  }
  .crm-wireframe .record { margin-top: 8px; padding-top: 6px; border-top: 1px solid #ccc; }
  .crm-wireframe .route { padding: 6px 0; text-align: center; font-size: 18px; }
  .crm-wireframe .tabs { display: flex; flex-wrap: wrap; gap: 4px 14px; border-bottom: 1px solid #aaa; }
  .crm-wireframe .tabs b { border-bottom: 2px solid currentColor; }
</style>
<div class="crm-wireframe" lang="en">
  <div class="entries">
    <div class="screen">
      <strong class="screen-title">Sales workspace</strong>
      <div class="controls"><span>Customers</span><span>Opportunities</span><span>Quotes</span></div>
      <div class="record">Recent follow-ups<br><u>Reviewed quote with Northstar Labs</u></div>
    </div>
    <div class="screen">
      <strong class="screen-title">Customers</strong>
      <div class="controls"><span>Search by name</span><span>Status ▾</span></div>
      <div class="record">Customer name<br><u>Northstar Labs</u></div>
    </div>
  </div>
  <div class="route" aria-hidden="true">↓</div>
  <div class="screen">
    <strong class="screen-title">Northstar Labs</strong>
    <div class="tabs"><span>Profile</span><span>Contacts</span><b>Follow-ups</b><span>Opportunities</span></div>
    <div class="record">Reviewed quote with Emma<br><small>Next step · Confirm rollout schedule</small></div>
  </div>
</div>
