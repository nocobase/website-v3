<ol class="role-workflow">
  <li class="workflow-stage">
    <div class="workflow-node"><span class="who requester">需求负责人</span><strong>确认业务规则和验收标准</strong></div>
  </li>
  <li class="workflow-stage">
    <div class="workflow-node"><span class="who owner">开发负责人</span><strong>启动开发</strong></div>
  </li>
  <li class="workflow-stage work">
    <div class="workflow-node"><span class="who agent">Agent 团队</span><strong>实现、验证并提交交付报告</strong></div>
    <div class="workflow-branch"><b>有疑问时</b> 需求负责人答疑，开发负责人也可代答。</div>
  </li>
  <li class="workflow-stage review">
    <div class="workflow-node"><span class="who requester">需求负责人</span><strong>验收交付结果</strong></div>
    <div class="workflow-branch"><b>退回修改</b> Agent 根据反馈修改，再次提交验收。</div>
  </li>
  <li class="workflow-stage">
    <div class="workflow-node"><span class="who owner">开发负责人</span><strong>通过后合并 PR 或完成任务</strong></div>
  </li>
</ol>
