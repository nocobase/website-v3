<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
  <title id="title">Studio coordinates development and delivery across applications</title>
  <desc id="desc">Studio connects coding tools and models on runtimes. The Lead Agent assigns work, while people define requirements, make decisions, and accept results. Applications progress through development, checks, acceptance, and delivery. Feedback becomes new work.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#7a8799"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #253348; font-size: 15px; }
      .zone { fill: #f8fafc; stroke: #d7dfe9; }
      .studio { fill: #eff5ff; stroke: #cbdcf3; }
      .card { fill: #fff; stroke: #d4ddea; }
      .heading { font-size: 15px; font-weight: 600; }
      .label { font-size: 13px; font-weight: 600; }
      .sub { font-size: 12px; fill: #56657a; }
      .blue { fill: #4169e1; }
      .flow { fill: none; stroke: #7a8799; stroke-width: 1.4; marker-end: url(#arrow); }
      .done { fill: #eaf1fc; stroke: #c5d5ec; }
      .pending { fill: #fff; stroke: #c6cfdd; stroke-dasharray: 5 4; }
      .active { fill: #4169e1; stroke: #4169e1; }
      .on { fill: #fff; }
      .on-sub { fill: #e4edfc; font-size: 12px; }
    </style>
  </defs>
  <rect width="1000" height="700" rx="12" fill="#fff"/>

  <rect class="zone" x="20" y="20" width="270" height="230" rx="10"/>
  <text class="heading" x="36" y="48">Runtimes</text>
  <text class="sub" x="36" y="73">Containers or virtual machines</text>
  <rect class="card" x="36" y="90" width="238" height="138" rx="8"/>
  <text class="label" x="50" y="116">Execution Agents</text>
  <text x="50" y="147">Claude Code</text><text x="184" y="147">Codex</text>
  <text x="50" y="176">OpenCode</text><text x="184" y="176">…</text>
  <text class="sub" x="50" y="209">Execute work · Return results</text>

  <rect class="studio" x="350" y="20" width="440" height="230" rx="10"/>
  <text class="heading blue" x="366" y="48">NocoBase Studio</text>
  <g class="label">
    <rect class="card" x="366" y="68" width="196" height="44" rx="7"/><text x="382" y="96">Projects</text>
    <rect class="card" x="574" y="68" width="200" height="44" rx="7"/><text x="590" y="96">Tasks</text>
    <rect class="card" x="366" y="124" width="196" height="44" rx="7"/><text x="382" y="152">Agents</text>
    <rect class="card" x="574" y="124" width="200" height="44" rx="7"/><text x="590" y="152">Skills &amp; project memory</text>
    <rect class="card" x="366" y="180" width="196" height="44" rx="7"/><text x="382" y="208">Quality</text>
    <rect class="card" x="574" y="180" width="200" height="44" rx="7"/><text x="590" y="208">Releases</text>
  </g>
  <path class="flow" d="M350 140H290"/><text class="sub" x="320" y="129" text-anchor="middle">Assign</text>
  <rect class="zone" x="850" y="90" width="130" height="106" rx="8"/>
  <text class="heading" x="915" y="118" text-anchor="middle">People</text>
  <text class="sub" x="915" y="146" text-anchor="middle">Requests · Decisions</text>
  <text class="sub" x="915" y="173" text-anchor="middle">Accept · Release</text>
  <path class="flow" d="M790 140H850" marker-start="url(#arrow)"/><text class="sub" x="820" y="129" text-anchor="middle">Work together</text>

  <path class="flow" d="M155 250V310"/><text class="sub" x="167" y="283">Commit code and open PRs</text>
  <path class="flow" d="M570 250V310"/><text class="sub" x="582" y="283">Track work, acceptance, and versions</text>

  <rect class="zone" x="20" y="310" width="960" height="370" rx="10"/>
  <text class="heading" x="36" y="340">Applications</text><text class="sub" x="132" y="340">Repositories, tasks, and versions</text>
  <g text-anchor="middle">
    <text class="label blue" x="274" y="376">Continuous development</text><text class="sub" x="274" y="398">Requirements · Design · Code</text>
    <text class="label blue" x="472" y="376">Checks and review</text><text class="sub" x="472" y="398">Tests · Code review</text>
    <text class="label blue" x="670" y="376">Acceptance and quality</text><text class="sub" x="670" y="398">Delivery report · Quality plan</text>
    <text class="label blue" x="868" y="376">Release and delivery</text><text class="sub" x="868" y="398">Versions · Artifacts · Records</text>
  </g>

  <g transform="translate(0 416)">
    <rect class="card" x="36" width="136" height="56" rx="7"/><text class="label" x="50" y="23">App A</text><text class="sub" x="50" y="44">In development</text>
    <rect class="active" x="186" width="176" height="56" rx="7"/><text class="label on" x="200" y="23">Build business features</text><text class="on-sub" x="200" y="44">Submit code and PRs</text>
    <rect class="pending" x="384" width="176" height="56" rx="7"/><text class="label" x="398" y="23">Test · Review</text><text class="sub" x="398" y="44">Find and fix issues</text>
    <rect class="pending" x="582" width="176" height="56" rx="7"/><text class="label" x="596" y="23">Accept · Merge</text><text class="sub" x="596" y="44">Verify results · Follow up</text>
    <rect class="pending" x="780" width="176" height="56" rx="7"/><text class="label" x="794" y="23">Publish release</text><text class="sub" x="794" y="44">Record production version</text>
    <path class="flow" d="M362 28H382"/><path class="flow" d="M560 28H580"/><path class="flow" d="M758 28H778"/>
  </g>
  <g transform="translate(0 488)">
    <rect class="card" x="36" width="136" height="56" rx="7"/><text class="label" x="50" y="23">App B</text><text class="sub" x="50" y="44">In testing</text>
    <rect class="done" x="186" width="176" height="56" rx="7"/><text class="label" x="200" y="23">Build business features</text><text class="sub" x="200" y="44">Submit code and PRs</text>
    <rect class="active" x="384" width="176" height="56" rx="7"/><text class="label on" x="398" y="23">Test · Review</text><text class="on-sub" x="398" y="44">Find and fix issues</text>
    <rect class="pending" x="582" width="176" height="56" rx="7"/><text class="label" x="596" y="23">Accept · Merge</text><text class="sub" x="596" y="44">Verify results · Follow up</text>
    <rect class="pending" x="780" width="176" height="56" rx="7"/><text class="label" x="794" y="23">Publish release</text><text class="sub" x="794" y="44">Record production version</text>
    <path class="flow" d="M362 28H382"/><path class="flow" d="M560 28H580"/><path class="flow" d="M758 28H778"/>
  </g>
  <g transform="translate(0 560)">
    <rect class="card" x="36" width="136" height="56" rx="7"/><text class="label" x="50" y="23">App C</text><text class="sub" x="50" y="44">Releasing</text>
    <rect class="done" x="186" width="176" height="56" rx="7"/><text class="label" x="200" y="23">Build business features</text><text class="sub" x="200" y="44">Submit code and PRs</text>
    <rect class="done" x="384" width="176" height="56" rx="7"/><text class="label" x="398" y="23">Test · Review</text><text class="sub" x="398" y="44">Find and fix issues</text>
    <rect class="done" x="582" width="176" height="56" rx="7"/><text class="label" x="596" y="23">Accept · Merge</text><text class="sub" x="596" y="44">Verify results · Follow up</text>
    <rect class="active" x="780" width="176" height="56" rx="7"/><text class="label on" x="794" y="23">Publish release</text><text class="on-sub" x="794" y="44">Record production version</text>
    <path class="flow" d="M362 28H382"/><path class="flow" d="M560 28H580"/><path class="flow" d="M758 28H778"/>
  </g>
  <path class="flow" d="M868 616V638H274V616"/>
  <text class="sub" x="571" y="662" text-anchor="middle">Turn new requests and feedback into tasks. Keep improving.</text>
</svg>
