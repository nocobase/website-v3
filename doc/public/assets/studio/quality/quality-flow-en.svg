  <text x="900" y="62" text-anchor="middle" font-size="36" font-weight="700" fill="#14213d">NocoBase Studio quality testing: from triggers to fixes</text>
  <text x="900" y="100" text-anchor="middle" font-size="19" fill="#5a6785">Four test types, one engine: run five dimensions in parallel, collect reports, and turn findings into tasks</text>

  
