    <rect x="1534" y="348" width="56" height="26" rx="13" fill="#dcfce7" /><text x="1562" y="366" text-anchor="middle" fill="#15803d">整理</text>
    <rect x="1598" y="348" width="56" height="26" rx="13" fill="#fef3c7" /><text x="1626" y="366" text-anchor="middle" fill="#b45309">性能</text>
    <rect x="1662" y="348" width="68" height="26" rx="13" fill="#e6edff" /><text x="1696" y="366" text-anchor="middle" fill="#2447c9">依存</text>
