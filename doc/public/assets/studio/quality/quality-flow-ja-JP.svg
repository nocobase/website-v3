    <text x="758" y="234" font-size="14" fill="#5a6785">Playwright・Vitest・ブラウザー操作</text>

    <rect x="730" y="270" width="8" height="86" rx="4" fill="#8b5cf6" />
    <text x="758" y="304" font-size="20" font-weight="700" fill="#14213d">権限</text>
    <text x="758" y="334" font-size="14" fill="#5a6785">権限エンジン・複数アカウントで対照</text>

    <rect x="730" y="370" width="8" height="86" rx="4" fill="#ef4444" />
    <text x="758" y="404" font-size="20" font-weight="700" fill="#14213d">セキュリティ</text>
    <text x="758" y="434" font-size="14" fill="#5a6785">OWASP ZAP・gitleaks・pnpm audit</text>

