  <g text-anchor="middle">
    <text x="252" y="852" font-size="21" font-weight="700" fill="#2447c9">テストの自動化</text>
    <text x="252" y="884" font-size="15" fill="#5a6785">開始、実行、問題の登録を自動化</text>
    <text x="684" y="852" font-size="21" font-weight="700" fill="#2447c9">共通エンジン</text>
    <text x="684" y="884" font-size="15" fill="#5a6785">四つの実行方法で基準と手順を共有</text>
    <text x="1116" y="852" font-size="21" font-weight="700" fill="#2447c9">五つの評価項目</text>
    <text x="1116" y="884" font-size="15" fill="#5a6785">実測ツールを使い、項目ごとに報告</text>
    <text x="1548" y="852" font-size="21" font-weight="700" fill="#2447c9">問題への対応</text>
    <text x="1548" y="884" font-size="15" fill="#5a6785">タスクで修正し、後続テストで検証</text>
