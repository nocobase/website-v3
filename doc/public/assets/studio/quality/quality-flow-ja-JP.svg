  <text x="1250" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d" textLength="215" lengthAdjust="spacingAndGlyphs">Studio 品質レポート</text>
  <text x="1250" y="318" text-anchor="middle" font-size="14" fill="#5a6785">結果を自動収集・判定</text>
  <g font-size="16" fill="#14213d">
    <text x="1158" y="360">機能</text><rect x="1254" y="343" width="92" height="24" rx="12" fill="#dcfce7" /><text x="1300" y="360" text-anchor="middle" font-size="13" fill="#15803d">合格</text>
    <text x="1158" y="396">権限</text><rect x="1254" y="379" width="92" height="24" rx="12" fill="#dcfce7" /><text x="1300" y="396" text-anchor="middle" font-size="13" fill="#15803d">合格</text>
    <text x="1158" y="432" textLength="90" lengthAdjust="spacingAndGlyphs">セキュリティ</text><rect x="1254" y="415" width="92" height="24" rx="12" fill="#fee2e2" /><text x="1300" y="432" text-anchor="middle" font-size="13" fill="#b91c1c">問題あり</text>
    <text x="1158" y="468">性能</text><rect x="1254" y="451" width="92" height="24" rx="12" fill="#fef3c7" /><text x="1300" y="468" text-anchor="middle" font-size="13" fill="#b45309">一部未検証</text>
    <text x="1158" y="504">コード品質</text><rect x="1254" y="487" width="92" height="24" rx="12" fill="#dcfce7" /><text x="1300" y="504" text-anchor="middle" font-size="13" fill="#15803d">合格</text>
