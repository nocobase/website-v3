  <rect width="1800" height="960" fill="url(#bg)" />

  
  <text x="900" y="62" text-anchor="middle" font-size="36" font-weight="700" fill="#14213d">NocoBase Studio 品質テスト：開始から修正まで</text>
  <text x="900" y="100" text-anchor="middle" font-size="19" fill="#5a6785">四つの実行方法と共通エンジン。五つの評価項目を並列実行し、結果をレポートにまとめ、問題をタスク化</text>

  
  <g font-size="18" font-weight="700" fill="#2447c9">
