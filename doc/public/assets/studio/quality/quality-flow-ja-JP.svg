  <text x="530" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#fff" textLength="215" lengthAdjust="spacingAndGlyphs">品質テストエンジン</text>
  <g font-size="16" fill="#e6edff" text-anchor="middle">
    <text x="530" y="420">テスト範囲を確定</text>
    <text x="530" y="450">対象バージョンをビルド</text>
    <text x="530" y="480">環境とデータを準備</text>
    <text x="530" y="510">評価項目ごとに分担</text>
