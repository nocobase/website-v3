    <text x="758" y="504" font-size="20" font-weight="700" fill="#14213d">性能</text>
    <text x="758" y="534" font-size="14" fill="#5a6785">Lighthouse・API 測定・SQL 分析</text>

    <rect x="730" y="570" width="8" height="86" rx="4" fill="#13a36e" />
    <text x="758" y="604" font-size="20" font-weight="700" fill="#14213d">コード品質</text>
    <text x="758" y="634" font-size="14" fill="#5a6785">jscpd・knip・sonarjs・カバレッジ</text>
  </g>
