    <text x="530" y="152" text-anchor="middle">② 共通のテストエンジン</text>
    <text x="890" y="152" text-anchor="middle">③ テストマシンで並列実行</text>
    <text x="1250" y="152" text-anchor="middle">④ レポートを自動生成</text>
    <text x="1600" y="152" text-anchor="middle">⑤ 問題への対応</text>
  </g>

  
