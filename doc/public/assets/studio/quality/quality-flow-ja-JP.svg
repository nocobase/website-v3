  <g>
    <circle cx="92" cy="212" r="20" fill="#e6edff" /><text x="92" y="219" text-anchor="middle" font-size="18" fill="#2447c9">日</text>
    <text x="124" y="208" font-size="21" font-weight="700" fill="#14213d">日次テスト</text>
    <text x="124" y="236" font-size="15" fill="#5a6785">新たに完了した業務タスク</text>
    <text x="124" y="260" font-size="14" fill="#3b6cf6">毎日の定時に自動実行</text>

    <circle cx="92" cy="342" r="20" fill="#e6edff" /><text x="92" y="349" text-anchor="middle" font-size="18" fill="#2447c9">発</text>
    <text x="124" y="338" font-size="21" font-weight="700" fill="#14213d">リリーステスト</text>
    <text x="124" y="366" font-size="15" fill="#5a6785">リリース待ちのタスク</text>
    <text x="124" y="390" font-size="14" fill="#3b6cf6">設定した件数で自動実行</text>

    <circle cx="92" cy="472" r="20" fill="#e6edff" /><text x="92" y="479" text-anchor="middle" font-size="18" fill="#2447c9">全</text>
    <text x="124" y="468" font-size="21" font-weight="700" fill="#14213d">プロジェクトテスト</text>
    <text x="124" y="496" font-size="15" fill="#5a6785">全体の機能とコアシナリオ</text>
    <text x="124" y="520" font-size="14" fill="#3b6cf6">毎週または毎月に実行</text>

    <circle cx="92" cy="602" r="20" fill="#e6edff" /><text x="92" y="609" text-anchor="middle" font-size="18" fill="#2447c9">選</text>
    <text x="124" y="598" font-size="21" font-weight="700" fill="#14213d">カスタムテスト</text>
    <text x="124" y="626" font-size="15" fill="#5a6785">タスクと評価項目を選択</text>
    <text x="124" y="650" font-size="14" fill="#3b6cf6">必要なときに開始</text>
  </g>

  
