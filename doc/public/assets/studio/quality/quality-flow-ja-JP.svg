    <rect x="958" y="284" width="78" height="26" rx="13" fill="#e6edff" /><text x="997" y="302" text-anchor="middle" textLength="65" lengthAdjust="spacingAndGlyphs">マシン 2</text>
    <rect x="958" y="384" width="78" height="26" rx="13" fill="#e6edff" /><text x="997" y="402" text-anchor="middle" textLength="65" lengthAdjust="spacingAndGlyphs">マシン 3</text>
    <rect x="958" y="484" width="78" height="26" rx="13" fill="#e6edff" /><text x="997" y="502" text-anchor="middle" textLength="65" lengthAdjust="spacingAndGlyphs">マシン 4</text>
    <rect x="958" y="584" width="78" height="26" rx="13" fill="#e6edff" /><text x="997" y="602" text-anchor="middle" textLength="65" lengthAdjust="spacingAndGlyphs">マシン 5</text>
  </g>

  
