<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="960" viewBox="0 0 1800 960" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','WenQuanYi Zen Hei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f7ff"/>
      <stop offset="1" stop-color="#eaf1ff"/>
    </linearGradient>
    <linearGradient id="engine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b6cf6"/>
      <stop offset="1" stop-color="#2447c9"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#13a36e"/>
      <stop offset="1" stop-color="#3b6cf6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1d3a8a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7d93c9"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#13a36e"/>
    </marker>
  </defs>

  <rect width="1800" height="960" fill="url(#bg)"/>

  <!-- Title -->
  <text x="900" y="62" text-anchor="middle" font-size="36" font-weight="700" fill="#14213d">NocoBase Studio 质量测试：从触发到修复，全程自动</text>
  <text x="900" y="100" text-anchor="middle" font-size="19" fill="#5a6785">四种触发方式，同一套测试引擎；五个维度分发到多台测试机并行执行，结果自动汇总成报告，问题自动变成任务</text>

  <!-- Column headers -->
  <g font-size="18" font-weight="700" fill="#2447c9">
    <text x="190" y="152" text-anchor="middle">① 多种测试方式</text>
    <text x="530" y="152" text-anchor="middle">② 同一套测试引擎</text>
    <text x="890" y="152" text-anchor="middle">③ 多台测试机并行</text>
    <text x="1250" y="152" text-anchor="middle">④ 自动生成报告</text>
    <text x="1600" y="152" text-anchor="middle">⑤ 问题自动闭环</text>
  </g>

  <!-- Connectors: triggers -> engine -->
  <g fill="none" stroke="#7d93c9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M330 225 C370 225 370 420 406 420"/>
    <path d="M330 355 C370 355 370 420 406 420"/>
    <path d="M330 485 C370 485 370 420 406 420"/>
    <path d="M330 615 C370 615 370 420 406 420"/>
  </g>
  <!-- engine -> runners -->
  <g fill="none" stroke="#7d93c9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M650 420 C690 420 690 213 726 213"/>
    <path d="M650 420 C690 420 690 313 726 313"/>
    <path d="M650 420 C690 420 690 413 726 413"/>
    <path d="M650 420 C690 420 690 513 726 513"/>
    <path d="M650 420 C690 420 690 613 726 613"/>
  </g>
  <!-- runners -> report -->
  <g fill="none" stroke="#7d93c9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M1050 213 C1090 213 1090 420 1126 420"/>
    <path d="M1050 313 C1090 313 1090 420 1126 420"/>
    <path d="M1050 413 C1090 413 1090 420 1126 420"/>
    <path d="M1050 513 C1090 513 1090 420 1126 420"/>
    <path d="M1050 613 C1090 613 1090 420 1126 420"/>
  </g>
  <!-- report -> follow-ups -->
  <g fill="none" stroke="#7d93c9" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M1370 420 C1410 420 1410 235 1446 235"/>
    <path d="M1370 420 C1410 420 1410 430 1446 430"/>
  </g>

  <!-- ① Triggers -->
  <g filter="url(#shadow)">
    <rect x="50" y="170" width="280" height="110" rx="16" fill="#fff"/>
    <rect x="50" y="300" width="280" height="110" rx="16" fill="#fff"/>
    <rect x="50" y="430" width="280" height="110" rx="16" fill="#fff"/>
    <rect x="50" y="560" width="280" height="110" rx="16" fill="#fff"/>
  </g>
  <g>
    <circle cx="92" cy="212" r="20" fill="#e6edff"/><text x="92" y="219" text-anchor="middle" font-size="18" fill="#2447c9">日</text>
    <text x="124" y="208" font-size="21" font-weight="700" fill="#14213d">每日测试</text>
    <text x="124" y="236" font-size="15" fill="#5a6785">每天新完成的需求</text>
    <text x="124" y="260" font-size="14" fill="#3b6cf6">每天定时自动触发</text>

    <circle cx="92" cy="342" r="20" fill="#e6edff"/><text x="92" y="349" text-anchor="middle" font-size="18" fill="#2447c9">发</text>
    <text x="124" y="338" font-size="21" font-weight="700" fill="#14213d">发布测试</text>
    <text x="124" y="366" font-size="15" fill="#5a6785">待发布的这一批任务</text>
    <text x="124" y="390" font-size="14" fill="#3b6cf6">待发布任务够数自动触发</text>

    <circle cx="92" cy="472" r="20" fill="#e6edff"/><text x="92" y="479" text-anchor="middle" font-size="18" fill="#2447c9">全</text>
    <text x="124" y="468" font-size="21" font-weight="700" fill="#14213d">项目测试</text>
    <text x="124" y="496" font-size="15" fill="#5a6785">全部功能和核心场景</text>
    <text x="124" y="520" font-size="14" fill="#3b6cf6">每周或每月定时触发</text>

    <circle cx="92" cy="602" r="20" fill="#e6edff"/><text x="92" y="609" text-anchor="middle" font-size="18" fill="#2447c9">选</text>
    <text x="124" y="598" font-size="21" font-weight="700" fill="#14213d">自定义测试</text>
    <text x="124" y="626" font-size="15" fill="#5a6785">自己选任务、选维度</text>
    <text x="124" y="650" font-size="14" fill="#3b6cf6">随时一键发起</text>
  </g>

  <!-- ② Engine -->
  <g filter="url(#shadow)">
    <rect x="410" y="250" width="240" height="340" rx="22" fill="url(#engine)"/>
  </g>
  <circle cx="530" cy="315" r="34" fill="#ffffff" fill-opacity="0.18"/>
  <g stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round">
    <circle cx="530" cy="315" r="13"/>
    <path d="M530 290v8M530 332v8M505 315h8M547 315h8M512 297l6 6M542 327l6 6M512 333l6-6M542 303l6-6"/>
  </g>
  <text x="530" y="380" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">质量测试引擎</text>
  <g font-size="16" fill="#e6edff" text-anchor="middle">
    <text x="530" y="420">确定测试范围</text>
    <text x="530" y="450">构建被测版本</text>
    <text x="530" y="480">准备测试环境和数据</text>
    <text x="530" y="510">按维度拆分任务</text>
  </g>
  <rect x="440" y="535" width="180" height="32" rx="16" fill="#ffffff" fill-opacity="0.18"/>
  <text x="530" y="557" text-anchor="middle" font-size="15" fill="#fff">内置标准 · 可自定义</text>

  <!-- ③ Runners -->
  <g filter="url(#shadow)">
    <rect x="730" y="170" width="320" height="86" rx="14" fill="#fff"/>
    <rect x="730" y="270" width="320" height="86" rx="14" fill="#fff"/>
    <rect x="730" y="370" width="320" height="86" rx="14" fill="#fff"/>
    <rect x="730" y="470" width="320" height="86" rx="14" fill="#fff"/>
    <rect x="730" y="570" width="320" height="86" rx="14" fill="#fff"/>
  </g>
  <g>
    <rect x="730" y="170" width="8" height="86" rx="4" fill="#3b6cf6"/>
    <text x="758" y="204" font-size="20" font-weight="700" fill="#14213d">功能</text>
    <text x="758" y="234" font-size="14" fill="#5a6785">Playwright · Vitest · 浏览器实测</text>

    <rect x="730" y="270" width="8" height="86" rx="4" fill="#8b5cf6"/>
    <text x="758" y="304" font-size="20" font-weight="700" fill="#14213d">权限</text>
    <text x="758" y="334" font-size="14" fill="#5a6785">权限引擎 · 多身份越权对照</text>

    <rect x="730" y="370" width="8" height="86" rx="4" fill="#ef4444"/>
    <text x="758" y="404" font-size="20" font-weight="700" fill="#14213d">安全</text>
    <text x="758" y="434" font-size="14" fill="#5a6785">OWASP ZAP · gitleaks · pnpm audit</text>

    <rect x="730" y="470" width="8" height="86" rx="4" fill="#f59e0b"/>
    <text x="758" y="504" font-size="20" font-weight="700" fill="#14213d">性能</text>
    <text x="758" y="534" font-size="14" fill="#5a6785">Lighthouse · 接口采样 · SQL 分析</text>

    <rect x="730" y="570" width="8" height="86" rx="4" fill="#13a36e"/>
    <text x="758" y="604" font-size="20" font-weight="700" fill="#14213d">代码质量</text>
    <text x="758" y="634" font-size="14" fill="#5a6785">jscpd · knip · sonarjs · 覆盖率</text>
  </g>
  <g font-size="13" fill="#2447c9">
    <rect x="958" y="184" width="78" height="26" rx="13" fill="#e6edff"/><text x="997" y="202" text-anchor="middle">测试机 1</text>
    <rect x="958" y="284" width="78" height="26" rx="13" fill="#e6edff"/><text x="997" y="302" text-anchor="middle">测试机 2</text>
    <rect x="958" y="384" width="78" height="26" rx="13" fill="#e6edff"/><text x="997" y="402" text-anchor="middle">测试机 3</text>
    <rect x="958" y="484" width="78" height="26" rx="13" fill="#e6edff"/><text x="997" y="502" text-anchor="middle">测试机 4</text>
    <rect x="958" y="584" width="78" height="26" rx="13" fill="#e6edff"/><text x="997" y="602" text-anchor="middle">测试机 5</text>
  </g>

  <!-- ④ Report -->
  <g filter="url(#shadow)">
    <rect x="1130" y="250" width="240" height="340" rx="22" fill="#fff"/>
  </g>
  <text x="1250" y="292" text-anchor="middle" font-size="22" font-weight="700" fill="#14213d">Studio 质量报告</text>
  <text x="1250" y="318" text-anchor="middle" font-size="14" fill="#5a6785">结果自动收回、自动判定</text>
  <g font-size="16" fill="#14213d">
    <text x="1158" y="360">功能</text><rect x="1254" y="343" width="92" height="24" rx="12" fill="#dcfce7"/><text x="1300" y="360" text-anchor="middle" font-size="13" fill="#15803d">通过</text>
    <text x="1158" y="396">权限</text><rect x="1254" y="379" width="92" height="24" rx="12" fill="#dcfce7"/><text x="1300" y="396" text-anchor="middle" font-size="13" fill="#15803d">通过</text>
    <text x="1158" y="432">安全</text><rect x="1254" y="415" width="92" height="24" rx="12" fill="#fee2e2"/><text x="1300" y="432" text-anchor="middle" font-size="13" fill="#b91c1c">有问题</text>
    <text x="1158" y="468">性能</text><rect x="1254" y="451" width="92" height="24" rx="12" fill="#fef3c7"/><text x="1300" y="468" text-anchor="middle" font-size="13" fill="#b45309">部分未验证</text>
    <text x="1158" y="504">代码质量</text><rect x="1254" y="487" width="92" height="24" rx="12" fill="#dcfce7"/><text x="1300" y="504" text-anchor="middle" font-size="13" fill="#15803d">通过</text>
  </g>
  <line x1="1158" y1="528" x2="1342" y2="528" stroke="#e3e8f5"/>
  <text x="1250" y="560" text-anchor="middle" font-size="15" fill="#2447c9">维度报告 + 交付报告</text>

  <!-- ⑤ Follow-ups -->
  <g filter="url(#shadow)">
    <rect x="1450" y="170" width="300" height="130" rx="16" fill="#fff"/>
    <rect x="1450" y="330" width="300" height="200" rx="16" fill="#fff"/>
  </g>
  <rect x="1470" y="188" width="70" height="26" rx="13" fill="#fef3c7"/><text x="1505" y="206" text-anchor="middle" font-size="14" fill="#b45309">待确认</text>
  <text x="1470" y="242" font-size="18" font-weight="700" fill="#14213d">人来拍板</text>
  <text x="1470" y="270" font-size="14" fill="#5a6785">规则不明的地方由人决定</text>
  <text x="1470" y="290" font-size="14" fill="#5a6785">修复，或者不修复</text>

  <g font-size="13">
    <rect x="1470" y="348" width="56" height="26" rx="13" fill="#fee2e2"/><text x="1498" y="366" text-anchor="middle" fill="#b91c1c">缺陷</text>
    <rect x="1534" y="348" width="56" height="26" rx="13" fill="#dcfce7"/><text x="1562" y="366" text-anchor="middle" fill="#15803d">清理</text>
    <rect x="1598" y="348" width="56" height="26" rx="13" fill="#fef3c7"/><text x="1626" y="366" text-anchor="middle" fill="#b45309">性能</text>
    <rect x="1662" y="348" width="68" height="26" rx="13" fill="#e6edff"/><text x="1696" y="366" text-anchor="middle" fill="#2447c9">依赖</text>
  </g>
  <text x="1470" y="406" font-size="18" font-weight="700" fill="#14213d">自动进入开发工作流</text>
  <g font-size="15" fill="#5a6785">
    <text x="1470" y="442">① Agent 自动修复</text>
    <text x="1470" y="472">② Agent 自动评审</text>
    <text x="1470" y="502">③ 合入，下次测试再验证</text>
  </g>
  <path d="M1600 300 V326" fill="none" stroke="#7d93c9" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="1612" y="319" font-size="13" fill="#5a6785">确认要修</text>

  <!-- Loop back -->
  <path d="M1600 530 V720 Q1600 750 1570 750 H220 Q190 750 190 720 V676" fill="none" stroke="url(#loop)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrowGreen)"/>
  <rect x="660" y="730" width="480" height="40" rx="20" fill="#fff" filter="url(#shadow)"/>
  <text x="900" y="757" text-anchor="middle" font-size="18" font-weight="700" fill="#13a36e">修复合入 → 下次测试再验证 → 质量越来越好</text>

  <!-- Highlights -->
  <g filter="url(#shadow)">
    <rect x="50" y="810" width="404" height="100" rx="16" fill="#fff"/>
    <rect x="482" y="810" width="404" height="100" rx="16" fill="#fff"/>
    <rect x="914" y="810" width="404" height="100" rx="16" fill="#fff"/>
    <rect x="1346" y="810" width="404" height="100" rx="16" fill="#fff"/>
  </g>
  <g text-anchor="middle">
    <text x="252" y="852" font-size="21" font-weight="700" fill="#2447c9">全程自动</text>
    <text x="252" y="884" font-size="15" fill="#5a6785">从触发、执行到登记问题，无需人工值守</text>
    <text x="684" y="852" font-size="21" font-weight="700" fill="#2447c9">一套引擎</text>
    <text x="684" y="884" font-size="15" fill="#5a6785">四种测试方式，同一套标准和流程</text>
    <text x="1116" y="852" font-size="21" font-weight="700" fill="#2447c9">五个维度</text>
    <text x="1116" y="884" font-size="15" fill="#5a6785">成熟测试工具实测，每个维度一份报告</text>
    <text x="1548" y="852" font-size="21" font-weight="700" fill="#2447c9">问题闭环</text>
    <text x="1548" y="884" font-size="15" fill="#5a6785">问题自动变任务，修复后再验证</text>
  </g>
</svg>
