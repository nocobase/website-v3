meta:
  title:
    zh: 联系我们 — NocoBase
    en: Contact Us — NocoBase
  description:
    zh: 需要产品咨询和商业服务咨询，都可以通过邮箱、微信或表单联系 NocoBase。
    en: Reach NocoBase by email or through the form for sales, and commercial services.
items:
  "000":
    en: Contact Us
    zh: 联系我们
    where: phero
  "001":
    en: Contact us. <span class="m">Tell us what you want to build.</span>
    zh: 联系我们，<span class="m">聊聊你想做的系统。</span>
    where: phero
  "002":
    en: For sales, and commercial services, reach us here. For technical questions, the <a href="https://forum.nocobase.com/" target="_blank" rel="noopener">community forum</a> is the best place to ask.
    zh: 需要产品咨询和商业服务咨询，都可以与我们联系。使用中遇到的技术问题，欢迎到<a href="https://forum.nocobase.com/" target="_blank" rel="noopener">社区论坛</a>交流。
    where: phero
  "003":
    en: Get in touch
    zh: 和我们聊聊
    where: contact
  "004":
    en: Fill in the form and we’ll get back to you soon, or write to us directly.
    zh: 填写右侧表单，我们会尽快联系你；也可以直接写信或加微信。
    where: contact
