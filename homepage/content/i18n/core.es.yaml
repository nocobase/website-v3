title: NocoBase Core — Deja que los agentes se centren en tu lógica de negocio
description: NocoBase Core es la base de aplicaciones de código abierto detrás de NocoBase Studio. Permisos, flujos de trabajo, archivos y capacidades de IA vienen listos para usar para que los agentes solo desarrollen tu lógica de negocio sobre una misma arquitectura, y las apps funcionen de forma independiente.
strings:
  "000": Deja que los agentes se centren en tu lógica de negocio. <span class="m">La base ya está lista.</span>
  "002": Inicio rápido
  "003": Ver los componentes base
  "004": Gratuito, de código abierto y listo para producción
  "005": Tu código y tus datos te pertenecen
  "006": Compatible con Claude Code, Codex y decenas de herramientas de programación más
  "008": Componentes probados, <span class="m">listos para usar.</span>
  "009": "Aunque la IA escriba el código, los permisos, los motores de flujos de trabajo y las aprobaciones son difíciles de diseñar desde cero: están llenos de casos límite y exigen mucho mantenimiento. Core ofrece componentes base listos para usar, que NocoBase mantiene y actualiza continuamente. Los agentes solo desarrollan la lógica de negocio, así que hay mucho menos código que escribir y verificar."
