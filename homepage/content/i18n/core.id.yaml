notes: |-
  Bahasa Indonesia（Anda）
  术语：foundation = fondasi；building blocks = komponen dasar；governance = tata kelola；agent team = tim agen；
  coding agent = agen coding；business logic = logika bisnis；business systems = sistem bisnis；vibe coding = vibe coding；
  self-hosted = self-hosted；at a glance = terlihat sekilas
title: NocoBase Core — Biarkan agen fokus pada logika bisnis Anda
description: NocoBase Core adalah fondasi aplikasi open source di balik NocoBase Studio. Izin akses, alur kerja, file, dan kemampuan AI siap pakai sehingga agen hanya membangun logika bisnis Anda di atas satu arsitektur, dan aplikasi berjalan mandiri.
strings:
  "000": Biarkan agen fokus pada logika bisnis Anda. <span class="m">Fondasinya sudah siap.</span>
  "002": Mulai cepat
  "003": Lihat komponen dasar
  "004": Gratis, open source, dan siap untuk produksi
  "005": Kode dan data milik Anda
  "006": Bekerja dengan Claude Code, Codex, dan puluhan alat coding lainnya
  "008": Komponen dasar yang teruji, <span class="m">siap pakai.</span>
  "009": "Meski kodenya ditulis AI, izin akses, mesin alur kerja, dan persetujuan tetap sulit dirancang dari nol: banyak kasus tepi dan perawatannya berat. Core menyediakan komponen dasar siap pakai yang terus dipelihara dan ditingkatkan oleh NocoBase. Agen hanya membangun logika bisnis, sehingga kode yang perlu ditulis dan diverifikasi jauh lebih sedikit."
  "010": Pengguna dan izin akses
  "011": Masuk dan sesi
  "012": Kata sandi, reset, dan sesi; single sign-on OIDC, login sosial, dan autentikasi dua faktor
  "013": Manajemen pengguna
  "014": Aktifkan dan nonaktifkan akun, tautan undangan, dan penetapan peran
  "016": Akses ke halaman, aksi, dan data, dengan aturan yang sama untuk manusia dan agen
  "017": Aturan akses data
  "018": Cakupan data bawaan, aturan berbagi, dan aturan pembatasan
  "019": Untuk skrip, sistem lain, dan command line
  "020": Data dan file
  "021": Model data dan migrasi
  "022": Tabel, field, relasi, dan migrasi di SQLite, PostgreSQL, MySQL, SQL Server, dan Oracle
  "023": Database lainnya
  "024": Dameng, KingbaseES, dan OceanBase
  "025": Penjelajah database
  "026": Telusuri koneksi, tabel, dan field yang sudah ada
  "028": Unggah, simpan, pratinjau, dan unduh, terhubung ke catatan bisnis
  "029": Cetak dari templat
  "030": Kontrak, penawaran harga, dan dokumen lain dari templat Office
  "032": Siklus hidup catatan
  "033": Status dan transisi dideklarasikan di kode, dengan riwayat penanganan lengkap
  "034": Manajemen alur kerja
  "035": Diagram alur dan riwayat eksekusi; admin dapat mengubah penyetuju dan ambang batas
  "036": Tugas terjadwal
  "037": Berjalan sesuai jadwal, setiap eksekusi tercatat
  "038": Persetujuan
  "039": Bertingkat, semua harus setuju atau cukup satu, tambah penyetuju, alihkan, dan kembalikan
  "040": Pusat tugas
  "041": Satu daftar tugas dari semua sumber bisnis
  "042": Pesan
  "044": Pengiriman, penyampaian, dan log
  "045": Pesan dalam aplikasi
  "046": Kanal dalam aplikasi dan kotak masuk
  "047": Kanal
  "048": Email SMTP dan Resend, bot grup Feishu dan DingTalk
  "049": Notifikasi push browser
  "051": Hubungkan kotak surat untuk sinkronisasi, membalas, dan mengirim, dengan percakapan terhubung ke catatan
  "052": AI dan agen
  "053": Agen bisnis
  "054": Definisi agen, layanan model, eksekusi, dan percakapan
  "055": Sesi agen
  "056": Mengobrol di browser dengan alat coding di komputer anggota tim
  "057": Basis pengetahuan
  "058": Dokumen dan file berversi dengan pencarian teks lengkap, untuk manusia dan agen
  "059": Antarmuka dan operasional
  "060": Halaman dan pustaka UI
  "061": "Kerangka halaman dan pustaka UI: tabel, papan, diagram alur, dan lainnya"
  "062": Bahasa dan tema
  "063": Ganti bahasa, serta mode terang, gelap, dan ringkas
  "064": Tugas latar belakang
  "065": Tugas, antrean, dan cache
  "066": Rahasia
  "067": Rahasia terenkripsi dengan rotasi
  "068": Deploy dan upgrade
  "069": Deploy, upgrade, dan rollback lewat command line
  "070": Halaman fondasi
  "071": Lihat komponen dasar Core mana saja yang dipakai aplikasi
  "072": <b>20+ komponen dasar</b>, dipelihara dan ditingkatkan oleh NocoBase.
  "073": Baca dokumentasi tiap komponen
  "074": Arsitektur dan standar
  "075": Satu arsitektur, <span class="m">satu standar.</span>
  "076": Ganti developer, model, atau bahkan sesi, dan AI bisa berimprovisasi berbeda setiap kali. Sistem makin sulit dipelihara. Core menyediakan satu struktur proyek dan satu standar pengembangan, sehingga sistem berkembang stabil selama bertahun-tahun di atas arsitektur yang konsisten.
  "077": Kerangka proyek
  "078": Setiap aplikasi baru dimulai dengan struktur yang sama. Halaman, endpoint, perubahan skema, dan tes masing-masing punya tempat tetap, dan komponen dasar Core masuk sebagai paket.
  "080": AGENTS.md dan skill menjelaskan di mana kode bisnis ditempatkan, apa yang diambil dari Core, serta cara menulis migrasi dan pemeriksaan izin.
  "081": Skill pengembangan
  "082": Skill dirilis bersama paket Core dan disinkronkan ke aplikasi saat instalasi. Claude Code, Codex, dan alat coding lainnya membaca panduan yang sama, jadi caranya tetap sama meski orang dan model berganti.
  "083": "Membangun bersama tim manusia dan agen: NocoBase Studio"
  "084": Open source dan self-hosting
  "085": Aplikasi dan data <span class="m">milik Anda.</span>
  "099": Mulai
  "111": Pelajari Studio
  "113": Baca dokumentasi Core
  "114": NocoBase Core adalah fondasi aplikasi open source di balik Studio. Dengan 20+ komponen dasar siap pakai untuk izin akses, alur kerja, file, dan AI, agen hanya membangun hal yang khas bagi bisnis Anda di atas satu arsitektur, dan sistem yang dirilis berjalan mandiri.
  "116": Aplikasi berjalan mandiri tanpa Studio
  "117": 20+ komponen dasar teruji, <span class="m">siap pakai.</span>
  "118": Izin akses, alur kerja, persetujuan, dan penyimpanan file bersifat kompleks dan menuntut keandalan tertinggi—sehingga tidak pernah ditulis ulang dari nol oleh AI. NocoBase memelihara dan meningkatkannya sementara agen fokus sepenuhnya pada logika bisnis Anda.
  "119": Kata sandi, reset, dan sesi; OIDC, SSO enterprise, dan autentikasi dua faktor
  "120": Unggah, penyimpanan, pratinjau, pemeriksaan konektivitas, dan ACL yang terhubung ke catatan
  "121": Alur kerja &amp; persetujuan
  "122": Diagram alur dan riwayat eksekusi; admin menyesuaikan penyetuju dan ambang batas langsung di UI
  "123": Tugas terjadwal</t-zh></b><span><t-zh>按时间规则执行，记录每次执行状态与日志</t-zh><t-en>Berjalan sesuai jadwal, dengan setiap eksekusi tercatat
  "124": Layanan model
  "125": Hubungkan model cloud maupun lokal dalam satu antarmuka tanpa ketergantungan vendor
  "126": Berjalan 24/7 di dalam aplikasi bisnis sesuai izin akses pemiliknya, dengan konfirmasi manusia
  "127": Basis pengetahuan AI
  "128": Dokumen dan file berversi dengan pencarian teks lengkap untuk manusia dan agen
  "129": Lihat Semua Dokumentasi Plugin
  "130": Arsitektur &amp; standar
  "131": Satu arsitektur, <span class="m">siap berkembang bertahun-tahun.</span>
  "132": Berganti developer, model, atau sesi dapat membuat hasil AI mudah melenceng. Core menyertakan kerangka proyek standar, aturan arsitektur, dan skill pengembangan berversi agar setiap kontributor dan model menulis ke dalam struktur yang persis sama.
  "133": Setiap aplikasi baru dimulai dengan tata letak yang sama untuk halaman, API, migrasi, dan tes, serta memanfaatkan kemampuan fondasi melalui <code>@nocobase/*</code>.
  "134": <code>AGENTS.md</code> menjabarkan tempat meletakkan kode bisnis, apa saja yang dapat dipakai ulang dari Core, serta cara menulis migrasi dan pemeriksaan izin akses.
  "135": Skill bawaan Core
  "136": Skill dirilis dan diperbarui bersama paket Core sehingga Claude Code, Codex, dan OpenCode selalu mengikuti panduan yang persis sama.
  "137": AI bawaan
  "138": AI tertanam langsung di <span class="m">setiap sistem bisnis.</span>
  "139": Dilengkapi layanan model bawaan, agen bisnis, dan basis pengetahuan AI. Setiap sistem yang dibangun di atas Core memiliki karyawan AI sendiri yang menangani tugas rutin 24/7, sementara manusia mengonfirmasi tindakan penting.
  "140": Gunakan model apa saja
  "141": Hubungkan model cloud atau model lokal self-hosted tanpa ketergantungan vendor, dengan pengelolaan rahasia dan pelacakan pemakaian terpusat.
  "142": Karyawan AI siap bertugas 24/7
  "143": Bekerja di dalam aplikasi bisnis Anda layaknya rekan kerja digital—mengumpulkan data, menyusun laporan dan rencana tindakan, serta meminta konfirmasi sebelum langkah penting.
  "144": Akses terkendali &amp; pengetahuan
  "145": Karyawan AI bekerja ketat sesuai izin akses data yang diberikan dan merujuk langsung pada basis pengetahuan perusahaan Anda yang berversi.
  "146": Open source &amp; berjalan mandiri
  "147": Open source, terus dipelihara, <span class="m">dan berjalan mandiri.</span>
  "148": Kode sumber Core terbuka dan dapat diaudit, dengan perbaikan dan upgrade berkelanjutan di setiap rilis. Kode bisnis Anda tersimpan di repositori Git Anda sendiri, dan aplikasi yang dirilis berjalan mandiri tanpa melewati Studio.
  "149": Open source &amp; terus dipelihara
  "150": Sepenuhnya open source dan bebas diaudit, dengan perbaikan keamanan dan peningkatan kemampuan berkelanjutan dari tim NocoBase.
  "151": Kode sumber nyata di repo Anda
  "152": Kode sumber TypeScript standar tersimpan di repositori Git Anda sendiri tanpa ketergantungan format tertutup.
  "153": Self-hosted &amp; multi-database
  "154": Jalankan secara self-hosted di infrastruktur Anda sendiri, termasuk di jaringan air-gapped dengan PostgreSQL, MySQL, Oracle, atau SQL Server.
  "155": Runtime produksi mandiri
  "156": Berjalan mandiri setelah di-deploy—lalu lintas harian tidak pernah melewati Studio, lengkap dengan upgrade dan rollback lewat CLI.
  "157": Ikuti panduan mulai cepat untuk membuat kerangka aplikasi dan biarkan agen coding Anda membangun logika bisnis di atas fondasi siap pakai Core.
  "158": Aplikasi Open Source
  "159": Siap pakai &amp; bisa dikustomisasi
  "160": Pasang NocoCRM, NocoITAM, atau NocoReach dan gunakan langsung, atau kustomisasi bersama agen di Studio.
  "161": Lihat Aplikasi Open Source
  "162": Edisi Community Gratis
  "163": Pimpin tim agen 24/7
  "164": Koordinasikan agen coding di berbagai perangkat dengan gerbang kualitas terstruktur serta persetujuan dari desktop maupun ponsel—gratis untuk mulai.
