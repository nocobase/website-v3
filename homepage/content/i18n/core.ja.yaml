title: NocoBase Core — エージェントは業務の開発に専念、基盤はもう整っている
description: NocoBase Core は、NocoBase Studio を支えるオープンソースのアプリケーション基盤です。権限、ワークフロー、ファイル、AI 連携など 20 以上の共通機能がすぐに使える状態でそろい、エージェントは統一されたアーキテクチャの上で自社の業務ロジックだけを開発でき、リリース後のアプリは独立して稼働します。
strings:
  "000": エージェントは業務の開発に専念。<span class="m">基盤はもう整っている。</span>
  "002": クイックスタート
  "003": 共通機能を見る
  "004": 無料のオープンソースで、そのまま本番環境に使える
  "005": コードとデータは自社のもの
  "006": Claude Code、Codex など数十種類のコーディングツールに対応
  "008": 共通機能は<span class="m">一から開発・検証しなくていい。</span>
  "009": AI に任せても、権限、ワークフローエンジン、承認といった基盤部分を一から設計するのは難しく、例外ケースが多く、保守の負担も大きくなります。Core は共通機能を最初から備え、NocoBase が継続的に保守・アップデートします。エージェントは業務部分だけを開発するので、書いて検証すべきコードが大幅に減ります。
  "010": ユーザーと権限
  "011": ログインとセッション
  "012": パスワードログイン、パスワード再設定、セッション。OIDC によるシングルサインオン、ソーシャルログイン、二要素認証
  "013": ユーザー管理
  "014": アカウントの有効化・無効化、招待リンク、ロールの割り当て
  "016": ページ、操作、データ範囲の権限。人とエージェントで同じルール
  "017": データ範囲のルール
  "018": 既定のデータ範囲、共有ルール、制限ルール
  "019": スクリプト、外部システム、コマンドラインからのアクセス用
  "020": データとファイル
  "021": データモデルとマイグレーション
  "022": テーブル、フィールド、リレーション、マイグレーション。SQLite、PostgreSQL、MySQL、SQL Server、Oracle に対応
  "023": その他のデータベース
  "024": Dameng、KingbaseES、OceanBase
  "025": データベースブラウザー
  "026": 既存データベースの接続、テーブル、フィールドを閲覧
  "028": アップロード、保存、プレビュー、ダウンロード。ファイルを業務レコードにひも付け
  "029": テンプレート印刷
  "030": Office テンプレートから契約書、見積書などの文書を生成
  "032": レコードのライフサイクル
  "033": 状態と遷移をコードで宣言し、処理履歴をすべて保存
  "034": ワークフロー管理
  "035": フロー図と実行履歴。管理者が承認者や金額のしきい値を調整可能
  "036": 定期実行
  "037": スケジュールに沿って実行し、毎回の実行を記録
  "038": 承認
  "039": 多段階承認、全員承認・いずれか承認、承認者の追加、転送、差し戻し
  "040": タスクセンター
  "041": 各業務の個人タスクを一覧に集約
  "042": メッセージ
  "044": 通知の送信、配信、ログ
  "045": アプリ内メッセージ
  "046": アプリ内チャネルと受信箱
  "047": 通知チャネル
  "048": SMTP と Resend によるメール、Feishu と DingTalk のグループボット
  "049": ブラウザのプッシュ通知
  "051": 個人のメールボックスを連携して同期・返信・送信。やり取りを業務レコードにひも付け
  "052": AI とエージェント
  "053": 業務エージェント
  "054": エージェント定義、モデルサービス、実行、会話
  "055": エージェントセッション
  "056": ブラウザから、メンバーの PC 上のコーディングツールと対話
  "057": ナレッジベース
  "058": バージョン管理された文書とファイル、全文検索。人とエージェントが利用
  "059": 画面と運用
  "060": ページと UI ライブラリ
  "061": ページフレームワークと UI コンポーネントライブラリ。テーブル、かんばん、フロー図など
  "062": 多言語とテーマ
  "063": 表示言語の切り替え、ライト・ダーク・コンパクトモード
  "064": バックグラウンドジョブ
  "065": ジョブ、キュー、キャッシュ
  "066": シークレット管理
  "067": シークレットの暗号化保存とローテーション
  "068": デプロイとアップデート
  "069": コマンドラインでのデプロイ、アップデート、ロールバック
  "070": 基盤ページ
  "071": アプリが使っている Core の共通機能を確認
  "072": <b>20 以上の共通機能</b>を、NocoBase が継続的に保守・アップデート。
  "073": 各機能のドキュメントを見る
  "074": アーキテクチャと規約
  "075": エージェントに<span class="m">統一のアーキテクチャと規約を。</span>
  "076": 担当者やモデル、さらには会話が変わるたびに、AI はその場しのぎの実装をしがちで、システムはどんどん保守しにくくなります。Core は統一されたプロジェクト構成と開発規約を提供し、システムは統一されたアーキテクチャのもとで長期にわたって安定して進化します。
  "077": プロジェクトのひな形
  "078": 新しいアプリは、最初から統一されたディレクトリ構成を備えています。ページ、API、スキーマ変更、テストにはそれぞれ決まった置き場所があり、Core の共通機能はパッケージとして取り込まれます。
  "080": AGENTS.md とスキルに、業務コードの置き場所、Core から使う機能、マイグレーションと権限チェックの書き方を明記しています。
  "081": 開発スキル
  "082": スキルは Core のパッケージと一緒に配布され、依存関係のインストール時にアプリへ同期されます。Claude Code、Codex などのコーディングツールが同じ書き方を参照するので、担当者やモデルが変わってもやり方は変わりません。
  "083": 複数の人とエージェントで開発するなら：NocoBase Studio
  "084": オープンソースとセルフホスト
  "085": アプリとデータは<span class="m">自社のもの。</span>
  "099": はじめる
  "111": Studio の詳細
  "113": Core のドキュメントを見る
  "114": NocoBase Core は、Studio を支えるオープンソースのアプリケーション基盤です。権限、ワークフロー、ファイル、AI 連携など 20 以上の共通機能が標準でそろっているため、エージェントは統一されたアーキテクチャの上で自社固有の業務ロジックだけを開発でき、リリース後のシステムは独立して稼働します。
  "116": リリース後は Studio なしで独立稼働
  "117": 20 以上の実績ある共通機能を、<span class="m">すぐに使える状態で。</span>
  "118": 権限、ワークフローエンジン、承認、ファイルストレージなどの基盤モジュールは複雑で極めて高い信頼性が求められるため、AI にゼロから生成させるのではなく、NocoBase が継続的に保守・アップデートします。エージェントは自社の業務ロジックの開発だけに専念できます。
  "119": パスワードログイン、パスワード再設定、セッション。OIDC、エンタープライズ SSO、二要素認証
  "120": アップロード、保存、プレビュー、接続チェック、権限チェック。ファイルを業務レコードにひも付け
  "121": ワークフローと承認
  "122": フロー図と実行履歴。管理者が画面から承認者や金額のしきい値を調整可能
  "123": 定期実行</t-zh></b><span><t-zh></t-zh><t-en>スケジュールに沿って実行し、毎回の実行状態とログを記録
  "124": モデル接続
  "125": クラウドモデルもローカルモデルも統一インターフェースで接続。特定ベンダーに縛られない
  "126": 業務アプリ内で担当者の権限のもと 24 時間稼働し、重要な操作は人の確認を経て実行
  "127": AI ナレッジベース
  "128": バージョン管理された業務文書とファイル、全文検索。人とエージェントが共通で参照
  "129": すべての機能ドキュメントを見る
  "130": アーキテクチャと規約
  "131": 統一されたアーキテクチャで、<span class="m">長期にわたって安定進化。</span>
  "132": 担当者やモデル、セッションが変わるたびに、AI の実装は容易にぶれてしまいます。Core は標準のプロジェクトひな形、アーキテクチャ規約、バージョン管理された開発スキルを提供するため、誰がどのモデルで書いても同じ構造に統一されます。
  "133": 新規アプリはすべて、ページ、API、マイグレーション、テストの配置が統一された構成で始まり、基盤の共通機能は <code>@nocobase/*</code> から取り込みます。
  "134": <code>AGENTS.md</code> に業務コードの置き場所、Core から再利用すべき機能、マイグレーションと権限チェックの書き方を明記し、アーキテクチャの崩れを防ぎます。
  "135": Core とともに配布される開発スキル
  "136": 開発スキルは Core のパッケージとともに配布・アップデートされます。Claude Code、Codex、OpenCode が常に同じ手順と規約を参照するため、担当者やモデルが変わっても一貫性が保たれます。
  "137": 内蔵 AI 機能
  "138": すべての業務システムに、<span class="m">AI を標準内蔵。</span>
  "139": モデル接続、業務エージェント、AI ナレッジベースを標準で備えています。Core 上に構築したすべてのシステムに専任の AI 社員を配置でき、定型業務を 24 時間分担させながら、重要な操作は人が確認できます。
  "140": あらゆるモデルを自由に接続
  "141": 特定ベンダーに縛られず、クラウドモデルも自社ホストのローカルモデルも自由に選択可能。API キーと利用履歴も一元管理できます。
  "142": 24 時間稼働する AI 社員
  "143": デジタルな同僚のように業務アプリ内で働き、データの集計、レポートや対応案の作成を自動で行い、重要な判断の前には根拠を添えて確認を求めます。
  "144": 権限管理と AI ナレッジベース
  "145": AI 社員は付与されたデータ権限の範囲内でのみ動作するため越権操作を防げます。バージョン管理された社内ナレッジベースを直接参照し、根拠のある回答を返します。
  "146": オープンソースと独立稼働
  "147": オープンソースで継続保守、<span class="m">業務システムは独立稼働。</span>
  "148": Core のソースコードは公開されており自由に監査でき、修正や機能強化もバージョンアップを通じて継続的に提供されます。業務コードは自社の Git リポジトリに保管され、リリース後のアプリは Studio を経由せず独立して稼働します。
  "149": オープンソースで継続的にアップデート
  "150": 完全なオープンソースとして自由に監査でき、セキュリティ修正や機能強化は NocoBase チームが継続的に提供します。
  "151": 標準ソースコードは自社リポジトリに
  "152": 業務アプリのソースコードは標準的な TypeScript プロジェクトとして自社の Git リポジトリに保存され、ブラックボックスによるロックインはありません。
  "153": セルフホストとマルチ DB 対応
  "154": 閉域網を含む自社インフラへのセルフホストに対応し、PostgreSQL、MySQL、Oracle、SQL Server をサポートしています。
  "155": 独立した本番ランタイム
  "156": デプロイ後は独立して稼働し、日常のトラフィックが Studio を経由することはありません。CLI によるアップグレードとロールバックにも対応しています。
  "157": クイックスタートに沿ってアプリのひな形を作成し、普段お使いのコーディングエージェントに Core の基盤上で業務ロジックを開発させましょう。
  "158": オープンソースアプリ
  "159": すぐ使える · カスタマイズ可能
  "160": NocoCRM、NocoITAM、NocoReach をインストールしてすぐに使い始められます。Studio でエージェントに自社の業務へ合わせてカスタマイズさせることも可能です。
  "161": オープンソースアプリ一覧を見る
  "162": Community 版は無料
  "163": 24 時間稼働のエージェントチームを率いる
  "164": 複数デバイス上のコーディングエージェントを連携させ、体系的な品質ゲートと PC・スマートフォンからの検収・承認を実現。無料で始められます。
