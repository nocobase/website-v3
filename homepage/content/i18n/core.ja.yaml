title: NocoBase Core — エージェントは業務の開発に専念、基盤はもう整っている
description: NocoBase Core は、AI で業務システムを開発・運用するためのオープンソースのアプリケーション基盤です。権限、ワークフロー、ファイルなどの共通機能がそろい、エージェントは統一されたアーキテクチャの上で自社の業務部分だけを開発します。
strings:
  "000": エージェントは業務の開発に専念。<span class="m">基盤はもう整っている。</span>
  "002": クイックスタート
  "003": 共通機能を見る
  "004": 無料のオープンソースで、そのまま本番環境に使える
  "005": コードとデータは自社のもの
  "006": Claude Code、Codex など数十種類のコーディングツールに対応
  "008": 共通機能は<span class="m">一から開発・検証しなくていい。</span>
  "009": AI に任せても、権限、ワークフローエンジン、承認といった基盤部分を一から設計するのは難しく、例外ケースが多く、保守の負担も大きくなります。Core は共通機能を最初から備え、NocoBase が継続的に保守・アップデートします。エージェントは業務部分だけを開発するので、書いて検証すべきコードが大幅に減ります。
  "010": ユーザーと権限
  "011": ログインとセッション
  "012": パスワードログイン、パスワード再設定、セッション。OIDC によるシングルサインオン、ソーシャルログイン、二要素認証
  "013": ユーザー管理
  "014": アカウントの有効化・無効化、招待リンク、ロールの割り当て
  "016": ページ、操作、データ範囲の権限。人とエージェントで同じルール
  "017": データ範囲のルール
  "018": 既定のデータ範囲、共有ルール、制限ルール
  "019": スクリプト、外部システム、コマンドラインからのアクセス用
  "020": データとファイル
  "021": データモデルとマイグレーション
  "022": テーブル、フィールド、リレーション、マイグレーション。SQLite、PostgreSQL、MySQL、SQL Server、Oracle に対応
  "023": その他のデータベース
  "024": Dameng、KingbaseES、OceanBase
  "025": データベースブラウザー
  "026": 既存データベースの接続、テーブル、フィールドを閲覧
  "028": アップロード、保存、プレビュー、ダウンロード。ファイルを業務レコードにひも付け
  "029": テンプレート印刷
  "030": Office テンプレートから契約書、見積書などの文書を生成
  "032": レコードのライフサイクル
  "033": 状態と遷移をコードで宣言し、処理履歴をすべて保存
  "034": ワークフロー管理
  "035": フロー図と実行履歴。管理者が承認者や金額のしきい値を調整可能
  "036": 定期実行
  "037": スケジュールに沿って実行し、毎回の実行を記録
  "038": 承認
  "039": 多段階承認、全員承認・いずれか承認、承認者の追加、転送、差し戻し
  "040": タスクセンター
  "041": 各業務の個人タスクを一覧に集約
  "042": メッセージ
  "044": 通知の送信、配信、ログ
  "045": アプリ内メッセージ
  "046": アプリ内チャネルと受信箱
  "047": 通知チャネル
  "048": SMTP と Resend によるメール、Feishu と DingTalk のグループボット
  "049": ブラウザのプッシュ通知
  "051": 個人のメールボックスを連携して同期・返信・送信。やり取りを業務レコードにひも付け
  "052": AI とエージェント
  "053": 業務エージェント
  "054": エージェント定義、モデルサービス、実行、会話
  "055": エージェントセッション
  "056": ブラウザから、メンバーの PC 上のコーディングツールと対話
  "057": ナレッジベース
  "058": バージョン管理された文書とファイル、全文検索。人とエージェントが利用
  "059": 画面と運用
  "060": ページと UI ライブラリ
  "061": ページフレームワークと UI コンポーネントライブラリ。テーブル、かんばん、フロー図など
  "062": 多言語とテーマ
  "063": 表示言語の切り替え、ライト・ダーク・コンパクトモード
  "064": バックグラウンドジョブ
  "065": ジョブ、キュー、キャッシュ
  "066": シークレット管理
  "067": シークレットの暗号化保存とローテーション
  "068": デプロイとアップデート
  "069": コマンドラインでのデプロイ、アップデート、ロールバック
  "070": 基盤ページ
  "071": アプリが使っている Core の共通機能を確認
  "072": <b>20 以上の共通機能</b>を、NocoBase が継続的に保守・アップデート。
  "073": 各機能のドキュメントを見る
  "074": アーキテクチャと規約
  "075": エージェントに<span class="m">統一のアーキテクチャと規約を。</span>
  "076": 担当者やモデル、さらには会話が変わるたびに、AI はその場しのぎの実装をしがちで、システムはどんどん保守しにくくなります。Core は統一されたプロジェクト構成と開発規約を提供し、システムは統一されたアーキテクチャのもとで長期にわたって安定して進化します。
  "077": プロジェクトのひな形
  "078": 新しいアプリは、最初から統一されたディレクトリ構成を備えています。ページ、API、スキーマ変更、テストにはそれぞれ決まった置き場所があり、Core の共通機能はパッケージとして取り込まれます。
  "080": AGENTS.md とスキルに、業務コードの置き場所、Core から使う機能、マイグレーションと権限チェックの書き方を明記しています。
  "081": 開発スキル
  "082": スキルは Core のパッケージと一緒に配布され、依存関係のインストール時にアプリへ同期されます。Claude Code、Codex などのコーディングツールが同じ書き方を参照するので、担当者やモデルが変わってもやり方は変わりません。
  "083": 複数の人とエージェントで開発するなら：NocoBase Studio
  "084": オープンソースとセルフホスト
  "085": アプリとデータは<span class="m">自社のもの。</span>
  "099": はじめる
  "111": Studio の詳細
  "113": Core のドキュメントを見る
