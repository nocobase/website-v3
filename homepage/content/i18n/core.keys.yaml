  "118":
    en: Permissions, workflows, approvals, and file storage are complex and demand the highest reliability—so they are never rewritten from scratch by AI. NocoBase maintains and upgrades them while agents focus solely on your business logic.
    zh: 权限、工作流引擎、审批、文件存储等底层模块复杂度高、对可靠性要求最高，不由 AI 从零生成，由 NocoBase 持续维护和升级。Agent 只写业务部分，测试和安全审查也集中在新写的业务上。
    where: blocks
  "119":
