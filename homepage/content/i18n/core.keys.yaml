    zh: 架构统一，<span class="m">长期稳定迭代。</span>
    where: standards
  "132":
    en: Switch developers, models, or sessions and AI easily drifts. Core ships a standard scaffold, architecture rules, and versioned dev skills so every contributor and model writes into the exact same structure.
    zh: 换人、换模型甚至换会话，AI 都可能随机发挥，系统越改越乱。Core 提供项目脚手架、架构规范和随底座发布的开发技能，不同的人、模型和会话写出来的都是同一种结构。
    where: standards
  "133":
    en: Every new app starts with the same layout for pages, APIs, migrations, and tests, pulling foundation capabilities via <code>@nocobase/*</code>.
    zh: 新建应用自带统一目录：页面、接口、数据迁移、测试各有固定位置，底层能力通过 <code>@nocobase/*</code> 引入。
    where: standards
  "134":
    en: <code>AGENTS.md</code> spells out where business code belongs, what to reuse from Core, and how to write migrations and permission checks.
    zh: <code>AGENTS.md</code> 写明业务代码放哪里、哪些直接复用底座、迁移和权限检查怎么写，避免架构随机漂移。
    where: standards
