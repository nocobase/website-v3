  "114":
    en: NocoBase Core is the open-source application foundation behind Studio. With 20+ ready-made building blocks for permissions, workflows, files, and AI, agents build only what is unique to your business on one architecture, and released systems run independently.
    zh: NocoBase Core 是工作台背后的开源应用底座。权限、流程、文件、AI 接入等 20 多项基础能力现成可用，Agent 在统一架构上只开发企业自己的业务，系统发布后独立运行。
    where: phero
