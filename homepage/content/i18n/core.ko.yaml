notes: |-
  한국어（제목은 명사형·해라체, 본문은 합니다체）
  용어：foundation = 기반；building blocks = 기본 기능；governance = 거버넌스；agent team = 에이전트 팀；
  coding agent = 코딩 에이전트；business logic = 비즈니스 로직；business systems = 비즈니스 시스템；
  vibe coding = 바이브 코딩；self-hosted = 셀프 호스팅；at a glance = 한눈에
title: NocoBase Core — 에이전트는 비즈니스 로직에만 집중, 기반은 이미 준비됨
description: NocoBase Core는 NocoBase Studio를 뒷받침하는 오픈소스 애플리케이션 기반입니다. 권한, 워크플로, 파일, AI 기능이 바로 쓸 수 있게 준비되어 있어 에이전트는 통일된 아키텍처 위에서 기업 고유의 비즈니스 로직만 개발하고, 배포된 앱은 독립적으로 실행됩니다.
strings:
  "000": 에이전트는 비즈니스 개발에만 집중하세요. <span class="m">기반은 이미 준비되어 있습니다.</span>
  "002": 빠른 시작
  "003": 기본 기능 보기
  "004": 무료 오픈소스, 그대로 프로덕션에 사용
  "005": 코드와 데이터는 기업의 소유
  "006": Claude Code, Codex 등 수십 가지 코딩 도구 지원
  "008": 검증된 기본 기능을 <span class="m">바로 사용한다.</span>
  "009": AI에게 맡겨도 권한, 워크플로 엔진, 승인 같은 기반 모듈을 처음부터 설계하기는 여전히 어렵습니다. 예외 상황이 많고 유지보수 부담도 큽니다. Core는 바로 쓸 수 있는 기본 기능을 제공하고, NocoBase가 지속적으로 유지보수하고 업그레이드합니다. 에이전트는 비즈니스 부분만 개발하므로 작성하고 검증할 코드가 크게 줄어듭니다.
  "010": 사용자와 권한
  "011": 로그인과 세션
  "012": 비밀번호 로그인, 비밀번호 재설정, 세션. OIDC 통합 인증, 소셜 로그인, 2단계 인증
  "013": 사용자 관리
  "014": 계정 활성화·비활성화, 초대 링크, 역할 할당
  "016": 페이지, 작업, 데이터 범위 권한. 사람과 에이전트에 같은 규칙 적용
  "017": 데이터 범위 규칙
  "018": 기본 데이터 범위, 공유 규칙, 제한 규칙
  "019": 스크립트, 외부 시스템, 명령줄에서 앱에 접근
  "020": 데이터와 파일
  "021": 데이터 모델과 마이그레이션
  "022": 테이블, 필드, 관계, 마이그레이션. SQLite, PostgreSQL, MySQL, SQL Server, Oracle 지원
  "023": 기타 데이터베이스
  "024": Dameng, KingbaseES, OceanBase
  "025": 데이터베이스 탐색
  "026": 기존 데이터베이스의 연결, 테이블, 필드 탐색
  "028": 업로드, 저장, 미리보기, 다운로드. 파일을 업무 레코드와 연결
  "029": 템플릿 인쇄
  "030": Office 템플릿으로 계약서, 견적서 등 문서 생성
  "032": 레코드 수명 주기
  "033": 상태와 전환을 코드로 선언하고, 전체 처리 이력 보관
  "034": 워크플로 관리
  "035": 흐름도와 실행 기록. 관리자가 승인자와 금액 기준을 조정
  "036": 예약 작업
  "037": 일정에 따라 실행하고 매 실행을 기록
  "038": 승인
  "039": 다단계, 합의·선택 승인, 승인자 추가, 전달, 반려
  "040": 작업 센터
  "041": 모든 업무의 개인 할 일을 한곳에 모음
  "042": 메시지
  "044": 알림 발송, 전달, 로그
  "045": 앱 내 메시지
  "046": 앱 내 채널과 받은편지함
  "047": 알림 채널
  "048": SMTP·Resend 이메일, Feishu·DingTalk 그룹 봇
  "049": 브라우저 푸시 알림
  "051": 개인 메일함을 연결해 동기화, 회신, 발송. 주고받은 메일을 업무 레코드와 연결
  "052": AI와 에이전트
  "053": 비즈니스 에이전트
  "054": 에이전트 정의, 모델 서비스, 실행, 대화
  "055": 에이전트 세션
  "056": 브라우저에서 구성원 컴퓨터의 코딩 도구와 대화
  "057": 지식 베이스
  "058": 버전 관리되는 문서와 파일, 전문 검색. 사람과 에이전트가 함께 사용
  "059": 인터페이스와 운영
  "060": 페이지와 UI 라이브러리
  "061": 페이지 프레임워크와 UI 컴포넌트 라이브러리. 테이블, 보드, 흐름도 등
  "062": 다국어와 테마
  "063": 인터페이스 언어 전환, 라이트·다크·컴팩트 모드
  "064": 백그라운드 작업
  "065": 작업, 큐, 캐시
  "066": 시크릿 관리
  "067": 시크릿 암호화 저장과 교체
  "068": 배포와 업그레이드
  "069": 명령줄로 배포, 업그레이드, 롤백
  "070": 기반 페이지
  "071": 앱이 사용하는 Core 기본 기능 확인
  "072": <b>20가지 이상의 기본 기능</b>을 NocoBase가 지속적으로 유지보수하고 업그레이드합니다.
  "073": 기능별 문서 보기
  "074": 아키텍처와 규칙
  "075": 에이전트를 위한 <span class="m">통일된 아키텍처와 규칙.</span>
  "076": 사람, 모델, 심지어 세션만 바뀌어도 AI는 매번 다르게 즉흥적으로 구현할 수 있고, 시스템은 점점 유지보수하기 어려워집니다. Core는 통일된 프로젝트 구조와 개발 규칙을 제공해, 시스템이 일관된 아키텍처 위에서 오랫동안 안정적으로 발전합니다.
  "077": 프로젝트 스캐폴딩
  "078": 새로 만든 앱에는 통일된 디렉터리 구조가 기본으로 들어 있습니다. 페이지, API, 스키마 변경, 테스트마다 정해진 위치가 있고, Core의 기본 기능은 패키지 형태로 가져옵니다.
  "080": AGENTS.md와 스킬에 비즈니스 코드를 둘 위치, Core에서 가져다 쓸 기능, 마이그레이션과 권한 검사 작성법을 명시합니다.
  "081": 개발 스킬
  "082": 스킬은 Core 패키지와 함께 배포되고, 의존성을 설치할 때 앱에 동기화됩니다. Claude Code, Codex 등 코딩 도구가 같은 작성법을 읽으므로 사람과 모델이 바뀌어도 방식은 그대로입니다.
  "083": "여러 사람과 에이전트가 함께 개발한다면: NocoBase Studio"
  "084": 오픈소스와 셀프 호스팅
  "085": 앱과 데이터는 <span class="m">기업의 소유.</span>
  "099": 시작하기
  "111": Studio 자세히 보기
  "113": Core 문서 보기
  "114": NocoBase Core는 Studio를 뒷받침하는 오픈소스 애플리케이션 기반입니다. 권한, 워크플로, 파일, AI 등 20가지 이상의 기본 기능이 바로 쓸 수 있게 준비되어 있어, 에이전트는 통일된 아키텍처 위에서 기업 고유의 비즈니스만 개발하며 배포된 시스템은 독립적으로 실행됩니다.
  "116": 배포 후 Studio 없이 독립 실행
  "117": 검증된 20가지 이상의 기본 기능을 <span class="m">바로 사용한다.</span>
  "118": 권한, 워크플로, 승인, 파일 스토리지는 복잡하고 가장 높은 신뢰성이 요구되므로 AI가 처음부터 다시 작성하지 않습니다. NocoBase가 이를 지속적으로 유지보수하고 업그레이드하는 동안 에이전트는 비즈니스 로직에만 집중합니다.
  "119": 비밀번호 로그인, 비밀번호 재설정, 세션. OIDC 통합 인증, 엔터프라이즈 SSO, 2단계 인증
  "120": 업로드, 저장, 미리보기, 연결 상태 점검, 권한 검증. 파일을 업무 레코드와 연결
  "121": 워크플로와 승인
  "122": 흐름도와 실행 기록. 관리자가 UI에서 승인자와 금액 기준을 조정
  "123": 예약 작업</t-zh></b><span><t-zh></t-zh><t-en>일정에 따라 실행하고 매 실행 상태와 로그를 기록
  "124": 모델 서비스
  "125": 벤더 종속 없이 단일 인터페이스로 클라우드 및 로컬 모델 연결
  "126": 비즈니스 앱 내에서 담당자 권한으로 24시간 실행, 중요 작업은 사람 확인 후 진행
  "127": AI 지식 베이스
  "128": 버전 관리되는 업무 문서와 파일, 전문 검색. 사람과 에이전트가 함께 조회
  "129": 전체 플러그인 문서 보기
  "130": 아키텍처와 표준
  "131": 통일된 아키텍처, <span class="m">오랫동안 안정적으로 발전한다.</span>
  "132": 개발자나 모델, 세션만 바뀌어도 AI의 구현 방식은 쉽게 흔들립니다. Core는 표준 스캐폴드, 아키텍처 규칙, 버전 관리되는 개발 스킬을 함께 제공해 어떤 구성원이나 모델이 작업해도 똑같은 구조로 코드를 작성합니다.
  "133": 새로 만든 모든 앱은 페이지, API, 마이그레이션, 테스트가 동일한 디렉터리 구조로 시작하며, 기반 기능은 <code>@nocobase/*</code> 패키지로 가져옵니다.
  "134": <code>AGENTS.md</code>에 비즈니스 코드 위치, Core에서 재사용할 기능, 마이그레이션과 권한 검사 작성법을 명시해 아키텍처가 흔들리지 않도록 합니다.
  "135": Core와 함께 제공되는 개발 스킬
  "136": 스킬이 Core 패키지와 함께 배포·업그레이드되므로 Claude Code, Codex, OpenCode가 언제나 똑같은 가이드에 따라 작업합니다.
  "137": 내장 AI 기능
  "138": 모든 비즈니스 시스템에 <span class="m">기본 내장된 AI.</span>
  "139": 모델 서비스, 비즈니스 에이전트, AI 지식 베이스가 기본 내장되어 있습니다. Core 위에 구축된 모든 시스템은 24시간 일상 업무를 처리하는 AI 직원을 갖추며, 중요한 작업은 사람의 확인을 거쳐 실행합니다.
  "140": 원하는 모델 자유롭게 연결
  "141": 특정 벤더에 종속되지 않고 클라우드 모델이나 셀프 호스팅 로컬 모델을 연결하며, 시크릿과 사용량을 중앙에서 관리합니다.
  "142": 24시간 업무를 분담하는 AI 직원
  "143": 디지털 동료처럼 비즈니스 앱 안에서 데이터를 취합하고 보고서와 처리안을 작성하며, 중요한 작업 전에는 근거와 함께 사람의 확인을 요청합니다.
  "144": 권한 통제와 AI 지식 베이스
  "145": AI 직원은 부여된 데이터 권한 범위 안에서만 동작하며, 버전 관리되는 기업 지식 베이스를 직접 참조해 근거 있는 답변을 제공합니다.
  "146": 오픈소스와 독립 실행
  "147": 오픈소스, 지속적인 유지보수, <span class="m">독립적인 실행.</span>
  "148": Core의 소스 코드는 공개되어 있어 누구나 감사할 수 있으며, 릴리스마다 수정 사항과 업그레이드가 지속적으로 제공됩니다. 비즈니스 코드는 기업의 자체 Git 저장소에 보관되고, 배포된 앱은 요청 경로에 Studio를 거치지 않고 독립적으로 실행됩니다.
  "149": 오픈소스 및 지속적인 유지보수
  "150": 완전한 오픈소스로 자유롭게 감사할 수 있으며, NocoBase 팀이 보안 패치와 기능 업그레이드를 지속적으로 제공합니다.
  "151": 기업 저장소에 보관되는 표준 소스 코드
  "152": 표준 TypeScript 소스 코드가 기업의 자체 Git 저장소에 저장되며, 독점 포맷이나 블랙박스 종속이 없습니다.
  "153": 셀프 호스팅과 멀티 데이터베이스
  "154": 폐쇄망을 포함한 자체 인프라에 셀프 호스팅할 수 있으며, PostgreSQL, MySQL, Oracle, SQL Server를 지원합니다.
  "155": 독립 실행되는 프로덕션 런타임
  "156": 배포 후 독립적으로 실행되어 일상 트래픽이 Studio를 거치지 않으며, CLI로 간편하게 업그레이드하고 롤백할 수 있습니다.
  "157": 빠른 시작 가이드에 따라 앱을 초기화하고, 코딩 에이전트가 Core의 준비된 기반 위에서 바로 비즈니스 로직을 개발하도록 시작하세요.
  "158": 오픈소스 앱
  "159": 바로 사용 · 맞춤 개발
  "160": NocoCRM, NocoITAM, NocoReach를 설치해 바로 사용하거나, Studio에서 에이전트와 함께 업무에 맞게 맞춤 개발할 수 있습니다.
  "161": 오픈소스 앱 모두 보기
  "162": Community 에디션 무료
  "163": 24시간 일하는 에이전트 팀 지휘
  "164": 여러 기기의 코딩 에이전트를 조율하고 체계적인 품질 게이트와 PC·모바일 승인을 거쳐 무료로 시작할 수 있습니다.
