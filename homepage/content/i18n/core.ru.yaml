title: NocoBase Core — Пусть агенты займутся бизнес-логикой
description: NocoBase Core — фундамент приложений с открытым кодом, лежащий в основе NocoBase Studio. Права доступа, процессы, файлы и возможности ИИ уже готовы к работе, поэтому агенты разрабатывают только вашу бизнес-логику на единой архитектуре, а приложения работают автономно.
strings:
  "000": Пусть агенты займутся бизнес-логикой. <span class="m">Фундамент уже готов.</span>
  "002": Быстрый старт
  "003": Смотреть базовые модули
  "004": Бесплатно, с открытым кодом и готово к продакшену
  "005": Код и данные принадлежат вам
  "006": Работает с Claude Code, Codex и десятками других инструментов разработки
  "008": Проверенные базовые модули, <span class="m">готовые к работе.</span>
  "009": "Даже если код пишет ИИ, права доступа, движки бизнес-процессов и согласования трудно спроектировать с нуля: в них много пограничных случаев, а поддержка требует больших усилий. Core предоставляет готовые базовые модули, которые NocoBase постоянно поддерживает и обновляет. Агенты разрабатывают только бизнес-логику, поэтому кода, который нужно написать и проверить, становится гораздо меньше."
  "010": Пользователи и права
  "011": Вход и сессии
  "012": Пароли, восстановление доступа и сессии; единый вход через OIDC, вход через соцсети и двухфакторная аутентификация
  "013": Управление пользователями
  "014": Включение и отключение учётных записей, ссылки-приглашения и назначение ролей
  "016": Доступ к страницам, действиям и данным — одни правила для людей и агентов
  "017": Правила доступа к данным
  "018": Область данных по умолчанию, правила общего доступа и ограничения
  "019": Для скриптов, внешних систем и командной строки
  "020": Данные и файлы
  "021": Модели данных и миграции
  "022": Таблицы, поля, связи и миграции на SQLite, PostgreSQL, MySQL, SQL Server и Oracle
  "023": Другие СУБД
  "024": Dameng, KingbaseES и OceanBase
  "025": Обзор баз данных
  "026": Просмотр подключений, таблиц и полей существующих баз
  "028": Загрузка, хранение, предпросмотр и скачивание с привязкой к бизнес-записям
  "029": Печать по шаблонам
  "030": Договоры, коммерческие предложения и другие документы по шаблонам Office
  "032": Жизненный цикл записей
  "033": Состояния и переходы описываются в коде, вся история обработки сохраняется
  "034": Управление процессами
  "035": Схемы процессов и история запусков; администраторы меняют согласующих и пороговые суммы
  "036": Задания по расписанию
  "037": Запуск по расписанию, каждый запуск записывается
  "038": Согласования
  "039": Многоуровневые, совместные и альтернативные согласования, добавление согласующего, передача и возврат
  "040": Центр задач
  "041": Единый список дел из всех бизнес-источников
  "042": Сообщения
  "044": Отправка, доставка и журналы
  "045": Внутренние сообщения
  "046": Внутренний канал и входящие
  "047": Каналы
  "048": Почта через SMTP и Resend, групповые боты Feishu и DingTalk
  "049": Push-уведомления в браузере
  "051": "Подключение почтовых ящиков: синхронизация, ответы и отправка, переписка привязана к записям"
  "052": ИИ и агенты
  "053": Бизнес-агенты
  "054": Описание агентов, сервисы моделей, запуски и диалоги
  "055": Сессии агентов
  "056": Общение в браузере с инструментами разработки на компьютерах участников
  "057": База знаний
  "058": Документы и файлы с версиями и полнотекстовым поиском — для людей и агентов
  "059": Интерфейс и эксплуатация
  "060": Страницы и библиотека UI
  "061": "Каркас страниц и библиотека UI: таблицы, канбан-доски, схемы процессов и другое"
  "062": Языки и темы
  "063": Переключение языка, светлый, тёмный и компактный режимы
  "064": Фоновые задачи
  "065": Задачи, очереди и кеширование
  "066": Секреты
  "067": Шифрование и ротация секретов
  "068": Развёртывание и обновление
  "069": Развёртывание, обновление и откат из командной строки
  "070": Страница фундамента
  "071": Какие базовые модули Core использует приложение
  "072": <b>Более 20 базовых модулей</b>, которые NocoBase поддерживает и обновляет.
  "073": Документация по каждому модулю
  "074": Архитектура и стандарты
  "075": Одна архитектура, <span class="m">единые стандарты.</span>
  "076": Стоит сменить разработчика, модель или даже сессию, и ИИ каждый раз может импровизировать по-своему, а поддерживать систему становится всё сложнее. Core задаёт единую структуру проекта и единые стандарты разработки, поэтому система годами стабильно развивается на одной архитектуре.
  "077": Каркас проекта
  "078": Каждое новое приложение начинается с одинаковой структуры. У страниц, эндпоинтов, изменений схемы и тестов есть постоянные места, а базовые модули Core подключаются как пакеты.
  "080": AGENTS.md и навыки описывают, где размещать бизнес-код, что брать из Core и как писать миграции и проверки прав.
  "081": Навыки разработки
  "082": Навыки поставляются вместе с пакетами Core и синхронизируются в приложение при установке. Claude Code, Codex и другие инструменты разработки читают одни и те же правила, поэтому подход не меняется, даже если меняются люди и модели.
  "083": Разработка командой людей и агентов — NocoBase Studio
  "084": Открытый код и свои серверы
  "085": Приложения и данные <span class="m">принадлежат вам.</span>
  "099": Начать
  "111": Подробнее о Studio
  "113": Документация Core
  "114": NocoBase Core — фундамент приложений с открытым кодом, лежащий в основе Studio. Более 20 готовых базовых модулей для прав доступа, процессов, файлов и ИИ позволяют агентам создавать на единой архитектуре только то, что уникально для вашего бизнеса, а выпущенные системы работают автономно.
  "116": Приложения работают автономно, без Studio
  "117": Более 20 проверенных базовых модулей, <span class="m">готовых к работе.</span>
  "118": Права доступа, бизнес-процессы, согласования и файловое хранилище сложны и требуют максимальной надёжности — поэтому ИИ никогда не переписывает их с нуля. NocoBase поддерживает и обновляет эти модули, а агенты сосредоточены исключительно на вашей бизнес-логике.
  "119": Пароли, восстановление доступа и сессии; OIDC, корпоративный SSO и двухфакторная аутентификация
  "120": Загрузка, хранение, предпросмотр, проверки доступности и права доступа с привязкой к записям
  "121": Процессы и согласования
  "122": Схемы процессов и история запусков; администраторы меняют согласующих и пороговые значения в интерфейсе
  "123": Задания по расписанию</t-zh></b><span><t-zh>按时间规则执行，记录每次执行状态与日志</t-zh><t-en>Запуск по расписанию с журналом каждого выполнения
  "124": Сервисы моделей
  "125": Единый интерфейс для облачных и локальных моделей без привязки к вендору
  "126": Работа 24/7 внутри бизнес-приложений с правами владельца и подтверждением ключевых действий человеком
  "127": База знаний для ИИ
  "128": Документы и файлы с версиями и полнотекстовым поиском для людей и агентов
  "129": Документация по всем плагинам
  "130": Архитектура и стандарты
  "131": Единая архитектура, <span class="m">готовая к годам развития.</span>
  "132": Стоит сменить разработчика, модель или сессию — и ИИ легко уходит в сторону. Core поставляет единый каркас проекта, правила архитектуры и версионируемые навыки разработки, чтобы любой участник и любая модель писали код в одной и той же структуре.
  "133": Каждое новое приложение начинается с единой структуры для страниц, API, миграций и тестов, подключая базовые модули через <code>@nocobase/*</code>.
  "134": <code>AGENTS.md</code> чётко описывает, где размещать бизнес-код, что переиспользовать из Core и как писать миграции и проверки прав доступа.
  "135": Навыки в составе Core
  "136": Навыки поставляются и обновляются вместе с пакетами Core, поэтому Claude Code, Codex и OpenCode всегда следуют одним и тем же правилам.
  "137": Встроенный ИИ
  "138": ИИ встроен <span class="m">в каждую бизнес-систему.</span>
  "139": Встроенные сервисы моделей, бизнес-агенты и база знаний для ИИ. В каждой системе на базе Core работают собственные ИИ-сотрудники, которые 24/7 берут на себя рутину, а ключевые действия подтверждают люди.
  "140": Любые модели
  "141": Подключайте облачные или локальные модели на своих серверах без привязки к вендору, с централизованным управлением секретами и учётом расхода.
  "142": ИИ-сотрудники работают 24/7
  "143": "Работают внутри бизнес-приложений как цифровые коллеги: собирают данные, готовят отчёты и проекты действий и запрашивают подтверждение перед важными шагами."
  "144": Разграничение прав и база знаний
  "145": ИИ-сотрудники действуют строго в рамках выданных прав доступа к данным и опираются напрямую на вашу версионируемую корпоративную базу знаний.
  "146": Открытый код и автономность
  "147": Открытый код, постоянная поддержка <span class="m">и автономная работа.</span>
  "148": Исходный код Core открыт для аудита, а исправления и обновления выходят с каждым релизом. Код вашей бизнес-логики хранится в вашем Git-репозитории, а выпущенные приложения работают автономно — без участия Studio в обработке запросов.
  "149": Открытый код и поддержка
  "150": Полностью открытый код, доступный для аудита, с регулярными исправлениями безопасности и развитием возможностей от команды NocoBase.
  "151": Настоящий код в вашем репозитории
  "152": Стандартный исходный код на TypeScript хранится в вашем Git-репозитории без какой-либо проприетарной привязки.
  "153": Свои серверы и разные СУБД
  "154": Развёртывание в вашей инфраструктуре, включая изолированные сети, с поддержкой PostgreSQL, MySQL, Oracle и SQL Server.
  "155": Автономная работа в продакшене
  "156": После развёртывания приложение работает самостоятельно — повседневный трафик не проходит через Studio, а обновления и откаты выполняются через CLI.
  "157": Пройдите быстрый старт, чтобы развернуть каркас приложения, и поручите вашему кодинг-агенту разработку бизнес-логики на готовом фундаменте Core.
  "158": Приложения с открытым кодом
  "159": Готовы к работе и доработке
  "160": Установите NocoCRM, NocoITAM или NocoReach и начните сразу, либо доработайте их с помощью агентов в Studio.
  "161": Смотреть открытые приложения
  "162": Бесплатная редакция Community
  "163": Управляйте командой агентов 24/7
  "164": Координируйте кодинг-агентов на разных устройствах с выстроенным контролем качества и приёмкой с компьютера или телефона — старт бесплатный.
