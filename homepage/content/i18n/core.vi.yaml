  "023": Cơ sở dữ liệu khác
  "024": Dameng, KingbaseES và OceanBase
  "025": Duyệt cơ sở dữ liệu
  "026": Xem kết nối, bảng và trường của cơ sở dữ liệu hiện có
  "028": Tải lên, lưu trữ, xem trước và tải xuống, tệp gắn với bản ghi nghiệp vụ
  "029": In theo mẫu
  "030": Tạo hợp đồng, báo giá và tài liệu khác từ mẫu Office
  "032": Vòng đời bản ghi
  "033": Trạng thái và luồng chuyển khai báo trong code, lưu đầy đủ lịch sử xử lý
  "034": Quản lý quy trình
