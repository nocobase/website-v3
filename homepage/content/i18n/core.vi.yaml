  "036": Tác vụ định kỳ
  "037": Chạy theo lịch, ghi lại mỗi lần chạy
  "038": Phê duyệt
  "039": Nhiều cấp, tất cả cùng duyệt hoặc một người duyệt, thêm người duyệt, chuyển giao và trả lại
  "040": Trung tâm công việc
  "041": Gom việc cần làm cá nhân từ mọi nguồn nghiệp vụ
  "042": Tin nhắn
  "044": Gửi, phân phối và nhật ký thông báo
  "045": Tin nhắn trong ứng dụng
  "046": Kênh tin nhắn trong ứng dụng và hộp thư đến
  "047": Kênh thông báo
  "048": Email qua SMTP và Resend, bot nhóm Feishu và DingTalk
  "049": Thông báo đẩy trên trình duyệt
  "051": Kết nối hộp thư cá nhân để đồng bộ, trả lời và gửi, thư từ gắn với bản ghi nghiệp vụ
  "052": AI và agent
  "053": Agent nghiệp vụ
  "054": Định nghĩa agent, dịch vụ model, lần chạy và hội thoại
