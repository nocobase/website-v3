notes: |-
  Tiếng Việt（bạn）
  术语：platform = nền tảng；foundation = nền móng（与 nền tảng 区分）；building blocks = khối chức năng；governance = quản trị；
  agent = agent；agent team = đội agent；coding agent = coding agent；business logic = logic nghiệp vụ；
  business systems = hệ thống nghiệp vụ；open source = mã nguồn mở；self-hosted = tự triển khai；at a glance = rõ ràng trong nháy mắt
title: NocoBase Core — Để agent tập trung vào logic nghiệp vụ
description: NocoBase Core là nền móng ứng dụng mã nguồn mở đứng sau NocoBase Studio. Phân quyền, quy trình, tệp tin và năng lực AI đều sẵn sàng để agent chỉ tập trung xây dựng logic nghiệp vụ trên một kiến trúc thống nhất, và ứng dụng chạy độc lập sau khi phát hành.
strings:
  "000": Để agent tập trung vào logic nghiệp vụ. <span class="m">Nền móng đã sẵn sàng.</span>
  "002": Bắt đầu nhanh
  "003": Xem các khối chức năng
  "004": Miễn phí, mã nguồn mở, dùng được ngay cho production
  "005": Code và dữ liệu thuộc về bạn
  "006": Hỗ trợ Claude Code, Codex và hàng chục công cụ lập trình khác
  "008": Khối chức năng đã kiểm chứng, <span class="m">dùng được ngay.</span>
  "009": "Dù AI viết code, phân quyền, workflow engine và phê duyệt vẫn khó thiết kế từ đầu: nhiều trường hợp biên, khối lượng bảo trì lớn. Core cung cấp sẵn các khối chức năng, được NocoBase liên tục bảo trì và nâng cấp. Agent chỉ phát triển phần logic nghiệp vụ, lượng code cần viết và kiểm chứng giảm đáng kể."
