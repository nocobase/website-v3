  "071": 查看應用用到了哪些 Core 能力
  "072": <b>20 多項基礎能力</b>，由 NocoBase 持續維護與升級。
  "073": 查看每項能力的文件
  "074": 架構和規範
  "075": 為 Agent 提供<span class="m">統一的架構與規範。</span>
  "076": 換人、換模型甚至換對話，AI 都可能隨意發揮，系統越來越難維護。Core 提供統一的專案結構與開發規範，系統在統一架構下長期穩定迭代。
  "077": 專案範本
  "078": 新建的應用自帶統一的目錄：頁面、介面、資料表結構變更、測試各有固定位置，Core 的基礎能力以套件的形式引入。
  "080": AGENTS.md 和技能寫明業務程式碼放在哪裡、哪些直接用現成能力、遷移和權限怎麼寫。
  "081": 開發技能
  "082": 技能隨 Core 的套件發布，安裝相依套件時同步到應用裡。Claude Code、Codex 等開發工具讀到的是同一套寫法，換人、換模型也不變。
  "083": 多人、多個 Agent 一起開發：NocoBase Studio
  "084": 開源與地端部署
  "085": 應用和資料<span class="m">歸企業私有。</span>
  "099": 開始使用
  "111": 了解 Studio
  "113": 查看 Core 文件
  "114": NocoBase Core 是工作台背後的開源應用基礎平台。權限、流程、檔案、AI 接入等 20 多項基礎能力現成可用，Agent 在統一架構上只開發企業自己的業務，系統發布後獨立運行。
  "116": 發布後獨立運行，不依賴工作台
  "117": 20 多項現成、可靠的<span class="m">基礎能力。</span>
  "118": 權限、工作流程引擎、簽核、檔案儲存等底層模組複雜度高、對可靠性要求最高，不由 AI 從零產生，由 NocoBase 持續維護與升級。Agent 只寫業務部分，測試和安全審查也集中在新寫的業務上。
  "119": 密碼登入、找回密碼、工作階段；OIDC 統一身分、企業 SSO、雙因素驗證
  "120": 上傳、儲存、預覽、連線檢查與權限驗證，檔案與業務紀錄關聯
  "121": 流程與簽核
  "122": 流程圖和執行紀錄，管理員可在介面調整簽核人與金額門檻
  "123": 排程任務</t-zh></b><span><t-zh></t-zh><t-en>依時間規則執行，記錄每次執行狀態與日誌
  "124": 模型接入
  "125": 統一接入雲端大型模型與企業本機部署模型，不綁定廠商
  "126": 進駐業務系統 24 小時運作，繼承負責人權限，關鍵操作請求人確認
  "127": AI 知識庫
  "128": 帶版本的業務文件與檔案、全文檢索，供人和 Agent 共同查閱
  "129": 查看全部能力文件
  "130": 架構與規範
  "131": 架構統一，<span class="m">長期穩定迭代。</span>
  "132": 換人、換模型甚至換對話，AI 都可能隨意發揮，系統越改越亂。Core 提供專案腳手架、架構規範和隨基礎平台發布的開發技能，不同的人、模型和對話寫出來的都是同一種結構。
  "133": 新建應用自帶統一目錄：頁面、API、資料遷移、測試各有固定位置，底層能力透過 <code>@nocobase/*</code> 引入。
  "134": <code>AGENTS.md</code> 寫明業務程式碼放哪裡、哪些直接沿用基礎平台、遷移和權限檢查怎麼寫，避免架構隨機漂移。
  "135": 隨基礎平台發布的開發技能
  "136": 開發技能隨基礎平台升級同步到應用裡。Claude Code、Codex、OpenCode 開工前先讀同一套規範，換人、換模型也不變。
  "137": 內建 AI 能力
  "138": 業務系統自帶 <span class="m">AI 能力。</span>
  "139": 內建模型接入、業務 Agent 和 AI 知識庫。每個以 Core 打造的系統都能擁有自己的 AI 員工，24 小時分擔日常工作，關鍵操作交由人確認。
  "140": 模型自由接入
  "141": 不綁定單一廠商，支援企業自選雲端大型模型或本機地端部署模型，統一管理金鑰與呼叫紀錄。
  "142": AI 員工主動分擔業務
  "143": 像數位同事一樣進駐業務系統，自動彙整資料、產生評估報告、起草處理方案；關鍵操作附上依據請人確認。
  "144": 權限可控與 AI 知識庫
  "145": AI 員工依授權範圍存取資料，不會越權操作；直接關聯企業知識庫裡的制度和資料，回答有據可查。
  "146": 開源與獨立運行
  "147": 開源、持續維護，<span class="m">業務系統獨立運行。</span>
  "148": 應用基礎平台原始碼公開可審查，基礎能力的修復與升級隨版本持續提供。業務原始碼保存在企業自己的儲存庫裡，發布後獨立運行，日常業務請求不經過工作台。
  "149": 開源可審查、持續升級
  "150": 基礎平台完全開源免費，安全修復與新能力由 NocoBase 團隊持續維護並隨版本升級提供。
  "151": 標準原始碼歸企業所有
  "152": 業務原始碼直接保存在企業自己的 Git 儲存庫裡，標準 TypeScript 專案，無黑箱鎖定。
  "153": 地端部署與多資料庫
  "154": 部署在企業自有伺服器，支援純內網以及 PostgreSQL、MySQL、Oracle 與 SQL Server。
  "155": 業務應用獨立運行
  "156": 發布後獨立運行在自己的服務程序中，日常業務請求不經過 Studio，支援命令列平滑升級與回復。
  "157": 跟著快速開始文件初始化應用，讓你熟悉的開發工具在現成基礎平台和統一規範上直接寫業務。
  "158": 開源應用
  "159": 裝上即用 · 可客製
  "160": 直接安裝 NocoCRM、NocoITAM、NocoReach 投入使用，也可以在工作台裡讓 Agent 依需求客製開發。
  "161": 查看全部開源應用
  "162": 社群版免費
  "163": 帶領 Agent 團隊並行交付
  "164": 多裝置多工具並行推進、按流程把關品質、電腦和手機隨時驗收，社群版開源免費起步。
