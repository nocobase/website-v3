meta:
  title:
    zh: 寻找 NocoBase 伙伴 — 和懂业务的伙伴一起，把系统做出来、用起来
    en: Find a NocoBase Partner — Get Your System Built and Running
  description:
    zh: NocoBase 伙伴熟悉 NocoBase 3、Studio 和各行业业务，带着 Agent 团队和你一起完成需求梳理、开发、验收、上线和后续维护，交付的代码归你。
    en: NocoBase partners know NocoBase 3, Studio, and your industry. With their agent teams they scope, build, accept, release, and maintain with you, and the code is yours.
items:
  "000":
    en: Find a Partner
    zh: 寻找伙伴
    where: phero
  "001":
    en: Find the right partner <span class="m">to get your system built and running.</span>
    zh: 找到懂你行业的伙伴，<span class="m">把系统做出来、用起来。</span>
    where: phero
  "002":
    en: NocoBase partners know NocoBase 3, Studio, and your industry inside out. Leading an agent team, they work with you to scope, build, verify, ship, and maintain your system. Every step is visible in Studio, and the resulting source code, Skills, and knowledge base are 100% yours.
    zh: NocoBase 合作伙伴既熟悉 NocoBase 3 与 Studio，也深耕你所在的行业。他们带着 Agent 团队与你一起完成需求梳理、系统开发、预览验收与上线运维。全流程在 Studio 中透明可见，交付的源码、Skills 与知识库完全归你。
    where: phero
  "003":
    en: Submit Your Requirements
    zh: 提交需求
    where: phero
  "004":
    en: Become a Partner
    zh: 成为合作伙伴
    where: phero
  "005":
    en: When a Partner Helps
    zh: 什么时候找伙伴
    where: sec
  "006":
    en: "Ready to build with AI, "
    zh: 想用 AI 落地业务系统，
    where: sec
  "007":
    en: but want an experienced hand to lead it.
    zh: 但团队还没准备好。
    where: sec
  "008":
    en: Short on engineers
    zh: 缺少开发人手
    where: sec
  "009":
    en: You lack in-house engineering bandwidth and want an experienced partner to lead an agent team to delivery.
    zh: 内部缺少研发或工程交付经验，需要专业团队带着 Agent 把项目稳妥落地。
    where: sec
  "010":
    en: Tight timeline
    zh: 要求快速上线
    where: sec
  "011":
    en: When the business can’t wait, start from a ready-made Solution or industry template and go live in weeks.
    zh: 业务等不起，希望基于现成的 Solutions 或行业模板起步，几周内投入使用。
    where: sec
  "012":
    en: Complex integration &amp; migration
    zh: 涉及复杂集成与迁移
    where: sec
  "013":
    en: Connect ERP, OA, SSO, or legacy databases, or migrate smoothly from NocoBase 2 or older systems.
    zh: 需要打通 ERP、OA、钉钉、飞书或存量数据库，或从旧系统、NocoBase 2 平滑迁移。
    where: sec
  "014":
    en: Enable your own team
    zh: 希望培养自有团队
    where: sec
  "015":
    en: Build the first release together so your team learns how to direct agents, verify previews, and ship on their own.
    zh: 边做边学，让内部团队掌握给 Agent 提需求、做验收和发版上线的能力。
    where: sec
  "016":
    en: What Partners Do
    zh: 伙伴能做什么
    where: tint
  "017":
    en: "From the first conversation "
    zh: 从第一次沟通，
    where: tint
  "018":
    en: to every improvement after go-live.
    zh: 到上线后的每一次改进。
    where: tint
  "019":
    en: Scoping &amp; architecture
    zh: 需求梳理与架构
    where: tint
  "020":
    en: Map your workflows, choose the right starting point on Solutions or Core, and break delivery into phased milestones.
    zh: 理清业务流程，选定从现成 Solution 还是从 Core 起步，拆解为可分批上线的模块。
    where: tint
  "021":
    en: System development
    zh: 定制开发
    where: tint
  "022":
    en: Orchestrate agents in Studio with tests and review on every change, ready for your sign-off in live previews.
    zh: 在 Studio 中调度 Agent 团队开发，每次改动均经测试与评审，由你在预览环境验收。
    where: tint
  "023":
    en: System integration
    zh: 系统集成
    where: tint
  "024":
    en: Wire up ERP, CRM, OA, SSO, team chat, and external databases with server-enforced permissions.
    zh: 对接 ERP、CRM、OA、SSO、企微/飞书/钉钉与外部数据库，权限在服务端严格受控。
    where: tint
  "025":
    en: Data migration
    zh: 数据迁移
    where: tint
  "026":
    en: Migrate from spreadsheets, legacy apps, or NocoBase 2, testing migration scripts against real data in preview first.
    zh: 从表格、旧系统或 NocoBase 2 迁移数据，迁移脚本先在真实数据预览环境中验证无误再执行。
    where: tint
  "027":
    en: On-site service
    zh: 本地现场服务
    where: tint
  "028":
    en: Local, in-person help with deployment, troubleshooting, and working through requirements with your business teams.
    zh: 在你所在的地区上门服务：部署、问题排查，以及和业务部门当面沟通需求。
    where: tint
  "029":
    en: Operations &amp; evolution
    zh: 运维与持续迭代
    where: tint
  "030":
    en: Handle self-hosted deployment, backups, upgrades, and troubleshooting, with agents in Studio driving ongoing improvements.
    zh: 负责私有化部署、备份、版本升级与故障排查，提供持续的支持和维护。
    where: tint
  "031":
    en: How It Works
    zh: 怎样一起工作
    where: sec
  "032":
    en: "Partners lead the agents. "
    zh: 伙伴带 Agent 团队干活，
    where: sec
  "033":
    en: You make the business calls.
    zh: 业务决策由你拍板。
    where: sec
  "034":
    en: Run the project in your own Studio, or have the partner build in theirs and deliver to your repo, with full visibility into progress, blockers, and releases.
    zh: 项目可直接在你的 Studio 中推进，或在伙伴的 Studio 中开发并交付至你的仓库。进度、卡点与上线时间全程透明。
    where: sec
  "035":
    en: Describe the business
    zh: 描述业务
    where: sec
  "036":
    en: You explain the process and pain points; the partner turns them into requirements and a phased plan.
    zh: 你讲清流程和痛点，伙伴整理成需求和分批计划。
    where: sec
  "037":
    en: Agree the plan
    zh: 敲定方案
    where: sec
  "038":
    en: You confirm business rules, scope, and acceptance criteria.
    zh: 业务规则、范围和验收标准由你确认。
    where: sec
  "039":
    en: Build &amp; check
    zh: 开发与检查
    where: sec
  "040":
    en: The agent team builds and tests; the partner owns quality.
    zh: Agent 团队开发和测试，伙伴把关质量。
    where: sec
  "041":
    en: Accept in preview
    zh: 预览验收
    where: sec
  "042":
    en: You walk through it in a preview and approve the release.
    zh: 你在预览环境里亲手走一遍，通过后批准上线。
    where: sec
  "043":
    en: Hand over &amp; care
    zh: 交接与维护
    where: sec
  "044":
    en: Source, Skills, and knowledge live in your repo; change it yourself or keep the partner on.
    zh: 源码、Skills 和知识库在你的仓库里；之后自己改，或继续请伙伴维护。
    where: sec
  "045":
    en: The partner and agents handle
    zh: 伙伴和 Agent 团队负责
    where: sec
  "046":
    en: Design, development, testing, and code review
    zh: 方案设计、开发、测试和代码评审
    where: sec
  "047":
    en: Environments, integrations, migrations, and release prep
    zh: 环境、集成、迁移和发布准备
    where: sec
  "048":
    en: Writing business rules into Skills and knowledge
    zh: 把业务规则写进 Skills 和知识库
    where: sec
  "049":
    en: You decide
    zh: 你决定
    where: sec
  "050":
    en: Business rules, scope, and priorities
    zh: 业务规则、范围和优先级
    where: sec
  "051":
    en: Whether each feature is accepted
    zh: 功能是否通过验收
    where: sec
  "052":
    en: When it goes live
    zh: 什么时候上线
    where: sec
  "053":
    en: Choosing a Partner
    zh: 怎么选伙伴
    where: sec
  "054":
    en: Submit your needs and we’ll recommend a match.
    zh: 提交需求后，我们按你的情况匹配推荐。
    where: sec
  "055":
    en: "We’ll match you with 1–3 qualified partners based on your region, industry, and scope. When you talk, we suggest checking:"
    zh: 我们将根据你所在的地区、行业和服务需求，匹配 1–3 家合适的伙伴供你沟通比对。沟通时建议重点确认：
    where: sec
  "056":
    en: "Experience: "
    zh: 行业经验：
    where: sec
  "057":
    en: live projects in your industry and whether they can demo one
    zh: 同行业已上线案例，以及是否支持现场演示
    where: sec
  "058":
    en: "Delivery: "
    zh: 交付方式：
    where: sec
  "059":
    en: whose Studio it’s built in, and how source code, Skills, and knowledge are handed over
    zh: 在谁的 Studio 环境开发，源码、技能与知识库如何移交
    where: sec
  "060":
    en: "After go-live: "
    zh: 后续维保：
    where: sec
  "061":
    en: how ongoing operations, upgrades, and response SLAs are structured
    zh: 上线后的运维、版本升级与响应 SLA 怎么约定
    where: sec
  "062":
    en: FAQ
    zh: 常见问题
    where: sec
  "063":
    en: What’s the difference between working with a partner vs. NocoBase directly?
    zh: 找伙伴和直接找 NocoBase 官方有什么区别？
    where: sec
  "064":
    en: NocoBase provides the platform, commercial licenses, and hands-on pilots. Partners provide end-to-end implementation in your region and industry, including custom builds, integrations, migrations, and long-term care. Both can team up when needed.
    zh: NocoBase 官方提供产品底座、商业授权，以及实战验证；伙伴则深入你所在的地区和行业，提供端到端的定制开发、系统集成、数据迁移与长期维保。重点项目也可由原厂与伙伴联合服务。
    where: sec
  "065":
    en: How does pricing work?
    zh: 费用怎么算？
    where: sec
  "066":
    en: Partners quote implementation and maintenance by project, module, or annual retainer. NocoBase commercial licenses follow official pricing and can be purchased through your partner.
    zh: 实施与维保服务由伙伴按项目、模块或年度维保报价；NocoBase 商业版授权按官网统一价格，可直接向伙伴一并采购。
    where: sec
  "067":
    en: Who owns the delivered code?
    zh: 交付的代码归谁？
    where: sec
  "068":
    en: You do. Your business logic lives as clean source code in your repository, powered by NocoBase Core plugins, with code, Skills, knowledge, and support terms clearly defined.
    zh: 完全归你。业务逻辑全部是你仓库里的干净源码，通用能力由 NocoBase Core 插件提供；合同中会明确约定源码、Skills、知识库及维保权责。
    where: sec
  "069":
    en: Can we switch partners or bring maintenance in-house later?
    zh: 以后能换伙伴，或者转由内部团队维护吗？
    where: sec
  "070":
    en: Anytime. Because the system is built on standard NocoBase Core with practices in Skills and context in the knowledge base, your own team or another partner can take over smoothly.
    zh: 随时可以。系统构建在标准的 NocoBase Core 之上，开发规范沉淀在技能中，业务上下文保存在知识库里，任何团队接手都无需从零摸索。
    where: sec
  "071":
    en: Submit your requirements
    zh: 提交你的需求
    where: req
  "072":
    en: Tell us about the system you want, and we’ll recommend partners by region, industry, and the services you need.
    zh: 说说你想做的系统，我们会按地区、行业和需要的服务，为你推荐合适的伙伴。
    where: req
  "073":
    en: Company name
    zh: 公司名称
    where: req
  "074":
    en: Contact name
    zh: 联系人姓名
    where: req
  "075":
    en: Contact email
    zh: 联系人邮箱
    where: req
  "076":
    en: Your requirements
    zh: 详细需求
    where: req
  "077":
    en: Submit
    zh: 提交需求
    where: req
  "078":
    en: "For example: your industry, the system or use case, the problem to solve, the services you need, budget or scale, and target go-live"
    zh: 可以写：所属行业、想做的系统或场景、想解决的问题、需要的服务、预算或规模、期望上线时间
    where: form
  "079":
    en: Country / region
    zh: ""
    where: req
  "080":
    en: Select your country or region
    zh: ""
    where: form
