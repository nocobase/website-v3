notes: |-
  Tiếng Việt（bạn）
  术语：platform = nền tảng；foundation = nền móng（与 nền tảng 区分）；building blocks = khối chức năng；governance = quản trị；
  agent = agent；agent team = đội agent；coding agent = coding agent；business logic = logic nghiệp vụ；
  business systems = hệ thống nghiệp vụ；open source = mã nguồn mở；self-hosted = tự triển khai；at a glance = rõ ràng trong nháy mắt
  页面用语：partner = đối tác；Skills = kỹ năng
title: Tìm đối tác NocoBase — Cùng đối tác hiểu nghiệp vụ xây dựng và vận hành hệ thống
description: Đối tác NocoBase am hiểu NocoBase 3, Studio và nghiệp vụ ngành của bạn, dẫn dắt đội agent cùng bạn làm rõ yêu cầu, phát triển, nghiệm thu, đưa vào vận hành và bảo trì về sau; code bàn giao thuộc về bạn.
strings:
  "001": Tìm đối tác hiểu ngành của bạn, <span class="m">xây dựng hệ thống và đưa vào sử dụng.</span>
  "002": Đối tác NocoBase vừa thành thạo NocoBase 3 và Studio, vừa am hiểu sâu ngành của bạn. Họ dẫn dắt đội agent cùng bạn làm rõ yêu cầu, phát triển hệ thống, nghiệm thu bản xem trước và vận hành sau khi lên production. Toàn bộ quá trình minh bạch trong Studio, mã nguồn, kỹ năng và kho tri thức bàn giao hoàn toàn thuộc về bạn.
  "003": Gửi yêu cầu
  "005": Khi nào nên tìm đối tác
  "006": "Muốn dùng AI xây hệ thống nghiệp vụ, "
  "007": nhưng đội ngũ chưa sẵn sàng.
  "008": Thiếu nhân lực phát triển
  "009": Nội bộ thiếu năng lực nghiên cứu phát triển hoặc kinh nghiệm bàn giao, cần đội chuyên nghiệp dẫn dắt agent đưa dự án vào vận hành ổn định.
  "010": Cần lên production nhanh
  "011": Nghiệp vụ không thể chờ, muốn bắt đầu từ Solutions có sẵn hoặc mẫu theo ngành và đưa vào sử dụng trong vài tuần.
  "012": Tích hợp và di chuyển phức tạp
  "013": Cần kết nối ERP, OA, SSO hoặc cơ sở dữ liệu sẵn có, hay di chuyển mượt mà từ hệ thống cũ, NocoBase 2.
  "014": Muốn đào tạo đội ngũ nội bộ
  "015": Vừa làm vừa học, để đội ngũ nội bộ nắm được cách giao yêu cầu cho agent, nghiệm thu và phát hành.
  "016": Đối tác có thể làm gì
  "017": "Từ lần trao đổi đầu tiên, "
  "018": đến mỗi lần cải tiến sau khi vận hành.
  "019": Làm rõ yêu cầu và kiến trúc
  "020": Làm rõ quy trình nghiệp vụ, chọn bắt đầu từ Solution có sẵn hay từ Core, chia thành các module triển khai theo từng đợt.
  "021": Phát triển tùy biến
  "022": Điều phối đội agent phát triển trong Studio, mọi thay đổi đều qua kiểm thử và review, bạn nghiệm thu trong môi trường xem trước.
  "023": Tích hợp hệ thống
  "024": Kết nối ERP, CRM, OA, SSO, ứng dụng chat doanh nghiệp và cơ sở dữ liệu bên ngoài, phân quyền kiểm soát chặt ở phía máy chủ.
  "025": Di chuyển dữ liệu
  "026": Di chuyển dữ liệu từ bảng tính, hệ thống cũ hoặc NocoBase 2, script migration được kiểm chứng trong môi trường xem trước với dữ liệu thật rồi mới chạy.
  "027": Dịch vụ tại chỗ
  "028": "Phục vụ tận nơi tại khu vực của bạn: triển khai, xử lý sự cố, trao đổi trực tiếp với bộ phận nghiệp vụ."
  "029": Vận hành và cải tiến liên tục
  "030": Phụ trách triển khai riêng, sao lưu, nâng cấp phiên bản và xử lý sự cố, hỗ trợ và bảo trì lâu dài.
  "031": Cách cùng làm việc
  "032": "Đối tác dẫn dắt đội agent, "
  "033": quyết định nghiệp vụ do bạn đưa ra.
  "034": Dự án có thể chạy trực tiếp trong Studio của bạn, hoặc phát triển trong Studio của đối tác rồi bàn giao vào repository của bạn. Tiến độ, điểm vướng và thời điểm phát hành đều minh bạch.
  "035": Mô tả nghiệp vụ
  "036": Bạn trình bày quy trình và điểm nghẽn, đối tác tổng hợp thành yêu cầu và kế hoạch theo từng đợt.
  "037": Chốt phương án
  "038": Bạn xác nhận quy tắc nghiệp vụ, phạm vi và tiêu chí nghiệm thu.
  "039": Phát triển và kiểm tra
  "040": Đội agent phát triển và kiểm thử, đối tác kiểm soát chất lượng.
  "041": Nghiệm thu trong bản xem trước
  "042": Bạn tự tay chạy thử trong môi trường xem trước, đạt thì phê duyệt phát hành.
  "043": Bàn giao và bảo trì
  "044": Mã nguồn, kỹ năng và kho tri thức nằm trong repository của bạn; sau này tự sửa hoặc tiếp tục nhờ đối tác bảo trì.
  "045": Đối tác và đội agent phụ trách
  "046": Thiết kế phương án, phát triển, kiểm thử và review code
  "047": Môi trường, tích hợp, di chuyển dữ liệu và chuẩn bị phát hành
  "048": Đưa quy tắc nghiệp vụ vào kỹ năng và kho tri thức
  "049": Bạn quyết định
  "050": Quy tắc nghiệp vụ, phạm vi và mức ưu tiên
  "051": Tính năng có đạt nghiệm thu hay không
  "052": Khi nào đưa vào vận hành
  "053": Chọn đối tác thế nào
  "054": Gửi yêu cầu, chúng tôi sẽ giới thiệu đối tác phù hợp.
  "055": "Chúng tôi sẽ dựa trên khu vực, ngành và nhu cầu dịch vụ của bạn để giới thiệu 1–3 đối tác phù hợp để trao đổi và so sánh. Khi trao đổi, nên xác nhận:"
  "056": "Kinh nghiệm ngành: "
  "057": dự án cùng ngành đã đưa vào vận hành, có thể demo trực tiếp hay không
  "058": "Cách bàn giao: "
  "059": phát triển trong Studio của ai, mã nguồn, kỹ năng và kho tri thức bàn giao thế nào
  "060": "Bảo trì về sau: "
  "061": vận hành, nâng cấp phiên bản và SLA phản hồi sau khi lên production thỏa thuận ra sao
  "062": Câu hỏi thường gặp
  "063": Tìm đối tác và làm việc trực tiếp với NocoBase khác nhau thế nào?
  "064": NocoBase cung cấp nền tảng sản phẩm, giấy phép thương mại và kiểm chứng thực tế; đối tác đi sâu vào khu vực và ngành của bạn, cung cấp trọn gói phát triển tùy biến, tích hợp hệ thống, di chuyển dữ liệu và bảo trì lâu dài. Dự án trọng điểm có thể do hãng và đối tác cùng phục vụ.
  "065": Chi phí tính thế nào?
  "066": Dịch vụ triển khai và bảo trì do đối tác báo giá theo dự án, module hoặc bảo trì hằng năm; giấy phép thương mại NocoBase theo giá chính thức trên website, có thể mua luôn qua đối tác.
  "067": Code bàn giao thuộc về ai?
  "068": Hoàn toàn thuộc về bạn. Logic nghiệp vụ là mã nguồn sạch trong repository của bạn, năng lực chung do plugin NocoBase Core cung cấp; hợp đồng ghi rõ quyền và trách nhiệm về mã nguồn, kỹ năng, kho tri thức và bảo trì.
  "069": Sau này có thể đổi đối tác hoặc chuyển cho đội nội bộ bảo trì không?
  "070": Bất cứ lúc nào. Hệ thống xây trên NocoBase Core chuẩn, quy chuẩn phát triển đúc kết trong kỹ năng, bối cảnh nghiệp vụ lưu trong kho tri thức, đội nào tiếp nhận cũng không phải mò mẫm từ đầu.
  "071": Gửi yêu cầu của bạn
  "072": Hãy cho biết hệ thống bạn muốn xây, chúng tôi sẽ giới thiệu đối tác phù hợp theo khu vực, ngành và dịch vụ cần thiết.
  "073": Tên công ty
  "074": Tên người liên hệ
  "075": Email người liên hệ
  "076": Yêu cầu chi tiết
  "077": Gửi yêu cầu
  "078": "Có thể ghi: ngành, hệ thống hoặc kịch bản muốn xây, vấn đề cần giải quyết, dịch vụ cần, ngân sách hoặc quy mô, thời gian mong muốn đưa vào sử dụng"
  "079": Quốc gia / khu vực
  "080": Chọn quốc gia hoặc khu vực
