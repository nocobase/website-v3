notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語：伙伴 = 夥伴；行业 = 產業
title: 尋找 NocoBase 夥伴 — 和懂業務的夥伴一起，把系統做出來、用起來
description: NocoBase 夥伴熟悉 NocoBase 3、Studio 和各產業業務，帶著 Agent 團隊和你一起完成需求梳理、開發、驗收、上線和後續維護，交付的程式碼歸你。
strings:
  "001": 找到懂你產業的夥伴，<span class="m">把系統做出來、用起來。</span>
  "002": NocoBase 合作夥伴既熟悉 NocoBase 3 與 Studio，也深耕你所在的產業。他們帶著 Agent 團隊與你一起完成需求梳理、系統開發、預覽驗收與上線維運。全流程在 Studio 中透明可見，交付的原始碼、技能與知識庫完全歸你。
  "003": 提交需求
  "005": 什麼時候找夥伴
  "006": 想用 AI 落地業務系統，
  "007": 但團隊還沒準備好。
  "008": 缺少開發人手
  "009": 內部缺少研發或工程交付經驗，需要專業團隊帶著 Agent 把專案穩妥落地。
  "010": 要求快速上線
  "011": 業務等不起，希望基於現成的 Solutions 或產業範本起步，幾週內投入使用。
  "012": 涉及複雜整合與遷移
  "013": 需要打通 ERP、OA、單一登入或既有資料庫，或從舊系統、NocoBase 2 平滑遷移。
  "014": 希望培養自有團隊
  "015": 邊做邊學，讓內部團隊掌握給 Agent 提需求、做驗收和發版上線的能力。
  "016": 夥伴能做什麼
  "017": 從第一次溝通，
  "018": 到上線後的每一次改進。
  "019": 需求梳理與架構
  "020": 理清業務流程，選定從現成 Solution 還是從 Core 起步，拆解為可分批上線的模組。
  "021": 客製開發
  "022": 在 Studio 中調度 Agent 團隊開發，每次改動均經測試與審查，由你在預覽環境驗收。
  "023": 系統整合
  "024": 對接 ERP、CRM、OA、單一登入、企業微信／飛書／釘釘與外部資料庫，權限在伺服器端嚴格控管。
  "025": 資料遷移
  "026": 從試算表、舊系統或 NocoBase 2 遷移資料，遷移腳本先在真實資料預覽環境中驗證無誤再執行。
  "027": 在地現場服務
  "028": 在你所在的地區上門服務：部署、問題排查，以及和業務部門當面溝通需求。
  "029": 維運與持續迭代
  "030": 負責地端部署、備份、版本升級與故障排查，提供持續的支援和維護。
  "031": 怎樣一起工作
  "032": 夥伴帶 Agent 團隊做事，
  "033": 業務決策由你拍板。
  "034": 專案可直接在你的 Studio 中推進，或在夥伴的 Studio 中開發並交付至你的儲存庫。進度、卡點與上線時間全程透明。
  "035": 描述業務
  "036": 你講清流程和痛點，夥伴整理成需求和分批計畫。
  "037": 敲定方案
  "038": 業務規則、範圍和驗收標準由你確認。
  "039": 開發與檢查
  "040": Agent 團隊開發和測試，夥伴把關品質。
  "041": 預覽驗收
  "042": 你在預覽環境裡親手走一遍，通過後批准上線。
  "043": 交接與維護
  "044": 原始碼、技能和知識庫在你的儲存庫裡；之後自己改，或繼續請夥伴維護。
  "045": 夥伴和 Agent 團隊負責
  "046": 方案設計、開發、測試和程式碼審查
  "047": 環境、整合、遷移和發布準備
  "048": 把業務規則寫進技能和知識庫
  "049": 你決定
  "050": 業務規則、範圍和優先順序
  "051": 功能是否通過驗收
  "052": 什麼時候上線
  "053": 怎麼選夥伴
  "054": 提交需求後，我們依你的情況配對推薦。
  "055": 我們將根據你所在的地區、產業和服務需求，配對 1–3 家合適的夥伴供你溝通比較。溝通時建議重點確認：
  "056": 產業經驗：
  "057": 同產業已上線案例，以及是否支援現場展示
  "058": 交付方式：
  "059": 在誰的 Studio 環境開發，原始碼、技能與知識庫如何移交
  "060": 後續維運：
  "061": 上線後的維運、版本升級與回應 SLA 怎麼約定
  "062": 常見問題
  "063": 找夥伴和直接找 NocoBase 原廠有什麼區別？
  "064": NocoBase 原廠提供產品基礎平台、商業授權，以及實戰驗證；夥伴則深入你所在的地區和產業，提供端到端的客製開發、系統整合、資料遷移與長期維運。重點專案也可由原廠與夥伴聯合服務。
  "065": 費用怎麼算？
  "066": 導入與維運服務由夥伴按專案、模組或年度維運報價；NocoBase 商業版授權依官網統一價格，可直接向夥伴一併採購。
  "067": 交付的程式碼歸誰？
  "068": 完全歸你。業務邏輯全部是你儲存庫裡的乾淨原始碼，通用能力由 NocoBase Core 外掛提供；合約中會明確約定原始碼、技能、知識庫及維運權責。
  "069": 以後能換夥伴，或者轉由內部團隊維護嗎？
  "070": 隨時可以。系統建構在標準的 NocoBase Core 之上，開發規範累積在技能中，業務脈絡保存在知識庫裡，任何團隊接手都無需從零摸索。
  "071": 提交你的需求
  "072": 說說你想做的系統，我們會依地區、產業和需要的服務，為你推薦合適的夥伴。
  "073": 公司名稱
  "074": 聯絡人姓名
  "075": 聯絡人信箱
  "076": 詳細需求
  "077": 提交需求
  "078": 可以寫：所屬產業、想做的系統或情境、想解決的問題、需要的服務、預算或規模、期望上線時間
  "079": 國家／地區
  "080": 選擇國家或地區
