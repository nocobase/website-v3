  "045": Kundenstory · Sungrow
  "046": Globale Abläufe auf einem einzigen NocoBase-Fundament
  "047": Wie ein weltweit führender Anbieter sauberer Energie Dutzende Kernsysteme auf einer gemeinsamen Plattform aufbaut und weiterentwickelt.
  "048": Story lesen
  "049": Warum NocoBase
  "050": KI schreibt Code im Handumdrehen.<br>
  "051": Zuverlässige Geschäftssysteme zu bauen, bleibt schwer.
  "052": Ihr Team entwickelt bereits mit KI oder per Vibe Coding. Der Code entsteht schnell, doch neue Probleme kommen hinzu.
  "054": Auch wenn KI den Code schreibt, bleiben Berechtigungen, Workflow-Engines und Freigaben schwer von Grund auf zu entwerfen. Es gibt viele Sonderfälle, und die Wartung ist aufwendig.
  "055": Die Architektur gerät außer Kontrolle
  "056": Wechseln Entwickler, Modell oder auch nur die Sitzung, kann die KI jedes Mal anders improvisieren. Das System wird immer schwerer wartbar.
  "057": Mehr parallele Arbeit, als sich prüfen lässt
  "058": Sie jonglieren mit mehreren Projekten und Aufgaben, wechseln zwischen Terminals und Chats, und die Agenten liefern immer mehr Änderungen. Niemand kann alles prüfen, doch die Kontrolle abzugeben, scheint zu riskant.
  "059": Wissen lässt sich schwer festhalten und teilen
  "060": Anforderungskontext, Geschäftsunterlagen und Erfahrungen verteilen sich auf Chats auf verschiedenen Rechnern. Wechseln Menschen oder Agenten, findet man sie kaum wieder.
  "061": Ihre Agenten kümmern sich um die Geschäftslogik.<br>
  "062": Das Fundament steht bereit.
  "063": NocoBase Core ist das Open-Source-Anwendungsfundament für Geschäftssysteme, die mit KI entwickelt und betrieben werden. Berechtigungen, Workflows, Dateien und weitere Bausteine sind sofort einsatzbereit. So entwickeln Agenten nur, was Ihr Geschäft ausmacht, auf einer einheitlichen Architektur.
  "064": Bewährte Bausteine, sofort einsatzbereit
  "065": Core bietet über 20 Bausteine, darunter Berechtigungen, Workflows, Dateien und Benachrichtigungen, damit sich Agenten auf die Geschäftslogik konzentrieren.
  "066": Eine Architektur, gemeinsame Standards
  "067": Core liefert Projektgerüst, Architekturstandards und Entwicklungs-Skills. So bleibt die Architektur einheitlich und unter Kontrolle, auch wenn Menschen und Modelle wechseln.
  "068": Ihre Apps und Daten gehören Ihnen
  "069": Core ist kostenlos und Open Source. Ihr Geschäftscode und Ihre Daten bleiben in Ihren eigenen Repositories und auf Ihren eigenen Servern, und Sie wählen Modelle und Agenten selbst.
  "070": NocoBase Core entdecken
  "071": Ihr Team konzentriert sich auf Entscheidungen.<br>
  "072": Die Umsetzung übernehmen Agenten.
  "073": NocoBase Studio ist die Governance-Plattform für Menschen und Agenten, die gemeinsam Software entwickeln. Es bündelt Claude Code und Codex Ihres Teams zu einem Agenten-Team, das Aufgaben selbstständig vorantreibt. Der Fortschritt ist auf einen Blick sichtbar, und die wichtigen Entscheidungen treffen Menschen.
  "074": Ein Agenten-Team, das die Arbeit vorantreibt
  "075": Verbinden Sie Agenten auf vielen Rechnern und steuern Sie sie zentral. Sie treiben viele Projekte und Aufgaben parallel voran, rund um die Uhr.
  "076": Fortschritt auf einen Blick
  "077": Projektfortschritt, Aufgabenverlauf, Auslastung der Agenten und Modellnutzung sind jederzeit transparent.
  "078": Entscheidungen mit Belegen
  "079": Braucht eine Entscheidung einen Menschen, liefern Agenten ausführliche Berichte, Checklisten, Screenshots und Empfehlungen. So können auch Fachexperten ohne Programmierkenntnisse entscheiden.
  "080": Das Wissen bleibt im Team
  "081": Skills halten fest, wie gearbeitet wird, die Wissensdatenbank enthält Geschäftsunterlagen, und das Projektgedächtnis bewahrt, was Agenten selbst lernen. Wechseln Menschen oder Agenten, macht der Nächste genau dort weiter, wo der Vorherige aufgehört hat.
  "082": NocoBase Studio entdecken
  "083": Geschäftsanwendungen als Open Source.<br>
  "084": <span class="ph">KI-gesteuert,</span> sofort einsatzbereit.
  "085": NocoBase Solution ist eine Reihe agentengesteuerter Geschäftsanwendungen auf Basis von Core. Agenten erledigen den Großteil der Arbeit, Menschen treffen nur die wichtigen Entscheidungen.
  "086": Agenten handeln proaktiv
  "087": Jede App bringt Fach-Agenten mit, die Ihren Regeln folgen und von sich aus den Großteil der Arbeit übernehmen, etwa Erstattungen prüfen oder Tickets bearbeiten.
  "088": Wichtige Entscheidungen treffen Menschen
  "089": Agenten legen offen, worauf ihre Arbeit beruht, und wichtige Entscheidungen trifft immer ein Mensch. Jeder Agent erbt die Berechtigungen der Person, für die er arbeitet, damit die Daten geschützt bleiben.
  "090": Einfach anzupassen
  "091": Jede App basiert auf NocoBase Core, mit einheitlicher Architektur und verlässlichem Fundament. So kann ein Coding-Agent sie für Sie anpassen.
  "092": Kostenlos, Open Source, sofort einsatzbereit
  "093": Alle Apps von NocoBase Solution sind kostenlos und Open Source, laufen auf Ihren eigenen Servern und arbeiten mit dem Modell Ihrer Wahl.
  "094": Alle Apps ansehen
  "095": Was unterscheidet NocoBase von Vibe Coding?
  "096": In beiden Fällen schreibt KI den Code. Vibe Coding eignet sich für schnelle Prototypen und kleine Tools. NocoBase ist für Geschäftssysteme gemacht, die über Jahre zuverlässig laufen und sich weiterentwickeln müssen.
  "097": Fundament
  "098": Vibe Coding
  "099": KI erzeugt Berechtigungen, Workflows, Freigaben und andere Basismodule in jedem Projekt neu. Das ist teuer und schwer zuverlässig zu machen.
  "100": Core liefert fertige Bausteine, und Agenten entwickeln nur die Geschäftslogik.
  "101": Architektur
  "102": Wechseln Modell oder Sitzung, kann die KI improvisieren. Die Architektur driftet nach und nach ab.
  "103": Core liefert eine einheitliche Projektstruktur und gemeinsame Entwicklungsstandards, damit sich das System über Jahre stabil auf einer einheitlichen Architektur weiterentwickelt.
  "104": Laufende Weiterentwicklung
  "105": Änderungen der KI werden oft ungelesen übernommen, und die Probleme häufen sich.
  "106": Studio organisiert Prüfungen und Reviews. Ist eine Entscheidung nötig, liefern Agenten Berichte, Checklisten und Screenshots, und ein Mensch entscheidet.
  "107": Wissen und Erfahrung
  "108": Anforderungskontext, Projektunterlagen und Erfahrungen sind über einzelne Chats verstreut.
  "109": Studio hält Methoden und Erfahrung in Skills, Wissensdatenbank und Projektgedächtnis fest. So macht jede neue Person und jeder neue Agent dort weiter, wo der Vorherige aufgehört hat.
  "110": Open Source &amp; Self-Hosting
  "111": Kostenlos, Open Source, selbst gehostet.<br>
  "112": Ihr Code und Ihre Daten gehören Ihnen.
  "113": Core und Solution sind kostenlos und Open Source. Studio ist in den kommerziellen Editionen enthalten.
