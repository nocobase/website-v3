title: NocoBase 3 — Platform open source untuk sistem bisnis yang dibangun dengan AI
description: NocoBase adalah platform open source bagi perusahaan untuk membangun dan menjalankan sistem bisnis dengan AI. Manusia merumuskan kebutuhan dan mengambil keputusan, agen menulis kode dan mengeksekusi, dan NocoBase menjaga sistem tetap andal serta proses tetap terkendali.
