meta:
  title:
    zh: NocoBase 3 — AI + NocoBase，构建可靠的业务系统
    en: NocoBase 3 — Open-Source Platform for AI-Built Business Systems
  description:
    zh: NocoBase 是企业用 AI 开发和运行业务系统的开源平台。人提需求、做决策；Agent 写代码、做执行；NocoBase 确保系统可靠、过程可控。
    en: NocoBase is the open-source platform for enterprises to build and run business systems with AI. People define needs and make decisions, agents write code and execute, and NocoBase keeps systems reliable and the process under control.
