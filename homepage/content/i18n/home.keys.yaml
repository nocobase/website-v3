    zh: AI 写的系统可靠吗？
    where: faq
  "302":
    en: Permissions, approvals, and other critical modules come from Core rather than being generated from scratch. Every change passes automated tests and cross-model review before human verification, ships only after approval, and can be rolled back anytime.
    zh: 权限、审批等核心基础能力由应用底座提供，不由 AI 从零生成。每个改动都经过自动测试和不同模型交叉评审，才交给人验收；经人批准才发布到生产，出了问题可以回滚。
