    zh: 不懂代码的业务人员能用吗？
    where: faq
  "300":
    en: Yes. Business users describe requirements, answer agent questions, and verify results with real data in a test environment on desktop or mobile. Agents and Studio handle branches, environments, testing, and releases.
    zh: 能。业务人员可以在电脑或手机上直接提需求、回答 Agent 的问题，在测试环境里用真实数据验收；环境、分支、测试和发布，由 Agent 和工作台承担。
    where: faq
