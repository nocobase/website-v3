  "294":
    en: Vibe coding speeds up writing code, but complex enterprise systems also need a reliable foundation, consistent architecture, and governance. NocoBase doesn’t replace vibe coding—Core supplies ready-made building blocks and standards, while Studio coordinates agent teams, quality checks, and team know-how to turn AI-written code into reliable business systems.
    zh: Vibe Coding 让软件开发更加高效，但当项目涉及复杂业务、多人协作和长期迭代时，仅靠 AI 生成代码还不够。NocoBase 并不是 Vibe Coding 的替代品，而是通过应用底座（Core）提供现成的基础能力和统一规范，通过工作台（Studio）完成多 Agent 调度、质量把关和经验沉淀，把 AI 写出的代码变成可靠的业务系统。
    where: faq
    unused: true
  "295":
    en: How is it different from low-code platforms?
    zh: 和低代码平台有什么区别？
    where: faq
  "296":
    en: Low-code platforms rely on manual drag-and-drop configuration, hit platform ceilings on complex requirements, and lock apps to the platform. With NocoBase, agents write real source code for complex rules, integrations, and custom UIs—stored in your own repo and running independently.
    zh: 低代码平台靠人拖拽配置，复杂需求要绕开平台限制，应用依附于平台。NocoBase 由 Agent 编写真正的源码，复杂规则、系统集成、定制界面都能做；代码在企业自己的仓库里，应用独立运行。
    where: faq
    unused: true
  "297":
    en: We already use Claude Code, Codex, or Cursor—why NocoBase?
    zh: 已经在用 Claude Code、Codex、Cursor，还需要 NocoBase 吗？
    where: faq
  "298":
    en: Coding tools solve how one developer writes code with AI; NocoBase solves how a team delivers reliable business systems continuously. Studio orchestrates those tools as a governed agent team, and Core gives them ready-made building blocks and consistent standards so the architecture never drifts.
    zh: 需要。这些编码工具解决的是一个人怎样用 AI 写代码，NocoBase 解决的是企业怎样用它们持续交付可靠的业务系统。工作台把这些编码工具组成一支 Agent 团队统一调度、按流程把关；应用底座提供现成的基础能力和统一规范，编码工具在上面只写业务，换人、换模型架构也不会漂移。
    where: faq
    unused: true
