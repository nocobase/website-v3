title: NocoBase 3 — AI로 비즈니스 시스템을 구축하는 오픈소스 플랫폼
description: NocoBase는 기업이 AI로 비즈니스 시스템을 개발하고 운영하는 오픈소스 플랫폼입니다. 사람은 요구사항을 정의하고 결정하며, 에이전트는 코드를 작성하고 실행하고, NocoBase는 시스템의 신뢰성과 프로세스의 통제력을 유지합니다.
