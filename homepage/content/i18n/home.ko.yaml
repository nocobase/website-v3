  "248": 전체 스토리 읽기
  "249": <span class="ln">NocoBase는 기업이 AI로 비즈니스 시스템을 개발하고 운영하는 오픈소스 플랫폼입니다.</span><span class="ln">사람은 요구사항을 정의하고 결정하며, 에이전트는 코드를 작성하고 실행하고, NocoBase는 시스템의 신뢰성과 프로세스의 통제력을 지킵니다.</span>
  "250": 사용자 스토리 · Sungrow
  "251": 새로운 업무 방식
  "252": "비즈니스 시스템을 개발하고 운영하는 방식이 "
  "253": 달라지고 있습니다.
  "254": Studio와 Core가 함께 뒷받침하여 기업이 새로운 업무 방식을 도입하면서도 모든 시스템을 신뢰할 수 있고 통제 가능한 상태로 유지합니다.
  "255": 비즈니스 팀
  "256": 직접 요청하고, 직접 검수
  "257": 더 이상 몇 달씩 기다릴 필요가 없습니다. 필요한 내용을 전달하면 에이전트가 몇 시간 만에 개발을 마치고, 직접 검수할 수 있도록 납품 보고서와 테스트 환경을 함께 전달합니다.
  "258": IT &amp; 개발 팀
  "259": 규칙 수립, 검토 및 배포 승인
  "260": 코딩과 테스트는 에이전트 팀이 맡고, IT 팀은 아키텍처 표준 수립, 설계 검토, 품질 관리, 배포 승인에 집중합니다.
  "261": 경영진
  "262": 진행 상황과 비용을 언제든 파악
  "263": 여러 단계를 거쳐 보고를 취합할 필요가 없습니다. 모든 프로젝트의 진행 상황, 사이클 타임, 모델 비용을 한곳에서 확인할 수 있습니다.
  "264": 일상 업무
  "265": AI가 일상 업무를 24시간 처리
  "266": 비즈니스 에이전트가 각 앱 안에서 담당자의 권한으로 24시간 일상 업무를 처리하며, 중요한 작업은 실행 전 사람의 확인을 받습니다.
  "267": Studio는 이 새로운 업무 방식을 위한 워크스페이스입니다. 여러 기기의 Claude Code, Codex, OpenCode를 24시간 일하는 에이전트 팀으로 묶어 개발, 테스트, 리뷰를 프로세스에 따라 진행하며, 사람은 PC나 모바일에서 요구사항을 정의하고 진행 상황을 확인하며 의사 결정을 내립니다.
  "268": 24시간 일하는 에이전트 팀
  "269": 개인 컴퓨터와 서버의 Claude Code, Codex, OpenCode를 연결해 벤더 종속 없이 여러 프로젝트를 병렬로 추진합니다.
  "270": 체계적인 워크플로, 한눈에 보이는 진행 상황
  "271": 모든 작업은 자동 테스트와 교차 모델 코드 리뷰를 포함한 워크플로에 따라 진행되며, 진행 상황, 사이클 타임, 비용을 한곳에서 확인할 수 있습니다.
  "272": 어디서나 근거를 바탕으로 결정
  "273": PC와 모바일 어디서나 요구사항을 전달하고 결과를 검수합니다. 보고서, 체크리스트, 스크린샷, 실제 동작하는 테스트 환경이 함께 제공되어 비개발자도 바로 검수할 수 있습니다.
  "274": 팀의 일하는 방식은 스킬에, 업무 문서는 지식 베이스에, 에이전트가 익힌 경험은 프로젝트 메모리에 저장합니다. 담당자나 모델이 바뀌어도 작업을 바로 이어갈 수 있습니다.
  "275": Studio 문서
  "276": Core는 Studio를 뒷받침하는 오픈소스 엔지니어링 기반입니다. 권한, 워크플로, 파일, AI 연동 등 20가지 이상의 기본 기능이 준비되어 있어, 에이전트는 통일된 아키텍처 위에서 기업 고유의 비즈니스 로직만 개발합니다.
  "277": 바로 쓰는 20가지 이상의 검증된 기본 기능
  "278": 사용자·권한, 데이터·파일, 워크플로·승인, 알림이 기본 내장되어 AI가 처음부터 생성하지 않으므로, 검토와 보안 점검을 비즈니스 로직에만 집중할 수 있습니다.
  "279": 장기 발전을 위한 일관된 아키텍처
  "280": 프로젝트 스캐폴딩, 아키텍처 규칙, 개발 스킬이 Core와 함께 제공되어 사람, 모델, 세션이 바뀌어도 동일한 구조를 유지합니다.
  "281": 모든 비즈니스 시스템에 AI 기본 내장
  "282": 모델 연결, 비즈니스 에이전트 스케줄링, AI 지식 베이스가 기본 내장되어 있습니다. 비즈니스 에이전트는 담당자의 권한으로 24시간 실행되며 중요한 작업은 사람의 확인을 받습니다.
  "283": 오픈소스·지속 유지보수, 앱은 독립 실행
  "284": Core는 오픈소스로 지속적으로 유지보수됩니다. 비즈니스 소스 코드는 기업의 저장소에 보관되며, 배포된 앱은 Studio와 무관하게 독립적으로 실행됩니다.
  "285": Core 문서
  "286": Community 에디션은 Studio 기본 기능과 Core의 모든 기능을 포함한 무료 오픈소스입니다. 상용 에디션은 1회 구매로 영구 라이선스를 제공합니다.
  "287": 코드와 데이터는 기업의 소유
  "288": Studio와 비즈니스 앱 모두 폐쇄망을 포함한 기업의 자체 서버에서 실행됩니다.
  "289": 특정 벤더에 종속되지 않습니다. Claude Code, Codex 등 다양한 코딩 도구와 클라우드·로컬 모델을 자유롭게 사용할 수 있습니다.
  "290": 배포된 비즈니스 앱은 독립적으로 실행됩니다. 일상적인 비즈니스 요청은 Studio를 거치지 않습니다.
  "291": 1회 구매
  "292": 상용 에디션은 1회 구매, 영구 라이선스로 제공됩니다. 서버, 모델, 코딩 도구는 직접 선택하고 각 공급업체에 직접 결제합니다.
  "293": 자주 묻는 질문
  "294": 바이브 코딩은 코드 작성 속도를 높여 주지만, 복잡한 기업용 시스템에는 신뢰할 수 있는 기반, 일관된 아키텍처, 거버넌스가 함께 필요합니다. NocoBase는 바이브 코딩을 대체하는 것이 아닙니다. Core가 바로 쓸 수 있는 기본 기능과 표준을 제공하고, Studio가 에이전트 팀 조율, 품질 검증, 팀 노하우 축적을 맡아 AI가 작성한 코드를 신뢰할 수 있는 비즈니스 시스템으로 완성합니다.
  "295": 로우코드 플랫폼과는 무엇이 다른가요?
  "296": 로우코드 플랫폼은 사람이 직접 드래그 앤 드롭으로 설정해야 하며, 복잡한 요구사항에서 플랫폼 한계에 부딪히고 앱이 플랫폼에 종속됩니다. NocoBase에서는 에이전트가 복잡한 규칙, 시스템 연동, 맞춤 UI까지 실제 소스 코드로 작성하며, 코드는 기업의 저장소에 보관되고 앱은 독립적으로 실행됩니다.
  "297": 이미 Claude Code, Codex, Cursor를 쓰고 있는데 NocoBase가 왜 필요한가요?
  "298": 코딩 도구는 개발자 한 명이 AI로 코드를 작성하는 문제를 해결하고, NocoBase는 팀이 신뢰할 수 있는 비즈니스 시스템을 지속적으로 납품하는 문제를 해결합니다. Studio가 기존 코딩 도구를 거버넌스가 적용된 에이전트 팀으로 조율하고, Core가 바로 쓸 수 있는 기본 기능과 일관된 표준을 제공해 아키텍처가 흔들리지 않습니다.
  "299": 코드를 모르는 현업 담당자도 참여할 수 있나요?
  "300": 네, 가능합니다. 현업 담당자는 PC나 모바일에서 요구사항을 설명하고 에이전트의 질문에 답하며, 테스트 환경에서 실제 데이터로 결과를 검수합니다. 브랜치, 환경, 테스트, 배포는 에이전트와 Studio가 맡습니다.
  "301": AI가 만든 시스템을 프로덕션에서 믿고 쓸 수 있나요?
  "302": 권한, 승인 등 핵심 모듈은 AI가 처음부터 생성하지 않고 Core에서 제공합니다. 모든 변경은 자동 테스트와 교차 모델 리뷰를 거쳐 사람에게 검수되며, 승인을 받은 뒤에만 배포되고 문제가 생기면 언제든 롤백할 수 있습니다.
  "303": 데이터가 외부로 전송되나요?
  "304": NocoBase는 폐쇄망을 포함한 기업의 자체 서버에서 실행됩니다. 에이전트가 작업할 때 관련 코드는 기업이 선택한 모델 공급업체로만 전송되며, 필요시 로컬에 호스팅된 모델을 사용할 수 있습니다.
  "305": 첫 번째 실제 요구사항으로 시작해 보세요.
  "306": Community 에디션은 Studio 기본 기능과 Core의 모든 기능을 포함한 무료 오픈소스입니다.
  "307": Community 에디션
  "308": 직접 배포하고 몇 분 만에 시작
  "309": 로컬이나 자체 서버에 NocoBase를 배포하고 사용 중인 코딩 도구와 모델을 연결해 바로 프로덕션에 적용할 수 있습니다.
  "310": 빠른 시작 문서
  "311": Pro &amp; Enterprise
  "312": 1회 구매
  "313": 기업 팀과 핵심 시스템을 위한 구성
  "314": 다중 역할 워크플로, 배포 승인, 엔터프라이즈 SSO, 예산 관리, 품질 계획, 회귀 테스트, 고가용성을 추가합니다.
  "315": 사람이 요구사항을 정의하고 결정
  "316": 에이전트가 코드를 작성하고 실행
  "317": NocoBase가 시스템의 신뢰성과 통제력을 유지
  "318": 언제 어디서나 협업과 의사 결정
  "319": PC와 모바일 어디서나 요구사항을 전달하고 진행 상황과 비용을 확인하며 결과를 검수할 수 있습니다. 모든 납품물에 보고서, 체크리스트, 스크린샷, 실제 동작하는 테스트 환경이 함께 제공됩니다.
  "320": 체계적인 워크플로, 핵심 단계는 사람이 검증
  "322": 자동 품질 테스트와 자동 수정 루프
  "323": 일일, 릴리스, 프로젝트, 사용자 지정 트리거에 따라 Playwright, OWASP ZAP, Lighthouse 등 검증된 도구로 7개 영역을 병렬 테스트합니다. 발견된 문제는 자동으로 후속 작업으로 등록되어 수정과 재테스트까지 이어집니다.
  "326": 작업에 따라 간편, 표준 또는 사용자 지정 워크플로를 선택하며, 매 실행마다 고정 스킬이 자동으로 로드됩니다. 다른 모델의 읽기 전용 리뷰와 자동 CI 검사를 통과한 뒤 사람의 검수로 넘어갑니다.
  "327": 바이브 코딩은 코드 작성 속도를 크게 높여 주지만, 복잡한 기업용 시스템에는 신뢰할 수 있는 기반, 체계적인 워크플로, 자동화된 품질 테스트도 함께 필요합니다. NocoBase는 바이브 코딩을 대체하지 않습니다. Core가 바로 쓸 수 있는 기본 기능과 일관된 아키텍처를 제공하고, Studio가 고정 스킬·교차 모델 리뷰·사람의 검증 게이트가 적용된 워크플로로 모든 작업을 진행하며, 검증된 도구로 다각도의 병렬 테스트와 자동 수정 루프를 실행해 AI가 작성한 코드를 신뢰할 수 있는 비즈니스 시스템으로 완성합니다.
  "328": 권한, 승인 등 핵심 모듈은 AI가 처음부터 생성하지 않고 Core에서 제공합니다. 모든 변경은 체계적인 워크플로를 따라 자동 검사와 교차 모델 리뷰를 거쳐 사람에게 검수됩니다. 또한 프로젝트 수준의 품질 테스트가 검증된 도구로 기능, 스모크 테스트, 권한, 보안, 성능, 코드 품질, UX를 점검하고 자동 수정 루프로 해결하며, 배포는 승인을 거쳐 진행되고 문제 시 즉시 롤백할 수 있습니다.
  "329": NocoBase Studio
  "330": NocoBase Core
  "331": Core는 Studio를 뒷받침하는 오픈소스 엔지니어링 기반입니다. 권한, 워크플로, 파일, AI 연동 등 30가지 이상의 기본 기능이 준비되어 있어, 에이전트는 통일된 아키텍처 위에서 기업 고유의 비즈니스 로직만 개발합니다.
  "332": 바로 쓰는 30가지 이상의 검증된 기본 기능
  "333": Core와 Studio가 함께 뒷받침하여 기업이 새로운 업무 방식을 도입하면서도 모든 시스템을 신뢰할 수 있고 통제 가능한 상태로 유지합니다.
  "334": Core와 모든 Solution 앱은 무료 오픈소스이며, Studio Community 에디션은 무료로 사용할 수 있습니다. Core로 바로 시작하거나 Studio를 배포할 수 있으며, 상용 에디션은 1회 구매로 영구 라이선스를 제공합니다.
  "335": 로우코드 플랫폼은 여전히 수동 드래그 앤 드롭 설정에 의존하므로 복잡한 규칙이나 맞춤 UI에서 한계에 부딪히고 앱이 플랫폼에 종속됩니다. NocoBase에서는 에이전트가 표준 소스 코드를 병렬로 작성해 훨씬 빠르게 개발하며 기능적 한계가 거의 없습니다. 코드는 기업의 자체 Git 저장소에 보관되고 독립적으로 실행되며, 일상 업무를 돕는 비즈니스 에이전트도 기본 내장됩니다.
  "336": 네, 필요합니다. 코딩 도구는 코드를 얼마나 빨리 작성하느냐를 해결하고, NocoBase는 신뢰할 수 있는 비즈니스 시스템을 어떻게 지속적으로 납품하느냐를 해결합니다. 먼저 기존 코딩 도구로 Core부터 바로 시작해 보세요. 30가지 이상의 기본 기능이 바로 준비되어 있어 에이전트가 아키텍처를 흐트러뜨리지 않고 비즈니스 로직에만 집중할 수 있습니다. 프로젝트가 늘어나 팀 협업, 현업 검수, 자동 품질 게이트가 필요해지면 Studio를 더해 거버넌스가 적용된 하나의 에이전트 팀으로 조율할 수 있습니다.
  "337": 기존 코딩 도구로 Core부터 바로 시작하거나, 팀 협업을 위해 Studio Community 에디션을 배포할 수 있습니다. 둘 다 무료로 시작할 수 있습니다.
