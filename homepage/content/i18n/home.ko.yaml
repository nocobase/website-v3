  "156": 영업 관리
  "157": 에이전트가 오늘 37건을 처리했습니다. 당신이 결정한 건 6건뿐입니다.
  "158": IT 자산
  "159": 절감한 비용마다 근거가 명확합니다.
  "160": 그로스
