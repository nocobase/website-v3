  "040": 신뢰할 수 있는 비즈니스 시스템 구축
  "041": <span class="ln">NocoBase는 AI로 비즈니스 시스템을 지속적으로 개발하고 운영하는 오픈소스 플랫폼입니다.</span><span class="ln">에이전트는 코드를 작성하고 실행하며, NocoBase는 기반과 거버넌스를 제공하고, 결정은 사람이 내립니다.</span>
  "042": 데모 보기
  "043": 시작하기
  "044": 다양한 업계의 팀이 NocoBase로 핵심 비즈니스 시스템을 구축합니다
  "045": 고객 사례 · Sungrow
  "046": 하나의 NocoBase 기반으로 글로벌 비즈니스를 운영하다
  "047": 글로벌 청정에너지 선도 기업이 하나의 공유 플랫폼 위에서 수십 개의 핵심 시스템을 구축하고 발전시키는 방법.
  "048": 사례 읽기
  "049": 왜 NocoBase인가
  "050": AI는 코드를 빠르게 작성합니다.<br>
  "051": 하지만 신뢰할 수 있는 비즈니스 시스템을 만드는 일은 여전히 쉽지 않습니다.
  "052": 이미 AI로 개발하거나 바이브 코딩을 하고 있다면 코드는 빠르게 나옵니다. 하지만 새로운 문제가 함께 생깁니다.
  "054": AI에 맡겨도 권한, 워크플로 엔진, 승인 같은 기반 모듈을 처음부터 개발하면 설계가 어렵고, 예외 상황이 많고, 유지 보수 부담도 큽니다.
  "055": 아키텍처가 제멋대로 흔들리고 통제를 벗어난다
  "056": 사람이나 모델, 심지어 세션만 바뀌어도 AI는 매번 다르게 구현할 수 있습니다. 시스템은 점점 유지 보수하기 어려워집니다.
  "057": 병렬 작업이 넘쳐 사람이 확인하지 못한다
  "058": 여러 프로젝트와 작업을 동시에 맡아 여러 터미널과 대화창을 오가는 동안, 에이전트가 넘기는 변경은 계속 늘어납니다. 다 볼 수도 없고, 그렇다고 손을 놓을 수도 없습니다.
  "059": 지식과 경험이 쌓이지도, 공유되지도 않는다
  "060": 요구 사항의 배경, 업무 자료, 프로젝트 경험이 여러 컴퓨터의 여러 대화에 흩어져 있어, 사람이나 에이전트가 바뀌면 찾기 어렵습니다.
  "061": 에이전트는 비즈니스 개발에만 집중하세요.<br>
  "062": 기반은 이미 준비되어 있습니다.
  "063": NocoBase Core는 AI로 비즈니스 시스템을 개발하고 운영하는 오픈소스 애플리케이션 기반입니다. 권한, 워크플로, 파일 같은 기본 기능을 바로 사용할 수 있어, 에이전트는 통일된 아키텍처 위에서 기업 고유의 비즈니스만 개발합니다.
  "064": 검증된 기본 기능을 바로 사용
  "065": Core는 권한, 워크플로, 파일, 알림 등 20가지 이상의 기본 기능을 제공하므로 에이전트는 비즈니스 개발에만 집중할 수 있습니다.
  "066": 에이전트를 위한 통일된 아키텍처와 규칙
  "067": Core는 프로젝트 스캐폴드, 아키텍처 규칙, 개발 스킬을 제공합니다. 사람이나 모델이 바뀌어도 프로젝트 아키텍처는 통일되고 통제된 상태로 유지됩니다.
  "068": 앱과 데이터는 기업의 소유
  "069": Core는 무료 오픈소스입니다. 비즈니스 코드와 데이터는 모두 기업의 저장소와 서버에 있으며, 모델과 에이전트도 자유롭게 선택할 수 있습니다.
  "070": NocoBase Core 자세히 보기
  "071": 팀은 의사 결정에 집중하세요.<br>
  "072": 실행은 에이전트에게 맡기세요.
  "073": NocoBase Studio는 사람과 에이전트가 함께 개발하는 거버넌스 플랫폼입니다. 팀의 Claude Code와 Codex를 하나의 에이전트 팀으로 묶어 작업을 자동으로 진행합니다. 진행 상황은 한눈에 보이고, 중요한 결정은 사람이 내립니다.
  "074": 멈추지 않고 일하는 에이전트 팀
  "075": 여러 머신의 에이전트를 연결해 한곳에서 배분하고, 24시간 여러 프로젝트와 많은 작업을 동시에 진행합니다.
  "076": 모든 진행 상황을 한눈에
  "077": 프로젝트 진행 상황, 작업 진행 과정, 에이전트 작업량, 모델 사용량까지 모두 한눈에 보입니다.
  "078": 근거를 바탕으로 결정
  "079": 사람의 결정이 필요할 때 에이전트가 상세한 보고서, 체크리스트, 스크린샷, 제안을 첨부하므로 코드를 모르는 업무 전문가도 바로 결정할 수 있습니다.
  "080": 방법, 경험, 지식이 팀에 쌓인다
  "081": 스킬에는 일하는 방법이, 지식 베이스에는 업무 자료가, 프로젝트 메모리에는 에이전트가 스스로 익힌 경험이 쌓입니다. 사람이나 에이전트가 바뀌어도 막힘없이 인수인계할 수 있습니다.
  "082": NocoBase Studio 자세히 보기
  "083": 오픈소스 비즈니스 앱.<br>
  "084": <span class="ph">AI 기반으로,</span> 설치 즉시 사용.
  "085": NocoBase Solution은 Core 위에 구축된, 에이전트가 움직이는 비즈니스 앱 시리즈입니다. 실행 업무의 대부분은 에이전트가 맡고, 사람은 중요한 결정만 내립니다.
  "086": 에이전트가 먼저 움직인다
  "087": 각 앱에는 여러 비즈니스 에이전트가 내장되어 있어, 규칙에 따라 실행 업무의 대부분을 스스로 맡습니다. 예를 들어 환불 확인이나 티켓 처리 같은 일입니다.
  "088": 중요한 결정은 사람이
  "089": 에이전트의 작업 결과에는 근거가 첨부되고, 중요한 결정은 반드시 사람이 내립니다. 에이전트는 담당자의 권한을 이어받아 데이터를 안전하게 지킵니다.
  "090": 쉬운 맞춤 개발
  "091": NocoBase Core로 개발되어 통일된 아키텍처와 신뢰할 수 있는 기반을 갖추고 있어, 코딩 에이전트에게 맞춤 개발을 맡길 수 있습니다.
  "092": 무료 오픈소스, 바로 사용
  "093": 모든 Solution은 무료 오픈소스이며, 기업의 자체 서버에 배포하고 모델도 자유롭게 선택할 수 있습니다.
  "094": 모든 Solution 보기
  "095": NocoBase와 바이브 코딩은 무엇이 다른가요?
  "096": 둘 다 AI가 코드를 작성합니다. 바이브 코딩은 프로토타입이나 작은 도구를 빠르게 만드는 데 적합하고, NocoBase는 오랫동안 안정적으로 운영하며 계속 발전시켜야 하는 비즈니스 시스템을 위한 것입니다.
  "097": 기반
  "098": 바이브 코딩
  "099": 권한, 워크플로, 승인 같은 기반 모듈을 프로젝트마다 AI가 처음부터 생성합니다. 비용이 크고 신뢰성을 보장하기 어렵습니다.
  "100": Core가 기본 기능을 제공하고, 에이전트는 비즈니스 부분만 개발합니다.
  "101": 아키텍처
  "102": 모델이나 세션이 바뀌면 AI가 제멋대로 구현할 수 있어, 아키텍처가 점점 흔들립니다.
  "103": Core가 통일된 프로젝트 구조와 개발 규칙을 제공해, 시스템이 통일된 아키텍처 위에서 오랫동안 안정적으로 발전합니다.
  "104": 지속적인 개선
  "105": AI가 무엇을 바꿨는지 보지도 않고 받아들이는 경우가 많아 문제가 점점 쌓입니다.
  "106": Studio가 검사와 리뷰를 조율합니다. 결정이 필요하면 에이전트가 보고서, 체크리스트, 스크린샷을 첨부하고, 사람이 결정합니다.
  "107": 지식과 경험
  "108": 요구 사항의 배경, 프로젝트 자료, 경험이 각자의 대화 속에 흩어져 있습니다.
  "109": Studio는 스킬, 지식 베이스, 프로젝트 메모리에 방법과 경험을 쌓아, 사람이나 에이전트가 바뀌어도 막힘없이 인수인계할 수 있습니다.
  "110": 오픈소스와 셀프 호스팅
  "111": 무료 오픈소스, 셀프 호스팅.<br>
  "112": 코드와 데이터는 기업의 소유입니다.
  "113": Core와 Solution은 무료 오픈소스이며, Studio는 상용 에디션에서 제공합니다.
  "114": 기여자
  "115": 누적 다운로드
  "116": 300만+
  "117": GitHub에서 소스 보기
  "118": 무료 오픈소스
  "119": Core와 모든 Solution은 무료 오픈소스이며, 그대로 프로덕션에 사용할 수 있습니다.
  "120": 셀프 호스팅
  "121": Core, Solution, Studio 모두 기업의 자체 서버에 배포되며, 코드와 데이터는 기업이 소유합니다.
  "122": 모델과 에이전트를 자유롭게 선택
  "123": 특정 벤더에 종속되지 않습니다. Claude Code, Codex 등의 코딩 도구와 다양한 대규모 언어 모델을 지원합니다.
  "124": 독립적으로 실행되는 앱
  "125": 비즈니스 앱은 배포 후 독립적으로 실행되며, 일상적인 비즈니스 요청은 Studio를 거치지 않습니다.
  "126": 팀에 맞는 시작점을 선택하세요.
  "127": 무료 오픈소스
  "128": Core로 자체 시스템 개발
  "129": 에이전트가 Core의 기본 기능을 활용해 기업 고유의 비즈니스만 개발합니다.
  "130": 배포 가이드 보기
  "131": 바로 쓰는 비즈니스 앱 설치
  "132": 그대로 사용할 수도 있고, 코딩 에이전트에게 비즈니스에 맞춘 커스터마이징을 맡길 수도 있습니다.
  "133": Solution 보기
  "134": 상용 에디션
  "135": 에이전트 팀을 이끌며 개발
  "136": 팀은 의사 결정에 집중하고, 실행은 에이전트에게 맡기세요.
  "137": 에디션 및 가격 보기
  "138": AI + NocoBase. 신뢰할 수 있는 비즈니스 시스템 구축.
