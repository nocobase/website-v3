  "040": Crie sistemas de negócio confiáveis
  "041": <span class="ln">NocoBase é a plataforma open source para criar, operar e evoluir sistemas de negócio com IA.</span><span class="ln">Os agentes escrevem o código e fazem o trabalho, o NocoBase fornece a base e a governança, e as pessoas tomam as decisões.</span>
