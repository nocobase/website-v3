title: NocoBase 3 — Plataforma open source para sistemas de negócio criados com IA
description: O NocoBase é a plataforma open source para empresas criarem e operarem sistemas de negócio com IA. As pessoas definem as necessidades e decidem, os agentes escrevem o código e executam, e o NocoBase mantém os sistemas confiáveis e o processo sob controle.
