  "043": Começar
  "044": Equipes de todos os setores constroem seus sistemas de negócio essenciais no NocoBase
  "045": Case de cliente · Sungrow
  "046": Operações globais sobre uma única base NocoBase
  "047": Como uma líder global em energia limpa cria e evolui dezenas de sistemas essenciais em uma única plataforma compartilhada.
  "048": Ler o case
  "049": Por que NocoBase
  "050": A IA escreve código rápido.<br>
  "051": Construir sistemas de negócio confiáveis continua difícil.
  "052": Sua equipe já desenvolve com IA ou faz vibe coding. O código sai rápido, mas novos problemas aparecem junto.
  "054": Mesmo com a IA escrevendo o código, permissões, motores de workflow e aprovações continuam difíceis de projetar do zero. Há muitos casos-limite, e a manutenção dá muito trabalho.
  "055": A arquitetura sai do controle
  "056": Troque de desenvolvedor, de modelo ou até de sessão, e a IA pode improvisar de um jeito diferente a cada vez. O sistema fica cada vez mais difícil de manter.
  "057": Mais trabalho em paralelo do que dá para revisar
  "058": Você alterna entre vários projetos e tarefas, entre terminais e chats, enquanto os agentes entregam cada vez mais mudanças. É mais do que alguém consegue revisar, mas soltar o controle parece arriscado demais.
  "059": Conhecimento difícil de registrar e compartilhar
  "060": Contexto dos requisitos, documentos de negócio e lições aprendidas ficam espalhados em chats de computadores diferentes. Quando mudam as pessoas ou os agentes, fica difícil encontrá-los.
  "061": Deixe os agentes focarem na sua lógica de negócio.<br>
  "062": A base já está pronta.
  "063": O NocoBase Core é a base de aplicações open source para sistemas de negócio criados e operados com IA. Permissões, workflows, arquivos e outros componentes básicos já vêm prontos, então os agentes desenvolvem só o que é específico do seu negócio, tudo em uma arquitetura consistente.
  "064": Componentes comprovados, prontos para usar
  "065": O Core oferece mais de 20 componentes básicos, como permissões, workflows, arquivos e notificações, para que os agentes foquem na lógica de negócio.
  "066": Uma arquitetura, um só padrão
  "067": O Core traz a estrutura do projeto, padrões de arquitetura e skills de desenvolvimento, para que a arquitetura continue consistente e sob controle mesmo quando mudam as pessoas e os modelos.
  "068": Seus apps e dados são seus
  "069": O Core é gratuito e open source. Seu código de negócio e seus dados ficam nos seus próprios repositórios e servidores, e você escolhe os modelos e os agentes.
  "070": Conheça o NocoBase Core
  "071": Deixe sua equipe focar nas decisões.<br>
  "072": A execução fica com os agentes.
  "073": O NocoBase Studio é a plataforma de governança para pessoas e agentes que desenvolvem software juntos. Ele reúne o Claude Code e o Codex da sua equipe em uma única equipe de agentes que faz as tarefas avançarem sozinha. O progresso fica à vista, e as decisões importantes ficam com as pessoas.
  "074": Uma equipe de agentes que mantém o trabalho andando
  "075": Conecte agentes de várias máquinas e coordene tudo em um só lugar. Eles fazem muitos projetos e tarefas avançarem em paralelo, 24 horas por dia.
  "076": Todo o progresso à vista
  "077": Andamento dos projetos, atividade das tarefas, carga dos agentes e uso de modelos ficam sempre visíveis.
  "078": Decisões baseadas em evidências
  "079": Quando uma decisão precisa de uma pessoa, os agentes anexam relatórios detalhados, checklists, capturas de tela e recomendações, para que até especialistas de negócio que não programam possam dar a palavra final.
  "080": O conhecimento fica na equipe
  "081": As skills guardam como o trabalho é feito, a base de conhecimento guarda os documentos de negócio e a memória do projeto guarda o que os agentes aprendem sozinhos. Quando mudam as pessoas ou os agentes, o próximo continua de onde o anterior parou.
  "082": Conheça o NocoBase Studio
  "083": Apps de negócio open source.<br>
  "084": <span class="ph">Movidos por IA,</span> prontos para usar.
  "085": O NocoBase Solution é uma linha de apps de negócio movidos por agentes e construídos sobre o Core. Os agentes fazem a maior parte do trabalho, e as pessoas tomam só as decisões importantes.
  "086": Agentes com iniciativa
  "087": Cada app vem com agentes de negócio que seguem suas regras e assumem por conta própria a maior parte do trabalho, como conferir reembolsos e atender tickets.
  "088": As decisões importantes são das pessoas
  "089": Os agentes mostram em que se baseia cada trabalho, e as decisões importantes são sempre tomadas por uma pessoa. Cada agente herda as permissões de quem ele atende, então os dados ficam protegidos.
  "090": Fáceis de personalizar
  "091": Todo app é construído sobre o NocoBase Core, com arquitetura consistente e base confiável, então você pode pedir a um agente de código que o personalize.
  "092": Gratuitos, open source, prontos para usar
  "093": Todos os apps do NocoBase Solution são gratuitos e open source, rodam nos seus próprios servidores e funcionam com o modelo que você escolher.
  "094": Ver todos os apps
  "095": Qual a diferença entre NocoBase e vibe coding?
  "096": Nos dois casos, a IA escreve o código. O vibe coding funciona bem para protótipos rápidos e ferramentas pequenas. O NocoBase é para sistemas de negócio que precisam rodar de forma confiável por anos e continuar evoluindo.
  "097": Base
  "098": Vibe coding
  "099": A IA gera do zero permissões, workflows, aprovações e outros módulos básicos em cada projeto. Isso é caro e difícil de tornar confiável.
  "100": O Core oferece componentes básicos prontos, e os agentes desenvolvem só a lógica de negócio.
  "101": Arquitetura
  "102": Troque de modelo ou de sessão e a IA pode improvisar. A arquitetura vai se desviando aos poucos.
  "103": O Core traz uma estrutura de projeto e padrões de desenvolvimento únicos, para que o sistema evolua de forma estável por anos em uma arquitetura consistente.
  "104": Evolução contínua
  "105": As mudanças da IA muitas vezes são aceitas sem que ninguém as leia, e os problemas se acumulam.
  "106": O Studio organiza verificações e revisões. Quando é preciso decidir, os agentes anexam relatórios, checklists e capturas de tela, e uma pessoa decide.
  "107": Conhecimento e experiência
  "108": Contexto dos requisitos, documentos do projeto e lições aprendidas ficam espalhados em chats individuais.
  "109": O Studio registra métodos e experiência em skills, na base de conhecimento e na memória do projeto, para que uma nova pessoa ou agente continue de onde o anterior parou.
  "110": Open source e auto-hospedagem
  "111": Gratuito, open source, auto-hospedado.<br>
  "112": Seu código e seus dados pertencem a você.
  "113": Core e Solution são gratuitos e open source. O Studio está disponível nas edições comerciais.
