title: NocoBase 3 — платформа с открытым кодом для бизнес-систем, созданных с ИИ
description: NocoBase — платформа с открытым кодом, на которой компании создают и запускают бизнес-системы с ИИ. Люди ставят задачи и принимают решения, агенты пишут код и выполняют работу, а NocoBase обеспечивает надёжность систем и контроль процесса.
