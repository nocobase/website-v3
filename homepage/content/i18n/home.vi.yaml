  "123": Không phụ thuộc nhà cung cấp. Hỗ trợ Claude Code, Codex và các công cụ lập trình khác, cùng nhiều loại model.
  "124": Ứng dụng vận hành độc lập
  "125": Sau khi phát hành, ứng dụng nghiệp vụ vận hành độc lập. Các yêu cầu nghiệp vụ hằng ngày không đi qua Studio.
