title: NocoBase 3 — Nền tảng mã nguồn mở cho hệ thống nghiệp vụ xây dựng bằng AI
description: NocoBase là nền tảng mã nguồn mở giúp doanh nghiệp xây dựng và vận hành hệ thống nghiệp vụ bằng AI. Con người nêu yêu cầu và ra quyết định, agent viết code và thực thi, còn NocoBase đảm bảo hệ thống tin cậy và quy trình trong tầm kiểm soát.
