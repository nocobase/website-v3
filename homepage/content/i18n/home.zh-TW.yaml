title: NocoBase 3 — AI + NocoBase，打造可靠的業務系統
description: NocoBase 是企業用 AI 開發與運行業務系統的開源平台。人提需求、做決策；Agent 寫程式、做執行；NocoBase 確保系統可靠、過程可控。
