  "237": Core、Studio 和 NocoCRM 等 Solution 應用開源免費，可直接用於正式環境；商業版增加團隊與組織層級的治理、企業整合、更多 Solution 應用與官方支援。
  "238": Core、Studio，以及 NocoCRM、NocoReach、NocoProject 開源免費，可直接用於正式環境與商業交付。不必購買授權，團隊就能帶領 Agent 團隊從需求做到上線。
  "239": 商業版
  "240": Core、Studio 和 Solution 每一層都有商業增強，一份授權同時生效。Professional 增加正式環境上線簽核、企業 SSO、NocoITAM 等更多應用與官方支援；Enterprise 增加跨團隊、跨環境的組織層級治理與高可用性。
  "241": 地端部署，獨立運行
