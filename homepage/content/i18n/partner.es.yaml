  "108": Marketing conjunto y casos
  "109": Cómo unirse
  "110": "Cuatro pasos "
  "111": hasta tu primer proyecto con NocoBase 3.
  "112": Solicita
  "113": Cuéntanos sobre tu equipo, tu región, tus sectores y los modelos de colaboración que te interesan.
  "114": Conversación y firma
  "115": Acordamos el modelo de colaboración, los clientes objetivo y un plan para el primer año, y firmamos.
  "116": Formación y certificación
  "117": Trae un requisito real y llévalo a producción en Studio (desarrollo, aceptación y publicación) para completar la formación y la certificación.
  "118": Vende y entrega
  "119": Únete al ecosistema de partners, recibe oportunidades referidas, revende licencias de NocoBase y entrega proyectos a tus clientes.
  "120": Preguntas frecuentes
  "121": ¿Necesitamos antes un gran equipo de desarrollo?
  "122": No hace falta ampliar el equipo de desarrollo. Los consultores dirigen el análisis de requisitos y la aceptación en Studio. Recomendamos contar con al menos un líder técnico que supervise los entornos, las integraciones y la aprobación de publicaciones.
  "123": ¿Podemos combinar modelos de colaboración?
  "124": Sí. Muchos partners revenden licencias y además ofrecen implementación y mantenimiento anual, y los especialistas sectoriales suelen empaquetar sus propias soluciones.
  "125": ¿Compartimos los ingresos por servicios con NocoBase?
  "126": No. El 100 % de los ingresos por despliegue, personalización, integración, formación y mantenimiento es tuyo, con los precios que tú fijes.
  "127": ¿Cómo se cobran los modelos y las herramientas de agentes?
  "128": Tú o tu cliente pagan directamente a los proveedores, sin recargo de NocoBase. Usa Claude Code, Codex, OpenCode y cualquier modelo en la nube o local.
  "129": ¿Podemos seguir entregando proyectos con NocoBase 2?
  "130": Sí. NocoBase 2 se mantiene en paralelo a NocoBase 3. Usa 2.x para apps configuradas visualmente y 3.x para sistemas complejos desarrollados con IA.
  "131": ¿De quién son las soluciones sectoriales que desarrollamos?
  "132": A ti. Puedes publicarlas como código abierto o con licencia comercial según tus condiciones; la presencia en el catálogo y el marketing conjunto se acuerdan entre ambos.
  "133": Solicita ser partner de NocoBase
  "134": Cuéntanos sobre tu equipo y tus planes y te contactaremos pronto. O escribe a partner@nocobase.com.
