notes: |-
  日本語（見出しは常体、本文は敬体）
  用語：foundation = 基盤；building blocks = 共通機能；governance = ガバナンス；agent team = エージェントチーム；
  coding agent = コーディングエージェント；business logic = 業務ロジック；business systems = 業務システム；
  vibe coding = バイブコーディング；self-hosted = セルフホスト；at a glance = ひと目でわかる；make the call = 判断する
  ページ用語：partner = パートナー；consultant = 導入コンサルタント；channel distribution = 販売代理；My issues など製品画面の名称は英語のまま
title: NocoBase パートナープログラム — エージェントチームで、より多くの顧客案件を納品
description: NocoBase パートナーになろう：販売手数料 15%〜40%、サービス収入は 100% あなたのもの。Core、Studio、Solution を使えば、導入コンサルタントは顧客の要件に集中し、開発はエージェントチームに任せて、複数の顧客案件を同時に進められます。
strings:
  "001": AI がソフトウェア納品のあり方を変えた。<span class="m">それを、あなたのビジネスに。</span>
  "002": これまで、受けられる案件の数は開発者の人数で決まっていました。今は、導入コンサルタントは顧客要件の分析、方針の決定、検収に集中するだけでよく、開発、テスト、デプロイはエージェントチームに任せられるため、複数の顧客案件を並行して進められます。NocoBase 3 は基盤となる Core、Studio、Solution の業務アプリを提供します。あなたの業界経験と顧客との関係こそが、最大の競争力です。
  "005": 販売手数料
  "006": 累計方式
  "007": 生涯累計、下がらない
  "008": サービス収入
  "009": 100% あなたのもの
  "010": 納品するコード
  "011": 顧客の所有、長期保守が可能
  "012": AI 時代の納品
  "013": 案件の規模は人数で決まらない。
  "014": 決めるのは業務の判断力。
  "015": AI によってコードを書くことは安くなりました。顧客が本当にお金を払うのは、業務を理解する専門家と、稼働後も安定し、将来も進化し続けるシステムです。それこそがパートナーの提供する核心的な価値です。
  "016": 従来の納品モデル
  "017": 人を増やして規模を拡大
  "018": NocoBase 3 で納品
  "019": 業務の判断力で規模を拡大
  "020": 納品能力
  "021": 案件数は開発者の人数で頭打ち
  "022": 1 つのエージェントチームが、すべての顧客案件を 24 時間並行して進める
  "024": 人日単価で見積もり、利益は工数に縛られる
  "025": モジュールと成果で価格設定。納品は速く、粗利は高く
  "026": 納品物
  "027": ブラックボックスな設定や独自コード。担当が替わると保守が困難
  "028": 標準基盤の上のクリーンなソースコード。レビュー可能、アップグレード可能、AI で継続的に改良可能
  "030": ノウハウはベテランの頭の中。人が辞めれば失われる
  "031": スキルとナレッジベースに蓄積し、次の同種の顧客ですぐに再利用
  "032": 稼働後
  "033": 稼働後は場当たり的な火消しに追われ、保守費も取りにくい
  "034": エージェントチームがアップグレードと日々の改善を担い、年間保守・改善サービスに
  "035": 1 人の導入コンサルタントが、4 つの顧客案件を並行して進める。
  "036": NocoBase Studio では、顧客ごとに独立したプロジェクトとリポジトリを持ちます。コンサルタントが対応するのは My issues の重要な場面だけ（プレビューの検収、業務上の質問への回答、リリースの承認）で、開発、テスト、リリース準備はエージェントチームがバックグラウンドで進めます。
  "037": 顧客の業務担当者は、独立したプレビュー環境で直接フィードバックと検収ができる
  "038": すべての変更が自動テストと人による承認を経るため、残業に頼らず品質を確保
  "039": 完了時にソースコード、スキル、ナレッジベースを一式引き渡す
  "040": パートナーシップの形
  "041": 販売代理、導入、業界ソリューションの共同構築。
  "042": 必要に応じて選び、組み合わせも自由。
  "043": 販売代理
  "044": NocoBase の商用ライセンスを紹介・販売し、累計売上に応じた段階的な手数料を得る。
  "045": 手数料率 15%〜40%、累計売上で決定
  "046": 実績は生涯累計でリセットなし。手数料率は上がる一方
  "047": 一度の支払い、永久ライセンス、ユーザー数無制限で、顧客の購買判断が容易
  "048": 営業資料、デモ環境、競合比較資料を一式提供
  "049": サービス提供
  "050": Studio とエージェントチームで、導入、カスタマイズ、連携、トレーニングを提供。
  "051": サービス収入は 100% あなたのもの。NocoBase の取り分なし
  "052": 価格は自由：案件単位、モジュール単位、年間保守契約
  "053": 稼働実績に応じてランクアップし、上位ランクは案件紹介を優先的に受けられる
  "054": 業界ソリューション
  "055": Core の上に業界特化型ソリューションを構築し、NocoCRM のように専用の業務エージェントを内蔵。
  "056": 一度作れば、同業界の顧客に横展開して保守
  "057": 業界の知見をスキルと業務ガイドに組み込み、エージェントが初日から業界を理解
  "058": 公式 Solutions カタログに掲載し、共同発表とマーケティング
  "059": テクノロジーエコシステム
  "060": モデル、エージェントツール、クラウド基盤、コネクタを NocoBase 3 の顧客ソリューションに組み込む。
  "061": スキル、コネクタ、UI コンポーネントを公開し、開発者とエージェントが直接利用
  "062": ソリューション、技術ドキュメント、導入事例を共同で発信
  "063": Core のプレビュー版を先行入手し、互換性認証を完了
  "065": 納品はより速く、確実に。
  "066": 顧客はより安心。
  "067": ソースコードを全量納品
  "068": 納品物は顧客の技術チームの審査に耐え、権利関係が明確でブラックボックスによるロックインもなく、顧客の不安を解消して受注を早める。
  "069": エンタープライズ機能を標準装備
  "070": 認証、権限、ワークフロー、承認、通知、AI 従業員がそろっており、エージェントは顧客固有の業務ロジックの開発に集中できる。
  "071": Studio で規模を拡大した納品
  "072": 複数の顧客と案件を一元管理し、テストとレビュー、独立したプレビュー、管理されたリリースで均一な納品品質を確保。
  "073": 既製の Solution から始める
  "075": セルフホストで、データ主権は顧客に
  "076": 閉域網へのデプロイとローカルモデルの接続に対応し、行政、金融、製造などの厳しいコンプライアンス要件も満たせる。
  "077": 世界中で実績のあるコミュニティ
  "078": GitHub スター 24.6K。NocoBase は世界中の企業、機関、大学で使われ、膨大な既存ユーザーが AI 時代へ移行しつつある。
  "079": パートナー支援
  "080": 最初の顧客から、
  "081": ずっと伴走します。
  "082": トレーニングと認定
  "083": 実際の要件を持ち込んで実践トレーニングに参加し、Studio でのエージェントの割り振り、プレビューの検収、管理されたリリースまでを一通り習得。
  "084": 営業支援
  "085": 提案資料、導入事例、競合分析、デモ環境を提供。重点案件ではメーカーが共同で支援・デモを実施。
  "086": メーカーによる技術サポート
  "087": 専用サポート窓口を開設し、上位パートナーは優先対応。Core の新バージョン、更新情報、関連スキルを先行提供。
  "088": 案件紹介
  "089": 地域、業界、言語、サービス内容に合わせて見込み客を紹介。NocoBase で構築した業務システムを顧客に納品。
  "090": ブランドと共同マーケティング
  "091": 公式パートナー認定証とロゴの使用権を付与し、公式サイトのパートナー一覧に掲載。共同マーケティングイベントや導入事例の発信も。
  "092": 参加条件
  "093": 参加は無料、
  "094": 取り組むほど支援も厚く。
  "095": 販売代理パートナー
  "096": 公式パートナー
  "097": 無料登録して販売代理契約を締結
  "098": Professional ライセンスを保有し、パートナー契約を締結
  "099": 主に公開ドキュメント
  "100": 専用のトレーニングと認定制度
  "101": 販売手数料
  "102": 最初の商用ライセンス販売で手数料の権利が有効に
  "103": 生涯累計売上で段階設定、15% から最大 40%、下がることはない
  "104": パートナー認定証
  "105": パートナー一覧への掲載
  "106": コミュニティサポート
  "107": 専用窓口
  "108": 共同マーケティングと事例
  "109": 参加の流れ
  "110": 申請から納品まで、
  "111": 最初の案件を始めよう。
  "112": 申請
  "113": チーム、地域、得意な業界、希望するパートナーシップの形を教えてください。
  "114": 協議と契約
  "115": パートナーシップの形、ターゲット顧客、初年度計画を一緒に確認し、パートナー契約を締結。
  "116": トレーニングと認定
  "117": 実際の要件を 1 つ持ち込み、Studio で開発、検収、稼働まで完了させて認定を取得。
  "118": 販売と納品を開始
  "119": パートナーエコシステムに参加し、顧客紹介を受け、NocoBase ライセンスの販売と顧客への納品を開始。
  "120": よくある質問
  "121": まず開発チームを作る必要はある？
  "122": 開発チームを増やす必要はありません。導入コンサルタントが Studio で要件と検収を主導します。環境、システム連携、リリースを管理する技術責任者を最低 1 名置くことをおすすめします。
  "123": 複数のパートナーシップを組み合わせられる？
  "124": できます。多くのパートナーが商用ライセンスを販売しつつ、カスタマイズ納品や年間保守も提供しています。特定業界に強いパートナーは、知見を独自の業界ソリューションにまとめることもあります。
  "125": サービス収入を NocoBase と分配する必要は？
  "126": いいえ。導入、カスタマイズ、連携、トレーニング、運用の収入は 100% あなたのもので、価格も自由に決められます。
  "127": モデルとエージェントツールの費用は？
  "128": あなたまたは顧客が各提供元から直接購入し、NocoBase は差額を一切上乗せしません。Claude Code、Codex、OpenCode や、各種クラウド・ローカルのモデルを自由に接続できます。
  "129": NocoBase 2 での納品は続けられる？
  "130": できます。NocoBase 2 と NocoBase 3 は長期にわたって並行して保守されます。画面設定で作るアプリには 2.x、AI による本格開発や複雑なロジックが必要なシステムには 3.x を使い分けてください。
  "131": 開発した業界ソリューションの知的財産権は誰のもの？
  "132": すべてあなたのものです。オープンソースにするか商用ライセンスにするかは自由に決められます。公式カタログへの掲載や共同プロモーションは、協業の中で具体的に取り決めます。
  "133": NocoBase パートナーに申し込む
  "134": チームと取り組みたいことを教えてください。追ってご連絡します。partner@nocobase.com への直接のご連絡も歓迎です。
  "135": 担当者名
  "136": 担当者のメールアドレス
  "137": 会社名
  "138": 会社概要
  "139": 希望する協業内容
  "140": 申し込む
  "141": ありがとうございます。お申し込みを受け付けました。追ってご連絡いたします。
  "142": チームの規模、得意な業界、既存の顧客
  "143": 希望するパートナーシップの形（販売代理、サービス提供、業界ソリューション、テクノロジー）と、ターゲット顧客・地域
  "144": 国・地域
  "145": 国・地域を選択
  "146": NocoCRM、NocoITAM、NocoReach はいずれもオープンソース。顧客の要件に合わせてカスタマイズすれば、ゼロからの開発よりはるかに速い。
