notes: |-
  한국어（제목은 명사형·해라체, 본문은 합니다체）
  용어：foundation = 기반；building blocks = 기본 기능；governance = 거버넌스；agent team = 에이전트 팀；
  coding agent = 코딩 에이전트；business logic = 비즈니스 로직；business systems = 비즈니스 시스템；
  vibe coding = 바이브 코딩；self-hosted = 셀프 호스팅；at a glance = 한눈에
  페이지 용어：partner = 파트너；consultant = 구축 컨설턴트；channel distribution = 채널 유통；My issues 등 제품 화면 이름은 영어 그대로
title: NocoBase 파트너 프로그램 — 에이전트 팀으로 더 많은 고객 프로젝트 납품
description: "NocoBase 파트너가 되세요: 채널 수수료 15%~40%, 서비스 수익 100% 귀속. Core, Studio, Solution을 기반으로 구축 컨설턴트는 고객 요구에 집중하고, 개발은 에이전트 팀에 맡겨 여러 고객 프로젝트를 동시에 진행합니다."
strings:
  "001": AI가 소프트웨어 납품 방식을 바꿨다. <span class="m">이제 그것을 당신의 비즈니스로.</span>
  "002": 예전에는 수주할 수 있는 프로젝트 수가 개발자 수에 달려 있었습니다. 이제 구축 컨설턴트는 고객 요구 분석, 핵심 의사 결정, 검수에만 집중하고, 개발·테스트·배포는 에이전트 팀이 맡아 여러 고객 프로젝트를 동시에 진행할 수 있습니다. NocoBase 3은 기반인 Core, Studio, Solution 업무 앱을 제공합니다. 당신의 업계 경험과 고객 관계가 가장 핵심적인 경쟁력입니다.
  "005": 채널 수수료
  "006": 누적 방식
  "007": 평생 누적, 내려가지 않음
  "008": 서비스 수익
  "009": 100% 귀속
  "010": 납품 코드
  "011": 고객 소유, 장기 유지보수 가능
  "012": AI 시대의 납품
  "013": "프로젝트 규모는 더 이상 인원수가 아니라 "
  "014": 업무 판단력에 달려 있다.
  "015": AI 덕분에 코드 작성은 저렴해졌습니다. 고객이 진정으로 비용을 지불하는 대상은 업무를 이해하는 전문가, 그리고 운영 후에도 안정적이고 앞으로도 계속 발전할 수 있는 시스템입니다. 이것이 바로 파트너가 제공하는 핵심 가치입니다.
  "016": 기존 납품 방식
  "017": 인력을 늘려 규모 확대
  "018": NocoBase 3 기반 납품
  "019": 업무 판단력으로 규모 확대
  "020": 납품 역량
  "021": 프로젝트 수가 개발 인력 규모에 묶임
  "022": 에이전트 팀 하나가 모든 고객 프로젝트를 24시간 동시에 진행
  "024": 맨데이 단위 견적, 이익이 공수에 묶임
  "025": 모듈과 성과 기준 가격 책정, 더 빠른 납품과 더 높은 이익률
  "026": 납품물
  "027": 블랙박스 설정이나 맞춤 코드, 담당자가 바뀌면 유지보수가 어려움
  "028": 표준 기반 위의 깔끔한 소스 코드, 검토·업그레이드 가능하고 AI로 계속 발전 가능
  "030": 노하우가 소수의 머릿속에만 있어 인력이 빠지면 사라짐
  "031": 스킬과 지식 베이스로 축적해 다음 유사 고객에게 바로 재사용
  "032": 오픈 이후
  "033": 오픈 후 수동적인 장애 대응에 매달리고 유지보수 비용은 받기 어려움
  "034": 에이전트 팀이 업그레이드와 일상 개선을 맡아 연간 유지보수·개선 서비스로 전환
  "035": 구축 컨설턴트 한 명이 네 개의 고객 프로젝트를 동시에 진행한다.
  "036": NocoBase Studio에서는 고객마다 독립된 프로젝트와 저장소를 갖습니다. 컨설턴트는 My issues에서 핵심 지점만 처리하면 됩니다(미리보기 검수, 업무 질문 답변, 배포 승인). 코딩, 테스트, 배포 준비는 에이전트 팀이 백그라운드에서 진행합니다.
  "037": 고객 업무 담당자가 독립된 미리보기 환경에서 직접 피드백하고 검수
  "038": 모든 변경이 자동 테스트와 사람의 승인을 거쳐, 야근 없이 품질 확보
  "039": 프로젝트 종료 시 소스 코드, 스킬, 지식 베이스를 모두 이관
  "040": 협력 방식
  "041": "유통, 납품, 업종 솔루션 공동 구축. "
  "042": 필요에 따라 선택하거나 자유롭게 조합.
  "043": 채널 유통
  "044": NocoBase 상용 라이선스를 소개·판매하고 누적 판매액에 따라 단계별 수수료를 받습니다.
  "045": 수수료율 15%~40%, 누적 판매액 기준 등급
  "046": 실적은 평생 누적되어 초기화되지 않고, 수수료율은 오르기만 함
  "047": 1회 결제, 영구 라이선스, 사용자 무제한으로 고객의 구매 장벽이 낮음
  "048": 영업 자료, 데모 환경, 경쟁사 비교 자료 일체 제공
  "049": 서비스 납품
  "050": Studio와 에이전트 팀으로 배포, 맞춤 개발, 연동, 교육 서비스를 제공합니다.
  "051": 서비스 수익 100% 귀속, NocoBase는 수수료를 받지 않음
  "052": "자유로운 가격 책정: 프로젝트 단위, 모듈 단위, 연간 유지보수"
  "053": 오픈한 프로젝트 수에 따라 등급이 오르고, 높은 등급은 고객 소개를 우선 받음
  "054": 업종 솔루션
  "055": Core 위에 업종 특화 솔루션을 만들고, NocoCRM처럼 전용 비즈니스 에이전트를 내장합니다.
  "056": 한 번 만들어 같은 업종 고객에게 대량 복제·유지보수
  "057": 업종 경험을 스킬과 업무 지침에 담아 에이전트가 처음부터 업종을 이해
  "058": 공식 Solutions 카탈로그 등재, 공동 출시와 마케팅
  "059": 기술 생태계
  "060": 모델, 에이전트 도구, 클라우드 인프라, 커넥터를 NocoBase 3 고객 솔루션에 통합합니다.
  "061": 스킬 패키지, 커넥터, UI 컴포넌트를 배포해 개발자와 에이전트가 바로 사용
  "062": 솔루션, 기술 문서, 대표 사례를 공동 발행
  "063": Core 프리뷰 버전을 먼저 받아 호환성 인증 완료
  "065": "더 빠르고 안정적인 납품, "
  "066": 더 안심하는 고객.
  "067": 소스 코드 전체 납품
  "068": 납품물은 고객 기술팀의 검토를 통과하고, 권리 관계가 명확하며 블랙박스 종속이 없어 고객의 우려를 없애고 계약을 앞당깁니다.
  "069": 엔터프라이즈 기능 기본 제공
  "070": 인증, 권한, 워크플로, 승인, 알림, AI 직원이 준비되어 있어 에이전트는 고객별 업무 로직에만 집중합니다.
  "071": Studio로 규모 있는 납품
  "072": 여러 고객과 프로젝트를 한곳에서 관리하고, 테스트와 리뷰, 독립 미리보기, 통제된 배포로 일관된 납품 품질을 보장합니다.
  "073": 기성 Solution으로 높은 출발점
  "075": 셀프 호스팅, 데이터 주권은 고객에게
  "076": 폐쇄망 배포와 로컬 모델 연결을 지원해 공공, 금융, 제조 등 업종의 엄격한 규정 준수 요구를 충족합니다.
  "077": 검증된 글로벌 커뮤니티와 평판
  "078": GitHub 스타 24.6K, NocoBase는 전 세계 수많은 기업, 기관, 대학에서 쓰이고 있으며 방대한 기존 고객이 AI 시대로 나아가고 있습니다.
  "079": 지원 방식
  "080": "첫 고객부터 "
  "081": 끝까지 함께합니다.
  "082": 교육과 인증
  "083": 실제 요구사항을 가지고 실전 교육에 참여해 Studio에서 에이전트 배정, 미리보기 검수, 통제된 배포까지 전 과정을 익힙니다.
  "084": 영업 지원
  "085": 제안 자료, 고객 사례, 경쟁 분석, 데모 환경을 제공하고, 중점 프로젝트에는 본사가 공동으로 지원하고 시연합니다.
  "086": 본사 기술 지원
  "087": 전용 지원 채널을 열고 높은 등급 파트너는 우선 응답, Core 새 버전과 업데이트 노트, 관련 스킬 패키지를 먼저 제공합니다.
  "088": 고객 소개
  "089": 지역, 업종, 언어, 서비스 유형에 맞춰 잠재 고객을 연결하고, NocoBase로 만든 비즈니스 시스템을 납품합니다.
  "090": 브랜드와 공동 마케팅
  "091": 공식 파트너 인증서와 로고 사용권 부여, 공식 사이트 파트너 목록 등재, 공동 마케팅 행사와 대표 사례 홍보.
  "092": 참여 조건
  "093": "부담 없이 시작하고, "
  "094": 투자할수록 더 많이 지원받습니다.
  "095": 채널 파트너
  "096": 공식 파트너
  "097": 무료 등록 후 채널 협력 계약 체결
  "098": Professional 라이선스 보유, 파트너 계약 체결
  "099": 주로 공개 문서
  "100": 전용 교육·인증 프로그램
  "101": 채널 수수료
  "102": 첫 상용 라이선스 판매 후 수수료 혜택 활성화
  "103": 평생 누적 판매액 기준 등급, 15%부터 최대 40%, 내려가지 않음
  "104": 파트너 인증서
  "105": 파트너 목록 등재
  "106": 커뮤니티 지원
  "107": 전용 채널
  "108": 공동 마케팅과 사례
  "109": 참여 절차
  "110": "신청부터 납품까지, "
  "111": 첫 프로젝트를 시작하세요.
  "112": 신청
  "113": 팀, 지역, 강점 업종, 원하는 협력 방식을 알려 주세요.
  "114": 협의와 계약
  "115": 협력 방식, 목표 고객, 첫해 계획을 함께 정하고 파트너 계약을 체결합니다.
  "116": 교육과 인증
  "117": 실제 요구사항 하나를 가지고 Studio에서 개발, 검수, 오픈까지 완료하면 교육과 인증을 마칩니다.
  "118": 영업과 납품 시작
  "119": 파트너 생태계에 합류해 고객을 소개받고, NocoBase 라이선스를 유통하며 고객에게 납품합니다.
  "120": 자주 묻는 질문
  "121": 먼저 개발팀을 꾸려야 하나요?
  "122": 개발팀을 늘릴 필요는 없습니다. 구축 컨설턴트가 Studio에서 요구사항과 검수를 주도합니다. 환경, 시스템 연동, 배포를 관리할 기술 책임자를 최소 한 명 두는 것을 권장합니다.
  "123": 여러 협력 방식을 함께 선택할 수 있나요?
  "124": 네. 많은 파트너가 상용 라이선스를 유통하면서 맞춤 납품과 연간 유지보수도 제공하며, 특정 업종에 강한 파트너는 경험을 자체 업종 솔루션으로 만들기도 합니다.
  "125": 서비스 수익을 NocoBase와 나눠야 하나요?
  "126": 아니요. 배포, 맞춤 개발, 연동, 교육, 운영 수익은 100% 귀속되며 가격도 자유롭게 정합니다.
  "127": 모델과 에이전트 도구 비용은 어떻게 되나요?
  "128": 귀사나 고객이 각 공급업체에서 직접 구매하며, NocoBase는 차액을 받지 않습니다. Claude Code, Codex, OpenCode와 각종 클라우드·로컬 모델을 자유롭게 연결할 수 있습니다.
  "129": NocoBase 2로 계속 납품할 수 있나요?
  "130": 네. NocoBase 2와 NocoBase 3은 장기간 병행 유지보수됩니다. 화면 구성 방식에 맞는 프로젝트는 2.x, AI 심층 개발과 복잡한 로직이 필요한 프로젝트는 3.x를 사용하세요.
  "131": 우리가 개발한 업종 솔루션의 지식재산권은 누구에게 있나요?
  "132": 전적으로 귀사의 것입니다. 오픈소스로 할지 상용 라이선스로 할지 직접 결정하며, 공식 카탈로그 등재와 공동 홍보는 협력 과정에서 구체적으로 협의합니다.
  "133": NocoBase 파트너 신청
  "134": 팀과 하고 싶은 일을 알려 주시면 곧 연락드리겠습니다. partner@nocobase.com으로 직접 메일을 보내셔도 됩니다.
  "135": 담당자 이름
  "136": 담당자 이메일
  "137": 회사명
  "138": 회사 소개
  "139": 협력 의향
  "140": 신청서 제출
  "141": 감사합니다! 신청서를 접수했으며 곧 연락드리겠습니다.
  "142": 팀 규모, 강점 업종, 기존 고객
  "143": 원하는 협력 방식(채널 유통, 서비스 납품, 업종 솔루션, 기술 생태계)과 목표 고객·지역
  "144": 국가/지역
  "145": 국가 또는 지역 선택
  "146": NocoCRM, NocoITAM, NocoReach 모두 오픈소스로, 고객 요구에 맞게 맞춤화하면 처음부터 개발하는 것보다 훨씬 빠릅니다.
