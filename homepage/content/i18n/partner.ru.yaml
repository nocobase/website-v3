notes: |-
  Русский（вы）
  术语：foundation = фундамент；building blocks = базовые модули；governance = контроль / управляемая разработка；
  agent team = команда агентов；coding agent = кодинг-агент；business logic = бизнес-логика；business systems = бизнес-системы；
  AI = ИИ；vibe coding = вайб-кодинг；open source = с открытым кодом；at a glance = как на ладони
  页面用语：partner = партнёр；consultant = консультант；channel distribution = дистрибуция；My issues 等产品界面名称照英文
title: Партнёрская программа NocoBase — больше клиентских проектов с командой агентов
description: "Станьте партнёром NocoBase: комиссия 15–40 % и 100 % дохода от услуг. С Core, Studio и Solution ваши консультанты занимаются потребностями клиентов, а команда агентов разрабатывает, поэтому много проектов идут одновременно."
strings:
  "001": ИИ изменил то, как поставляется софт. <span class="m">Превратите это в свой бизнес.</span>
  "002": Раньше число проектов ограничивалось числом разработчиков. Теперь ваши консультанты занимаются только анализом потребностей клиента, ключевыми решениями и приёмкой, а команда агентов пишет код, тестирует и разворачивает, поэтому много клиентских проектов идут параллельно. NocoBase 3 даёт Core как фундамент, Studio и бизнес-приложения Solution. Ваш отраслевой опыт и отношения с клиентами — вот что вас выделяет.
  "005": Комиссия за продажи
  "006": Накопление
  "007": Пожизненно, только растёт
  "008": Доход от услуг
  "009": 100 % вам
  "010": Переданный код
  "011": Принадлежит клиенту, поддерживаем
  "012": Поставка в эпоху ИИ
  "013": "Масштаб больше не зависит от численности. "
  "014": Он зависит от вашей экспертизы.
  "015": ИИ сделал написание кода дешёвым. Теперь клиенты платят за человека, который понимает их бизнес, и за надёжную систему, которая годами может развиваться дальше. Именно это и дают партнёры.
  "016": Традиционная поставка
  "017": Рост за счёт найма
  "018": С NocoBase 3
  "019": Рост за счёт экспертизы
  "020": Объём работ
  "021": Число проектов упирается в число разработчиков
  "022": Одна команда агентов круглосуточно продвигает все клиентские проекты
  "024": Оплата по человеко-дням, маржа привязана к часам
  "025": "Цена за модуль и результат: быстрее поставка, выше маржа"
  "026": Что передаётся клиенту
  "027": Непрозрачные настройки или самописный код, который сложно передать
  "028": "Чистый исходный код на стандартном фундаменте: проверяемый, обновляемый, развиваемый с ИИ"
  "030": Опыт хранится в головах нескольких людей
  "031": Сохраняется в навыках и базах знаний и переиспользуется у следующего клиента
  "032": После запуска
  "033": Тушение пожаров после запуска, которое трудно выставить в счёт
  "034": Команды агентов берут на себя обновления и текущие доработки, которые превращаются в ежегодное сопровождение
  "035": Один консультант, четыре клиентских проекта параллельно.
  "036": В NocoBase Studio у каждого клиента свой изолированный проект и репозиторий. Консультант подключается только к ключевым решениям в My issues (проверить превью, ответить на бизнес-вопросы, одобрить релиз), а агенты в фоне разрабатывают, тестируют и готовят развёртывание.
  "037": Представители клиента оставляют отзывы и принимают функции прямо в живых превью
  "038": "Каждое изменение проходит автопроверки и приёмку человеком: качество без авралов"
  "039": При сдаче проекта клиент получает весь исходный код, навыки и базы знаний
  "040": Форматы партнёрства
  "041": "Перепродавайте, внедряйте или создавайте отраслевые решения. "
  "042": Выберите одно или совместите.
  "043": Дистрибуция
  "044": Рекомендуйте и продавайте коммерческие лицензии NocoBase с комиссией по уровням.
  "045": Комиссия 15–40 % в зависимости от накопленных продаж
  "046": "Накопление пожизненно: уровень не обнуляется и не снижается"
  "047": Разовая оплата, бессрочная лицензия и неограниченное число пользователей упрощают согласование у клиента
  "048": С продающими материалами, демо-средами и сравнением с конкурентами
  "049": Услуги внедрения
  "050": Оказывайте услуги развёртывания, доработки, интеграции и обучения в Studio вместе с командой агентов.
  "051": 100 % дохода от услуг остаётся у вас, NocoBase не берёт долю
  "052": "Цены — на ваше усмотрение: за проект, за модуль или годовое сопровождение"
  "053": Повышайте уровень с каждым запущенным проектом и получайте лиды в приоритете
  "054": Отраслевые решения
  "055": Создавайте отраслевые решения на Core со встроенными профильными агентами, как в NocoCRM.
  "056": Создайте один раз — внедряйте и сопровождайте у всех клиентов отрасли
  "057": Упакуйте отраслевые правила в навыки и инструкции — агенты будут разбираться в отрасли с первого дня
  "058": Размещение в каталоге NocoBase Solution, совместный запуск и маркетинг
  "059": Технологическая экосистема
  "060": Встраивайте модели, инструменты для агентов, облачную инфраструктуру или коннекторы в решения на NocoBase 3.
  "061": Публикуйте навыки, коннекторы и UI-компоненты для разработчиков и агентов
  "062": Совместно публикуйте решения, техническую документацию и кейсы клиентов
  "063": Ранний доступ к версиям Core для проверки совместимости
  "065": "Быстрее и надёжнее поставка. "
  "066": Спокойнее клиенты.
  "067": Весь исходный код
  "068": Результат выдерживает техническую проверку клиента и не привязывает к вендору — это доверие, которое помогает закрывать сделки.
  "069": Корпоративные возможности из коробки
  "070": Аутентификация, права, процессы, согласования и ИИ-сотрудники уже есть, поэтому агенты пишут только логику конкретного клиента.
  "071": Масштабируемая поставка в Studio
  "072": Ведите нескольких клиентов и репозитории в одном пространстве с тестами и ревью, изолированными превью и контролируемыми релизами.
  "073": Старт с готовых решений Solution
  "075": Свои серверы, полный контроль над данными
  "076": Развёртывание в закрытом контуре с любой моделью отвечает строгим требованиям финансового сектора, госорганов и промышленности.
  "077": Признание по всему миру
  "078": "24,6K звёзд на GitHub: NocoBase работает в компаниях, госучреждениях и университетах по всему миру, которые сейчас переходят в эпоху ИИ."
  "079": Как мы поддерживаем
  "080": "С первого клиента "
  "081": мы рядом с вами.
  "082": Обучение и сертификация
  "083": Приходите с реальной задачей и научитесь управлять агентами, проверять превью и безопасно выпускать релизы в Studio.
  "084": Поддержка продаж
  "085": Презентации, кейсы, сравнения с конкурентами и демо-среды, а также совместные встречи по ключевым сделкам.
  "086": Техническая поддержка
  "087": Выделенные каналы поддержки с приоритетом для старших уровней и ранний доступ к версиям Core и навыкам.
  "088": Передача лидов
  "089": Получайте квалифицированные лиды по региону, отрасли, языку и типу услуг и поставляйте этим клиентам бизнес-системы на NocoBase.
  "090": Бренд и совместный маркетинг
  "091": Официальный статус партнёра, место в каталоге, совместные мероприятия и кейсы клиентов.
  "092": Условия
  "093": "Начните бесплатно. "
  "094": Чем больше вклад, тем больше поддержки.
  "095": Партнёр по продажам
  "096": Официальный партнёр
  "097": Бесплатная регистрация и подписание соглашения о продажах
  "098": Лицензия Professional и подписанное партнёрское соглашение
  "099": В основном публичная документация
  "100": Отдельная программа обучения и сертификации
  "101": Комиссия
  "102": Активируется после первой продажи лицензии
  "103": По уровням накопленных продаж, от 15 % до 40 %, без снижения
  "104": Сертификат партнёра
  "105": Место в каталоге
  "106": Поддержка сообщества
  "107": Выделенный канал
  "108": Совместный маркетинг и кейсы
  "109": Как стать партнёром
  "110": "Четыре шага "
  "111": до первого проекта на NocoBase 3.
  "112": Заявка
  "113": Расскажите о команде, регионе, отраслях и интересующих форматах партнёрства.
  "114": Обсуждение и договор
  "115": Согласуем формат партнёрства, целевых клиентов и план на первый год и подписываем соглашение.
  "116": Обучение и сертификация
  "117": Возьмите реальную задачу и доведите её в Studio до релиза (разработка, приёмка, выпуск), чтобы пройти обучение и сертификацию.
  "118": Продажи и внедрение
  "119": "Станьте частью партнёрской экосистемы: получайте рекомендации, продавайте лицензии NocoBase и выполняйте проекты для клиентов."
  "120": Частые вопросы
  "121": Нужна ли сначала большая команда разработчиков?
  "122": Расширять команду разработки не нужно. Консультанты ведут сбор требований и приёмку в Studio. Рекомендуем иметь хотя бы одного техлида, который отвечает за среды, интеграции и одобрение релизов.
  "123": Можно ли совмещать форматы партнёрства?
  "124": Да. Многие партнёры продают лицензии и одновременно выполняют внедрение и годовое сопровождение, а отраслевые специалисты часто упаковывают собственные решения.
  "125": Нужно ли делиться доходом от услуг с NocoBase?
  "126": Нет. 100 % дохода от развёртывания, доработки, интеграции, обучения и сопровождения остаётся у вас, а цены вы устанавливаете сами.
  "127": Как оплачиваются модели и инструменты агентов?
  "128": Вы или клиент платите поставщикам напрямую, NocoBase не берёт наценку. Используйте Claude Code, Codex, OpenCode и любые облачные или локальные модели.
  "129": Можно ли и дальше делать проекты на NocoBase 2?
  "130": Да. NocoBase 2 поддерживается параллельно с NocoBase 3. Используйте 2.x для приложений с визуальной настройкой, а 3.x — для сложных систем, разработанных с ИИ.
  "131": Кому принадлежат созданные нами отраслевые решения?
  "132": Вам. Открывайте код или лицензируйте коммерчески на своих условиях; размещение в каталоге и совместный маркетинг обсуждаются вместе.
  "133": Заявка на партнёрство с NocoBase
  "134": Расскажите о команде и планах, и мы скоро свяжемся с вами. Или напишите на partner@nocobase.com.
  "135": Контактное лицо
  "136": Email контактного лица
  "137": Название компании
  "138": О компании
  "139": Как вы хотите сотрудничать с нами
  "140": Отправить заявку
  "141": Спасибо! Мы получили вашу заявку и скоро свяжемся с вами.
  "142": Размер команды, отрасли и текущие клиенты
  "143": Интересующие форматы партнёрства (дистрибуция, внедрение, отраслевые решения, технологии), целевые клиенты и регионы
  "144": Страна или регион
  "145": Выберите страну или регион
  "146": Дорабатывайте под клиента NocoCRM, NocoITAM или NocoReach с открытым кодом вместо разработки с нуля.
