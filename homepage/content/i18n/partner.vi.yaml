notes: |-
  Tiếng Việt（bạn）
  术语：platform = nền tảng；foundation = nền móng（与 nền tảng 区分）；building blocks = khối chức năng；governance = quản trị；
  agent = agent；agent team = đội agent；coding agent = coding agent；business logic = logic nghiệp vụ；
  business systems = hệ thống nghiệp vụ；open source = mã nguồn mở；self-hosted = tự triển khai；at a glance = rõ ràng trong nháy mắt
  页面用语：partner = đối tác；consultant = tư vấn viên；channel distribution = phân phối；My issues 等产品界面名称照英文
title: Chương trình đối tác NocoBase — Bàn giao nhiều dự án khách hàng hơn với đội agent
description: "Trở thành đối tác NocoBase: hoa hồng phân phối 15%–40%, doanh thu dịch vụ 100% thuộc về bạn. Dựa trên Core, Studio và Solution, tư vấn viên tập trung vào nhu cầu khách hàng, việc phát triển giao cho đội agent, nhiều dự án chạy cùng lúc."
strings:
  "001": AI đã thay đổi cách bàn giao phần mềm. <span class="m">Hãy biến nó thành công việc kinh doanh của bạn.</span>
  "002": Trước đây, nhận được bao nhiêu dự án phụ thuộc vào số lập trình viên. Giờ đây, tư vấn viên của bạn chỉ cần tập trung phân tích nhu cầu khách hàng, chốt phương án và nghiệm thu, còn phát triển, kiểm thử và triển khai giao cho đội agent, nhiều dự án khách hàng chạy song song. NocoBase 3 cung cấp nền móng Core, Studio và các ứng dụng nghiệp vụ Solution; kinh nghiệm ngành và quan hệ khách hàng của bạn chính là lợi thế cạnh tranh cốt lõi.
  "005": Hoa hồng phân phối
  "006": Cách tích lũy
  "007": Tích lũy trọn đời, chỉ tăng không giảm
  "008": Doanh thu dịch vụ
  "009": 100% thuộc về bạn
  "010": Code bàn giao
  "011": Thuộc về khách hàng, bảo trì lâu dài
  "012": Bàn giao trong thời đại AI
  "013": "Quy mô dự án không còn phụ thuộc vào số người, "
  "014": mà vào năng lực phán đoán nghiệp vụ của bạn.
  "015": AI khiến việc viết code trở nên rẻ. Điều khách hàng thực sự sẵn sàng trả tiền là chuyên gia hiểu nghiệp vụ, cùng một hệ thống vận hành ổn định sau khi lên production và tiếp tục phát triển lâu dài. Đó chính là giá trị cốt lõi mà đối tác mang lại.
  "016": Mô hình bàn giao truyền thống
  "017": Mở rộng bằng cách thêm người
  "018": Bàn giao trên NocoBase 3
  "019": Mở rộng bằng năng lực phán đoán nghiệp vụ
  "020": Năng lực bàn giao
  "021": Số dự án bị giới hạn bởi quy mô đội lập trình
  "022": Một đội agent thúc đẩy đồng thời mọi dự án khách hàng suốt 24 giờ
  "024": Báo giá theo ngày công, lợi nhuận bị khóa theo giờ công
  "025": Định giá theo module và kết quả, bàn giao nhanh hơn, biên lợi nhuận cao hơn
  "026": Sản phẩm bàn giao
  "027": Cấu hình hộp đen hoặc code tùy biến, đổi người là khó bảo trì
  "028": Mã nguồn sạch trên nền móng chuẩn, có thể review, nâng cấp và tiếp tục để AI phát triển
  "030": Kinh nghiệm nằm trong đầu nhân viên cũ, người nghỉ là mất
  "031": Đúc kết thành kỹ năng và kho tri thức, tái sử dụng ngay cho khách hàng cùng loại tiếp theo
  "032": Sau khi đưa vào vận hành
  "033": Sau khi lên production thì chữa cháy bị động, khó thu phí bảo trì
  "034": Đội agent đảm nhận nâng cấp và cải tiến hằng ngày, dễ dàng chuyển thành dịch vụ bảo trì và phát triển hằng năm
  "035": Một tư vấn viên, bốn dự án khách hàng chạy song song.
  "036": "Trong NocoBase Studio, mỗi khách hàng có dự án và repository riêng biệt. Tư vấn viên chỉ cần xử lý các điểm then chốt trong My issues: nghiệm thu bản xem trước, giải đáp câu hỏi nghiệp vụ, phê duyệt phát hành; viết code, kiểm thử và chuẩn bị phát hành đều do đội agent làm ở phía sau."
  "037": Phía nghiệp vụ của khách hàng góp ý và nghiệm thu trực tiếp trong môi trường xem trước riêng
  "038": Mỗi thay đổi đều qua kiểm thử tự động và phê duyệt thủ công, chất lượng không phải đánh đổi bằng tăng ca
  "039": Khi kết thúc dự án, bàn giao đầy đủ mã nguồn, kỹ năng và kho tri thức cho khách hàng
  "040": Hình thức hợp tác
  "041": "Phân phối, bàn giao, cùng xây giải pháp ngành, "
  "042": chọn theo nhu cầu hoặc kết hợp tự do.
  "043": Phân phối
  "044": Giới thiệu và bán giấy phép thương mại NocoBase, nhận hoa hồng lũy tiến theo doanh số tích lũy.
  "045": Tỷ lệ hoa hồng 15%–40%, xếp hạng theo doanh số tích lũy
  "046": Doanh số tích lũy trọn đời không bị xóa, tỷ lệ hoa hồng chỉ tăng không giảm
  "047": Trả một lần, giấy phép vĩnh viễn, không giới hạn số người dùng, rào cản mua của khách hàng thấp
  "048": Cung cấp trọn bộ tài liệu bán hàng, môi trường demo và cẩm nang so sánh đối thủ
  "049": Bàn giao dịch vụ
  "050": Dùng Studio và đội agent để cung cấp dịch vụ triển khai, tùy biến, tích hợp và đào tạo cho khách hàng.
  "051": Doanh thu dịch vụ 100% thuộc về bạn, NocoBase không ăn chia
  "052": "Tự định giá: theo dự án, theo module hoặc bảo trì hằng năm"
  "053": Thăng hạng theo số dự án đưa vào vận hành thành công, hạng cao được ưu tiên giới thiệu khách hàng
  "054": Giải pháp ngành
  "055": Xây giải pháp ngành dọc trên Core, tích hợp agent nghiệp vụ chuyên biệt như NocoCRM.
  "056": Đúc kết một lần, nhân rộng và bảo trì cho khách hàng cùng ngành
  "057": Đóng gói kinh nghiệm ngành vào kỹ năng và hướng dẫn nghiệp vụ, agent hiểu nghề ngay từ đầu
  "058": Lên danh mục Solutions chính thức, cùng ra mắt và quảng bá
  "059": Hệ sinh thái công nghệ
  "060": Đưa model, công cụ agent, hạ tầng đám mây hoặc connector vào giải pháp NocoBase 3 cho khách hàng.
  "061": Phát hành gói kỹ năng, connector và thành phần UI để lập trình viên và agent dùng trực tiếp
  "062": Cùng xây dựng giải pháp, tài liệu kỹ thuật và case study tiêu biểu
  "063": Nhận trước bản xem trước của Core để hoàn tất chứng nhận tương thích
  "065": "Bàn giao nhanh hơn, ổn định hơn, "
  "066": khách hàng yên tâm hơn.
  "067": Bàn giao toàn bộ mã nguồn
  "068": Sản phẩm bàn giao vượt qua thẩm định kỹ thuật của khách hàng, quyền sở hữu rõ ràng, không bị khóa vào hộp đen, xóa bỏ lo ngại và đẩy nhanh ký hợp đồng.
  "069": Năng lực cấp doanh nghiệp có sẵn
  "070": Xác thực, phân quyền, quy trình, phê duyệt, thông báo và nhân viên AI có sẵn, agent chỉ cần tập trung viết logic nghiệp vụ riêng của khách hàng.
  "071": Studio hỗ trợ bàn giao quy mô lớn
  "072": Quản lý tập trung nhiều khách hàng, nhiều dự án, đảm bảo chất lượng bàn giao đồng đều nhờ kiểm thử và review, môi trường xem trước riêng và phát hành có kiểm soát.
  "073": Khởi đầu từ Solutions có sẵn
  "075": Tự triển khai, chủ quyền dữ liệu thuộc về khách hàng
  "076": Hỗ trợ triển khai trong mạng nội bộ và kết nối model cục bộ, dễ dàng đáp ứng yêu cầu tuân thủ nghiêm ngặt của chính phủ, tài chính, sản xuất.
  "077": Cộng đồng toàn cầu và uy tín vững chắc
  "078": 24,6K sao trên GitHub, NocoBase đã phục vụ nhiều doanh nghiệp, tổ chức và trường đại học trên toàn cầu, lượng khách hàng hiện hữu lớn đang bước vào thời đại AI.
  "079": Chúng tôi hỗ trợ bạn thế nào
  "080": "Từ khách hàng đầu tiên, "
  "081": đồng hành cùng bạn suốt chặng đường.
  "082": Đào tạo và chứng nhận
  "083": Mang theo yêu cầu thực tế tham gia đào tạo thực chiến, nắm vững cách điều phối agent, nghiệm thu bản xem trước và phát hành có kiểm soát trong Studio.
  "084": Hỗ trợ bán hàng
  "085": Cung cấp tài liệu tiền bán hàng, case study, phân tích đối thủ và môi trường demo; dự án trọng điểm có hỗ trợ và demo chung từ hãng.
  "086": Hỗ trợ kỹ thuật từ hãng
  "087": Mở kênh hỗ trợ riêng, đối tác hạng cao được ưu tiên phản hồi; nhận trước phiên bản Core mới, ghi chú cập nhật và gói kỹ năng đi kèm.
  "088": Giới thiệu khách hàng
  "089": Phân phối khách hàng tiềm năng chính xác theo khu vực, ngành, ngôn ngữ và loại dịch vụ, bàn giao cho khách hệ thống nghiệp vụ xây trên NocoBase.
  "090": Thương hiệu và hợp tác marketing
  "091": Cấp chứng nhận và quyền dùng nhận diện đối tác chính thức, có mặt trong danh bạ đối tác, cùng tổ chức sự kiện và quảng bá case study.
  "092": Điều kiện tham gia
  "093": "Bắt đầu không rào cản, "
  "094": đầu tư càng sâu, hỗ trợ càng nhiều.
  "095": Đối tác phân phối
  "096": Đối tác chính thức
  "097": Đăng ký miễn phí, ký thỏa thuận hợp tác phân phối
  "098": Sở hữu giấy phép Professional, ký thỏa thuận đối tác
  "099": Chủ yếu là tài liệu công khai
  "100": Chương trình đào tạo và chứng nhận riêng
  "101": Hoa hồng
  "102": Kích hoạt quyền lợi hoa hồng sau khi bán giấy phép thương mại đầu tiên
  "103": Xếp hạng theo doanh số tích lũy trọn đời, từ 15%, tối đa 40%, chỉ tăng không giảm
  "104": Chứng nhận đối tác
  "105": Có mặt trong danh bạ đối tác
  "106": Hỗ trợ cộng đồng
  "107": Kênh riêng
  "108": Hợp tác marketing và case study
  "109": Quy trình tham gia
  "110": "Từ đăng ký đến bàn giao, "
  "111": bắt đầu dự án đầu tiên của bạn.
  "112": Gửi đăng ký
  "113": Giới thiệu đội ngũ, khu vực, ngành thế mạnh và hình thức hợp tác bạn muốn chọn.
  "114": Trao đổi và ký kết
  "115": Cùng xác nhận hình thức hợp tác, khách hàng mục tiêu và kế hoạch năm đầu, ký thỏa thuận đối tác.
  "116": Đào tạo và chứng nhận
  "117": Mang theo một yêu cầu thực tế, hoàn thành phát triển, nghiệm thu và đưa vào vận hành trong Studio để hoàn tất đào tạo và chứng nhận.
  "118": Bắt đầu bán và bàn giao
  "119": Gia nhập hệ sinh thái đối tác, nhận giới thiệu khách hàng, phân phối giấy phép NocoBase và bàn giao cho khách hàng.
  "120": Câu hỏi thường gặp
  "121": Có cần lập một đội phát triển trước không?
  "122": Không cần mở rộng đội phát triển. Tư vấn viên dẫn dắt yêu cầu và nghiệm thu trong Studio; nên có ít nhất một trưởng nhóm kỹ thuật kiểm soát môi trường, tích hợp hệ thống và phát hành.
  "123": Có thể chọn nhiều hình thức hợp tác cùng lúc không?
  "124": Có. Nhiều đối tác vừa phân phối giấy phép thương mại vừa cung cấp bàn giao tùy biến và bảo trì hằng năm; đối tác chuyên sâu theo ngành còn đúc kết kinh nghiệm thành giải pháp ngành riêng.
  "125": Doanh thu dịch vụ có phải chia với NocoBase không?
  "126": Không. Doanh thu từ triển khai, tùy biến, tích hợp, đào tạo và vận hành 100% thuộc về bạn, định giá hoàn toàn tự chủ.
  "127": Chi phí model và công cụ agent tính thế nào?
  "128": Bạn hoặc khách hàng mua trực tiếp từ nhà cung cấp, NocoBase không thu chênh lệch. Tự do kết nối Claude Code, Codex, OpenCode cùng mọi model đám mây hoặc cục bộ.
  "129": Vẫn có thể dùng NocoBase 2 để bàn giao cho khách hàng không?
  "130": "Có. NocoBase 2 và NocoBase 3 được bảo trì song song lâu dài: dự án cấu hình trực quan dùng 2.x, dự án cần AI phát triển sâu và logic phức tạp dùng 3.x."
  "131": Quyền sở hữu trí tuệ của giải pháp ngành chúng tôi phát triển thuộc về ai?
  "132": Hoàn toàn thuộc về bạn. Bạn tự quyết định mã nguồn mở hay cấp phép thương mại; việc lên danh mục chính thức và quảng bá chung sẽ trao đổi cụ thể khi hợp tác.
  "133": Đăng ký trở thành đối tác NocoBase
  "134": Hãy cho chúng tôi biết về đội ngũ và dự định của bạn, chúng tôi sẽ sớm liên hệ. Hoặc viết thư đến partner@nocobase.com.
  "135": Tên người liên hệ
  "136": Email người liên hệ
  "137": Tên công ty
  "138": Giới thiệu công ty
  "139": Mô tả ngắn ý định hợp tác
  "140": Gửi đăng ký
  "141": Cảm ơn bạn! Chúng tôi đã nhận được đăng ký và sẽ sớm liên hệ.
  "142": Quy mô đội, ngành thế mạnh và khách hàng hiện có
  "143": Hình thức hợp tác muốn chọn (phân phối, bàn giao dịch vụ, giải pháp ngành, hệ sinh thái công nghệ), cùng khách hàng và khu vực mục tiêu
  "144": Quốc gia / khu vực
  "145": Chọn quốc gia hoặc khu vực
  "146": NocoCRM, NocoITAM, NocoReach đều mã nguồn mở, tùy biến theo nhu cầu khách hàng trên nền có sẵn, nhanh hơn nhiều so với làm từ đầu.
