  "283": FAQ zu Lizenzierung &amp; Kauf
  "284": Wie wähle ich zwischen Community, Professional und Enterprise?
  "285": "Einzelpersonen und kleine Teams können kostenlos mit Community starten: Sie enthält bereits die Grundfunktionen von Studio, alle Bausteine von Core sowie alle Open-Source-Apps."
  "286": "Wählen Sie Professional, wenn ein Team Governance braucht: Es ergänzt Mehrrollen-Workflows mit doppelter Abnahme, Deployment-Freigaben, Enterprise-SSO, Kostenkontrolle, erweiterte Freigaben, einen Deployment-Service sowie Support mit 12-Stunden-Reaktionszeit."
  "287": "Wählen Sie Enterprise für teamübergreifende Lieferung und geschäftskritische Systeme: Es ergänzt Qualitätspläne, automatisierte Regressionstests, umgebungsübergreifende Releases, Hochverfügbarkeits-Clustering, Multi-Tenant-, Multi-App- und Multi-Portal-Architektur, Audit-Logs, Air-Gap-Auslieferung, 3 Tage Onboarding sowie priorisierten Support mit 4-Stunden-Reaktionszeit."
  "288": Ja. Community enthält die Grundfunktionen von Studio, den gesamten Core und alle Open-Source-Apps – kostenlos für den Produktivbetrieb und Kundenprojekte.
  "289": Sie läuft nie ab. Kommerzielle Editionen sind ein Einmalkauf ohne Jahresgebühren und ohne nutzerbasierte Lizenzkosten.
  "290": Ja. Studio, Ihre Agenten und Ihre Apps laufen vollständig auf Ihren eigenen Servern, einschließlich Air-Gap-Netzwerken. Einmal veröffentlicht, laufen Ihre Apps eigenständig ohne Studio im Anfragepfad.
  "291": Muss ich Studio separat kaufen?
  "292": Nein. Die Studio Community-Edition ist bereits kostenlos und Open Source in Community enthalten. Team-Governance sowie Enterprise-Funktionen für Qualität und Releases sind direkt in Professional und Enterprise enthalten.
  "293": Kann ich die kommerzielle Studio-Edition für meine Kunden bereitstellen?
  "294": Nein. Die kommerzielle Studio-Edition (Pro/Enterprise) darf nur vom lizenzierten Unternehmen genutzt werden. Die damit entwickelten Geschäftsanwendungen können Sie an Ihre Kunden ausliefern, oder Ihre Kunden hosten selbst die Open-Source-Community-Edition.
  "295": Erzählen Sie uns von Ihrem Team und Ihrem Vorhaben. Wir helfen Ihnen bei der Wahl der passenden Edition und Deployment-Architektur.
