  "206": Wählen Sie Professional, um mit Studio Geschäftssysteme zu entwickeln und auszuliefern. Enthalten sind alle Kernfunktionen von Studio und ein Deployment durch das NocoBase-Team; die erste Antwort auf Supportanfragen kommt innerhalb von 12&nbsp;Stunden.
  "207": Wählen Sie Enterprise, wenn Ihre Systeme Cluster und Hochverfügbarkeit, Mandantenfähigkeit, Audit-Logs oder Air-Gap-Bereitstellung brauchen oder die Entwicklung Qualitätspläne, Deployment-Freigaben und Kostenkontrolle erfordert. Enthalten sind 3 Tage Deployment, Schulung und Implementierung sowie eine erste Antwort innerhalb von 4&nbsp;Stunden.
