  "284": ¿Cómo elijo entre Community, Professional y Enterprise?
  "285": "Las personas y equipos pequeños pueden empezar gratis con Community: ya incluye las funciones principales de Studio, todos los componentes base de Core y todas las apps de código abierto."
  "286": "Elige Professional cuando un equipo necesita gobernanza: añade flujos con múltiples roles y doble aprobación, aprobación de despliegues, SSO empresarial, control de costos, aprobaciones avanzadas, un servicio de despliegue y soporte con respuesta en 12 horas."
  "287": "Elige Enterprise para entregas multiequipo y sistemas críticos: añade planes de calidad, pruebas de regresión automáticas, promociones entre entornos, clúster de alta disponibilidad, arquitectura multiinquilino, multiaplicación y multiportal, registros de auditoría, entrega para entornos aislados, 3 días de puesta en marcha y soporte prioritario en 4 horas."
  "288": Sí. Community incluye las funciones principales de Studio, todo Core y todas las apps de código abierto, gratis para producción y proyectos de clientes.
  "289": No caduca nunca. Las ediciones comerciales son de pago único, sin cuotas anuales ni cargos por usuario.
  "290": Sí. Studio, tus agentes y tus apps se ejecutan en tus propios servidores, incluso en redes aisladas. Una vez publicadas, las apps funcionan por sí solas sin pasar por Studio en el flujo de solicitudes.
  "291": ¿Tengo que comprar Studio por separado?
  "292": No. La edición Community de Studio ya viene gratis y de código abierto en Community. La gobernanza de equipo y las funciones empresariales de calidad y lanzamientos se incluyen directamente en Professional y Enterprise.
  "293": ¿Puedo desplegar Studio comercial para mis clientes?
  "294": No. Studio comercial (Pro/Enterprise) solo puede ser utilizado por la empresa con licencia. Puedes entregar a tus clientes las apps empresariales que desarrolles o dejar que autoalojen la edición Community de código abierto.
  "295": Cuéntanos sobre tu equipo y lo que quieres construir. Te ayudamos a elegir la edición y la configuración de despliegue adecuadas.
