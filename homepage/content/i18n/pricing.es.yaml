  "154": Preguntas frecuentes
  "155": ¿Cómo elijo entre Professional y Enterprise?
  "156": Elige Professional si un solo equipo desarrolla con Studio. Incluye un despliegue a cargo del equipo de NocoBase y una primera respuesta a las solicitudes de soporte en menos de 12&nbsp;horas.
  "157": Elige Enterprise si trabajan varios equipos o si necesitas publicación en varios entornos, alta disponibilidad, registros de auditoría o entrega en entornos aislados. Incluye 3 días de despliegue, formación e implementación, y una primera respuesta en menos de 4&nbsp;horas.
  "158": ¿Puedo usar Community en producción?
  "159": Sí. Community incluye todo Core, además de NocoCRM, NocoReach y NocoProject, de uso gratuito en producción y en proyectos para clientes. Añade las skills de desarrollo de NocoBase a tu agente de programación y empieza a desarrollar. Tu equipo se encarga de las pruebas, las publicaciones y la operación.
  "160": ¿Cuánto dura una licencia comercial?
  "161": No caduca nunca. Las ediciones comerciales se compran una sola vez, sin cuotas anuales.
  "162": ¿Qué pasa cuando termina el primer año de actualizaciones y soporte?
  "163": Todo sigue funcionando. Si quieres nuevas versiones y soporte, puedes comprar actualizaciones y soporte por separado, sin necesidad de renovar cada año.
  "164": ¿Las ediciones comerciales son autoalojadas?
  "165": Sí. Studio, tus agentes y tus apps se ejecutan en tus propios servidores. Una vez publicadas, tus apps funcionan por sí solas, y las solicitudes diarias del negocio nunca pasan por Studio.
  "166": ¿Puedo comprar Studio por separado?
  "167": No. Studio viene incluido en Professional y Enterprise.
  "168": ¿Los clientes con licencia comercial de NocoBase 2 tienen que volver a comprar?
  "169": Mientras tu licencia comercial de NocoBase 2 siga dentro de su periodo de actualizaciones, puedes usar NocoBase 3 sin volver a comprar. Las versiones 2.x y 3.x se mantienen en paralelo.
  "170": ¿No sabes qué edición te conviene?
  "171": Cuéntanos sobre tu equipo y lo que quieres construir. Te ayudamos a analizarlo y a diseñar la configuración adecuada.
  "173": Empieza gratis
  "174": Aprobaciones avanzadas y SSO empresarial
  "175": Todas las apps de Solution, como NocoCRM, NocoITAM y NocoReach, con sus agentes de negocio
  "176": Sí. Community incluye todo Core, además de todas las apps de Solution, de uso gratuito en producción y en proyectos para clientes. Añade las skills de desarrollo de NocoBase a tu agente de programación y empieza a desarrollar. Tu equipo se encarga de las pruebas, las publicaciones y la operación.
  "177": ¿Puedo desarrollar apps para mis clientes con Professional o Enterprise?
  "178": Sí. Puedes vender las apps que desarrolles con Professional o Enterprise a tantos clientes como quieras, sin pagar nada extra a NocoBase. Lo que no puedes es redistribuir Professional o Enterprise a empresas que no tengan licencia.
  "179": ¿Puedo desplegar Studio para mis clientes?
  "180": No. Studio solo puede usarlo la empresa con licencia. Puedes entregar a tus clientes las apps que desarrolles con él, pero no desplegar Studio para ellos.
  "181": Mientras tu licencia Professional o Enterprise de NocoBase 2 siga dentro de su periodo de actualizaciones, puedes usar NocoBase 3 sin volver a comprar. La edición Standard no está incluida. Las versiones 2.x y 3.x se mantienen en paralelo.
