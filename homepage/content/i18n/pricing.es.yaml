title: Ediciones y precios — NocoBase 3
description: La edición Community es gratuita y de código abierto, e incluye las funciones básicas de Studio, todas las capacidades de Core y todas las apps de código abierto. Professional cuesta 8.000 USD en un único pago con gobernanza de equipo y 1 año de actualizaciones y soporte. Enterprise se cotiza según tus necesidades.
