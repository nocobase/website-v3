title: Éditions et tarifs — NocoBase 3
description: "L’édition Community est gratuite et open source : elle inclut l’essentiel de Studio, toutes les briques de Core et toutes les applications open source. Professional coûte 8 000 $ US en paiement unique, avec la gouvernance d’équipe et 1 an de mises à jour et de support. Enterprise est proposé sur devis."
