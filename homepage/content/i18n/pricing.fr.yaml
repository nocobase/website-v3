  "154": FAQ
  "155": Comment choisir entre Professional et Enterprise ?
  "156": Choisissez Professional si une seule équipe développe avec Studio. L’édition comprend un déploiement par l’équipe NocoBase et une première réponse aux demandes de support sous 12&nbsp;heures.
  "157": Choisissez Enterprise pour plusieurs équipes, ou si vous avez besoin de mises en production multi-environnements, de haute disponibilité, de journaux d’audit ou d’une livraison hors ligne. L’édition comprend 3 jours de déploiement, de formation et de mise en œuvre, et une première réponse sous 4&nbsp;heures.
  "158": Puis-je utiliser Community en production ?
  "159": Oui. Community comprend l’intégralité de Core ainsi que NocoCRM, NocoReach et NocoProject, utilisables gratuitement en production et pour des projets clients. Ajoutez les skills de développement de NocoBase à votre agent de code et commencez à développer. Votre équipe gère les tests, les mises en production et l’exploitation.
  "160": Quelle est la durée d’une licence commerciale ?
  "161": Elle n’expire jamais. Les éditions commerciales s’achètent une fois, sans frais annuels.
  "162": Que se passe-t-il à la fin de la première année de mises à jour et de support ?
  "163": Tout continue de fonctionner. Pour obtenir les nouvelles versions et du support, vous pouvez acheter mises à jour et support séparément, sans devoir renouveler chaque année.
  "164": Les éditions commerciales sont-elles auto-hébergées ?
  "165": Oui. Studio, vos agents et vos applications tournent tous sur vos propres serveurs. Une fois publiées, vos applications fonctionnent de façon autonome, et les requêtes métier du quotidien ne passent jamais par Studio.
  "166": Puis-je acheter Studio seul ?
  "167": Non. Studio est inclus dans Professional et Enterprise.
  "168": Les détenteurs d’une licence commerciale NocoBase 2 doivent-ils racheter ?
  "169": Tant que votre licence commerciale NocoBase 2 est dans sa période de mises à jour, vous pouvez utiliser NocoBase 3 sans racheter. Les versions 2.x et 3.x sont maintenues en parallèle.
  "170": Vous hésitez entre les éditions ?
  "171": Parlez-nous de votre équipe et de ce que vous voulez construire. Nous vous aidons à y voir clair et à concevoir la bonne configuration.
  "173": Commencer gratuitement
  "174": Validations avancées et SSO d’entreprise
  "175": Toutes les applications Solution, comme NocoCRM, NocoITAM et NocoReach, avec leurs agents métier
  "176": Oui. Community comprend l’intégralité de Core ainsi que toutes les applications Solution, utilisables gratuitement en production et pour des projets clients. Ajoutez les skills de développement de NocoBase à votre agent de code et commencez à développer. Votre équipe gère les tests, les mises en production et l’exploitation.
  "177": Puis-je développer des applications pour mes clients avec Professional ou Enterprise ?
  "178": Oui. Vous pouvez vendre les applications développées avec Professional ou Enterprise à autant de clients que vous le souhaitez, sans frais supplémentaires pour NocoBase. En revanche, vous ne pouvez pas redistribuer Professional ou Enterprise à des entreprises qui ne disposent pas de licence.
  "179": Puis-je déployer Studio pour mes clients ?
  "180": Non. Studio est réservé à l’entreprise titulaire de la licence. Vous pouvez livrer à vos clients les applications développées avec Studio, mais pas déployer Studio pour eux.
  "181": Tant que votre licence NocoBase 2 Professional ou Enterprise est dans sa période de mises à jour, vous pouvez utiliser NocoBase 3 sans racheter. L’édition Standard n’est pas concernée. Les versions 2.x et 3.x sont maintenues en parallèle.
