title: Edisi dan harga — NocoBase 3
description: Core dan semua aplikasi Solution gratis dan open source, sedangkan Studio Edisi Community gratis digunakan (dengan dua alur kerja bawaan). Professional seharga US$8.000 sekali bayar dengan tata kelola tim, alur kerja kustom, serta 1 tahun upgrade dan dukungan. Enterprise disesuaikan dengan kebutuhan Anda.
