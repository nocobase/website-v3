  "283": FAQ lisensi &amp; pembelian
  "284": Bagaimana cara memilih antara Community, Professional, dan Enterprise?
  "285": "Perorangan dan tim kecil bisa mulai gratis dengan Community: sudah mencakup fitur dasar Studio, seluruh komponen dasar Core, dan semua aplikasi open source."
  "286": "Pilih Professional saat tim membutuhkan tata kelola: menambahkan alur kerja multi-peran dengan persetujuan ganda, persetujuan deploy, SSO perusahaan, kontrol biaya, persetujuan lanjutan, satu kali layanan deploy, dan dukungan dengan respons dalam 12 jam."
  "287": "Pilih Enterprise untuk pengiriman multi-tim dan sistem kritis: menambahkan rencana kualitas, pengujian regresi otomatis, promosi lintas lingkungan, klaster ketersediaan tinggi, arsitektur multi-tenant/multi-aplikasi/multi-portal, log audit, pengiriman air-gapped, 3 hari onboarding, dan dukungan prioritas 4 jam."
  "288": Bisa. Community mencakup fitur dasar Studio, seluruh Core, dan semua aplikasi open source, gratis untuk produksi maupun pengerjaan proyek klien.
  "289": Tidak pernah kedaluwarsa. Edisi komersial dibeli sekali bayar tanpa biaya tahunan dan tanpa biaya per kursi.
  "290": Ya. Studio, agen, dan aplikasi Anda semuanya berjalan di server Anda sendiri, termasuk di jaringan air-gapped. Setelah dirilis, aplikasi berjalan sendiri tanpa melewati Studio.
  "291": Apakah Studio perlu dibeli terpisah?
  "292": Tidak. Studio Edisi Community sudah gratis dan open source di dalam Community. Fitur tata kelola tim serta kualitas dan rilis tingkat enterprise sudah termasuk langsung di Professional dan Enterprise.
  "293": Bisakah saya men-deploy Studio komersial untuk klien?
  "294": Tidak. Studio komersial (Pro/Enterprise) hanya boleh digunakan oleh perusahaan pemegang lisensi. Anda dapat menyerahkan aplikasi bisnis yang dibangun kepada klien atau meminta mereka melakukan self-host Edisi Community yang open source.
  "295": Ceritakan tentang tim Anda dan apa yang ingin Anda bangun. Kami bantu memilih edisi dan pengaturan deployment yang tepat.
