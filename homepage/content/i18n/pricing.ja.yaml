  "283": ライセンスと購入に関する FAQ
  "284": Community、Professional、Enterprise はどう選べばいい？
  "285": 個人や小規模チームは無料の Community から始められます。Studio の基本機能、Core のすべての共通機能、すべてのオープンソースアプリが最初から含まれています。
  "286": チームでのガバナンスが必要なら Professional が最適です。ダブル検収付きの複数ロールワークフロー、デプロイ承認、エンタープライズ SSO、コスト管理、高度な承認に加え、導入支援 1 回と初回応答 12 時間以内の技術サポートが含まれます。
  "287": 複数チームでの開発や基幹業務システムには Enterprise をお選びください。品質計画、自動リグレッションテスト、環境間プロモーション、クラスタ高可用性、マルチテナント／マルチアプリ／マルチポータルアーキテクチャ、監査ログ、閉域網向けオフライン納品に加え、3 日間の導入・トレーニング・実装支援と初回応答 4 時間以内の優先サポートが含まれます。
  "288": 使えます。Community には Studio の基本機能、Core のすべて、すべてのオープンソースアプリが含まれており、本番運用や顧客向け納品にも無料で利用できます。
  "289": 無期限です。商用版は買い切りで、年額費用もユーザー数課金もありません。購入したバージョンはずっと使い続けられます。
  "290": はい。Studio、エージェント、業務アプリはすべて閉域網を含む自社サーバーで稼働します。リリース後の業務アプリは独立して動作し、日常のリクエストが Studio を経由することはありません。
  "291": Studio は別途購入が必要？
  "292": いいえ、不要です。Studio の基本機能は無料のオープンソースとして Community にすでに含まれています。チームガバナンスやエンタープライズ向けの品質・リリース機能は、それぞれ Professional と Enterprise に直接含まれます。
  "293": 商用版 Studio を顧客向けにデプロイできる？
  "294": できません。商用版 Studio（Professional／Enterprise）はライセンスを取得した企業のみが使用できます。開発した業務アプリを顧客に納品したり、顧客自身にオープンソースの Community エディションをセルフホストしてもらったりすることは可能です。
  "295": チームの規模や構築したいシステムをお聞かせください。最適なエディションとデプロイ構成の選定をお手伝いします。
