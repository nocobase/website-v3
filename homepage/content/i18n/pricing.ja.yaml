title: エディションと価格 — NocoBase 3
description: Community エディションは無料のオープンソースで、Studio の基本機能、Core のすべての共通機能、すべてのオープンソースアプリを含みます。Professional は 8,000 米ドルの買い切りで、チームガバナンスと 1 年間のアップデートおよび技術サポート付き。Enterprise は個別見積もりです。
