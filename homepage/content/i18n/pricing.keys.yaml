  "284":
    en: How do I choose between Community, Professional, and Enterprise?
    zh: 社区版、专业版和企业版如何选择？
    where: faq
  "285":
    en: "Individuals and small teams can start free with Community: it already includes Studio’s core features, every Core building block, and all open-source apps."
    zh: 个人和小团队可以直接从社区版起步：开源免费，已经包含工作台（Studio）的基础功能、应用底座（Core）的全部基础能力和全部开源应用。
    where: faq
    unused: true
  "286":
    en: "Choose Professional when a team needs governance: it adds multi-role workflows with dual sign-off, deployment approvals, enterprise SSO, cost controls, advanced approvals, one deployment service, and 12-hour response support."
    zh: 一个团队需要规范分工与治理，选专业版：增加多角色流程（业务与技术双重验收）、部署审批、企业 SSO、成本控制，以及高级审批、信创数据库与一次部署服务，技术支持首次响应不超过 12&nbsp;小时。
    where: faq
    unused: true
  "287":
    en: "Choose Enterprise for multi-team delivery and mission-critical systems: it adds quality plans, automated regression testing, cross-environment promotions, HA clustering, multi-tenant/multi-app/multi-portal architecture, audit logs, air-gapped delivery, 3 days of onboarding, and 4-hour priority support."
    zh: 多团队协作或关键业务系统，选企业版：增加质量计划、回归测试、跨环境发布，以及集群高可用、多租户、多应用、多门户、审计日志和离线交付，包含 3 天部署、培训和实施服务，优先支持首次响应不超过 4&nbsp;小时。
    where: faq
    unused: true
  "288":
    en: Yes. Community includes Studio’s core features, all of Core, and every open-source app, free for production and client delivery.
    zh: 可以。社区版包含工作台（Studio）的基础功能、完整的 Core 底座和所有开源应用，可以直接用于生产环境和商业交付。
    where: faq
  "289":
    en: It never expires. Commercial editions are a one-time purchase with no annual fees and no per-seat charges.
    zh: 永久有效。商业版一次付费，没有年费，也不按席位收费，已购版本可以一直使用。
    where: faq
  "290":
    en: Yes. Studio, your agents, and your apps all run on your own servers, including air-gapped networks. Once released, apps run on their own without Studio in the request path.
    zh: 是的。工作台、Agent 和业务应用都部署在你自己的服务器上，支持纯内网。业务应用发布后独立运行，日常业务请求不经过工作台。
    where: faq
  "291":
    en: Do I need to buy Studio separately?
    zh: Studio 需要单独购买吗？
    where: faq
  "292":
    en: No. Studio Community Edition is already free and open source in Community. Team governance and enterprise quality/release features are included directly in Professional and Enterprise.
    zh: 不需要。Studio 社区版已经开源免费包含在社区版里，个人和小团队可以直接部署使用；多角色流程、部署审批、企业 SSO、成本控制，以及质量计划、回归测试和跨环境发布等进阶功能，分别包含在专业版和企业版中。
    where: faq
    unused: true
  "293":
    en: Can I deploy commercial Studio for my clients?
    zh: 可以把商业版 Studio 部署给客户使用吗？
    where: faq
  "294":
    en: No. Commercial Studio (Pro/Enterprise) may only be used by the licensed company. You can deliver the business apps you build to clients or have them self-host the open-source Community Edition.
    zh: 不能。商业版（专业版、企业版）Studio 仅限获得授权的公司使用。你可以把用 Studio 开发的业务应用交付给客户，或让客户自行部署开源社区版，但商业版 Studio 本身不能分发给未获授权的公司。
    where: faq
  "295":
    en: Tell us about your team and what you want to build. We’ll help you choose the right edition and deployment setup.
    zh: 告诉我们你的团队规模和业务场景，我们帮你评估版本与部署方案。
    where: faq
