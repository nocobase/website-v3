meta:
  title:
    zh: 版本与价格 — NocoBase 3
    en: Editions &amp; Pricing — NocoBase 3
  description:
    zh: 社区版开源免费，包含 Studio 工作台基础功能（含两种内置工作流程）、Core 全部基础能力和全部开源应用；专业版 5 万元一次买断，含多角色与自定义流程、部署审批、企业 SSO、成本控制与 1 年支持；企业版按需报价。
    en: Community Edition is free and open source, including Studio basics with two built-in workflows, every Core capability, and all open-source apps. Professional is $8,000 one-time with team governance, custom workflows, and 1 year of upgrades and support. Enterprise is quoted to your needs.
