notes: |-
  한국어（제목은 명사형·해라체, 본문은 합니다체）
  용어：foundation = 기반；building blocks = 기본 기능；governance = 거버넌스；agent team = 에이전트 팀；
  coding agent = 코딩 에이전트；business logic = 비즈니스 로직；business systems = 비즈니스 시스템；
  vibe coding = 바이브 코딩；self-hosted = 셀프 호스팅；at a glance = 한눈에
  페이지 용어：에디션 이름 Community, Professional, Enterprise는 번역하지 않음；가격은 달러（8,000달러）；信创数据库는 중국어 간체판에만
title: 에디션과 가격 — NocoBase 3
description: Core와 모든 Solution 앱은 무료 오픈소스입니다. Professional은 8,000달러 1회 구매로 Studio, 1년 업그레이드와 기술 지원, 배포 서비스 1회가 포함됩니다. Enterprise는 맞춤 견적입니다.
