  "151": NocoBase 팀 제공
  "152": 배포 1회
  "153": "3일: 배포, 교육, 구축"
  "154": 자주 묻는 질문
  "155": Professional과 Enterprise 중 무엇을 선택해야 하나요?
  "156": 한 팀이 Studio로 개발한다면 Professional을 선택하세요. NocoBase 팀의 배포 서비스 1회와 기술 지원 최초 응답 12&nbsp;시간 이내가 포함됩니다.
  "157": 여러 팀이 협업하거나 다중 환경 배포, 고가용성, 감사 로그, 오프라인 납품이 필요하다면 Enterprise를 선택하세요. 3일간의 배포·교육·구축 서비스와 최초 응답 4&nbsp;시간 이내가 포함됩니다.
  "158": Community를 프로덕션에서 사용할 수 있나요?
  "159": 네. Community에는 Core 전체와 NocoCRM, NocoReach, NocoProject가 포함되며, 프로덕션과 고객 납품에 사용할 수 있습니다. 코딩 에이전트에 NocoBase 개발 스킬을 설치하면 바로 개발할 수 있고, 테스트, 배포, 운영은 팀이 직접 맡습니다.
  "160": 상용 라이선스의 유효 기간은 얼마인가요?
  "161": 영구적입니다. 상용 에디션은 1회 결제로 연간 비용이 없으며, 구매한 버전은 계속 사용할 수 있습니다.
  "162": 1년 업그레이드와 기술 지원이 끝나면 어떻게 되나요?
  "163": 시스템은 그대로 운영됩니다. 새 버전과 기술 지원이 계속 필요하면 업그레이드와 지원 서비스를 별도로 구매할 수 있으며, 매년 연속으로 구매할 필요는 없습니다.
  "164": 상용 에디션은 셀프 호스팅인가요?
  "165": 네. Studio, 에이전트, 업무 앱 모두 자체 서버에 배포됩니다. 업무 앱은 배포 후 독립적으로 실행되며, 일상적인 업무 요청은 Studio를 거치지 않습니다.
  "166": Studio만 따로 구매할 수 있나요?
  "167": 아니요. Studio는 Professional과 Enterprise에 포함되어 있습니다.
  "168": NocoBase 2 상용 라이선스 사용자는 다시 구매해야 하나요?
  "169": NocoBase 2 상용 라이선스의 업그레이드 기간이 남아 있다면 다시 구매하지 않고 NocoBase 3을 사용할 수 있습니다. 2.x와 3.x는 장기간 병행 유지보수됩니다.
  "170": 어떤 에디션이 맞을지 고민되나요?
  "171": 팀 상황과 업무 시나리오를 알려 주시면 분석과 설계를 도와드립니다.
  "173": 무료로 시작
  "174": 고급 승인, 엔터프라이즈 SSO
  "175": NocoCRM, NocoITAM, NocoReach 등 모든 Solution 앱과 각 비즈니스 에이전트
  "176": 네. Community에는 Core 전체와 모든 Solution 앱이 포함되며, 프로덕션과 고객 납품에 사용할 수 있습니다. 코딩 에이전트에 NocoBase 개발 스킬을 설치하면 바로 개발할 수 있고, 테스트, 배포, 운영은 팀이 직접 맡습니다.
