  "154": Perguntas frequentes
  "155": Como escolher entre Professional e Enterprise?
  "156": Escolha o Professional se uma equipe desenvolve com o Studio. Inclui uma implantação feita pela equipe da NocoBase e primeira resposta aos pedidos de suporte em até 12&nbsp;horas.
  "157": Escolha o Enterprise para várias equipes, ou se precisar de publicação em vários ambientes, alta disponibilidade, logs de auditoria ou entrega em ambientes isolados. Inclui 3 dias de implantação, treinamento e implementação, e primeira resposta em até 4&nbsp;horas.
  "158": Posso usar o Community em produção?
  "159": Sim. O Community inclui todo o Core, além de NocoCRM, NocoReach e NocoProject, gratuitos para produção e entregas a clientes. Adicione as skills de desenvolvimento da NocoBase ao seu agente de código e comece a desenvolver. Sua equipe cuida de testes, publicações e operação.
  "160": Quanto tempo dura uma licença comercial?
  "161": Ela nunca expira. As edições comerciais são uma compra única, sem anuidade.
  "162": O que acontece quando termina o primeiro ano de atualizações e suporte?
  "163": Tudo continua funcionando. Para novas versões e suporte, você pode comprar atualizações e suporte separadamente, sem precisar renovar todo ano.
  "164": As edições comerciais são auto-hospedadas?
  "165": Sim. O Studio, seus agentes e seus apps rodam nos seus próprios servidores. Depois de publicados, seus apps funcionam por conta própria, e as requisições do dia a dia nunca passam pelo Studio.
  "166": Posso comprar o Studio separadamente?
  "167": Não. O Studio vem com o Professional e o Enterprise.
  "168": Quem tem licença comercial do NocoBase 2 precisa comprar de novo?
  "169": Enquanto sua licença comercial do NocoBase 2 estiver dentro do período de atualizações, você pode usar o NocoBase 3 sem comprar de novo. As versões 2.x e 3.x são mantidas em paralelo.
  "170": Não sabe qual edição escolher?
  "171": Conte sobre sua equipe e o que você quer construir. Ajudamos você a pensar e a desenhar a configuração certa.
