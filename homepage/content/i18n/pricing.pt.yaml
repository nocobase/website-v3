title: Edições e preços — NocoBase 3
description: O Core e todos os apps do Solution são gratuitos e open source. O Professional custa US$ 8.000 em pagamento único, com Studio, 1 ano de atualizações e suporte e uma implantação. O Enterprise tem orçamento sob medida.
