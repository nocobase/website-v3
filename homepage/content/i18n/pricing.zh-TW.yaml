  "154": 常見問題
  "155": Professional 和 Enterprise 如何選擇？
  "156": 一個團隊用 Studio 開發，選 Professional：包含一次部署服務，技術支援首次回應不超過 12&nbsp;小時。
  "157": 多個團隊協作，或需要跨環境發布、叢集高可用、稽核日誌、離線交付，選 Enterprise：包含 3 天部署、培訓和導入服務，技術支援首次回應不超過 4&nbsp;小時。
  "158": Community 可以用於正式環境嗎？
  "159": 可以。Community 包含完整的 Core 和 NocoCRM、NocoReach、NocoProject，可用於正式環境和商業交付。你的 Coding Agent 裝上 NocoBase 的開發技能就能開發，測試、發布和維運由團隊自己負責。
  "160": 商業版授權的有效期是多久？
  "161": 永久有效。商業版一次付費，沒有年費，已購版本可以一直使用。
  "162": 1 年升級與技術支援到期後怎麼辦？
  "163": 系統照常運行。想繼續獲得新版本和技術支援，可以單獨購買升級和支援服務，且無需連續購買。
  "164": 商業版是否地端部署？
  "165": 是的。Studio、Agent 和業務應用都部署在你自己的伺服器上。業務應用發布後獨立運行，日常業務請求不經過 Studio。
  "166": Studio 是否可以單獨購買？
  "167": 不能。Studio 包含在 Professional 和 Enterprise 中。
  "168": NocoBase 2 商業版使用者需要重新購買嗎？
  "169": 只要 NocoBase 2 商業版還在升級有效期內，就可以直接使用 NocoBase 3，不用重新購買。2.x 和 3.x 會長期並行維護。
  "170": 拿不準選哪個版本？
  "171": 告訴我們你的團隊背景和業務情境，我們幫你分析和設計。
  "173": 免費開始
  "174": 進階簽核、企業 SSO
  "175": NocoCRM、NocoITAM、NocoReach 等全部 Solution 應用及其業務 Agent
  "176": 可以。Community 包含完整的 Core 和所有 Solution 應用，可用於正式環境和商業交付。你的 Coding Agent 裝上 NocoBase 的開發技能就能開發，測試、發布和維運由團隊自己負責。
