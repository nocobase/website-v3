notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語：版本名譯作社群版、專業版、企業版（簡體中文是社区版、专业版、企业版，其他語言保留英文）；價格用美元（US$8,000）；信創資料庫只在簡體中文版列出
title: 版本與價格 — NocoBase 3
description: Core 與全部 Solution 開源免費，Studio 社群版免費使用（含工作台基礎功能與兩種內建工作流程）；專業版 US$8,000 一次買斷，含多角色與自訂流程、部署簽核、企業 SSO、成本控制與 1 年升級與技術支援；企業版依需求報價。
