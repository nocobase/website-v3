notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語：版本名 Community、Professional、Enterprise 不譯；價格用美元（US$8,000）；信創資料庫只在簡體中文版列出
title: 版本與價格 — NocoBase 3
description: Core 和所有 Solution 應用開源免費。Professional US$8,000 一次買斷，含 Studio、1 年升級與技術支援和一次部署服務；Enterprise 依需求報價。
