notes: |-
  Português（巴西，você）
  术语：foundation = base；building blocks = componentes básicos；governance = governança；agent team = equipe de agentes；
  coding agent = agente de código；business logic = lógica de negócio；business systems = sistemas de negócio；
  vibe coding = vibe coding；self-hosted = auto-hospedado；make the call = dar a palavra final / decidir；at a glance = à vista
  子页面术语：agent = agente；lead = lead；opportunity / deal = oportunidade（同一概念）；account = cliente；approval = aprovação；
  comment (approval) = parecer；timeline = linha do tempo；business guidance = Diretrizes de negócio；touchpoint = interação；
  follow up = acompanhar；inbox = caixa de entrada；quote = proposta；asset register = cadastro de ativos；
  entitlement = direito de uso；seat = licença；idle = ocioso；stock = estoque；stocktake / audit = inventário；
  joiner / leaver = admissão / desligamento（new hire = novo colaborador）；discrepancy = divergência；reconcile = conciliar；
  purchase request = solicitação de compra；PO = pedido de compra；repair = reparo；disposal = descarte
