notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語（產品介面上的名稱，用簡體中文介面的說法、只轉繁體字；本頁以此為準，审批 不用 簽核）：
  NocoCRM：线索 = 線索；商机 = 商機；公司 = 公司；联系人 = 聯絡人；任务 = 任務；审批 = 審批；报表 = 報表；收件箱 = 收件箱；
  邮箱 = 郵箱；业务指导 = 業務指導；技能 = 技能；Agent 团队 = Agent 團隊；Agent 工作 = Agent 工作；审批助手 Agent = 審批助手 Agent；
  同意 / 有条件同意 / 驳回 = 同意 / 有條件同意 / 駁回；批注 = 批註；
  NocoITAM：待办 = 待辦；设备 = 設備；配件 = 配件；耗材 = 耗材；组件 = 組件；授权 = 授權；席位 = 席位；采购 = 採購；维修 = 維修；
  报废 = 報廢；盘点 = 盤點；配置 = 配置；资产管家 = 資產管家；审批助手 = 審批助手；MDM 跟进 = MDM 跟進；MDM 核对 = MDM 核對
