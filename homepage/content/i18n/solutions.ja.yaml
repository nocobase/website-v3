title: NocoBase Solution — オープンソースの業務アプリ、AI 駆動ですぐに使える
description: NocoBase Solution は、Core 上に構築された、エージェントが動かす業務アプリのシリーズです。
strings:
  "000": オープンソースの業務アプリ。<span class="m">AI 駆動で、すぐに使える。</span>
  "003": 自社サーバーで稼働
  "004": モデルを自由に選べる
  "005": 営業管理 · Beta
  "007": NocoCRM の詳細
  "008": IT 資産台帳・管理 · Beta
  "010": NocoITAM の詳細
  "011": グロース · Alpha
  "013": NocoReach の詳細
  "014": サポート · 近日公開
  "016": プロジェクト · 近日公開
  "018": 人事 · 近日公開
  "020": 業務エージェント
  "021": エージェントが<span class="m">自ら動く。</span>
  "022": 従来の業務ソフトウェアは、データの記録も、業務の受け渡しも、一つひとつの操作も人に頼っています。NocoBase Solution では、各アプリに業務エージェントが組み込まれ、ルールに従って実務の大部分を自ら引き受けます。たとえば返金の確認やチケット対応などです。
  "023": 各エージェントの担当、動くタイミング、進め方は、すべて明確に定められています。
  "024": "何かが起きると動き出す： "
  "025": 新しいリード、顧客からのメール、タスクの完了をきっかけに、該当するエージェントが自動で動き出します。スケジュールに沿って定期的に実行することもできます。
  "026": "ルールに従って動く： "
  "027": 業務ガイダンスには自社の背景と基準を、スキルには仕事の進め方を書きます。内容を変更すると、エージェントは次の実行から新しい内容に従います。
  "028": "すべてを記録に残す： "
  "029": 各エージェントの実行回数、採用された提案と見送られた提案が、すべて記録されます。
  "030": 人とエージェントの役割分担
  "031": 人が担う、<span class="m">重要な判断。</span>
  "033": アプリ
  "034": 業務エージェントが担当
  "035": 人が判断
  "036": 顧客情報とやり取りの記録の整理、リードと会社の調査、次のステップの提案、見積もりの事前チェック
  "037": 割引、見積もり、契約条件
  "038": 資産台帳と MDM の照合、入社・退職時の配布構成の準備、購買申請と廃棄申請の一次審査
  "039": 購買、廃棄、重要な資産の変更
  "040": 毎日のデータ分析、根拠を添えた成長機会の発見、変更を加えたプルリクエストの作成
  "041": 採用する機会の選定、ブランドチェック、リリース
  "043": チケットの分類と振り分け、ナレッジベースの検索、返信の下書き
  "044": 返金、エスカレーション、例外対応
  "045": 調査や文書作成タスクの実行、進捗の追跡、リスクの洗い出し
  "046": 目標、優先順位、成果の検収
  "047": 入社準備、従業員記録の整理、社内規程に関する質問への回答
  "048": 採用、給与、人事上の特例
  "049": 根拠を添える
  "050": エージェントが渡すすべての成果には、どのメール、どの記録、どの資料にもとづくのか、出どころが明記されます。
  "051": 判断するのは人
  "052": 割引、購買、返金といった判断では、エージェントは選択肢と理由を用意するだけで、最終的な判断は担当者が行います。
  "053": 担当者の権限を継承
  "054": エージェントが閲覧・変更できる範囲は、その担当者と同じです。権限を超えることはありません。
  "055": カスタマイズ
  "056": 手軽に<span class="m">カスタマイズできる。</span>
  "058": デプロイしてすぐに稼働
  "059": 各アプリは個別にデプロイできます。業務ガイダンスを書き、モデルを接続すれば、業務エージェントが働き始めます。
  "060": スキル、ルール、コードを変更
  "061": 進め方が変わればスキルを編集し、ワークフローやフィールドが変わればコーディングエージェントにソースを変更させます。
  "062": 公式アップデートは必要なときに
  "063": カスタマイズしたソースは自社のものです。必要な公式アップデートは、検証したうえで自社のリポジトリにマージします。
  "064": Solution のアプリは NocoBase Core 上に構築
  "065": 人とエージェントのチームでカスタマイズ：NocoBase Studio
  "066": オープンソースとセルフホスト
  "067": 無料のオープンソース、<span class="m">すぐに使える。</span>
  "074": はじめる
  "079": アプリを見る
