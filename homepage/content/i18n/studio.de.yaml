title: NocoBase Studio — Agenten treiben die Arbeit voran. Ihr Team behält die Kontrolle.
description: NocoBase Studio ist der Arbeitsbereich für NocoBase. Verbinden Sie Claude Code, Codex und OpenCode auf Ihren Geräten zu einem rund um die Uhr arbeitenden Agenten-Team, das nach klaren Prozessen entwickelt, testet und prüft – während Menschen am Desktop oder mobil steuern und entscheiden.
strings:
  "000": Agenten treiben die Arbeit voran. <span class="m">Ihr Team behält die Kontrolle.</span>
  "002": Online testen
  "004": Läuft auf Ihren eigenen Servern
  "005": Funktioniert mit Claude Code, Codex und Dutzenden weiteren Coding-Tools
  "006": In den kommerziellen Editionen enthalten
  "007": Agenten-Team
  "008": Ein Agenten-Team, <span class="m">das die Arbeit vorantreibt.</span>
  "009": Studio verbindet Agenten auf vielen Rechnern und steuert sie zentral. Sie treiben viele Projekte und Aufgaben parallel voran, rund um die Uhr.
  "010": Agenten auf vielen Rechnern
  "011": Verbinden Sie Claude Code, Codex und andere Agenten auf den Rechnern und Servern Ihres Teams, und Studio erkennt die dort angemeldeten Coding-Tools und Modelle. Beschreiben Sie, worin jeder Agent gut ist, aktivieren Sie ihn, und er wird Teil des Agenten-Teams.
  "012": Ein Koordinator verteilt die Arbeit
  "013": Ein Koordinations-Agent verteilt Design, Entwicklung, Tests und Review nach den Stärken der einzelnen Agenten. Er schreibt keinen Code und merget nichts; die Abnahme macht immer ein Mensch.
  "014": Viele Aufgaben gleichzeitig
  "015": Jede Aufgabe hat ihren eigenen Branch, und jeder Lauf arbeitet in einem eigenen Worktree. So kommen viele Aufgaben gleichzeitig voran, ohne sich zu stören. Mehr Rechner bedeuten mehr Parallelität.
  "016": My sessions
  "017": Sprechen Sie in Studio mit dem Agenten auf Ihrem eigenen Rechner, um Anforderungen zu besprechen und zu klären, Aufgaben festzuhalten und ihren Fortschritt zu verfolgen. Sobald eine Aufgabe startet, setzt der Koordinations-Agent das Agenten-Team ein.
  "018": Fortschritt
  "019": Fortschritt <span class="m">auf einen Blick.</span>
  "020": Projektfortschritt, Aufgabenverlauf, Auslastung der Agenten und Modellnutzung sind jederzeit transparent. Sie sehen auf einen Blick, wo jede Aufgabe steht und was als Nächstes kommt.
  "021": Projektfortschritt
  "022": Der Fortschritt jedes Projekts sowie erledigte Aufgaben, Durchlaufzeit, Anteil der von Agenten erledigten Arbeit und Kosten pro Aufgabe, jeweils im Vergleich zur Vorperiode.
  "023": Aufgabenverlauf
  "024": Oben in jeder Aufgabe steht, in welchem Schritt sie ist, welcher Agent daran arbeitet und was als Nächstes kommt.
  "025": Auslastung der Agenten und Modellnutzung
  "026": Sehen Sie, an welchen Aufgaben die Agenten auf jedem Rechner arbeiten und wie viele Tokens jedes Modell zu welchen Kosten verbraucht hat.
  "027": Entscheidungen
  "028": Entscheidungen <span class="m">mit Belegen.</span>
  "030": Bericht und Checkliste
  "031": Jede Übergabe beschreibt, was sich geändert hat und wie es geprüft wurde, mit einer Abnahme-Checkliste Punkt für Punkt.
  "032": Screenshots und Vorschauen
  "033": Zu jedem Szenario gibt es Screenshots, und wenn Sie es selbst ausprobieren möchten, steht eine eigene Vorschauumgebung bereit.
  "034": Abnehmen oder zurückgeben
  "035": Mit den Belegen in der Hand nehmen Sie die Arbeit ab oder geben sie zurück. Nennen Sie den Grund, und die Agenten machen dort weiter.
  "036": Fachexperten
  "037": Auch Fachexperten, die nicht programmieren, können entscheiden.
  "038": Fachexperten beschreiben ihren Bedarf in ihren eigenen Worten, beantworten die Fragen der Agenten und prüfen das Ergebnis in einer Vorschau mit echten Daten. Umgebungen, Branches, Tests und Releases übernehmen die Agenten und Studio.
  "039": Tech Leads legen die Regeln fest und geben Releases frei. Fachexperten verantworten die Anforderungen und die Abnahme.
  "040": Bevor Arbeit bei einem Menschen ankommt, organisiert Studio Prüfungen und Reviews.
  "041": "Jede Änderung durchläuft denselben Weg: Sie landet erst bei einem Menschen, wenn Tests und Code-Review bestanden sind, und geht erst in Produktion, wenn ein Mensch zustimmt. Geht etwas schief, wird sie zurückgerollt."
  "042": Branch und Worktree
  "043": Jede Aufgabe hat ihren eigenen Branch, und jeder Lauf arbeitet in einem eigenen Worktree. Pull Requests aus diesem Branch werden mit der Aufgabe verknüpft.
  "044": Tests und Review
  "045": Die CI führt Prüfungen und Tests aus, dann prüft ein anderes Modell den Code, wenn möglich von einem anderen Anbieter.
  "046": Vorschau
  "047": Bei Bedarf erhält ein Pull Request eine eigene Vorschauumgebung, in der ein Mensch testet und abnimmt.
  "048": Merge und Release
  "049": Nach der Abnahme wird gemergt, und die Aufgabe ist erledigt, sobald alle ihre Pull Requests gemergt sind. Releases in die Produktion brauchen die Zustimmung eines Menschen.
  "050": Rollback
  "051": Wenn etwas kaputtgeht, zurück zum letzten Release.
  "053": Das Wissen <span class="m">bleibt im Team.</span>
  "054": Anforderungskontext, Geschäftsunterlagen und Erfahrungen verteilen sich auf Chats auf verschiedenen Rechnern. Wechseln Menschen oder Agenten, findet man sie kaum wieder. Studio hält Methoden und Erfahrung in Skills, Wissensdatenbank und Projektgedächtnis fest. So macht jede neue Person und jeder neue Agent dort weiter, wo der vorherige aufgehört hat.
  "055": Skills
  "056": Skills halten fest, wie gearbeitet wird. Beschreiben Sie, wie Sie Anforderungen klären, entwickeln, reviewen und releasen, global, pro Projekt oder pro Arbeitsverzeichnis, und jeder Lauf bringt sie mit.
  "057": Wissensdatenbank
  "058": Die Wissensdatenbank enthält Geschäftsunterlagen. Anforderungen, Geschäftsregeln, Vertragsvorlagen und anderes Material werden von Menschen geschrieben oder hochgeladen, und Agenten lesen sie bei der Arbeit.
  "059": Projektgedächtnis
  "060": Das Projektgedächtnis bewahrt, was Agenten selbst lernen. Es liegt im Repository des Projekts, wird mit dem Pull Request jeder Aufgabe reviewt und gemergt und vor der nächsten Aufgabe gelesen.
  "061": Open Source und Self-Hosting
  "062": Selbst gehostet. <span class="m">Ihr Code und Ihre Daten gehören Ihnen.</span>
  "070": Der Code der Agenten baut auf NocoBase Core auf
  "072": NocoBase Studio online testen
  "073": Vollständig in neuem Tab öffnen
  "074": Sie sind mit einem Demo-Konto angemeldet. Alle Daten sind erfunden, probieren Sie also ruhig alles aus.
  "075": NocoBase Studio ist der Arbeitsbereich für NocoBase. Es bündelt Claude Code, Codex und OpenCode auf Ihren Geräten zu einem rund um die Uhr arbeitenden Agenten-Team für Entwicklung, Tests und Review nach klaren Prozessen – während Menschen am Desktop oder mobil Anforderungen stellen, Fortschritte verfolgen und entscheiden.
  "076": Kostenlos starten
  "078": Die Community-Edition ist kostenlos und enthält die Grundfunktionen von Studio
  "079": Selbst gehostet auf Ihren eigenen Servern, Air-Gap-fähig
  "080": Funktioniert mit Claude Code, Codex, OpenCode und mehr
  "081": Ein Agenten-Team <span class="m">rund um die Uhr.</span>
  "082": Verbinden Sie Coding-Tools auf Laptops und Team-Servern in einem Arbeitsbereich. Ein Koordinations-Agent verteilt die Arbeit, und Agenten treiben mehrere Projekte rund um die Uhr in isolierten Umgebungen voran.
  "083": Viele Geräte, jedes Coding-Tool
  "084": Verbinden Sie Claude Code, Codex, OpenCode und weitere Tools auf Laptops und Servern ohne Vendor-Lock-in. Fügen Sie weitere Rechner hinzu, um mehr Aufgaben parallel laufen zu lassen.
  "085": Automatische Zuteilung nach Stärke
  "086": Ein Koordinations-Agent verteilt Design-, Entwicklungs-, Test- und Review-Aufgaben nach den Stärken jedes Agenten – ohne ständiges Überwachen von Terminals, während die finale Abnahme immer bei Menschen bleibt.
  "087": Isolierte parallele Läufe
  "088": Jede Aufgabe läuft in ihrem eigenen Branch, Worktree und einer eigenen Testumgebung, sodass Dutzende Aufgaben parallel vorankommen, ohne sich zu stören.
  "089": Zusammenarbeit &amp; Entscheidungen
  "090": Klare Entscheidungen, <span class="m">überall.</span>
  "091": Fachabteilungen stellen Anforderungen und nehmen Ergebnisse am Desktop oder mobil anhand von Übergabeberichten und Live-Testumgebungen ab – während Fortschritt, Durchlaufzeit und Modellkosten über alle Projekte hinweg auf einen Blick sichtbar bleiben.
  "092": Anforderungen in Alltagssprache &amp; direkte Abnahme
  "093": Beschreiben Sie Anforderungen in Alltagssprache und beantworten Sie kurze Rückfragen. Jede Übergabe enthält Bericht, Checkliste, Screenshots und eine Live-Testumgebung.
  "094": Am Desktop und mobil einsatzbereit
  "095": Fügen Sie Studio zum Startbildschirm Ihres Smartphones hinzu, um von überall Anforderungen zu stellen, Fragen zu beantworten, Screenshots zu prüfen und mit Sofortbenachrichtigungen freizugeben.
  "096": Fortschritt, Auslastung und Kosten im Blick
  "097": Aufgaben, Kontext und Übergaben jedes Projekts liegen an einem Ort – mit Dashboards für Durchsatz, Durchlaufzeit, Nacharbeit, Agenten-Auslastung und Kosten pro Aufgabe.
  "098": Prozess &amp; Qualität
  "099": Klare Prozesse, <span class="m">Qualität an jedem Schritt.</span>
  "100": Von der Anforderung und dem Entwurf über Entwicklung, Tests und Review bis zu Abnahme und Release hat jeder Schritt klare Zuständigkeiten, Prüfpunkte und einen lückenlosen Audit-Trail.
  "101": Passender Workflow pro Projekt
  "102": Integrierte Workflows von schlank bis strikt – oder passen Sie eigene Abläufe an Ihre Engineering-Standards an.
  "103": Tests &amp; Cross-Model-Review
  "104": Zuerst laufen automatische Tests, gefolgt vom Code-Review durch das Modell eines anderen Anbieters; bei Fehlern erfolgt automatisch eine Nachbesserung.
  "105": Doppelte Abnahme
  "106": Fachabteilungen prüfen das Verhalten in einer Live-Vorschau, während Tech Leads Architektur und Sicherheit abnehmen.
  "107": Qualitätspläne &amp; Regression
  "108": Führen Sie vor jedem Release vollständige Regressionstests über Funktionen, Berechtigungen, Sicherheit, Performance und Codequalität aus.
  "109": Freigegebenes Release &amp; Rollback
  "110": Produktions-Deployments erfordern eine Freigabe, unterstützen Release-Fenster und lassen sich sauber auf das letzte stabile Release zurückrollen.
  "111": Klare Rollen
  "112": Fachabteilungen verantworten Anforderungen und Abnahme; Tech Leads verantworten Regeln und Releases.
  "113": Fachabteilungen formulieren Regeln in Alltagssprache und prüfen mit echten Daten in einer Testumgebung – Branches, Tests, Reviews und Deployments übernehmen die Agenten und Studio.
  "114": Teamwissen
  "115": Halten Sie Teampraktiken in Skills, Geschäftsunterlagen in der Wissensdatenbank und das Gelernte der Agenten im Projektgedächtnis fest – nichts geht verloren, wenn Menschen oder Modelle wechseln.
  "116": Machen Sie Entwicklungsstandards, Review-Checklisten und Teamabläufe zu Skills – global, pro Projekt oder pro Verzeichnis –, die bei jedem Lauf automatisch greifen.
  "117": Verwalten Sie Geschäftsrichtlinien, Regeln, Spezifikationen und Vorlagen zentral mit Datei-Parsing, damit Menschen und Agenten auf derselben Wissensbasis arbeiten.
  "118": Erfahrungen, die Agenten bei Entwicklung und Reviews sammeln, werden direkt im Repository gespeichert, in PRs geprüft und vor der nächsten Aufgabe gelesen.
  "119": Editionen &amp; Self-Hosting
  "120": Kostenlos mit Community starten, <span class="m">mit Ihrem Team wachsen.</span>
  "121": Jede Edition wird selbst auf Ihren eigenen Servern gehostet – auch in Air-Gap-Netzwerken. Starten Sie kostenlos mit Community oder wechseln Sie per Einmalkauf mit Dauerlizenz.
  "124": Für Einzelpersonen &amp; kleine Teams
  "125": Enthält Aufgaben, Agenten-Teams, Runtimes, Tests &amp; Cross-Model-Review, Vorschau-Abnahme, Skills/Wissensdatenbank/Projektgedächtnis, mobile Freigaben, Nutzungsprotokolle und Rollenberechtigungen.
  "126": Pro
  "127": Einmalige Lizenz
  "128": Für Teams mit laufender Auslieferung
  "129": Ergänzt Mehrrollen-Workflows mit doppelter Abnahme, Deployment-Freigaben, Enterprise-SSO (SAML/LDAP/Feishu/DingTalk/WeCom) und Budgetgrenzen.
  "130": Editionen vergleichen
  "131": Enterprise
  "132": Für mehrere Teams &amp; kritische Systeme
  "133": Ergänzt Projekt-Qualitätspläne, automatische Release-Regressionstests, umgebungsübergreifende Releases mit Release-Fenstern und Freeze-Zeiten sowie Hochverfügbarkeits-Clustering.
  "135": Code und Daten bleiben auf Ihren Servern
  "136": Beliebige Modelle und Coding-Tools, inklusive lokaler Modelle
  "137": Veröffentlichte Apps laufen eigenständig ohne Studio im Anfragepfad
  "138": Studio-Dokumentation lesen
  "139": "Entdecken Sie das Fundament hinter Studio: NocoBase Core"
  "140": Open-Source-Apps auf Basis von NocoBase ansehen
  "142": Strukturierte Workflows, <span class="m">Menschen an den Kontrollpunkten.</span>
  "144": Integrierte &amp; eigene Workflows
  "146": Klare Prüfpunkte &amp; automatische Nachbesserung
  "148": Feste Skills bei jedem Lauf
  "149": Hinterlegen Sie Entwicklungs-, Review-Bewertungs- und Berichtsregeln als feste Skills, die automatisch geladen werden und sich pro Aufgabe nicht entfernen lassen – kombiniert mit freigegebenen Releases und Rollback.
  "150": Qualitätsmanagement
  "151": Automatisierte Qualitätstests, <span class="m">geschlossene Fehlerbehebung.</span>
  "152": Bewährte Test-Tools prüfen parallel über sieben Dimensionen hinweg, statt dass Agenten aus dem Code raten – mit automatischen Berichten und Folgeaufgaben, die im geschlossenen Kreislauf behoben und erneut getestet werden.
  "153": Bewährte Tools &amp; eigene Standards
  "154": Deckt Funktionen, Smoke-Tests, Berechtigungen, Sicherheit, Performance, Codequalität und UX mit Playwright, einer Rollenmatrix-Engine, OWASP ZAP, gitleaks, Lighthouse, PostgreSQL EXPLAIN und jscpd ab. Passen Sie Schwellenwerte, Skills und Dimensionen an; fehlende Voraussetzungen werden klar als nicht geprüft markiert.
  "155": Vier Auslöser, parallele Runner
  "156": Tägliche, Release-, Projekt- und benutzerdefinierte Läufe nutzen dieselbe Engine und dasselbe Regelwerk. Kernszenarien liegen im Repository und wachsen mit dem Produkt mit, während mehrere Testrechner die Dimensionen parallel ausführen.
  "157": Auto-Berichte &amp; geschlossene Fehlerbehebung
  "158": Berichte pro Dimension fließen in einen gemeinsamen Übergabebericht ein. Deduplizierte Fehler, Performance-Regressionen, Sicherheitsfunde und Aufräumpunkte gehen in den Entwicklungs-Workflow, wo Agenten sie beheben, reviewen und erneut testen – nur unklare Regeln entscheiden Menschen.
  "160": Ergänzt Mehrrollen-Workflows mit doppelter Abnahme und benutzerdefinierte Workflows, Deployment-Freigaben, Enterprise-SSO (SAML/LDAP/Feishu/DingTalk/WeCom) und Budgetgrenzen.
  "161": Ergänzt Projekt-Qualitätsmanagement über sieben Dimensionen mit bewährten Tools, automatisierte Regressionstests mit geschlossener Fehlerbehebung, umgebungsübergreifende Releases mit Release-Fenstern und Freeze-Zeiten sowie Hochverfügbarkeits-Clustering.
  "162": Anforderer und Tech Leads verantworten Start und Abschluss, während Agenten dazwischen Planung, Entwicklung, schreibgeschütztes Review durch ein anderes Modell und automatische CI-Prüfungen übernehmen – bei Ablehnung geht es automatisch zurück in die Überarbeitung.
  "163": NocoBase Studio
  "164": NocoBase Studio ist der Team-Entwicklungsarbeitsbereich für NocoBase. Es bündelt Claude Code, Codex und OpenCode auf Ihren Geräten zu einem rund um die Uhr arbeitenden Agenten-Team für Entwicklung, Tests und Review nach klaren Prozessen – während Menschen am Desktop oder mobil Anforderungen stellen, Fortschritte verfolgen und entscheiden.
  "165": Studio installieren
  "166": Weisen Sie jeder Aufgabe einen einfachen, Standard- oder benutzerdefinierten Workflow mit festen Skills bei jedem Lauf zu – mit klaren Zuständigkeiten, automatischen Korrekturschleifen und lückenlosem Audit-Trail.
  "167": Community enthält den einfachen und den Standard-Workflow; Professional ergänzt Mehrrollen-Workflows, eigene Schritte und konfigurierbare Zuständigkeitsregeln.
  "168": Community kostenlos
  "169": Enthält Aufgaben, Agenten-Teams, Runtimes, zwei integrierte Workflows (einfach &amp; Standard) mit festen Skills, CI-Prüfungen &amp; Cross-Model-Review, Vorschau-Abnahme, Wissensdatenbank/Projektgedächtnis, mobile Freigaben und Rollenberechtigungen.
  "170": Oder direkt mit NocoBase Core starten
