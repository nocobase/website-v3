notes: |-
  Español（中性拉美/西班牙通用，tú）
  术语：foundation = base；building blocks = componentes base；governance = gobernanza；agent team = equipo de agentes；
  coding agent = agente de programación；business logic = lógica de negocio；business systems = sistemas empresariales；
  vibe coding = vibe coding；self-hosted = autoalojado；make the call = decidir；at a glance = de un vistazo
  页面用语：issue = tarea；coordinator agent = agente coordinador；My sessions 等产品界面名称照英文
title: NocoBase Studio — Los agentes hacen avanzar el trabajo. Tu equipo mantiene el control.
description: NocoBase Studio es el espacio de trabajo de NocoBase. Convierte Claude Code, Codex y OpenCode en tus dispositivos en un equipo de agentes 24/7 que desarrolla, prueba y revisa siguiendo un proceso, mientras las personas guían y deciden desde computadora o móvil.
strings:
  "000": Los agentes hacen avanzar el trabajo. <span class="m">Tu equipo mantiene el control.</span>
  "002": Pruébalo en línea
  "004": Se ejecuta en tus propios servidores
  "005": Compatible con Claude Code, Codex y decenas de herramientas de programación más
  "006": Disponible en las ediciones comerciales
  "007": Equipo de agentes
  "008": Un equipo de agentes <span class="m">que hace avanzar el trabajo.</span>
  "009": Studio conecta agentes de muchas máquinas y los coordina de forma centralizada. Hacen avanzar muchos proyectos y tareas en paralelo, día y noche.
  "010": Agentes en muchas máquinas
  "011": Conecta Claude Code, Codex y otros agentes de las computadoras y servidores de tu equipo, y Studio detecta las herramientas de programación y los modelos con sesión iniciada. Indica en qué destaca cada agente, actívalo y se suma al equipo de agentes.
  "012": Un coordinador reparte el trabajo
  "013": Un agente coordinador reparte el diseño, el desarrollo, las pruebas y la revisión según lo que mejor hace cada agente. No escribe código ni fusiona nada; la aceptación siempre la hace una persona.
  "014": Muchas tareas a la vez
  "015": Cada tarea tiene su propia rama y cada ejecución trabaja en un worktree independiente, así que muchas tareas avanzan a la vez sin chocar. Agrega máquinas para ejecutar más en paralelo.
  "016": My sessions
  "017": En Studio, conversa con el agente de tu propia computadora para discutir y aclarar requisitos, registrar tareas y seguir su avance. Cuando una tarea arranca, el agente coordinador pone a trabajar al equipo de agentes.
  "018": Avance
  "019": El avance, <span class="m">de un vistazo.</span>
  "020": El avance de los proyectos, la actividad de las tareas, la carga de los agentes y el uso de modelos se ven con claridad. De un vistazo sabes en qué punto está cada tarea y qué sigue.
  "021": Avance de los proyectos
  "022": El avance de cada proyecto, junto con las tareas completadas, el tiempo de ciclo, la proporción completada por agentes y el costo por tarea, comparados con el periodo anterior.
  "023": Actividad de las tareas
  "024": Cada tarea muestra arriba en qué paso está, qué agente trabaja en ella y qué sigue.
  "025": Carga de los agentes y uso de modelos
  "026": Consulta en qué tareas trabajan los agentes de cada máquina y cuántos tokens ha usado cada modelo, y a qué costo.
  "027": Decisiones
  "028": Decisiones <span class="m">basadas en evidencias.</span>
  "030": Informe y lista de verificación
  "031": Cada entrega explica qué cambió y cómo se verificó, con una lista de aceptación punto por punto.
  "032": Capturas y vistas previas
  "033": Cada escenario incluye capturas de pantalla y, si quieres probarlo tú mismo, tienes listo un entorno de vista previa independiente.
  "034": Aceptar o devolver
  "035": Con la evidencia en mano, acepta el trabajo o devuélvelo. Explica el motivo y los agentes siguen a partir de ahí.
  "036": Expertos de negocio
  "037": Los expertos de negocio que no programan también pueden decidir.
  "038": Los expertos de negocio describen lo que necesitan con sus propias palabras, responden las preguntas de los agentes y revisan el resultado en una vista previa con datos reales. Los entornos, las ramas, las pruebas y las publicaciones quedan a cargo de los agentes y de Studio.
  "039": Los líderes técnicos fijan las reglas y aprueban las publicaciones. Los expertos de negocio definen los requisitos y se encargan de la aceptación.
  "040": Antes de que el trabajo llegue a una persona, Studio organiza las comprobaciones y revisiones.
  "041": "Cada cambio sigue el mismo camino: llega a una persona solo después de pasar las pruebas y la revisión de código, y llega a producción solo cuando una persona lo aprueba. Si algo sale mal, se revierte."
  "042": Rama y worktree
  "043": Cada tarea tiene su propia rama y cada ejecución trabaja en un worktree independiente. Los pull requests de esa rama se vinculan a la tarea.
  "044": Pruebas y revisión
  "045": La CI ejecuta las comprobaciones y pruebas, y luego otro modelo revisa el código, de otro proveedor si lo hay.
  "046": Vista previa
  "047": Cuando hace falta, un pull request tiene su propio entorno de vista previa para que una persona lo pruebe y lo apruebe.
  "048": Fusión y publicación
  "049": Se fusiona tras la aceptación, y la tarea se completa cuando se fusionan todos sus pull requests. Publicar en producción requiere la aprobación de una persona.
  "050": Revertir
  "051": Si algo falla, vuelve a la versión anterior.
  "053": El conocimiento <span class="m">se queda en el equipo.</span>
  "054": El contexto de los requisitos, los documentos de negocio y la experiencia del proyecto quedan dispersos en conversaciones de distintas computadoras. Cuando cambian las personas o los agentes, cuesta encontrarlos. Studio guarda los métodos y la experiencia en skills, la base de conocimiento y la memoria del proyecto, para que quien llegue después retome el trabajo donde lo dejó el anterior.
  "055": Skills
  "056": Las skills guardan cómo se hace el trabajo. Escribe cómo aclaras requisitos, desarrollas, revisas y publicas, a nivel global, de proyecto o de directorio de trabajo, y cada ejecución las incluye.
  "057": Base de conocimiento
  "058": La base de conocimiento guarda los documentos de negocio. Requisitos, reglas de negocio, plantillas de contrato y otros materiales los escriben o suben las personas, y los agentes los consultan mientras trabajan.
  "059": Memoria del proyecto
  "060": La memoria del proyecto guarda lo que los agentes aprenden por sí mismos. Vive en el repositorio del proyecto, se revisa y fusiona junto con el pull request de cada tarea, y se lee antes de empezar la siguiente.
  "061": Código abierto y autoalojamiento
  "062": Autoalojado. <span class="m">Tu código y tus datos te pertenecen.</span>
  "070": El código que escriben los agentes se basa en NocoBase Core
  "072": Prueba NocoBase Studio en línea
  "073": Abrir completo en una pestaña nueva
  "074": Ya iniciaste sesión con una cuenta de demostración. Todos los datos son ficticios, así que prueba lo que quieras.
  "075": NocoBase Studio es el espacio de trabajo de NocoBase. Reúne Claude Code, Codex y OpenCode de todos tus dispositivos en un equipo de agentes 24/7 que se encarga del desarrollo, las pruebas y la revisión siguiendo un proceso, mientras las personas envían solicitudes, siguen el avance y deciden desde computadora o móvil.
  "076": Empieza gratis
  "078": La edición Community es gratuita e incluye las funciones principales de Studio
  "079": Autoalojado en tus propios servidores, listo para redes aisladas
  "080": Compatible con Claude Code, Codex, OpenCode y más
  "081": Un equipo de agentes <span class="m">24/7.</span>
  "082": Conecta las herramientas de programación de laptops y servidores del equipo en un solo espacio de trabajo. Un agente coordinador asigna las tareas y los agentes trabajan en entornos aislados en varios proyectos las 24 horas.
  "083": Varios dispositivos, cualquier herramienta
  "084": Conecta Claude Code, Codex, OpenCode y más desde laptops y servidores sin dependencia de proveedores. Agrega equipos para ejecutar más trabajo en paralelo.
  "085": Asignación automática por especialidad
  "086": "Un agente coordinador asigna las tareas de diseño, desarrollo, pruebas y revisión según las fortalezas de cada agente: sin vigilar terminales, y las personas conservan la aprobación final."
  "087": Ejecuciones paralelas aisladas
  "088": Cada tarea se ejecuta en su propia rama, worktree y entorno de pruebas para que decenas de tareas avancen en paralelo sin interferir entre sí.
  "089": Colaboración y decisiones
  "090": Decisiones claras, <span class="m">en cualquier lugar.</span>
  "091": Los equipos de negocio envían solicitudes y aceptan entregas desde computadora o móvil con informes y entornos de pruebas en vivo, mientras el avance, el tiempo de ciclo y el gasto en modelos quedan visibles en todos los proyectos.
  "092": Solicitudes en lenguaje claro y aceptación directa
  "093": Describe tus necesidades en lenguaje cotidiano y responde aclaraciones rápidas. Cada entrega incluye un informe, una lista de verificación, capturas y un entorno de pruebas en vivo.
  "094": Listo en computadora y móvil
  "095": Añádelo a la pantalla de inicio de tu teléfono para enviar solicitudes, responder preguntas, revisar capturas y aprobar desde cualquier lugar con notificaciones al instante.
  "096": Avance, carga y gasto en un solo lugar
  "097": Las tareas, el contexto y las entregas de cada proyecto conviven en un mismo lugar, con paneles de rendimiento, tiempo de ciclo, retrabajo, carga de agentes y costo por tarea.
  "098": Proceso y calidad
  "099": Proceso estructurado, <span class="m">calidad en cada etapa.</span>
  "100": Desde la solicitud y el diseño hasta el desarrollo, las pruebas, la revisión, la aceptación y el lanzamiento, cada paso tiene responsables claros, controles y trazabilidad completa.
  "101": Flujo a la medida de cada proyecto
  "102": Flujos integrados que van de ligeros a estrictos, o personaliza los tuyos según tus estándares de ingeniería.
  "103": Pruebas y revisión entre modelos
  "104": Primero se ejecutan pruebas automáticas y luego otro proveedor de modelos revisa el código; si algo falla, vuelve automáticamente para corregirse.
  "105": Doble aprobación
  "106": Los responsables de negocio validan el funcionamiento en una vista previa en vivo mientras los líderes técnicos aprueban la arquitectura y la seguridad.
  "107": Planes de calidad y regresión
  "108": Ejecuta pruebas de regresión completas sobre funciones, permisos, seguridad, rendimiento y calidad del código antes de cada lanzamiento.
  "109": Lanzamiento aprobado y reversión
  "110": Los despliegues a producción requieren aprobación, admiten ventanas de lanzamiento y se revierten limpiamente a la última versión estable.
  "111": Roles claros
  "112": Los equipos de negocio lideran los requisitos y la aceptación; los líderes técnicos definen las reglas y aprueban los lanzamientos.
  "113": Los equipos de negocio expresan las reglas en lenguaje claro y validan con datos reales en un entorno de pruebas; las ramas, pruebas, revisiones y despliegues quedan a cargo de los agentes y Studio.
  "114": Conocimiento del equipo
  "115": "Convierte las prácticas del equipo en skills, guarda el material de negocio en la base de conocimiento y conserva lo que aprenden los agentes en la memoria del proyecto: nada se pierde cuando cambian las personas o los modelos."
  "116": Convierte estándares de desarrollo, listas de revisión y prácticas del equipo en skills a nivel global, de proyecto o de directorio, aplicadas automáticamente en cada ejecución.
  "117": Reúne políticas de negocio, reglas, especificaciones y plantillas en un solo lugar con análisis de archivos para que personas y agentes consulten la misma fuente de verdad.
  "118": Las lecciones que los agentes aprenden durante el desarrollo y las revisiones se guardan en el propio repositorio, se revisan en los PR y se leen antes de iniciar la siguiente tarea.
  "119": Ediciones y autoalojamiento
  "120": Empieza gratis con Community, <span class="m">escala a medida que crece tu equipo.</span>
  "121": Todas las ediciones son autoalojadas en tus propios servidores, incluso en redes aisladas. Empieza gratis con Community o sube de nivel con una licencia perpetua de pago único.
  "124": Para personas y equipos pequeños
  "125": Incluye tareas, equipos de agentes, runtimes, pruebas y revisión entre modelos, aceptación en vista previa, skills, base de conocimiento y memoria, aprobaciones móviles, registros de uso y permisos por rol.
  "126": Pro
  "127": Licencia de pago único
  "128": Para equipos con entregas continuas
  "129": Añade flujos con múltiples roles y doble aprobación, aprobación de despliegues, SSO empresarial (SAML, LDAP, Feishu, DingTalk, WeCom) y límites de presupuesto.
  "130": Comparar ediciones
  "131": Enterprise
  "132": Para varios equipos y sistemas críticos
  "133": Añade planes de calidad por proyecto, pruebas de regresión automáticas en cada lanzamiento, promociones entre entornos con ventanas de lanzamiento y periodos de congelación, y clúster de alta disponibilidad.
  "135": El código y los datos permanecen en tus servidores
  "136": Cualquier modelo o herramienta de programación, incluidos modelos locales
  "137": Las apps publicadas funcionan de forma independiente sin pasar por Studio
  "138": Leer la documentación de Studio
  "139": "Descubre la base detrás de Studio: NocoBase Core"
  "140": Ver las apps de código abierto creadas con NocoBase
