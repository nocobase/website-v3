notes: |-
  Français（vouvoiement）。? ! : ; 前的不换行空格由 build.py 自动加
  术语：foundation = socle（applicatif）；building blocks = briques；governance = gouvernance；agent team = équipe d’agents；
  coding agent = agent de code；business logic = logique métier；business systems = systèmes métier；vibe coding = vibe coding；
  self-hosted = auto-hébergé；make the call = trancher；at a glance = en un coup d’œil；people = les humains
  页面用语：issue = tâche；coordinator agent = agent coordinateur；sign-off = validation；My sessions 等产品界面名称照英文
title: NocoBase Studio — Les agents font avancer le travail. Votre équipe garde la maîtrise.
description: NocoBase Studio est l’espace de travail de NocoBase. Transformez Claude Code, Codex et OpenCode répartis sur vos appareils en une équipe d’agents active 24h/24 qui développe, teste et relit selon vos processus, pendant que les humains pilotent et décident depuis un ordinateur ou un mobile.
strings:
  "000": Les agents font avancer le travail. <span class="m">Votre équipe garde la maîtrise.</span>
  "002": Essayer en ligne
  "004": Sur vos propres serveurs
  "005": Compatible avec Claude Code, Codex et des dizaines d’autres outils de code
  "006": Inclus dans les éditions commerciales
  "007": Équipe d’agents
  "008": Une équipe d’agents <span class="m">qui fait avancer le travail.</span>
  "009": Studio connecte des agents répartis sur de nombreuses machines et les pilote depuis un seul endroit. Ils font avancer de nombreux projets et tâches en parallèle, jour et nuit.
  "010": Des agents sur de nombreuses machines
  "011": "Connectez Claude Code, Codex et d’autres agents installés sur les ordinateurs et les serveurs de votre équipe : Studio détecte les outils de code et les modèles qui y sont connectés. Indiquez le point fort de chaque agent, activez-le, et il rejoint l’équipe d’agents."
  "012": Un coordinateur répartit le travail
  "013": Un agent coordinateur répartit conception, développement, tests et revue selon les points forts de chaque agent. Il n’écrit pas de code et ne fusionne rien ; la validation revient toujours à un humain.
  "014": Plusieurs tâches à la fois
  "015": "Chaque tâche a sa propre branche et chaque exécution travaille dans un worktree séparé : de nombreuses tâches avancent en même temps sans se gêner. Ajoutez des machines pour en mener davantage en parallèle."
  "016": My sessions
  "017": Dans Studio, échangez avec l’agent de votre propre ordinateur pour discuter et clarifier les besoins, consigner des tâches et suivre leur avancement. Dès qu’une tâche démarre, l’agent coordinateur met l’équipe d’agents au travail.
  "018": Avancement
  "019": L’avancement <span class="m">en un coup d’œil.</span>
  "020": "Avancement des projets, activité des tâches, charge des agents et consommation des modèles : tout est visible. Vous voyez en un coup d’œil où en est chaque tâche et ce qui suit."
  "021": Avancement des projets
  "022": L’avancement de chaque projet, ainsi que les tâches terminées, le temps de cycle, la part réalisée par les agents et le coût par tâche, comparés à la période précédente.
  "023": Activité des tâches
  "024": "En haut de chaque tâche : l’étape en cours, l’agent qui s’en occupe et la suite."
  "025": Charge des agents et consommation des modèles
  "026": Voyez sur quelles tâches travaillent les agents de chaque machine, et combien de tokens chaque modèle a consommés, pour quel coût.
  "027": Décisions
  "028": Des décisions <span class="m">fondées sur des preuves.</span>
  "030": Rapport et checklist
  "031": Chaque livraison indique ce qui a changé et comment cela a été vérifié, avec une checklist de validation point par point.
  "032": Captures et aperçus
  "033": Chaque scénario est accompagné de captures d’écran, et si vous voulez essayer vous-même, un environnement d’aperçu dédié est prêt.
  "034": Valider ou renvoyer
  "035": Preuves à l’appui, validez le travail ou renvoyez-le. Indiquez pourquoi, et les agents reprennent à partir de là.
  "036": Experts métier
  "037": Les experts métier qui ne codent pas peuvent trancher.
  "038": Les experts métier décrivent leur besoin avec leurs propres mots, répondent aux questions des agents et vérifient le résultat dans un aperçu avec de vraies données. Environnements, branches, tests et mises en production sont pris en charge par les agents et Studio.
  "039": Les responsables techniques fixent les règles et approuvent les mises en production. Les experts métier portent les besoins et la validation.
  "040": Avant qu’un travail n’arrive à un humain, Studio orchestre contrôles et revues.
  "041": "Chaque modification suit le même parcours : elle n’arrive à un humain qu’après avoir passé les tests et la revue de code, et n’atteint la production qu’avec l’accord d’un humain. En cas de problème, on revient en arrière."
  "042": Branche et worktree
  "043": Chaque tâche a sa propre branche et chaque exécution travaille dans un worktree séparé. Les pull requests de cette branche sont liées à la tâche.
  "044": Tests et revue
  "045": La CI exécute les contrôles et les tests, puis un autre modèle relit le code, d’un autre fournisseur quand c’est possible.
  "046": Aperçu
  "047": Si besoin, une pull request dispose de son propre environnement d’aperçu, où un humain peut tester et valider.
  "048": Fusion et mise en production
  "049": Fusion après validation ; la tâche est terminée une fois toutes ses pull requests fusionnées. Toute mise en production doit être approuvée par un humain.
  "050": Retour arrière
  "051": En cas de problème, revenez à la version précédente.
  "053": Le savoir-faire <span class="m">reste dans l’équipe.</span>
  "054": "Contexte des besoins, documents métier et retours d’expérience restent éparpillés dans des conversations, sur différents ordinateurs. Quand les personnes ou les agents changent, on ne les retrouve plus. Studio capitalise méthodes et expérience dans les skills, la base de connaissances et la mémoire de projet : une nouvelle personne ou un nouvel agent reprend là où le précédent s’était arrêté."
  "055": Skills
  "056": "Les skills conservent les méthodes. Décrivez comment vous clarifiez, développez, relisez et livrez, au niveau global, du projet ou du répertoire de travail : chaque exécution les applique."
  "057": Base de connaissances
  "058": La base de connaissances conserve les documents métier. Besoins, règles métier, modèles de contrat et autres documents sont rédigés ou déposés par les humains, et les agents les consultent en travaillant.
  "059": Mémoire de projet
  "060": La mémoire de projet conserve ce que les agents apprennent d’eux-mêmes. Elle vit dans le dépôt du projet, est relue et fusionnée avec la pull request de chaque tâche, et lue avant de commencer la suivante.
  "061": Open source et auto-hébergement
  "062": Auto-hébergé. <span class="m">Votre code et vos données vous appartiennent.</span>
  "070": Le code écrit par les agents repose sur NocoBase Core
  "072": Essayer NocoBase Studio en ligne
  "073": Ouvrir en plein écran dans un nouvel onglet
  "074": "Vous êtes connecté à un compte de démo. Toutes les données sont fictives : essayez tout ce que vous voulez."
  "075": NocoBase Studio est l’espace de travail de NocoBase. Il réunit Claude Code, Codex et OpenCode répartis sur vos appareils en une équipe d’agents active 24h/24 qui gère développement, tests et revue selon vos processus, pendant que les humains soumettent leurs demandes, suivent l’avancement et décident sur ordinateur ou mobile.
  "076": Commencer gratuitement
  "078": L’édition Community est gratuite et inclut l’essentiel de Studio
  "079": Auto-hébergé sur vos serveurs, compatible hors ligne
  "080": Compatible avec Claude Code, Codex, OpenCode et bien d’autres
  "081": Une équipe d’agents <span class="m">active 24h/24.</span>
  "082": Connectez les outils de code de vos ordinateurs portables et serveurs d’équipe dans un même espace de travail. Un agent coordinateur répartit le travail et les agents s’exécutent 24h/24 dans des environnements isolés sur plusieurs projets.
  "083": Plusieurs machines, tous vos outils de code
  "084": Connectez Claude Code, Codex, OpenCode et d’autres outils sur vos ordinateurs et serveurs, sans dépendance fournisseur. Ajoutez des machines pour mener davantage de tâches en parallèle.
  "085": Répartition automatique selon les spécialités
  "086": "Un agent coordinateur répartit conception, développement, tests et revue selon les points forts de chaque agent : plus besoin de surveiller des terminaux, tandis que les humains gardent la validation finale."
  "087": Exécutions parallèles et isolées
  "088": "Chaque tâche tourne dans sa propre branche, son propre worktree et son propre environnement de test : des dizaines de tâches avancent en parallèle sans jamais se gêner."
  "089": Collaboration et décisions
  "090": Des décisions éclairées, <span class="m">où que vous soyez.</span>
  "091": Les équipes métier soumettent leurs demandes et valident les livraisons sur ordinateur ou mobile grâce aux rapports de livraison et environnements de test interactifs, tandis que l’avancement, les délais de cycle et les coûts des modèles restent visibles sur tous vos projets.
  "092": Demandes en langage clair et validation directe
  "093": Décrivez vos besoins en langage naturel et répondez aux questions de précision. Chaque livraison s’accompagne d’un rapport, d’une checklist, de captures d’écran et d’un environnement de test interactif.
  "094": Disponible sur ordinateur et mobile
  "095": Ajoutez Studio à l’écran d’accueil de votre téléphone pour soumettre des demandes, répondre aux questions, consulter les captures d’écran et approuver de partout grâce aux notifications instantanées.
  "096": Avancement, charge et coûts en un coup d’œil
  "097": Les tâches, le contexte et les livraisons de chaque projet sont réunis au même endroit, avec des tableaux de bord dédiés au débit, au temps de cycle, au taux de reprise, à la charge des agents et au coût par tâche.
  "098": Processus et qualité
  "099": Des processus structurés, <span class="m">la qualité à chaque étape.</span>
  "100": De la demande et la conception au développement, aux tests, à la revue, à la validation et à la mise en production, chaque étape définit clairement ses responsables, ses contrôles et une traçabilité complète.
  "101": Un workflow adapté à chaque projet
  "102": Des workflows intégrés du plus léger au plus strict, ou entièrement personnalisables selon vos standards d’ingénierie.
  "103": Tests et revue croisée multi-modèles
  "104": Les tests automatisés s’exécutent en premier, suivis d’une revue de code par le modèle d’un autre fournisseur ; en cas d’échec, les corrections repartent automatiquement.
  "105": Double validation
  "106": Les équipes métier vérifient le comportement dans un aperçu interactif tandis que les responsables techniques valident l’architecture et la sécurité.
  "107": Plans qualité et non-régression
  "108": Lancez des tests de non-régression complets sur les fonctionnalités, les permissions, la sécurité, les performances et la qualité du code avant chaque mise en production.
  "109": Mise en production approuvée et retour arrière
  "110": Les déploiements en production nécessitent une approbation, respectent vos fenêtres de mise en production et reviennent proprement à la dernière version stable en cas de problème.
  "111": Rôles clairement définis
  "112": Les équipes métier portent les besoins et la validation ; les responsables techniques définissent les règles et approuvent les mises en production.
  "113": Les équipes métier énoncent leurs règles en langage clair et vérifient sur de vraies données dans un environnement de test ; branches, tests, revues et déploiements sont pris en charge par les agents et Studio.
  "114": Savoir-faire d’équipe
  "115": "Capitalisez les pratiques de l’équipe dans les skills, les documents métier dans la base de connaissances et ce que les agents apprennent dans la mémoire de projet : rien ne se perd quand les personnes ou les modèles changent."
  "116": Transformez vos standards de développement, checklists de revue et habitudes d’équipe en skills appliquées automatiquement à chaque exécution, au niveau global, du projet ou du répertoire.
  "117": Centralisez procédures, règles métier, spécifications et modèles avec analyse de fichiers, pour que les humains et les agents travaillent sur la même source de vérité.
  "118": Les enseignements tirés par les agents lors du développement et des revues sont enregistrés dans le dépôt, relus dans les PR et consultés avant la tâche suivante.
  "119": Éditions et auto-hébergement
  "120": Démarrez gratuitement avec Community, <span class="m">évoluez avec votre équipe.</span>
  "121": Toutes les éditions s’auto-hébergent sur vos propres serveurs, y compris sur des réseaux sans accès à Internet. Démarrez gratuitement avec Community, ou passez à une licence perpétuelle en paiement unique.
  "124": Pour les particuliers et petites équipes
  "125": Inclut tâches, équipes d’agents, runtimes, tests et revue croisée multi-modèles, validation sur aperçu, skills/base de connaissances/mémoire, approbations mobiles, journaux d’utilisation et permissions par rôle.
  "126": Pro
  "127": Paiement unique
  "128": Pour les équipes qui livrent en continu
  "129": Ajoute les workflows multi-rôles avec double validation, l’approbation des déploiements, le SSO d’entreprise (SAML/LDAP/Feishu/DingTalk/WeCom) et les plafonds budgétaires.
  "130": Comparer les éditions
  "131": Enterprise
  "132": Pour le multi-équipes et les systèmes critiques
  "133": Ajoute les plans qualité par projet, les tests de non-régression automatisés avant mise en production, les promotions multi-environnements avec fenêtres de mise en production et périodes de gel, ainsi que le cluster haute disponibilité.
  "135": Code et données restent sur vos serveurs
  "136": Tout modèle ou outil de code, modèles locaux compris
  "137": Les applications publiées tournent seules, sans que les requêtes passent par Studio
  "138": Lire la documentation Studio
  "139": "Découvrir le socle derrière Studio : NocoBase Core"
  "140": Découvrir les applications open source bâties sur NocoBase
  "163": NocoBase Studio
