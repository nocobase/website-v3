notes: |-
  日本語（見出しは常体、本文は敬体）
  用語：foundation = 基盤；building blocks = 共通機能；governance = ガバナンス；agent team = エージェントチーム；
  coding agent = コーディングエージェント；business logic = 業務ロジック；business systems = 業務システム；
  vibe coding = バイブコーディング；self-hosted = セルフホスト；at a glance = ひと目でわかる；make the call = 判断する
  ページ用語：issue = タスク；coordinator agent = コーディネーターエージェント；sign-off = 検収；My sessions など製品画面の名称は英語のまま
title: NocoBase Studio — エージェントが自律的に推進し、チームが全体を掌握する
description: NocoBase Studio は NocoBase のワークスペースです。複数デバイス上の Claude Code、Codex、OpenCode を 24 時間稼働するエージェントチームにまとめ、プロセスに沿って開発・テスト・レビューを自律的に進めます。人は PC やスマートフォンから要件を伝え、進捗を確認し、判断を下します。
strings:
  "000": エージェントが自律的に推進し、<span class="m">チームが全体を掌握する。</span>
  "002": オンラインで試す
  "004": 自社サーバーで稼働
  "005": Claude Code、Codex など数十種類のコーディングツールに対応
  "006": 商用版で提供
  "007": エージェントチーム
  "008": 止まらずに進む<span class="m">エージェントチーム。</span>
  "009": Studio は複数のマシン上のエージェントを接続して一元的に割り振り、24 時間体制で多数のプロジェクトとタスクを並行して進めます。
  "010": 複数マシンのエージェントを接続
  "011": 個人の PC やチームのサーバー上の Claude Code、Codex などを接続すると、Studio がログイン済みのコーディングツールとモデルを自動で認識します。各エージェントの得意分野を書いて有効にすれば、エージェントチームに加わります。
  "012": コーディネーターが仕事を割り振る
  "013": コーディネーターエージェントが、各エージェントの得意分野に応じて設計、開発、テスト、レビューを割り振ります。自らはコードを書かず、マージもしません。検収は常に人が行います。
  "014": 複数のタスクを同時に進める
  "015": タスクごとに専用のブランチで開発し、実行のたびに独立した worktree を使うため、複数のタスクを互いに干渉させずに同時に進められます。マシンを増やすほど、並行して進められるタスクも増えます。
  "016": My sessions
  "017": Studio から自分の PC 上のエージェントと対話し、要件を相談・明確化して、タスクを記録し、進捗を追います。タスクが始まると、コーディネーターエージェントがエージェントチームに開発を割り振ります。
  "018": 進捗
  "019": すべての進捗が<span class="m">ひと目でわかる。</span>
  "020": プロジェクトの進捗、タスクの進行状況、エージェントの稼働状況、モデルの使用量まで、すべて可視化されます。各タスクがどこまで進み、次に何をするのかがひと目でわかります。
  "021": プロジェクトの進捗
  "022": 各プロジェクトの進捗に加え、完了タスク数、サイクルタイム、エージェントによる完了の割合、タスクあたりのコストを前期間と比較します。
  "023": タスクの進行状況
  "024": 各タスクの最上部に、今どのステップか、どのエージェントが担当しているか、次に何をするかが表示されます。
  "025": エージェントの稼働状況とモデルの使用量
  "026": 各マシンのエージェントがどのタスクを進めているか、各モデルがどれだけトークンを使い、いくらかかったかをいつでも確認できます。
  "027": 意思決定
  "028": 根拠にもとづいて<span class="m">判断できる。</span>
  "030": レポートとチェックリスト
  "031": 引き渡しのたびに、何を変更し、どう検証したかを明記し、項目ごとの検収チェックリストを添えます。
  "032": スクリーンショットとプレビュー
  "033": シナリオごとにスクリーンショットを添付。自分で試したいときは、独立したプレビュー環境を開けます。
  "034": 承認か差し戻し
  "035": 根拠を確認して、承認するか差し戻します。差し戻すときは理由を書けば、エージェントがそこから修正を続けます。
  "036": 業務の専門家
  "037": コードを書かない業務の専門家でも、その場で判断できる。
  "038": 業務の専門家は業務の言葉で要件を伝え、エージェントの質問に答え、実データを使ったプレビューで検収します。環境、ブランチ、テスト、リリースはエージェントと Studio が引き受けます。
  "039": 技術責任者はルールを決めてリリースを承認し、業務の専門家は要件を決めて検収を担います。
  "040": 人の手に渡る前に、Studio がチェックとレビューを取りまとめる。
  "041": すべての変更は同じ流れをたどります。テストとコードレビューを通過して初めて人が検収し、人が承認して初めて本番にリリースされます。問題があればロールバックできます。
  "042": ブランチと worktree
  "043": タスクごとに専用のブランチがあり、実行のたびに独立した worktree で作業します。そのブランチの PR は自動的にタスクにひも付きます。
  "044": テストとレビュー
  "045": CI がチェックとテストを実行し、続いて別のモデルがコードをレビューします。可能なら別ベンダーのモデルを使います。
  "046": プレビュー
  "047": 必要に応じて PR ごとに独立したプレビュー環境を立ち上げ、人が試して検収します。
  "048": マージとリリース
  "049": 検収後にマージされ、タスクのすべての PR がマージされるとタスクは自動で完了します。本番へのリリースは人が承認します。
  "050": ロールバック
  "051": 問題があれば、前のバージョンに戻せます。
  "053": 方法・経験・知識が<span class="m">チームに蓄積される。</span>
  "054": 要件の背景、業務資料、プロジェクトの経験が、別々の PC の別々の会話に散らばり、担当者やエージェントが変わると見つけられなくなります。Studio はスキル、ナレッジベース、プロジェクトメモリーに方法と経験を蓄積し、担当者やエージェントが変わってもスムーズに引き継げます。
  "055": スキル
  "056": スキルには仕事の進め方を保存します。要件の明確化、開発、レビュー、リリースのやり方をスキルとして書き、グローバル、プロジェクト、作業ディレクトリの 3 段階で管理します。毎回の実行に自動で適用されます。
  "057": ナレッジベース
  "058": ナレッジベースには業務資料を保存します。要件定義書、業務ルール、契約書テンプレートなどを人が作成・アップロードし、エージェントは作業中に直接参照します。
  "059": プロジェクトメモリー
  "060": プロジェクトメモリーには、エージェントが自ら学んだ経験を保存します。プロジェクトのリポジトリに置かれ、タスクの PR と一緒にレビュー・マージされ、次の作業を始める前に読み込まれます。
  "061": オープンソースとセルフホスト
  "062": セルフホスト。<span class="m">コードとデータは自社のもの。</span>
  "070": エージェントが書くコードは NocoBase Core の上に構築
  "072": NocoBase Studio をオンラインで試す
  "073": 新しいタブで全画面表示
  "074": デモアカウントでログイン済みです。データはすべて架空のものなので、自由に操作してください。
  "075": NocoBase Studio は NocoBase のワークスペースです。複数デバイス上の Claude Code、Codex、OpenCode を 24 時間稼働するひとつのエージェントチームにまとめ、プロセスに沿って開発・テスト・レビューを自律的に進めます。人は PC やスマートフォンから要件を伝え、進捗を確認し、判断を下します。
  "076": 無料で始める
  "078": Community エディションは無料、Studio の基本機能を標準搭載
  "079": 自社サーバーでセルフホスト、閉域網にも対応
  "080": Claude Code、Codex、OpenCode などに対応
  "081": 24 時間稼働する<span class="m">エージェントチーム。</span>
  "082": 個人の PC やチームサーバー上のコーディングツールをひとつのワークスペースに統合します。コーディネーターエージェントが仕事を割り振り、各エージェントが隔離された環境で 24 時間体制で複数プロジェクトを並行推進します。
  "083": 複数デバイス・多彩なツールを一元接続
  "084": PC やサーバー上の Claude Code、Codex、OpenCode などを特定ベンダーに縛られず接続できます。マシンを追加するほど、並行して進められる作業も増えます。
  "085": 得意分野に応じた自動割り振り
  "086": コーディネーターエージェントが各エージェントの得意分野に応じて設計、開発、テスト、レビューを割り振ります。ターミナルに張り付く必要はなく、最終的な検収は常に人が担います。
  "087": 隔離された環境での並行実行
  "088": タスクごとに専用のブランチ、worktree、テスト環境が用意されるため、数十のタスクを互いに干渉させずに並行して進められます。
  "089": 協働と意思決定
  "090": どこからでも、<span class="m">根拠にもとづいて判断。</span>
  "091": 業務担当者は PC やスマートフォンから直接要件を伝え、納品レポートと操作可能なテスト環境を確認して自ら検収できます。複数プロジェクトの進捗、サイクルタイム、モデル利用コストもひと目でわかります。
  "092": 自然な言葉で依頼し、その場で検収
  "093": 業務の言葉で要件を伝え、エージェントの確認質問に答えるだけです。納品ごとにレポート、チェックリスト、スクリーンショット、操作可能なテスト環境が添えられます。
  "094": PC でもスマートフォンでもすぐに利用
  "095": スマートフォンのホーム画面に追加すれば、外出先からでも依頼、質問への回答、スクリーンショットの確認、検収・承認が行えます。判断が必要なときは即座に通知が届きます。
  "096": 進捗、稼働状況、コストを一か所で把握
  "097": すべてのプロジェクトのタスク、議論の経緯、納品物を一元管理します。完了タスク数、サイクルタイム、手戻り率、エージェントの負荷、タスクあたりのコストをダッシュボードで可視化します。
  "098": プロセスと品質管理
  "099": 体系的なプロセスで、<span class="m">あらゆる関門の品質を守る。</span>
  "100": 要件定義、設計、開発、テスト、レビュー、検収、リリースまで、すべての工程で責任範囲と通過基準を明確にし、完全な証跡を残します。
  "101": プロジェクトに合ったワークフロー
  "102": 軽量なものから厳格なものまで複数のワークフローを標準搭載しており、開発規約に合わせて独自にカスタマイズすることもできます。
  "103": 自動テストとクロスモデルレビュー
  "104": まず自動テストを実行し、続いて別ベンダーのモデルがコードをレビューします。不合格の場合は自動で修正・再テストへ差し戻されます。
  "105": 業務と技術のダブル検収
  "106": 業務担当者がプレビュー環境で実動作を検証し、技術責任者がアーキテクチャと安全性を検収する二段構えで品質を担保します。
  "107": 品質計画とリグレッションテスト
  "108": リリースのたびに、機能、権限、セキュリティ、パフォーマンス、コード品質にわたる包括的なリグレッションテストを実行します。
  "109": 承認制リリースとロールバック
  "110": 本番デプロイには承認者の承認が必須で、リリースウィンドウにも対応。問題が起きても直前の安定バージョンへ確実にロールバックできます。
  "111": 明確な役割分担
  "112": 業務担当者は要件と検収を担い、技術責任者はルールとリリース承認を担う。
  "113": 業務担当者は業務の言葉でルールを伝え、テスト環境で実データを使って検収するだけです。ブランチ管理、テスト、レビュー、デプロイはエージェントと Studio が引き受けます。
  "114": チームの資産
  "115": チームの仕事の進め方はスキルに、業務資料はナレッジベースに、エージェントが学んだ経験はプロジェクトメモリーに蓄積します。担当者やモデルが変わってもノウハウが失われません。
  "116": 開発規約、レビュー基準、チームの仕事の進め方をスキルとしてまとめ、グローバル・プロジェクト・ディレクトリの 3 階層で管理します。実行のたびに自動で適用されます。
  "117": 業務規程、ルール、仕様書、テンプレートを一元管理し、ファイル解析にも対応。人とエージェントが同じ最新情報を参照できます。
  "118": 開発やレビューの過程でエージェントが学んだ知見はリポジトリにそのまま記録され、PR でレビューされたうえで次のタスク開始前に読み込まれます。
  "119": エディションとセルフホスト
  "120": Community 版で無料で始めて、<span class="m">チームの成長に合わせて拡張。</span>
  "121": すべてのエディションが閉域網を含む自社サーバーでのセルフホストに対応しています。Community 版で無料で始め、必要に応じて買い切りの永久ライセンスへアップグレードできます。
  "124": 個人・小規模チーム向け
  "125": タスク管理、エージェントチーム、Runtimes、自動テストとクロスモデルレビュー、プレビュー検収、スキル・ナレッジベース・プロジェクトメモリー、モバイル承認、利用ログ、ロール権限を含みます。
  "126": Pro
  "127": 買い切りライセンス
  "128": 継続的に開発・納品するチーム向け
  "129": ダブル検収付きの複数ロールワークフロー、デプロイ承認、エンタープライズ SSO（SAML・LDAP・Feishu・DingTalk・WeCom）、予算上限管理を追加します。
  "130": エディションを比較
  "131": Enterprise
  "132": 複数チームと基幹業務向け
  "133": プロジェクト単位の品質計画、リリース前の自動リグレッションテスト、リリースウィンドウや凍結期間を備えた環境間プロモーション、クラスタ高可用性を追加します。
  "135": コードとデータはすべて自社サーバー内に保管
  "136": ローカルモデルを含め、モデルもコーディングツールも自由に選択
  "137": リリース後のアプリは独立稼働し、リクエストは Studio を経由しない
  "138": Studio ドキュメントを読む
  "139": Studio を支える基盤を見る：NocoBase Core
  "140": NocoBase で構築されたオープンソースアプリを見る
