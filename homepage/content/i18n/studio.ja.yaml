notes: |-
  日本語（見出しは常体、本文は敬体）
  用語：foundation = 基盤；building blocks = 共通機能；governance = ガバナンス；agent team = エージェントチーム；
  coding agent = コーディングエージェント；business logic = 業務ロジック；business systems = 業務システム；
  vibe coding = バイブコーディング；self-hosted = セルフホスト；at a glance = ひと目でわかる；make the call = 判断する
  ページ用語：issue = タスク；coordinator agent = コーディネーターエージェント；sign-off = 検収；My sessions など製品画面の名称は英語のまま
title: NocoBase Studio — エージェントが自律的に推進し、チームが全体を掌握する
description: NocoBase Studio は、人とエージェントが協働開発するためのガバナンスプラットフォームです。Claude Code、Codex、OpenCode をひとつのエージェントチームにまとめ、タスクを自律的に進めます。進捗はひと目でわかり、重要な判断は人が下します。
strings:
  "000": エージェントが自律的に推進し、<span class="m">チームが全体を掌握する。</span>
  "002": オンラインで試す
  "004": 自社サーバーで稼働
  "005": Claude Code、Codex など数十種類のコーディングツールに対応
  "006": 商用版で提供
  "007": エージェントチーム
  "008": 止まらずに進む<span class="m">エージェントチーム。</span>
  "009": Studio は複数のマシン上のエージェントを接続して一元的に割り振り、24 時間体制で多数のプロジェクトとタスクを並行して進めます。
  "010": 複数マシンのエージェントを接続
  "011": 個人の PC やチームのサーバー上の Claude Code、Codex などを接続すると、Studio がログイン済みのコーディングツールとモデルを自動で認識します。各エージェントの得意分野を書いて有効にすれば、エージェントチームに加わります。
  "012": コーディネーターが仕事を割り振る
  "013": コーディネーターエージェントが、各エージェントの得意分野に応じて設計、開発、テスト、レビューを割り振ります。自らはコードを書かず、マージもしません。検収は常に人が行います。
  "014": 複数のタスクを同時に進める
  "015": タスクごとに専用のブランチで開発し、実行のたびに独立した worktree を使うため、複数のタスクを互いに干渉させずに同時に進められます。マシンを増やすほど、並行して進められるタスクも増えます。
  "016": My sessions
  "017": Studio から自分の PC 上のエージェントと対話し、要件を相談・明確化して、タスクを記録し、進捗を追います。タスクが始まると、コーディネーターエージェントがエージェントチームに開発を割り振ります。
  "018": 進捗
  "019": すべての進捗が<span class="m">ひと目でわかる。</span>
  "020": プロジェクトの進捗、タスクの進行状況、エージェントの稼働状況、モデルの使用量まで、すべて可視化されます。各タスクがどこまで進み、次に何をするのかがひと目でわかります。
  "021": プロジェクトの進捗
  "022": 各プロジェクトの進捗に加え、完了タスク数、サイクルタイム、エージェントによる完了の割合、タスクあたりのコストを前期間と比較します。
  "023": タスクの進行状況
  "024": 各タスクの最上部に、今どのステップか、どのエージェントが担当しているか、次に何をするかが表示されます。
  "025": エージェントの稼働状況とモデルの使用量
  "026": 各マシンのエージェントがどのタスクを進めているか、各モデルがどれだけトークンを使い、いくらかかったかをいつでも確認できます。
  "027": 意思決定
  "028": 根拠にもとづいて<span class="m">判断できる。</span>
  "030": レポートとチェックリスト
  "031": 引き渡しのたびに、何を変更し、どう検証したかを明記し、項目ごとの検収チェックリストを添えます。
  "032": スクリーンショットとプレビュー
  "033": シナリオごとにスクリーンショットを添付。自分で試したいときは、独立したプレビュー環境を開けます。
  "034": 承認か差し戻し
  "035": 根拠を確認して、承認するか差し戻します。差し戻すときは理由を書けば、エージェントがそこから修正を続けます。
  "036": 業務の専門家
  "037": コードを書かない業務の専門家でも、その場で判断できる。
  "038": 業務の専門家は業務の言葉で要件を伝え、エージェントの質問に答え、実データを使ったプレビューで検収します。環境、ブランチ、テスト、リリースはエージェントと Studio が引き受けます。
  "039": 技術責任者はルールを決めてリリースを承認し、業務の専門家は要件を決めて検収を担います。
  "040": 人の手に渡る前に、Studio がチェックとレビューを取りまとめる。
  "041": すべての変更は同じ流れをたどります。テストとコードレビューを通過して初めて人が検収し、人が承認して初めて本番にリリースされます。問題があればロールバックできます。
  "042": ブランチと worktree
  "043": タスクごとに専用のブランチがあり、実行のたびに独立した worktree で作業します。そのブランチの PR は自動的にタスクにひも付きます。
  "044": テストとレビュー
  "045": CI がチェックとテストを実行し、続いて別のモデルがコードをレビューします。可能なら別ベンダーのモデルを使います。
  "046": プレビュー
  "047": 必要に応じて PR ごとに独立したプレビュー環境を立ち上げ、人が試して検収します。
  "048": マージとリリース
  "049": 検収後にマージされ、タスクのすべての PR がマージされるとタスクは自動で完了します。本番へのリリースは人が承認します。
  "050": ロールバック
  "051": 問題があれば、前のバージョンに戻せます。
  "053": 方法・経験・知識が<span class="m">チームに蓄積される。</span>
  "054": 要件の背景、業務資料、プロジェクトの経験が、別々の PC の別々の会話に散らばり、担当者やエージェントが変わると見つけられなくなります。Studio はスキル、ナレッジベース、プロジェクトメモリーに方法と経験を蓄積し、担当者やエージェントが変わってもスムーズに引き継げます。
  "055": スキル
  "056": スキルには仕事の進め方を保存します。要件の明確化、開発、レビュー、リリースのやり方をスキルとして書き、グローバル、プロジェクト、作業ディレクトリの 3 段階で管理します。毎回の実行に自動で適用されます。
  "057": ナレッジベース
  "058": ナレッジベースには業務資料を保存します。要件定義書、業務ルール、契約書テンプレートなどを人が作成・アップロードし、エージェントは作業中に直接参照します。
  "059": プロジェクトメモリー
  "060": プロジェクトメモリーには、エージェントが自ら学んだ経験を保存します。プロジェクトのリポジトリに置かれ、タスクの PR と一緒にレビュー・マージされ、次の作業を始める前に読み込まれます。
  "061": オープンソースとセルフホスト
  "062": セルフホスト。<span class="m">コードとデータは自社のもの。</span>
  "070": エージェントが書くコードは NocoBase Core の上に構築
  "072": NocoBase Studio をオンラインで試す
  "073": 新しいタブで全画面表示
  "074": デモアカウントでログイン済みです。データはすべて架空のものなので、自由に操作してください。
