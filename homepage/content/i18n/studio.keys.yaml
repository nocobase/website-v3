    zh: 团队资产
    where: memory
  "115":
    en: Put team practices into skills, keep business material in the knowledge base, and save what agents learn in project memory—nothing gets lost when people or models change.
    zh: 做事的方法放进技能，业务资料放进知识库，Agent 平时学到的经验记在项目记忆里。不再散落在个人电脑的会话中，换人、换模型都能接着往下做。
    where: memory
  "116":
    en: Turn development standards, review checklists, and team habits into skills scoped globally, per project, or per directory—applied automatically on every run.
    zh: 把开发规范、评审标准和做事方法做成技能，按全局、项目、工作目录三级生效，每次运行自动带上。
    where: memory
  "117":
    en: Keep business policies, rules, specs, and templates in one place with file parsing so both people and agents read the same source of truth.
    zh: 业务制度、规则、需求说明和合同模板集中管理，支持上传解析，供人和 Agent 工作时直接查阅。
    where: memory
  "118":
