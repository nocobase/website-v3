  "113":
    en: Business teams state rules in plain language and verify with real data in a test environment—branches, tests, reviews, and deploys are handled by agents and Studio.
    zh: 业务人员不用懂代码，用业务语言说清规则、回答 Agent 追问，在测试环境里用真实数据验收；分支、测试、评审与部署由 Agent 和工作台承担。
    where: process
  "114":
