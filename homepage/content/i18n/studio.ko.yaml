notes: |-
  한국어（제목은 명사형·해라체, 본문은 합니다체）
  용어：foundation = 기반；building blocks = 기본 기능；governance = 거버넌스；agent team = 에이전트 팀；
  coding agent = 코딩 에이전트；business logic = 비즈니스 로직；business systems = 비즈니스 시스템；
  vibe coding = 바이브 코딩；self-hosted = 셀프 호스팅；at a glance = 한눈에
  페이지 용어：issue = 작업；coordinator agent = 코디네이터 에이전트；sign-off = 검수；My sessions 등 제품 화면 이름은 영어 그대로
title: NocoBase Studio — 에이전트는 스스로 추진하고, 팀은 전체를 장악한다
description: NocoBase Studio는 NocoBase의 워크스페이스입니다. 여러 기기의 Claude Code, Codex, OpenCode를 24시간 일하는 에이전트 팀으로 묶어 프로세스에 따라 개발, 테스트, 리뷰를 진행하며, 사람은 PC나 모바일에서 방향을 잡고 의사 결정을 내립니다.
strings:
  "000": 에이전트는 스스로 추진하고, <span class="m">팀은 전체를 장악한다.</span>
  "002": 온라인 체험
  "004": 기업의 자체 서버에 배포
  "005": Claude Code, Codex 등 수십 가지 코딩 도구 지원
  "006": 상용 에디션에서 제공
  "007": 에이전트 팀
  "008": 쉬지 않고 일을 진행하는 <span class="m">에이전트 팀.</span>
  "009": Studio는 여러 머신의 에이전트를 연결해 중앙에서 배정하고, 24시간 여러 프로젝트와 수많은 작업을 동시에 진행합니다.
  "010": 여러 머신의 에이전트 연결
  "011": 개인 컴퓨터와 팀 서버의 Claude Code, Codex 등을 연결하면 Studio가 로그인된 코딩 도구와 모델을 자동으로 인식합니다. 에이전트마다 잘하는 일을 적고 활성화하면 에이전트 팀에 합류합니다.
  "012": 코디네이터가 업무 배정
  "013": 코디네이터 에이전트가 에이전트별 강점에 따라 설계, 개발, 테스트, 리뷰를 배정합니다. 직접 코드를 작성하거나 병합하지 않으며, 검수는 항상 사람이 합니다.
  "014": 여러 작업을 동시에
  "015": 작업마다 자체 브랜치에서 개발하고, 실행할 때마다 독립된 worktree를 사용하므로 여러 작업이 서로 간섭 없이 동시에 진행됩니다. 머신이 많을수록 동시에 진행할 수 있는 작업도 늘어납니다.
  "016": My sessions
  "017": Studio에서 내 컴퓨터의 에이전트와 대화하며 요구사항을 논의하고 구체화하고, 작업을 기록하고, 진행 상황을 확인합니다. 작업이 시작되면 코디네이터 에이전트가 에이전트 팀에 개발을 맡깁니다.
  "018": 진행 상황
  "019": 모든 진행 상황을 <span class="m">한눈에.</span>
  "020": 프로젝트 진행 상황, 작업 진행 과정, 에이전트 작업량, 모델 사용량이 모두 선명하게 보입니다. 작업마다 어디까지 왔고 다음에 무엇을 할지 한눈에 알 수 있습니다.
  "021": 프로젝트 진행 상황
  "022": 프로젝트별 진행률과 함께 완료한 작업, 사이클 타임, 에이전트 완료 비율, 작업당 비용을 이전 기간과 비교합니다.
  "023": 작업 진행 과정
  "024": 각 작업의 맨 위에 지금 어느 단계인지, 어떤 에이전트가 맡고 있는지, 다음에 무엇을 할지 표시됩니다.
  "025": 에이전트 작업량과 모델 사용량
  "026": 머신별 에이전트가 어떤 작업을 진행 중인지, 모델별로 토큰을 얼마나 쓰고 비용이 얼마인지 언제든 확인할 수 있습니다.
  "027": 의사 결정
  "028": 근거를 보고 <span class="m">결정한다.</span>
  "030": 보고서와 체크리스트
  "031": 넘겨줄 때마다 무엇을 바꿨고 어떻게 검증했는지 적고, 항목별 검수 체크리스트를 첨부합니다.
  "032": 스크린샷과 미리보기
  "033": 시나리오마다 스크린샷을 첨부하고, 직접 해 보고 싶을 때는 독립된 미리보기 환경을 열 수 있습니다.
  "034": 통과 또는 반려
  "035": 근거를 보고 통과하거나 반려합니다. 반려할 때 이유를 적으면 에이전트가 이어서 수정합니다.
  "036": 업무 전문가
  "037": 코드를 모르는 업무 전문가도 바로 결정할 수 있다.
  "038": 업무 전문가는 업무 언어로 요구사항을 전달하고, 에이전트의 질문에 답하고, 실제 데이터로 미리보기에서 검수합니다. 환경, 브랜치, 테스트, 배포는 에이전트와 Studio가 맡습니다.
  "039": 기술 책임자는 규칙을 정하고 배포를 승인하며, 업무 전문가는 요구사항을 정하고 검수를 맡습니다.
  "040": 사람에게 넘어가기 전에 Studio가 검사와 리뷰를 진행한다.
  "041": 모든 변경은 같은 절차를 거칩니다. 테스트와 코드 리뷰를 통과해야 사람에게 검수가 넘어가고, 사람이 승인해야 프로덕션에 배포되며, 문제가 생기면 롤백할 수 있습니다.
  "042": 브랜치와 worktree
  "043": 작업마다 자체 브랜치가 있고, 실행할 때마다 독립된 worktree에서 진행합니다. 해당 브랜치의 PR은 작업에 자동으로 연결됩니다.
  "044": 테스트와 리뷰
  "045": CI가 검사와 테스트를 실행한 뒤, 다른 모델이 코드를 리뷰합니다. 가능하면 다른 업체의 모델을 씁니다.
  "046": 미리보기
  "047": 필요하면 PR마다 독립된 미리보기 환경을 띄워 사람이 써 보고 검수합니다.
  "048": 병합과 배포
  "049": 검수를 통과하면 병합되고, 작업의 PR이 모두 병합되면 작업이 자동으로 완료됩니다. 프로덕션 배포는 사람이 승인합니다.
  "050": 롤백
  "051": 문제가 생기면 이전 버전으로 되돌립니다.
  "053": 방법, 경험, 지식이 <span class="m">팀에 쌓인다.</span>
  "054": 요구사항 배경, 업무 자료, 프로젝트 경험이 여러 컴퓨터의 여러 대화에 흩어져 있어, 사람이나 에이전트가 바뀌면 찾기 어렵습니다. Studio는 스킬, 지식 베이스, 프로젝트 메모리에 방법과 경험을 쌓아, 사람이나 에이전트가 바뀌어도 막힘없이 인수인계할 수 있습니다.
  "055": 스킬
  "056": 스킬에는 일하는 방법을 담습니다. 요구사항 구체화, 개발, 리뷰, 배포 방식을 스킬로 작성해 전역, 프로젝트, 작업 디렉터리의 세 단계로 관리하고, 매 실행에 자동으로 적용합니다.
  "057": 지식 베이스
  "058": 지식 베이스에는 업무 자료를 담습니다. 요구사항 문서, 업무 규칙, 계약서 템플릿 등을 사람이 작성하거나 업로드하고, 에이전트는 일하면서 바로 참고합니다.
  "059": 프로젝트 메모리
  "060": 프로젝트 메모리에는 에이전트가 스스로 익힌 경험을 담습니다. 프로젝트 저장소에 보관되고, 작업의 PR과 함께 리뷰·병합되며, 다음 작업을 시작하기 전에 먼저 읽습니다.
  "061": 오픈소스와 셀프 호스팅
  "062": 셀프 호스팅. <span class="m">코드와 데이터는 기업의 소유.</span>
  "070": 에이전트가 작성하는 코드는 NocoBase Core 위에 구축
  "072": NocoBase Studio 온라인 체험
  "073": 새 탭에서 전체 화면으로 열기
  "074": 데모 계정으로 로그인되어 있습니다. 모든 데이터는 가상이니 마음껏 사용해 보세요.
  "075": NocoBase Studio는 NocoBase의 워크스페이스입니다. 여러 기기의 Claude Code, Codex, OpenCode를 하나의 24시간 에이전트 팀으로 묶어 프로세스에 따라 개발, 테스트, 리뷰를 진행하고, 사람은 PC나 모바일에서 요구사항을 전달하고 진행 상황을 추적하며 결정합니다.
  "076": 무료로 시작하기
  "078": 무료 오픈소스 Community 에디션에 Studio 기본 기능 포함
  "079": 자체 서버 셀프 호스팅, 폐쇄망 지원
  "080": Claude Code, Codex, OpenCode 등 다양한 코딩 도구 지원
  "081": 24시간 일하는 <span class="m">에이전트 팀.</span>
  "082": 개인 컴퓨터와 팀 서버의 코딩 도구를 하나의 워크스페이스에 연결합니다. 코디네이터 에이전트가 작업을 배정하고, 에이전트들이 격리된 환경에서 여러 프로젝트를 24시간 병렬로 진행합니다.
  "083": 여러 기기, 어떤 코딩 도구든 통합 연결
  "084": 벤더 종속 없이 노트북과 서버의 Claude Code, Codex, OpenCode 등을 연결합니다. 머신을 추가할수록 더 많은 작업을 병렬로 처리할 수 있습니다.
  "085": 역할에 따른 자동 작업 배정
  "086": 코디네이터 에이전트가 각 에이전트의 강점에 맞춰 설계, 개발, 테스트, 리뷰 작업을 배정합니다. 터미널을 일일이 지켜볼 필요가 없으며, 최종 검수는 항상 사람이 맡습니다.
  "087": 격리된 환경에서 병렬 실행
  "088": 모든 작업은 독립된 브랜치, worktree, 테스트 환경에서 실행되어 수십 개의 작업이 충돌 없이 동시에 진행됩니다.
  "089": 협업과 의사 결정
  "090": 언제 어디서나, <span class="m">명확한 의사 결정.</span>
  "091": 비즈니스 팀은 PC나 모바일에서 요구사항을 전달하고 납품 보고서와 실제 테스트 환경으로 직접 검수합니다. 모든 프로젝트의 진행 상황, 사이클 타임, 모델 비용도 한눈에 확인할 수 있습니다.
  "092": 자연어 요청과 직접 검수
  "093": 일상 언어로 요구사항을 설명하고 간단한 추가 질문에 답하면 됩니다. 모든 납품물에 보고서, 체크리스트, 스크린샷, 실제 동작하는 테스트 환경이 함께 제공됩니다.
  "094": PC와 모바일 어디서나 즉시 사용
  "095": 휴대폰 홈 화면에 추가해 어디서나 요구사항을 전달하고, 질문에 답하고, 스크린샷을 확인하며 승인할 수 있습니다. 결정이 필요할 때 즉시 알림을 보냅니다.
  "096": 진행 상황, 작업량, 비용을 한곳에서
  "097": 모든 프로젝트의 작업, 맥락, 납품 기록이 한곳에 모이며, 처리량, 사이클 타임, 재작업률, 에이전트 작업량, 작업당 비용을 대시보드로 확인할 수 있습니다.
  "098": 프로세스와 품질 관리
  "099": 체계적인 프로세스, <span class="m">단계마다 철저한 품질 검증.</span>
  "100": 요구사항과 설계부터 개발, 테스트, 리뷰, 검수, 배포까지 모든 단계에 명확한 담당자와 게이트, 완전한 감사 이력이 적용됩니다.
  "101": 프로젝트에 맞는 워크플로
  "102": 경량 워크플로부터 엄격한 워크플로까지 기본 제공되며, 기업의 엔지니어링 표준에 맞춰 직접 구성할 수도 있습니다.
  "103": 자동 테스트와 교차 모델 리뷰
  "104": 먼저 자동 테스트를 실행한 뒤 다른 공급업체의 모델이 코드를 리뷰합니다. 통과하지 못한 항목은 자동으로 수정·재검증 루프로 돌아갑니다.
  "105": 비즈니스·기술 이중 검수
  "106": 현업 담당자는 실제 미리보기 환경에서 동작을 검수하고, 기술 책임자는 아키텍처와 안전성을 검수합니다.
  "107": 품질 계획과 회귀 테스트
  "108": 매 배포 전 기능, 권한, 보안, 성능, 코드 품질 전반에 걸쳐 전체 회귀 테스트를 실행합니다.
  "109": 승인 기반 배포와 롤백
  "110": 프로덕션 배포는 승인을 거쳐 진행되며 배포 창구를 지원하고, 문제가 생기면 직전 정상 버전으로 깔끔하게 롤백합니다.
  "111": 명확한 역할 분담
  "112": 비즈니스 팀은 요구사항과 검수를, 기술 책임자는 규칙과 배포 승인을 맡습니다.
  "113": 비즈니스 팀은 일상 언어로 규칙을 설명하고 테스트 환경에서 실제 데이터로 검수합니다. 브랜치, 테스트, 리뷰, 배포는 에이전트와 Studio가 맡습니다.
  "114": 팀 노하우
  "115": 팀의 작업 방식은 스킬에, 업무 자료는 지식 베이스에, 에이전트가 익힌 경험은 프로젝트 메모리에 저장합니다. 사람이나 모델이 바뀌어도 소중한 노하우가 사라지지 않습니다.
  "116": 개발 표준, 리뷰 체크리스트, 팀의 작업 방식을 전역·프로젝트·디렉터리 단위의 스킬로 정리해 매 실행 시 자동으로 적용합니다.
  "117": 업무 정책, 규칙, 명세서, 템플릿을 파일 파싱 기능과 함께 한곳에서 관리해 사람과 에이전트가 동일한 기준 자료를 참고합니다.
  "118": 에이전트가 개발과 리뷰 과정에서 익힌 경험은 저장소에 바로 기록되고 PR에서 함께 리뷰되며, 다음 작업을 시작하기 전에 먼저 읽습니다.
  "119": 에디션과 셀프 호스팅
  "120": Community 에디션으로 무료 시작, <span class="m">팀 성장에 맞춰 확장.</span>
