notes: |-
  Português（巴西，você）
  术语：foundation = base；building blocks = componentes básicos；governance = governança；agent team = equipe de agentes；
  coding agent = agente de código；business logic = lógica de negócio；business systems = sistemas de negócio；
  vibe coding = vibe coding；self-hosted = auto-hospedado；make the call = dar a palavra final / decidir；at a glance = à vista
  页面用语：issue = tarefa；coordinator agent = agente coordenador；My sessions 等产品界面名称照英文
title: NocoBase Studio — Os agentes fazem o trabalho avançar. Sua equipe mantém o controle.
description: O NocoBase Studio é o espaço de trabalho do NocoBase. Transforme Claude Code, Codex e OpenCode de seus dispositivos em uma equipe de agentes 24/7 que desenvolve, testa e revisa seguindo seu processo, enquanto as pessoas orientam e decidem pelo computador ou celular.
strings:
  "000": Os agentes fazem o trabalho avançar. <span class="m">Sua equipe mantém o controle.</span>
  "002": Experimente online
  "004": Roda nos seus próprios servidores
  "005": Funciona com Claude Code, Codex e dezenas de outras ferramentas de código
  "006": Disponível nas edições comerciais
  "007": Equipe de agentes
  "008": Uma equipe de agentes <span class="m">que faz o trabalho avançar.</span>
  "009": O Studio conecta agentes em várias máquinas e os coordena de forma centralizada. Eles fazem muitos projetos e tarefas avançarem em paralelo, 24 horas por dia.
  "010": Agentes em várias máquinas
  "011": Conecte Claude Code, Codex e outros agentes nos computadores e servidores da sua equipe, e o Studio identifica as ferramentas de código e os modelos com login feito. Diga no que cada agente é bom, ative-o e ele entra para a equipe de agentes.
  "012": Um coordenador distribui o trabalho
  "013": Um agente coordenador distribui design, desenvolvimento, testes e revisão conforme o ponto forte de cada agente. Ele não escreve código nem faz merge; quem aceita o trabalho é sempre uma pessoa.
  "014": Várias tarefas ao mesmo tempo
  "015": Cada tarefa tem seu próprio branch, e cada execução trabalha em um worktree separado, então muitas tarefas avançam ao mesmo tempo sem conflito. Adicione máquinas para rodar mais em paralelo.
  "016": My sessions
  "017": No Studio, converse com o agente do seu próprio computador para discutir e esclarecer requisitos, registrar tarefas e acompanhar o andamento. Quando uma tarefa começa, o agente coordenador coloca a equipe de agentes para trabalhar.
  "018": Progresso
  "019": O progresso <span class="m">à vista.</span>
  "020": O progresso dos projetos, o andamento das tarefas, a carga dos agentes e o uso de modelos ficam claros. Você vê à primeira vista em que ponto está cada tarefa e o que vem a seguir.
  "021": Progresso dos projetos
  "022": O progresso de cada projeto, mais as tarefas concluídas, o tempo de ciclo, a parcela concluída por agentes e o custo por tarefa, comparados com o período anterior.
  "023": Andamento das tarefas
  "024": No topo de cada tarefa aparecem a etapa atual, o agente que está trabalhando nela e o próximo passo.
  "025": Carga dos agentes e uso de modelos
  "026": Veja em quais tarefas os agentes de cada máquina estão trabalhando e quantos tokens cada modelo usou, a que custo.
  "027": Decisões
  "028": Decisões <span class="m">baseadas em evidências.</span>
  "030": Relatório e checklist
  "031": Cada entrega diz o que mudou e como foi verificado, com um checklist de aceitação item por item.
  "032": Capturas de tela e previews
  "033": Cada cenário vem com capturas de tela e, quando você quiser testar, um ambiente de preview separado está pronto.
  "034": Aceitar ou devolver
  "035": Com as evidências em mãos, aceite o trabalho ou devolva. Diga o motivo, e os agentes continuam a partir daí.
  "036": Especialistas de negócio
  "037": Especialistas de negócio que não programam também podem dar a palavra final.
  "038": Os especialistas de negócio descrevem o que precisam com as próprias palavras, respondem às perguntas dos agentes e conferem o resultado em um preview com dados reais. Ambientes, branches, testes e publicações ficam com os agentes e o Studio.
  "039": Os líderes técnicos definem as regras e aprovam as publicações. Os especialistas de negócio cuidam dos requisitos e da aceitação.
  "040": Antes que o trabalho chegue a uma pessoa, o Studio organiza verificações e revisões.
  "041": "Toda mudança segue o mesmo caminho: só chega a uma pessoa depois de passar nos testes e na revisão de código, e só vai para produção depois que uma pessoa aprova. Se algo der errado, é só fazer rollback."
  "042": Branch e worktree
  "043": Cada tarefa tem seu próprio branch, e cada execução trabalha em um worktree separado. Os pull requests desse branch ficam vinculados à tarefa.
  "044": Testes e revisão
  "045": A CI roda verificações e testes, e depois outro modelo revisa o código, de outro fornecedor quando houver.
  "046": Preview
  "047": Quando necessário, um pull request ganha seu próprio ambiente de preview para uma pessoa testar e aprovar.
  "048": Merge e publicação
  "049": O merge acontece após a aceitação, e a tarefa é concluída quando todos os seus pull requests são mesclados. Publicar em produção exige a aprovação de uma pessoa.
  "050": Rollback
  "051": Se algo quebrar, volte para a versão anterior.
  "053": O conhecimento <span class="m">fica com a equipe.</span>
  "054": O contexto dos requisitos, os documentos de negócio e as lições aprendidas ficam espalhados em conversas em computadores diferentes. Quando mudam as pessoas ou os agentes, fica difícil encontrá-los. O Studio guarda métodos e experiência em skills, na base de conhecimento e na memória do projeto, para que quem chega continue de onde o anterior parou.
  "055": Skills
  "056": As skills guardam como o trabalho é feito. Escreva como você esclarece requisitos, desenvolve, revisa e publica, no nível global, do projeto ou do diretório de trabalho, e toda execução as leva junto.
  "057": Base de conhecimento
  "058": A base de conhecimento guarda os documentos de negócio. Requisitos, regras de negócio, modelos de contrato e outros materiais são escritos ou enviados por pessoas, e os agentes os consultam enquanto trabalham.
  "059": Memória do projeto
  "060": A memória do projeto guarda o que os agentes aprendem sozinhos. Ela fica no repositório do projeto, é revisada e mesclada junto com o pull request de cada tarefa e lida antes de a próxima começar.
  "061": Open source e auto-hospedagem
  "062": Auto-hospedado. <span class="m">Seu código e seus dados pertencem a você.</span>
  "070": O código que os agentes escrevem é construído sobre o NocoBase Core
  "072": Experimente o NocoBase Studio online
  "073": Abrir em tela cheia em uma nova aba
  "074": Você entrou com uma conta de demonstração. Todos os dados são fictícios, então teste à vontade.
  "075": O NocoBase Studio é o espaço de trabalho do NocoBase. Ele reúne Claude Code, Codex e OpenCode dos seus dispositivos em uma equipe de agentes 24/7 que cuida de desenvolvimento, testes e revisão por processo, enquanto as pessoas fazem solicitações, acompanham o progresso e decidem no computador ou no celular.
  "076": Comece grátis
  "078": A edição Community é gratuita e inclui os recursos essenciais do Studio
  "079": Auto-hospedado nos seus próprios servidores, pronto para redes isoladas
  "080": Funciona com Claude Code, Codex, OpenCode e muito mais
  "081": Uma equipe de agentes <span class="m">24/7.</span>
  "082": Conecte ferramentas de código em notebooks e servidores da equipe em um só espaço de trabalho. Um agente coordenador distribui as tarefas, e os agentes rodam em ambientes isolados em vários projetos, 24 horas por dia.
  "083": Vários dispositivos, qualquer ferramenta de código
  "084": Conecte Claude Code, Codex, OpenCode e outras ferramentas em notebooks e servidores sem dependência de fornecedor. Adicione máquinas para executar mais tarefas em paralelo.
  "085": Distribuição automática por especialidade
  "086": Um agente coordenador distribui tarefas de design, desenvolvimento, testes e revisão conforme os pontos fortes de cada agente — sem precisar vigiar terminais, mantendo a aceitação final com as pessoas.
  "087": Execuções paralelas isoladas
  "088": Cada tarefa roda no próprio branch, worktree e ambiente de teste, permitindo que dezenas de tarefas avancem em paralelo sem conflito.
  "089": Colaboração e decisões
  "090": Decisões claras, <span class="m">de qualquer lugar.</span>
  "091": As áreas de negócio enviam solicitações e aceitam entregas pelo computador ou celular com relatórios de entrega e ambientes de teste ativos, enquanto progresso, tempo de ciclo e gastos com modelos ficam à vista em todos os projetos.
  "092": Pedidos em linguagem natural e aceitação direta
  "093": Descreva o que precisa em linguagem natural e responda a perguntas rápidas. Cada entrega traz relatório, checklist, capturas de tela e um ambiente de teste ativo.
  "094": Pronto no computador e no celular
  "095": Adicione à tela inicial do celular para enviar solicitações, responder perguntas, conferir capturas de tela e aprovar de qualquer lugar com notificações instantâneas.
  "096": Progresso, carga e gastos em um só lugar
  "097": As tarefas, o contexto e as entregas de cada projeto ficam reunidos, com painéis de vazão, tempo de ciclo, retrabalho, carga dos agentes e custo por tarefa.
  "098": Processo e qualidade
  "099": Processo estruturado, <span class="m">qualidade em cada etapa.</span>
  "100": Da solicitação e do design até desenvolvimento, testes, revisão, aceitação e publicação, cada etapa tem responsáveis claros, critérios de controle e trilha de auditoria completa.
  "101": Fluxo na medida certa
  "102": Fluxos prontos que vão do mais leve ao mais rigoroso, ou personalize o seu conforme os padrões de engenharia da equipe.
  "103": Testes e revisão entre modelos
  "104": Os testes automáticos rodam primeiro, seguidos pela revisão de código por um modelo de outro fornecedor; falhas voltam automaticamente para correção.
  "105": Aceitação dupla
  "106": Os responsáveis de negócio validam o comportamento em um preview ativo enquanto líderes técnicos aprovam arquitetura e segurança.
  "107": Planos de qualidade e regressão
  "108": Execute testes completos de regressão em funcionalidades, permissões, segurança, desempenho e qualidade de código antes de cada publicação.
  "109": Publicação aprovada e rollback
  "110": Implantações em produção exigem aprovação, suportam janelas de publicação e fazem rollback seguro para a última versão estável.
  "111": Papéis claros
  "112": As áreas de negócio cuidam dos requisitos e da aceitação; os líderes técnicos definem as regras e aprovam as publicações.
  "113": As áreas de negócio descrevem regras em linguagem natural e validam com dados reais em um ambiente de teste — branches, testes, revisões e implantações ficam com os agentes e o Studio.
  "114": Conhecimento da equipe
  "115": Coloque as práticas da equipe em skills, guarde os materiais de negócio na base de conhecimento e salve o que os agentes aprendem na memória do projeto — nada se perde quando mudam pessoas ou modelos.
  "116": Transforme padrões de desenvolvimento, checklists de revisão e práticas da equipe em skills com escopo global, por projeto ou por diretório — aplicadas automaticamente em cada execução.
  "117": Reúna políticas de negócio, regras, especificações e modelos em um só lugar com leitura automática de arquivos, para que pessoas e agentes consultem a mesma fonte oficial.
  "118": As lições que os agentes aprendem durante o desenvolvimento e as revisões ficam salvas no repositório, são revisadas em PRs e lidas antes de a próxima tarefa começar.
  "119": Edições e auto-hospedagem
  "120": Comece grátis com o Community, <span class="m">escale conforme sua equipe cresce.</span>
  "121": Todas as edições são auto-hospedadas nos seus próprios servidores, inclusive em redes isoladas sem internet. Comece grátis com o Community ou faça upgrade com licença perpétua de pagamento único.
  "124": Para uso individual e pequenas equipes
  "125": Inclui tarefas, equipes de agentes, runtimes, testes e revisão entre modelos, aceitação em preview, skills/base de conhecimento/memória, aprovações pelo celular, registros de uso e permissões por papel.
  "126": Pro
  "127": Licença de pagamento único
  "128": Para equipes com entregas contínuas
  "129": Adiciona fluxos com múltiplos papéis e aceitação dupla, aprovação de implantações, SSO corporativo (SAML/LDAP/Feishu/DingTalk/WeCom) e limites de orçamento.
  "130": Comparar edições
  "131": Enterprise
  "132": Para várias equipes e sistemas críticos
  "133": Adiciona planos de qualidade por projeto, testes automáticos de regressão por versão, promoção entre ambientes com janelas de publicação e períodos de congelamento, além de cluster de alta disponibilidade.
  "135": Código e dados ficam nos seus servidores
  "136": Qualquer modelo ou ferramenta de código, incluindo modelos locais
  "137": Apps publicados rodam de forma independente, sem passar pelo Studio
  "138": Ler a documentação do Studio
  "139": "Conheça a base por trás do Studio: NocoBase Core"
  "140": Veja apps open source criados no NocoBase
