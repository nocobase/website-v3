notes: |-
  Русский（вы）
  术语：foundation = фундамент；building blocks = базовые модули；governance = контроль / управляемая разработка；
  agent team = команда агентов；coding agent = кодинг-агент；business logic = бизнес-логика；business systems = бизнес-системы；
  AI = ИИ；vibe coding = вайб-кодинг；open source = с открытым кодом；at a glance = как на ладони
  页面用语：issue = задача；coordinator agent = агент-координатор；sign-off = приёмка；My sessions 等产品界面名称照英文
title: NocoBase Studio — Агенты сами двигают работу вперёд. Команда держит всё под контролем.
description: NocoBase Studio — рабочее пространство NocoBase. Объединяйте Claude Code, Codex и OpenCode на ваших устройствах в команду агентов 24/7, которая по процессу разрабатывает, тестирует и проводит ревью, пока люди направляют работу и принимают решения с компьютера или телефона.
strings:
  "000": Агенты сами двигают работу вперёд. <span class="m">Команда держит всё под контролем.</span>
  "002": Попробовать онлайн
  "004": Работает на ваших серверах
  "005": Работает с Claude Code, Codex и десятками других инструментов разработки
  "006": Входит в коммерческие редакции
  "007": Команда агентов
  "008": Команда агентов, <span class="m">которая двигает работу вперёд.</span>
  "009": Studio подключает агентов на множестве машин и централизованно распределяет между ними работу. Они круглосуточно и параллельно двигают вперёд множество проектов и задач.
  "010": Агенты на многих машинах
  "011": Подключите Claude Code, Codex и других агентов на компьютерах и серверах команды — Studio сам найдёт инструменты разработки и модели, в которые выполнен вход. Опишите, в чём силён каждый агент, включите его, и он войдёт в команду агентов.
  "012": Координатор распределяет работу
  "013": Агент-координатор распределяет проектирование, разработку, тестирование и ревью с учётом сильных сторон каждого агента. Сам он не пишет и не сливает код; работу всегда принимает человек.
  "014": Много задач одновременно
  "015": У каждой задачи своя ветка, а каждый запуск работает в отдельном worktree, поэтому много задач продвигаются одновременно и не мешают друг другу. Больше машин — больше параллельной работы.
  "016": My sessions
  "017": "В Studio общайтесь с агентом на своём компьютере: обсуждайте и уточняйте требования, заводите задачи и следите за ходом работы. Когда задача запускается, агент-координатор подключает к ней команду агентов."
  "018": Прогресс
  "019": Весь прогресс <span class="m">как на ладони.</span>
  "020": Ход проектов, движение задач, загрузка агентов и расход моделей — всё на виду. Сразу понятно, на каком этапе каждая задача и что будет дальше.
  "021": Ход проектов
  "022": Ход каждого проекта, а также выполненные задачи, время цикла, доля работы агентов и стоимость задачи — в сравнении с прошлым периодом.
  "023": Ход задачи
  "024": Вверху каждой задачи видно, на каком она шаге, какой агент над ней работает и что будет дальше.
  "025": Загрузка агентов и расход моделей
  "026": Видно, какими задачами заняты агенты на каждой машине, сколько токенов израсходовала каждая модель и во что это обошлось.
  "027": Решения
  "028": Решения, <span class="m">подкреплённые фактами.</span>
  "030": Отчёт и чек-лист
  "031": К каждой сдаче работы прилагаются описание изменений, способ их проверки и чек-лист приёмки по пунктам.
  "032": Скриншоты и превью
  "033": Каждый сценарий сопровождается скриншотами, а если хотите проверить сами, наготове отдельная среда предпросмотра.
  "034": Принять или вернуть
  "035": Посмотрев материалы, примите работу или верните её. Укажите причину, и агенты продолжат с этого места.
  "036": Бизнес-эксперты
  "037": Решение могут принимать и бизнес-эксперты, которые не пишут код.
  "038": Бизнес-эксперты описывают задачу своими словами, отвечают на вопросы агентов и проверяют результат в превью на реальных данных. Средами, ветками, тестами и релизами занимаются агенты и Studio.
  "039": Техлиды задают правила и одобряют релизы. Бизнес-эксперты отвечают за требования и приёмку.
  "040": Прежде чем работа попадёт к человеку, Studio организует проверки и ревью.
  "041": "Каждое изменение проходит один и тот же путь: к человеку оно попадает только после тестов и код-ревью, а в продакшен — только после одобрения человеком. Если что-то пошло не так, изменение откатывается."
  "042": Ветка и worktree
  "043": У каждой задачи своя ветка, а каждый запуск работает в отдельном worktree. Pull request из этой ветки автоматически привязывается к задаче.
  "044": Тесты и ревью
  "045": CI запускает проверки и тесты, затем код ревьюит другая модель — по возможности от другого вендора.
  "046": Превью
  "047": При необходимости для pull request поднимается отдельная среда предпросмотра, где человек проверяет и принимает работу.
  "048": Слияние и релиз
  "049": Слияние — после приёмки; задача закрывается, когда слиты все её pull request. Релиз в продакшен требует одобрения человека.
  "050": Откат
  "051": Если что-то сломалось, вернитесь к предыдущему релизу.
  "053": Опыт и знания <span class="m">остаются в команде.</span>
  "054": Контекст требований, бизнес-документы и опыт проекта разбросаны по чатам на разных компьютерах. Когда меняются люди или агенты, их трудно найти. Studio сохраняет методы и опыт в навыках, базе знаний и памяти проекта, поэтому новый человек или агент продолжает с того места, где остановился предыдущий.
  "055": Навыки
  "056": Навыки хранят способы работы. Опишите, как вы уточняете требования, разрабатываете, проводите ревью и выпускаете релизы, на глобальном уровне, уровне проекта или рабочего каталога, и каждый запуск будет их учитывать.
  "057": База знаний
  "058": База знаний хранит бизнес-документы. Требования, бизнес-правила, шаблоны договоров и другие материалы пишут или загружают люди, а агенты обращаются к ним в работе.
  "059": Память проекта
  "060": Память проекта хранит то, чему агенты научились сами. Она лежит в репозитории проекта, проходит ревью и сливается вместе с pull request каждой задачи и читается перед началом следующей.
  "061": Открытый код и свои серверы
  "062": На ваших серверах. <span class="m">Код и данные принадлежат вам.</span>
  "070": Код, который пишут агенты, строится на NocoBase Core
  "072": Попробуйте NocoBase Studio онлайн
  "073": Открыть целиком в новой вкладке
  "074": Вы вошли под демо-аккаунтом. Все данные вымышлены, так что пробуйте что угодно.
  "075": NocoBase Studio — рабочее пространство NocoBase. Оно объединяет Claude Code, Codex и OpenCode на ваших устройствах в единую команду агентов 24/7, которая по процессу ведёт разработку, тестирование и ревью, пока люди ставят задачи, следят за прогрессом и принимают решения с компьютера или телефона.
  "076": Начать бесплатно
  "078": Редакция Community бесплатна и включает базовые возможности Studio
  "079": На ваших серверах, с поддержкой изолированных сетей
  "080": Работает с Claude Code, Codex, OpenCode и другими инструментами
  "081": Команда агентов, <span class="m">работающая 24/7.</span>
  "082": Подключите инструменты разработки на ноутбуках и серверах команды к единому рабочему пространству. Агент-координатор распределяет задачи, а агенты круглосуточно работают в изолированных средах сразу по нескольким проектам.
  "083": Любые устройства и инструменты разработки
  "084": Подключайте Claude Code, Codex, OpenCode и другие инструменты на ноутбуках и серверах без привязки к вендору. Добавляйте машины, чтобы вести больше задач параллельно.
  "085": Автоматическое распределение по специализации
  "086": Агент-координатор распределяет проектирование, разработку, тестирование и ревью с учётом сильных сторон каждого агента — без присмотра за терминалами, но с финальной приёмкой человеком.
  "087": Изолированный параллельный запуск
  "088": Каждая задача выполняется в собственной ветке, worktree и тестовой среде, поэтому десятки задач продвигаются параллельно и не мешают друг другу.
  "089": Совместная работа и решения
  "090": Обоснованные решения — <span class="m">откуда угодно.</span>
  "091": Бизнес-команды ставят задачи и проводят приёмку с компьютера или телефона на основе отчётов о поставке и живых тестовых сред, а прогресс, время цикла и расходы на модели по каждому проекту всегда как на ладони.
  "092": Задачи простыми словами и прямая приёмка
  "093": Опишите задачу простыми словами и ответьте на уточняющие вопросы. Каждая поставка включает отчёт, чек-лист, скриншоты и рабочую тестовую среду.
  "094": Удобно на компьютере и телефоне
  "095": Добавьте Studio на главный экран телефона, чтобы ставить задачи, отвечать на вопросы, просматривать скриншоты и проводить приёмку из любого места с мгновенными уведомлениями.
  "096": Прогресс, загрузка и затраты в одном месте
  "097": Задачи, контекст и поставки по каждому проекту собраны вместе — с дашбордами пропускной способности, времени цикла, доли доработок, загрузки агентов и стоимости задачи.
  "098": Процессы и качество
  "099": Выстроенный процесс, <span class="m">контроль качества на каждом этапе.</span>
  "100": От постановки задачи и проектирования до разработки, тестирования, ревью, приёмки и релиза — на каждом шаге определены ответственные, контрольные точки и полный журнал аудита.
  "101": Процесс под масштаб проекта
  "102": Встроенные процессы — от лёгких до строгих — или настройка собственного под ваши инженерные стандарты.
  "103": Тесты и кросс-модельное ревью
  "104": Сначала запускаются автотесты, затем код ревьюит модель другого поставщика; при ошибках задача автоматически возвращается на доработку.
  "105": Двойная приёмка
  "106": Представители бизнеса проверяют работу в живом превью, а техлиды подтверждают архитектуру и безопасность.
  "107": Планы качества и регрессия
  "108": Запускайте полное регрессионное тестирование функций, прав доступа, безопасности, производительности и качества кода перед каждым релизом.
  "109": Одобрение релизов и откат
  "110": Развёртывания в продакшен требуют одобрения, поддерживают окна релизов и чисто откатываются к последнему стабильному релизу.
  "111": Чёткое разделение ролей
  "112": Бизнес-команды отвечают за требования и приёмку, а техлиды — за правила и релизы.
  "113": Бизнес-команды формулируют правила простыми словами и проверяют результат на реальных данных в тестовой среде, а ветками, тестами, ревью и развёртыванием занимаются агенты и Studio.
  "114": Опыт команды
  "115": Оформляйте практики команды в навыки, храните бизнес-материалы в базе знаний и сохраняйте опыт агентов в памяти проекта — при смене людей или моделей ничего не теряется.
  "116": Превратите стандарты разработки, чек-листы ревью и практики команды в навыки на глобальном уровне, уровне проекта или каталога — они применяются автоматически при каждом запуске.
  "117": Храните регламенты, правила, спецификации и шаблоны в одном месте с разбором файлов, чтобы люди и агенты опирались на единый источник правды.
  "118": Опыт, накопленный агентами в ходе разработки и ревью, сохраняется прямо в репозитории, проверяется в PR и считывается перед началом следующей задачи.
  "119": Редакции и свои серверы
  "120": Начните бесплатно с Community <span class="m">и масштабируйтесь по мере роста команды.</span>
  "121": Каждая редакция разворачивается на ваших серверах, включая изолированные сети. Начните бесплатно с Community или перейдите на коммерческую редакцию с разовой покупкой и бессрочной лицензией.
  "124": Для отдельных специалистов и небольших команд
  "125": Включает задачи, команды агентов, среды выполнения, тесты и кросс-модельное ревью, приёмку в превью, навыки, базу знаний и память, согласования с телефона, журналы расхода и ролевые права.
  "126": Pro
  "127": Разовая лицензия
  "128": Для команд с непрерывной поставкой
  "129": Добавляет многоролевые процессы с двойной приёмкой, согласование развёртываний, корпоративный SSO (SAML, LDAP, Feishu, DingTalk, WeCom) и лимиты бюджета.
  "130": Сравнить редакции
  "131": Enterprise
  "132": Для нескольких команд и критичных систем
  "133": Добавляет планы качества по проектам, автоматическое регрессионное тестирование релизов, перенос между средами с окнами релизов и периодами заморозки, а также кластеризацию высокой доступности.
  "135": Код и данные остаются на ваших серверах
  "136": Любые модели и инструменты разработки, включая локальные
  "137": Выпущенные приложения работают автономно — запросы не проходят через Studio
  "138": Читать документацию Studio
  "139": Узнайте о фундаменте Studio — NocoBase Core
  "140": Смотрите приложения с открытым кодом на базе NocoBase
  "163": NocoBase Studio
