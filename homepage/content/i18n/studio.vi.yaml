notes: |-
  Tiếng Việt（bạn）
  术语：platform = nền tảng；foundation = nền móng（与 nền tảng 区分）；building blocks = khối chức năng；governance = quản trị；
  agent = agent；agent team = đội agent；coding agent = coding agent；business logic = logic nghiệp vụ；
  business systems = hệ thống nghiệp vụ；open source = mã nguồn mở；self-hosted = tự triển khai；at a glance = rõ ràng trong nháy mắt
  页面用语：issue = nhiệm vụ；coordinator agent = agent điều phối；sign-off = nghiệm thu；My sessions 等产品界面名称照英文
title: NocoBase Studio — Agent tự thúc đẩy công việc. Đội ngũ làm chủ toàn cục.
description: NocoBase Studio là không gian làm việc của NocoBase. Kết nối Claude Code, Codex và OpenCode trên nhiều thiết bị thành một đội agent 24/7 tự động phát triển, kiểm thử và review theo quy trình, trong khi con người định hướng và ra quyết định từ máy tính hoặc điện thoại.
strings:
  "000": Agent tự thúc đẩy công việc. <span class="m">Đội ngũ làm chủ toàn cục.</span>
  "002": Dùng thử trực tuyến
  "004": Triển khai trên máy chủ của bạn
  "005": Hỗ trợ Claude Code, Codex và hàng chục công cụ lập trình khác
  "006": Có trong các phiên bản thương mại
  "007": Đội agent
  "008": Một đội agent <span class="m">liên tục thúc đẩy công việc.</span>
  "009": Studio kết nối agent trên nhiều máy và điều phối tập trung, thúc đẩy song song nhiều dự án và nhiệm vụ suốt 24 giờ.
  "010": Agent trên nhiều máy
  "011": Kết nối Claude Code, Codex và các agent khác trên máy tính cá nhân và máy chủ của đội, Studio tự nhận diện công cụ lập trình và model đã đăng nhập. Ghi rõ thế mạnh của từng agent rồi bật lên, agent sẽ gia nhập đội agent.
  "012": Agent điều phối phân công
  "013": Agent điều phối phân công thiết kế, phát triển, kiểm thử và review theo thế mạnh của từng agent. Nó không viết code, không merge code, việc nghiệm thu luôn do con người thực hiện.
  "014": Nhiều nhiệm vụ cùng lúc
  "015": Mỗi nhiệm vụ phát triển trên nhánh riêng, mỗi lần chạy dùng một worktree độc lập, nên nhiều nhiệm vụ cùng tiến triển mà không ảnh hưởng nhau. Càng nhiều máy, càng nhiều nhiệm vụ chạy song song.
  "016": My sessions
  "017": Trong Studio, trò chuyện với agent trên máy của bạn để thảo luận và làm rõ yêu cầu, ghi nhận nhiệm vụ và theo dõi tiến độ. Khi nhiệm vụ bắt đầu, agent điều phối sẽ giao cho đội agent phát triển.
  "018": Tiến độ
  "019": Tiến độ <span class="m">rõ ràng trong nháy mắt.</span>
  "020": Tiến độ dự án, diễn biến nhiệm vụ, khối lượng việc của agent và mức dùng model đều hiển thị rõ ràng. Mỗi nhiệm vụ đang ở đâu, bước tiếp theo là gì, đều rõ trong nháy mắt.
  "021": Tiến độ dự án
  "022": Tiến độ từng dự án, cùng số nhiệm vụ hoàn thành, thời gian chu kỳ, tỷ lệ do agent hoàn thành và chi phí mỗi nhiệm vụ, so sánh với kỳ trước.
  "023": Diễn biến nhiệm vụ
  "024": Ngay đầu mỗi nhiệm vụ hiển thị đang ở bước nào, agent nào đang làm, bước tiếp theo là gì.
  "025": Khối lượng việc của agent và mức dùng model
  "026": Agent trên mỗi máy đang làm những nhiệm vụ nào, mỗi model đã dùng bao nhiêu token, tốn bao nhiêu tiền, đều tra được bất cứ lúc nào.
  "027": Quyết định
  "028": Quyết định <span class="m">có căn cứ rõ ràng.</span>
  "030": Báo cáo và danh sách kiểm tra
  "031": Mỗi lần bàn giao đều ghi rõ đã làm gì, kiểm chứng ra sao, kèm danh sách nghiệm thu từng mục.
  "032": Ảnh chụp màn hình và bản xem trước
  "033": Mỗi kịch bản kèm ảnh chụp màn hình; khi cần, mở môi trường xem trước riêng để tự mình thử.
  "034": Duyệt hoặc trả lại
  "035": Xem xong căn cứ thì duyệt hoặc trả lại. Khi trả lại, ghi rõ lý do để agent tiếp tục sửa.
  "036": Chuyên gia nghiệp vụ
  "037": Chuyên gia nghiệp vụ không biết code cũng có thể quyết định.
  "038": Chuyên gia nghiệp vụ nêu yêu cầu bằng ngôn ngữ nghiệp vụ, trả lời câu hỏi của agent và nghiệm thu trong bản xem trước với dữ liệu thật. Môi trường, nhánh, kiểm thử và phát hành do agent và Studio đảm nhận.
  "039": Trưởng nhóm kỹ thuật đặt quy tắc, phê duyệt phát hành; chuyên gia nghiệp vụ đặt yêu cầu, chịu trách nhiệm nghiệm thu.
  "040": Trước khi đến tay con người, Studio tổ chức kiểm tra và review.
  "041": "Mọi thay đổi đi theo cùng một quy trình: kiểm thử và review code đều đạt mới giao cho người nghiệm thu; được người phê duyệt mới phát hành lên production, có sự cố thì rollback."
  "042": Nhánh và worktree
  "043": Mỗi nhiệm vụ có nhánh riêng, mỗi lần chạy diễn ra trong một worktree độc lập; PR trên nhánh tự động gắn với nhiệm vụ.
  "044": Kiểm thử và review
  "045": CI chạy kiểm tra và test, sau đó đổi sang model khác review code, ưu tiên model của nhà cung cấp khác.
  "046": Xem trước
  "047": Khi cần, mỗi PR có môi trường xem trước riêng để con người dùng thử và nghiệm thu.
  "048": Merge và phát hành
  "049": Nghiệm thu xong thì merge, nhiệm vụ tự động hoàn thành khi mọi PR đã merge; phát hành lên production do con người phê duyệt.
  "050": Rollback
  "051": Có sự cố thì quay về phiên bản trước.
  "053": Phương pháp, kinh nghiệm, tri thức <span class="m">ở lại với đội ngũ.</span>
  "054": Bối cảnh yêu cầu, tài liệu nghiệp vụ và kinh nghiệm dự án nằm rải rác trong các phiên trò chuyện trên nhiều máy khác nhau, đổi người hay đổi agent là khó tìm lại. Studio lưu phương pháp và kinh nghiệm vào kỹ năng, kho tri thức và bộ nhớ dự án, đổi người hay đổi agent vẫn bàn giao trơn tru.
  "055": Kỹ năng
  "056": "Kỹ năng lưu cách làm việc. Cách làm rõ yêu cầu, phát triển, review, phát hành được viết thành kỹ năng ở ba cấp: toàn cục, dự án, thư mục làm việc, mỗi lần chạy tự động mang theo."
  "057": Kho tri thức
  "058": Kho tri thức lưu tài liệu nghiệp vụ. Tài liệu yêu cầu, quy tắc nghiệp vụ, mẫu hợp đồng… do con người soạn hoặc tải lên, agent tra cứu trực tiếp khi làm việc.
  "059": Bộ nhớ dự án
  "060": Bộ nhớ dự án lưu kinh nghiệm agent tự học được, nằm trong repository của dự án, được review và merge cùng PR của nhiệm vụ, và được đọc trước khi bắt đầu nhiệm vụ tiếp theo.
  "061": Mã nguồn mở và tự triển khai
  "062": Tự triển khai. <span class="m">Code và dữ liệu thuộc về bạn.</span>
  "070": Code do agent viết được xây trên NocoBase Core
  "072": Dùng thử NocoBase Studio trực tuyến
  "073": Mở toàn trang trong tab mới
  "074": Bạn đã được đăng nhập bằng tài khoản demo. Toàn bộ dữ liệu đều là giả lập, cứ thoải mái thử mọi thứ.
  "075": NocoBase Studio là không gian làm việc của NocoBase. Studio kết nối Claude Code, Codex và OpenCode trên nhiều thiết bị thành một đội agent 24/7 tự động phát triển, kiểm thử và review theo quy trình, trong khi con người gửi yêu cầu, theo dõi tiến độ và ra quyết định từ máy tính hoặc điện thoại.
  "076": Bắt đầu miễn phí
  "078": Phiên bản Community miễn phí, bao gồm các tính năng cốt lõi của Studio
  "079": Tự triển khai trên máy chủ của bạn, sẵn sàng cho mạng nội bộ tách biệt
  "080": Hỗ trợ Claude Code, Codex, OpenCode và nhiều công cụ khác
  "081": Một đội agent <span class="m">hoạt động 24/7.</span>
  "082": Kết nối các công cụ lập trình trên máy tính cá nhân và máy chủ của đội vào một không gian làm việc chung. Agent điều phối phân công nhiệm vụ, còn các agent chạy trong môi trường tách biệt để thúc đẩy nhiều dự án suốt 24/7.
  "083": Nhiều thiết bị, mọi công cụ lập trình
  "084": Kết nối Claude Code, Codex, OpenCode và các công cụ khác trên máy tính cá nhân lẫn máy chủ mà không phụ thuộc nhà cung cấp. Thêm máy để chạy song song nhiều việc hơn.
  "085": Tự động phân công theo thế mạnh
  "086": Agent điều phối phân công các nhiệm vụ thiết kế, phát triển, kiểm thử và review theo thế mạnh từng agent — không cần ngồi canh terminal, còn con người luôn giữ quyền nghiệm thu cuối cùng.
  "087": Chạy song song trong môi trường tách biệt
  "088": Mỗi nhiệm vụ chạy trên nhánh, worktree và môi trường kiểm thử riêng, giúp hàng chục nhiệm vụ tiến triển song song mà không xung đột nhau.
  "089": Cộng tác &amp; ra quyết định
  "090": Quyết định rõ ràng, <span class="m">ở bất cứ đâu.</span>
  "091": Bộ phận nghiệp vụ gửi yêu cầu và nghiệm thu trên máy tính hoặc điện thoại với báo cáo bàn giao và môi trường kiểm thử trực tiếp, còn tiến độ, thời gian chu kỳ và chi phí model của mọi dự án đều rõ ràng trong nháy mắt.
  "092": Nêu yêu cầu tự nhiên &amp; trực tiếp nghiệm thu
  "093": Mô tả nhu cầu bằng ngôn ngữ tự nhiên và trả lời các câu hỏi làm rõ nhanh. Mỗi lần bàn giao đều kèm báo cáo, danh sách kiểm tra, ảnh chụp màn hình và môi trường kiểm thử trực tiếp.
  "094": Sẵn sàng trên máy tính và điện thoại
  "095": Thêm vào màn hình chính điện thoại để gửi yêu cầu, trả lời câu hỏi, xem ảnh chụp màn hình và phê duyệt mọi lúc mọi nơi với thông báo tức thì.
  "096": Tiến độ, khối lượng và chi phí tại một nơi
  "097": Toàn bộ nhiệm vụ, bối cảnh và lần bàn giao của mọi dự án nằm tập trung một chỗ, kèm bảng điều khiển theo dõi năng suất, thời gian chu kỳ, tỷ lệ làm lại, tải agent và chi phí mỗi nhiệm vụ.
  "098": Quy trình &amp; chất lượng
  "099": Quy trình bài bản, <span class="m">kiểm soát chất lượng ở từng chặng.</span>
  "100": Từ yêu cầu, thiết kế đến phát triển, kiểm thử, review, nghiệm thu và phát hành, mỗi bước đều có người phụ trách rõ ràng, cổng kiểm soát và đầy đủ dấu vết kiểm toán.
  "101": Quy trình phù hợp từng dự án
  "102": Tích hợp sẵn nhiều quy trình từ gọn nhẹ đến chặt chẽ, hoặc tùy chỉnh riêng cho khớp với chuẩn kỹ thuật của doanh nghiệp.
  "103": Kiểm thử &amp; review chéo giữa các model
  "104": Kiểm thử tự động chạy trước, tiếp đến là review code bởi model từ nhà cung cấp khác; nếu chưa đạt sẽ tự động quay vòng sửa lại.
  "105": Nghiệm thu kép
  "106": Phía nghiệp vụ kiểm chứng tính năng trên bản xem trước trực tiếp, còn trưởng nhóm kỹ thuật nghiệm thu kiến trúc và độ an toàn.
  "107": Kế hoạch chất lượng &amp; kiểm thử hồi quy
  "108": Chạy kiểm thử hồi quy toàn diện về tính năng, phân quyền, bảo mật, hiệu năng và chất lượng code trước mỗi đợt phát hành.
  "109": Phê duyệt phát hành &amp; rollback
  "110": Triển khai lên production bắt buộc có phê duyệt, hỗ trợ khung thời gian phát hành và rollback gọn gàng về phiên bản ổn định gần nhất.
  "111": Phân vai rõ ràng
  "112": Bộ phận nghiệp vụ phụ trách yêu cầu và nghiệm thu; trưởng nhóm kỹ thuật đặt quy tắc và phê duyệt phát hành.
  "113": Bộ phận nghiệp vụ nêu quy tắc bằng ngôn ngữ tự nhiên và nghiệm thu bằng dữ liệu thật trong môi trường kiểm thử — nhánh code, kiểm thử, review và triển khai do agent và Studio đảm nhận.
  "114": Tri thức đội ngũ
  "115": Đưa cách làm việc của đội vào kỹ năng, lưu tài liệu nghiệp vụ trong kho tri thức và ghi lại kinh nghiệm agent học được vào bộ nhớ dự án — không gì thất lạc khi đổi người hay đổi model.
  "116": Chuyển chuẩn phát triển, danh sách review và thói quen làm việc thành kỹ năng áp dụng ở cấp toàn cục, dự án hoặc thư mục — tự động nạp trong mỗi lần chạy.
  "117": Quản lý tập trung quy chế, quy tắc nghiệp vụ, đặc tả và biểu mẫu kèm phân tích tệp để cả con người và agent cùng đọc từ một nguồn duy nhất.
  "118": Kinh nghiệm agent rút ra trong quá trình phát triển và review được lưu ngay trong kho mã, review cùng PR và đọc lại trước khi bắt đầu nhiệm vụ tiếp theo.
  "119": Phiên bản &amp; tự triển khai
  "120": Bắt đầu miễn phí với Community, <span class="m">mở rộng khi đội ngũ lớn mạnh.</span>
  "121": Mọi phiên bản đều tự triển khai trên máy chủ của bạn, kể cả mạng nội bộ tách biệt hoàn toàn. Bắt đầu miễn phí với Community, hoặc nâng cấp bằng giấy phép vĩnh viễn mua một lần.
  "124": Cho cá nhân &amp; đội nhỏ
  "125": Gồm nhiệm vụ, đội agent, runtimes, kiểm thử &amp; review chéo giữa các model, nghiệm thu bản xem trước, kỹ năng/kho tri thức/bộ nhớ dự án, phê duyệt trên điện thoại, nhật ký sử dụng và phân quyền vai trò.
  "126": Pro
  "127": Giấy phép mua một lần
  "128": Cho đội ngũ liên tục bàn giao hệ thống
  "129": Bổ sung quy trình đa vai trò kèm nghiệm thu kép, phê duyệt triển khai, SSO doanh nghiệp (SAML/LDAP/Feishu/DingTalk/WeCom) và giới hạn ngân sách.
  "130": So sánh các phiên bản
  "131": Enterprise
  "132": Cho nhiều đội ngũ &amp; hệ thống trọng yếu
  "133": Bổ sung kế hoạch chất lượng theo dự án, kiểm thử hồi quy tự động khi phát hành, phát hành đa môi trường kèm khung thời gian phát hành và giai đoạn đóng băng, cùng cụm tính sẵn sàng cao.
  "135": Code và dữ liệu luôn nằm trên máy chủ của bạn
  "136": Mọi model hoặc công cụ lập trình, gồm cả model cục bộ
  "137": Ứng dụng sau khi phát hành chạy độc lập, yêu cầu không đi qua Studio
  "138": Đọc tài liệu Studio
  "139": "Tìm hiểu nền móng phía sau Studio: NocoBase Core"
  "140": Xem các ứng dụng mã nguồn mở xây dựng trên NocoBase
  "142": Quy trình bài bản, <span class="m">con người giữ điểm kiểm soát.</span>
  "144": Quy trình tích hợp sẵn &amp; tùy chỉnh
  "146": Điểm kiểm soát rõ ràng &amp; tự động làm lại
  "148": Kỹ năng cố định ở mọi lần chạy
  "149": Gắn quy chuẩn phát triển, tiêu chí phân hạng review và mẫu báo cáo làm kỹ năng cố định để tự động nạp và không thể gỡ bỏ theo từng nhiệm vụ, đi kèm phát hành có phê duyệt và rollback.
  "150": Quản lý chất lượng
  "151": Kiểm thử chất lượng tự động, <span class="m">khắc phục khép kín.</span>
  "152": Các công cụ kiểm thử đã kiểm chứng chạy song song trên bảy khía cạnh thay vì để agent đoán qua mã nguồn — tự động xuất báo cáo và chuyển các phát hiện thành nhiệm vụ theo dõi để sửa lỗi, kiểm thử lại theo vòng khép kín.
  "153": Công cụ đã kiểm chứng &amp; chuẩn tùy chỉnh
  "154": Bao phủ tính năng, kiểm thử smoke, phân quyền, bảo mật, hiệu năng, chất lượng code và UX bằng Playwright, công cụ ma trận phân quyền, OWASP ZAP, gitleaks, Lighthouse, PostgreSQL EXPLAIN và jscpd. Tùy chỉnh ngưỡng, kỹ năng và khía cạnh; mục thiếu điều kiện tiên quyết luôn được đánh dấu rõ là chưa kiểm chứng.
  "155": Bốn cơ chế kích hoạt, chạy song song nhiều máy
  "156": Các đợt chạy hằng ngày, phát hành, dự án và tùy chỉnh dùng chung một công cụ và bộ quy tắc. Kịch bản cốt lõi lưu trong kho mã và phát triển cùng sản phẩm, trong khi nhiều máy kiểm thử thực thi song song các khía cạnh.
  "157": Báo cáo tự động &amp; khắc phục khép kín
  "158": Báo cáo từng khía cạnh được tổng hợp thành một báo cáo bàn giao duy nhất. Các lỗi đã khử trùng lặp, suy giảm hiệu năng, phát hiện bảo mật và hạng mục dọn code đi thẳng vào quy trình phát triển để agent sửa, review và kiểm thử lại — chỉ giữ lại các quy tắc chưa rõ ràng cho con người quyết định.
  "160": Bổ sung quy trình đa vai trò kèm nghiệm thu kép và quy trình tùy chỉnh, phê duyệt triển khai, SSO doanh nghiệp (SAML/LDAP/Feishu/DingTalk/WeCom) và giới hạn ngân sách.
  "161": Bổ sung quản lý chất lượng cấp dự án trên bảy khía cạnh bằng công cụ đã kiểm chứng, kiểm thử hồi quy tự động kèm khắc phục khép kín, phát hành đa môi trường với khung thời gian phát hành và giai đoạn đóng băng, cùng cụm tính sẵn sàng cao.
  "162": Người yêu cầu và trưởng nhóm kỹ thuật phụ trách đầu vào và đầu ra, còn ở giữa agent đảm nhận lập phương án, viết code, review chỉ đọc bằng model khác và kiểm tra CI tự động — tự động quay vòng xử lý khi bị trả lại.
  "163": NocoBase Studio
  "164": NocoBase Studio là không gian phát triển nhóm cho NocoBase. Studio kết nối Claude Code, Codex và OpenCode trên nhiều thiết bị thành một đội agent 24/7 đảm nhận phát triển, kiểm thử và review theo quy trình, trong khi con người gửi yêu cầu, theo dõi tiến độ và ra quyết định từ máy tính hoặc điện thoại.
  "165": Cài đặt nhanh Studio
  "166": Chọn quy trình rút gọn, tiêu chuẩn hoặc tùy chỉnh cho từng nhiệm vụ với kỹ năng cố định tự động nạp ở mỗi lần chạy — giữ rõ trách nhiệm, vòng làm lại tự động và đầy đủ dấu vết kiểm toán.
  "167": Community đi kèm quy trình rút gọn và tiêu chuẩn; Professional bổ sung quy trình đa vai trò, các bước tùy chỉnh và quy tắc phân quyền phụ trách linh hoạt.
  "168": Community miễn phí
  "169": Gồm nhiệm vụ, đội agent, runtimes, hai quy trình tích hợp sẵn (rút gọn &amp; tiêu chuẩn) với kỹ năng cố định, kiểm tra CI &amp; review chéo giữa các model, nghiệm thu bản xem trước, kho tri thức/bộ nhớ dự án, phê duyệt trên điện thoại và phân quyền vai trò.
  "170": Hoặc bắt đầu trực tiếp với NocoBase Core
