notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語：任务 = 任務；调度 Agent = 調度 Agent；评审 = 審查；会话 = 對話；我的会话 = 我的對話
title: NocoBase Studio — Agent 自主推進，團隊掌控全局
description: NocoBase Studio 是 NocoBase 的工作台。把多台裝置上的 Claude Code、Codex、OpenCode 等組成一支 24 小時運作的 Agent 團隊，按流程自主推進開發、測試和審查；人在電腦或手機上提需求、看進展、做決策。
strings:
  "000": Agent 自主推進，<span class="m">團隊掌控全局。</span>
  "002": 線上體驗
  "004": 地端部署在企業自己的伺服器上
  "005": 支援 Claude Code、Codex 等數十種開發工具
  "006": 於商業版中提供
  "007": Agent 團隊
  "008": 一支持續推進的 <span class="m">Agent 團隊。</span>
  "009": Studio 接入多台機器上的 Agent 統一調度，24 小時同步推進多個專案和大量任務。
  "010": 接入多台機器上的 Agent
  "011": 個人電腦和團隊伺服器上的 Claude Code、Codex 等接入後，Studio 自動識別已登入的開發工具和模型。寫明每個 Agent 擅長什麼並啟用，它就加入 Agent 團隊。
  "012": 調度 Agent 分派工作
  "013": 調度 Agent 依每個 Agent 的專長分派設計、開發、測試、審查工作。它不寫程式碼、不合併程式碼，驗收始終由人來做。
  "014": 多個任務同時推進
  "015": 每個任務在自己的分支上開發，每次執行使用獨立的 worktree，多個任務同時推進、互不干擾。機器越多，能同時推進的任務越多。
  "016": 我的對話
  "017": 在 Studio 裡和自己電腦上的 Agent 對話，討論和釐清需求、記錄任務、追蹤進展。任務開始後，由調度 Agent 安排 Agent 團隊開發。
  "018": 進展
  "019": 各項進展<span class="m">一目了然。</span>
  "020": 專案進展、任務推進過程、Agent 工作負載和模型用量都清晰可見。每個任務做到哪裡、下一步做什麼，都一目了然。
  "021": 專案進展
  "022": 每個專案的進度，以及完成的任務、週期時間、Agent 完成占比和單一任務成本，都和上一週期對比。
  "023": 任務推進過程
  "024": 每個任務做到哪一步、哪個 Agent 在做、接下來做什麼，都顯示在任務的最上方。
  "025": Agent 工作負載和模型用量
  "026": 每台機器上的 Agent 在推進哪些任務，各個模型用了多少 token、花了多少錢，隨時可查。
  "027": 決策
  "028": 有憑有據<span class="m">做決策。</span>
  "030": 報告與清單
  "031": 交付時寫明做了什麼、怎樣驗證的，並附上逐條的驗收清單。
  "032": 截圖與預覽
  "033": 每個情境附上截圖；需要時開啟獨立的預覽環境，親自試一遍。
  "034": 通過或退回
  "035": 看完依據，通過或退回。退回時寫明原因，Agent 接著改。
  "036": 業務專家
  "037": 不懂程式的業務專家，也可以直接拍板。
  "038": 業務專家用業務語言提需求、回答 Agent 的提問，在預覽裡用真實資料驗收。環境、分支、測試和發布，由 Agent 和 Studio 承擔。
  "039": 技術負責人定規則、批准上線；業務專家定需求、負責驗收。
  "040": 交到人手上之前，Studio 組織檢查和審查。
  "041": 每次改動走同樣的流程：測試和程式碼審查都通過，才交給人驗收；經人批准，才發布到正式環境，出了問題可以回復。
  "042": 分支與 worktree
  "043": 每個任務有自己的分支，每次執行在獨立的 worktree 裡進行；分支上的 PR 自動關聯到任務。
  "044": 測試與審查
  "045": CI 跑檢查和測試，再換一個模型審查程式碼，優先用另一家廠商的模型。
  "046": 預覽驗收
  "047": 需要時為 PR 啟動獨立的預覽環境，供人試用驗收。
  "048": 合併發布
  "049": 驗收通過後合併，任務的 PR 全部合併後任務自動完成；發布到正式環境由人批准。
  "050": 回復
  "051": 出了問題，退回上一個版本。
  "053": 方法、經驗、知識<span class="m">累積在團隊裡。</span>
  "054": 需求背景、業務資料、專案經驗散落在不同電腦的不同對話裡，換人、換 Agent 就很難找到。Studio 用技能、知識庫和專案記憶累積方法與經驗，換人、換 Agent 都能順利交接。
  "055": 技能
  "056": 技能保存做事的方法。需求釐清、開發、審查、發布的做法寫成技能，分全域、專案、工作目錄三級，每次執行自動帶上。
  "057": 知識庫
  "058": 知識庫保存業務資料。需求文件、業務規則、合約範本等由人撰寫或上傳，Agent 工作時直接查閱。
  "059": 專案記憶
  "060": 專案記憶保存 Agent 自主學到的經驗，存在專案的儲存庫裡，隨任務的 PR 一起審查、合併，下次開工前先讀。
  "061": 開源與地端部署
  "062": 地端部署，<span class="m">程式碼和資料歸企業所有。</span>
  "070": Agent 寫的程式碼建在 NocoBase Core 上
  "072": 線上體驗 NocoBase Studio
  "073": 在新分頁完整開啟
  "074": 已用展示帳號自動登入，資料都是虛構的，可以隨意操作。
  "075": NocoBase Studio 是 NocoBase 的工作台。它把多台裝置上的 Claude Code、Codex、OpenCode 等組成一支 24 小時運作的 Agent 團隊，按流程自主推進開發、測試和審查；人在電腦或手機上提需求、看進展、做決策。
  "076": 免費開始使用
  "078": 社群版開源免費，包含工作台基礎功能
  "079": 地端部署在企業自己的伺服器上，支援純內網
  "080": 支援 Claude Code、Codex、OpenCode 等開發工具
  "081": 一支 24 小時運作的 <span class="m">Agent 團隊。</span>
  "082": 把個人電腦和團隊伺服器上的開發工具統一接入工作台，由調度 Agent 自動分派任務，在獨立環境裡並行推進多個專案。
  "083": 多裝置、多工具統一接入
  "084": 統一接入個人電腦和伺服器上的 Claude Code、Codex、OpenCode 等開發工具，不綁定單一模型或廠商，機器越多併發越高。
  "085": 調度 Agent 自動分派
  "086": 調度 Agent 依每個 Agent 的專長分派設計、開發、測試和審查任務，不用人逐一盯著終端機對話，驗收始終由人把關。
  "087": 獨立環境並行推進
  "088": 每個任務在獨立的分支、worktree 和測試環境裡執行，互不干擾，24 小時同時推進多個專案與大量任務。
  "089": 人機協作與決策
  "090": 隨時隨地，<span class="m">有憑有據做決策。</span>
  "091": 業務人員在電腦或手機上直接提需求、看交付報告和可操作的測試環境並親自驗收；多人多專案的進展、週期和模型花費一目了然。
  "092": 業務人員直接提需求、親自驗收
  "093": 用自然語言提需求並回答 Agent 追問；交付時附上報告、驗收清單、截圖和可操作的測試環境，不懂技術也能直接拍板。
  "094": 電腦和手機隨時可用
  "095": 加到手機主畫面，隨時提需求、回答 Agent 的問題、看截圖並完成驗收或簽核；需要人做決定時即時推播提醒，不必守在電腦前。
  "096": 進展、負載與花費一目了然
  "097": 所有專案的需求、討論和交付集中在一處；儀表板直覺呈現完成任務數、週期時間、重工率、Agent 負載與單一任務模型花費。
  "098": 流程與品質把關
  "099": 按流程推進，<span class="m">層層把關品質。</span>
  "100": 從需求、方案、開發、測試、審查到驗收、上線，每一步由誰做、誰確認、交出什麼都按流程執行，全程留痕。
  "101": 依專案選流程
  "102": 內建從簡單到完整的多種流程，小改動走輕量流程，核心系統走嚴格流程，也可依企業制度自訂。
  "103": 自動測試與交叉審查
  "104": 每個改動先跑自動測試，再換另一家廠商的模型交叉審查；未通過自動重做重測，全過才交給人。
  "105": 業務與技術雙重驗收
  "106": 業務人員在獨立測試環境裡做業務驗收，技術負責人做技術驗收，各自把關。
  "107": 品質計畫與回歸測試
  "108": 上線前依品質計畫對系統做功能、權限、安全、效能和程式碼品質回歸測試，每次發布心裡有底。
  "109": 簽核上線與回復
  "110": 經簽核人批准才發布到正式環境，支援預發布驗證與上線時段；出了問題一鍵回復到上一版本。
  "111": 角色分工
  "112": 業務人員提需求、做驗收，技術負責人定規則、批准上線。
  "113": 業務人員不用懂程式，用業務語言說清規則、回答 Agent 追問，在測試環境裡用真實資料驗收；分支、測試、審查與部署由 Agent 和工作台承擔。
  "114": 團隊資產
  "115": 做事的方法放進技能，業務資料放進知識庫，Agent 平時學到的經驗記在專案記憶裡。不再散落在個人電腦的對話中，換人、換模型都能接著往下做。
  "116": 把開發規範、審查標準和做事方法做成技能，依全域、專案、工作目錄三級生效，每次執行自動帶上。
  "117": 業務制度、規則、需求說明和合約範本集中管理，支援上傳解析，供人和 Agent 工作時直接查閱。
  "118": Agent 在開發和驗收回饋裡學到的經驗持續記在專案儲存庫中，隨 PR 一起審查，下次開工前先讀。
  "119": 版本與地端部署
  "120": 社群版免費起步，<span class="m">隨團隊成長升級。</span>
  "121": 工作台全部部署在企業自己的伺服器上，支援純內網。個人和小團隊直接免費上手，專業版與企業版一次買斷、永久授權。
  "124": 個人與小團隊免費起步
  "125": 包含專案與任務、Agent 團隊、執行環境、自動測試與交叉審查、驗收上線、技能/知識庫/專案記憶、手機做決策、執行紀錄與成員權限。
  "126": 專業版
  "127": 一次買斷
  "128": 一個團隊持續交付業務系統
  "129": 在社群版基礎上，增加多角色流程（業務與技術雙重驗收）、部署簽核、企業 SSO（SAML/LDAP/飛書/釘釘/企業微信）以及依專案和成員的成本預算控制。
  "130": 查看版本與價格
  "131": 企業版
  "132": 多團隊協作與關鍵業務
  "133": 在專業版基礎上，增加專案層級品質計畫、發布自動回歸測試、跨環境發布（預發布驗證、上線時段與凍結期）以及高可用與叢集支援。
  "135": 程式碼與資料全在企業自有伺服器
  "136": 模型與開發工具自由選擇，支援本機模型
  "137": 業務系統發布後獨立運行，請求不經過工作台
  "138": 閱讀 Studio 完整文件
  "139": 了解工作台背後的應用基礎平台：NocoBase Core
  "140": 看看用 NocoBase 做出來的開源應用
  "163": 工作台 · NocoBase Studio
