  "002": Para vendas e serviços comerciais, fale conosco aqui. Para dúvidas técnicas, o <a href="https://forum.nocobase.com/" target="_blank" rel="noopener">fórum da comunidade</a> é o melhor lugar.
  "003": Vamos conversar
  "004": Preencha o formulário e entraremos em contato em breve, ou escreva diretamente para nós.
