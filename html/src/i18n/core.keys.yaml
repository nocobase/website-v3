  "074":
    en: Architecture and standards
    zh: 架构和规范
    where: standards
  "075":
    en: One architecture, <span class="m">one set of standards.</span>
    zh: 为 Agent 提供<span class="m">统一的架构和规范。</span>
    where: standards
  "076":
    en: Switch developers, models, or even sessions, and the AI may improvise differently each time. The system gets harder and harder to maintain. Core provides one project structure and one set of development standards, so the system evolves steadily for years on a consistent architecture.
    zh: 换人、换模型甚至换会话，AI 都可能随机发挥，系统越来越难维护。Core 提供统一的项目结构和开发规范，系统在统一架构下长期稳定迭代。
    where: standards
  "077":
    en: Project scaffolding
    zh: 项目脚手架
    where: standards
  "078":
    en: Every new app starts with the same layout. Pages, endpoints, schema changes, and tests each have a fixed place, and Core’s building blocks come in as packages.
    zh: 新建的应用自带统一的目录：页面、接口、表结构变更、测试各有固定位置，Core 的基础能力以包的形式引入。
    where: standards
  "079":
    en: Architecture standards
    zh: 架构规范
    where: standards
  "080":
    en: AGENTS.md and the skills spell out where business code goes, what to take from Core, and how to write migrations and permission checks.
    zh: AGENTS.md 和技能写明业务代码放在哪里、哪些直接用现成能力、迁移和权限怎么写。
    where: standards
  "081":
    en: Development skills
    zh: 开发技能
    where: standards
  "082":
    en: Skills ship with Core’s packages and sync into the app on install. Claude Code, Codex, and other coding tools read the same playbook, so the approach holds as people and models change.
    zh: 技能随 Core 的包发布，安装依赖时同步到应用里。Claude Code、Codex 等编码工具读到的是同一套写法，换人、换模型也不变。
    where: standards
  "083":
    en: "Building with a team of people and agents: NocoBase Studio"
    zh: 多人、多个 Agent 一起开发：NocoBase Studio
    where: standards
