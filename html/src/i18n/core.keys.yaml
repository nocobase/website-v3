meta:
  title:
    zh: NocoBase Core — 让 Agent 专心写业务，底座已经就绪
    en: NocoBase Core — Let agents focus on your business logic
  description:
    zh: NocoBase Core 是 AI 开发和运行业务系统的开源应用底座。权限、流程、文件等基础能力现成可用，Agent 在统一架构上只开发企业自己的业务。
    en: NocoBase Core is the open-source application foundation for business systems built and run with AI.
items:
  "000":
    en: Let agents focus on your business logic. <span class="m">The foundation is ready.</span>
    zh: 让 Agent 专心写业务，<span class="m">底座已经就绪。</span>
    where: phero
  "001":
    en: NocoBase Core is the open-source application foundation for business systems built and run with AI. Permissions, workflows, files, and other building blocks come ready to use, so agents build only what is specific to your business, all on one consistent architecture.
    zh: NocoBase Core 是 AI 开发和运行业务系统的开源应用底座。权限、流程、文件等基础能力现成可用，Agent 在统一架构上只开发企业自己的业务。
    where: phero
  "002":
    en: Quick Start
    zh: 快速开始
    where: phero
  "003":
    en: See the Building Blocks
    zh: 查看基础能力
    where: phero
  "004":
    en: Free, open source, and ready for production
    zh: 开源免费，可以直接用于生产
    where: phero
  "005":
    en: Your code and data belong to you
    zh: 代码和数据归企业所有
    where: phero
  "006":
    en: Works with Claude Code, Codex, and dozens of other coding tools
    zh: 支持 Claude Code、Codex 等数十种编码工具
    where: phero
  "007":
    en: Building blocks
    zh: 基础能力
    where: blocks
  "008":
    en: Proven building blocks, <span class="m">ready to use.</span>
    zh: 基础能力<span class="m">不用从头开发和验证。</span>
    where: blocks
  "009":
    en: Even with AI writing the code, permissions, workflow engines, and approvals are hard to design from scratch. They are full of edge cases and take a lot of work to maintain. Core provides ready-made building blocks, and NocoBase keeps maintaining and upgrading them. Agents build only the business logic, so there is far less code to write and verify.
    zh: 即使交给 AI，权限、工作流引擎、审批等底层模块从零开发，设计难度依然很高，边界情况多，维护工作量大。Core 提供现成的基础能力，由 NocoBase 持续维护和升级。Agent 只开发业务部分，需要开发和验证的代码大幅减少。
    where: blocks
