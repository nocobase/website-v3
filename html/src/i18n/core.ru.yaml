title: NocoBase Core — Пусть агенты займутся бизнес-логикой
description: NocoBase Core — фундамент приложений с открытым кодом для бизнес-систем, которые создаются и работают с помощью ИИ.
strings:
  "000": Пусть агенты займутся бизнес-логикой. <span class="m">Фундамент уже готов.</span>
  "002": Быстрый старт
  "003": Смотреть базовые модули
  "004": Бесплатно, с открытым кодом и готово к продакшену
  "005": Код и данные принадлежат вам
  "006": Работает с Claude Code, Codex и десятками других инструментов разработки
  "008": Проверенные базовые модули, <span class="m">готовые к работе.</span>
  "009": "Даже если код пишет ИИ, права доступа, движки бизнес-процессов и согласования трудно спроектировать с нуля: в них много пограничных случаев, а поддержка требует больших усилий. Core предоставляет готовые базовые модули, которые NocoBase постоянно поддерживает и обновляет. Агенты разрабатывают только бизнес-логику, поэтому кода, который нужно написать и проверить, становится гораздо меньше."
  "010": Пользователи и права
  "011": Вход и сессии
  "012": Пароли, восстановление доступа и сессии; единый вход через OIDC, вход через соцсети и двухфакторная аутентификация
  "013": Управление пользователями
  "014": Включение и отключение учётных записей, ссылки-приглашения и назначение ролей
  "016": Доступ к страницам, действиям и данным — одни правила для людей и агентов
  "017": Правила доступа к данным
  "018": Область данных по умолчанию, правила общего доступа и ограничения
  "019": Для скриптов, внешних систем и командной строки
  "020": Данные и файлы
  "021": Модели данных и миграции
  "022": Таблицы, поля, связи и миграции на SQLite, PostgreSQL, MySQL, SQL Server и Oracle
  "023": Другие СУБД
  "024": Dameng, KingbaseES и OceanBase
  "025": Обзор баз данных
  "026": Просмотр подключений, таблиц и полей существующих баз
  "028": Загрузка, хранение, предпросмотр и скачивание с привязкой к бизнес-записям
  "029": Печать по шаблонам
  "030": Договоры, коммерческие предложения и другие документы по шаблонам Office
  "032": Жизненный цикл записей
  "033": Состояния и переходы описываются в коде, вся история обработки сохраняется
  "034": Управление процессами
  "035": Схемы процессов и история запусков; администраторы меняют согласующих и пороговые суммы
  "036": Задания по расписанию
  "037": Запуск по расписанию, каждый запуск записывается
  "038": Согласования
  "039": Многоуровневые, совместные и альтернативные согласования, добавление согласующего, передача и возврат
  "040": Центр задач
  "041": Единый список дел из всех бизнес-источников
  "042": Сообщения
  "044": Отправка, доставка и журналы
  "045": Внутренние сообщения
  "046": Внутренний канал и входящие
  "047": Каналы
  "048": Почта через SMTP и Resend, групповые боты Feishu и DingTalk
  "049": Push-уведомления в браузере
  "051": "Подключение почтовых ящиков: синхронизация, ответы и отправка, переписка привязана к записям"
  "052": ИИ и агенты
  "053": Бизнес-агенты
  "054": Описание агентов, сервисы моделей, запуски и диалоги
  "055": Сессии агентов
  "056": Общение в браузере с инструментами разработки на компьютерах участников
  "057": База знаний
  "058": Документы и файлы с версиями и полнотекстовым поиском — для людей и агентов
  "059": Интерфейс и эксплуатация
  "060": Страницы и библиотека UI
  "061": "Каркас страниц и библиотека UI: таблицы, канбан-доски, схемы процессов и другое"
  "062": Языки и темы
  "063": Переключение языка, светлый, тёмный и компактный режимы
  "064": Фоновые задачи
  "065": Задачи, очереди и кеширование
  "066": Секреты
  "067": Шифрование и ротация секретов
  "068": Развёртывание и обновление
  "069": Развёртывание, обновление и откат из командной строки
  "070": Страница фундамента
  "071": Какие базовые модули Core использует приложение
  "072": <b>Более 20 базовых модулей</b>, которые NocoBase поддерживает и обновляет.
  "073": Документация по каждому модулю
  "074": Архитектура и стандарты
  "075": Одна архитектура, <span class="m">единые стандарты.</span>
  "076": Стоит сменить разработчика, модель или даже сессию, и ИИ каждый раз может импровизировать по-своему, а поддерживать систему становится всё сложнее. Core задаёт единую структуру проекта и единые стандарты разработки, поэтому система годами стабильно развивается на одной архитектуре.
  "077": Каркас проекта
  "078": Каждое новое приложение начинается с одинаковой структуры. У страниц, эндпоинтов, изменений схемы и тестов есть постоянные места, а базовые модули Core подключаются как пакеты.
  "080": AGENTS.md и навыки описывают, где размещать бизнес-код, что брать из Core и как писать миграции и проверки прав.
  "081": Навыки разработки
  "082": Навыки поставляются вместе с пакетами Core и синхронизируются в приложение при установке. Claude Code, Codex и другие инструменты разработки читают одни и те же правила, поэтому подход не меняется, даже если меняются люди и модели.
  "083": Разработка командой людей и агентов — NocoBase Studio
  "084": Открытый код и свои серверы
  "085": Приложения и данные <span class="m">принадлежат вам.</span>
  "099": Начать
  "111": Подробнее о Studio
  "113": Документация Core
