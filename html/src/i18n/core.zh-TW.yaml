notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
title: NocoBase Core — 讓 Agent 專心寫業務，地基已經打好
description: NocoBase Core 是以 AI 開發與運行業務系統的開源應用基礎平台。權限、流程、檔案等基礎能力現成可用，Agent 在統一架構上只開發企業自己的業務。
strings:
  "000": 讓 Agent 專心寫業務，<span class="m">地基已經打好。</span>
  "002": 快速開始
  "003": 查看基礎能力
  "004": 開源免費，可直接用於正式環境
  "005": 程式碼和資料歸企業所有
  "006": 支援 Claude Code、Codex 等數十種開發工具
  "008": 基礎能力<span class="m">不必從頭開發與驗證。</span>
  "009": 即使交給 AI，權限、工作流程引擎、簽核等底層模組從零開發，設計難度依然很高，邊界情況多，維護工作量大。Core 提供現成的基礎能力，由 NocoBase 持續維護與升級。Agent 只開發業務部分，需要開發與驗證的程式碼大幅減少。
  "010": 使用者與權限
  "011": 登入與工作階段
  "012": 密碼登入、找回密碼、工作階段；OIDC 統一身分、社群登入、雙因素驗證
  "013": 使用者管理
  "014": 帳號啟用與停用、邀請連結、指派角色
  "016": 頁面、操作和資料範圍的授權，人與 Agent 用同一套
  "017": 資料範圍規則
  "018": 預設資料範圍、共用規則、限制規則
  "019": 供腳本、外部系統和命令列存取應用
  "020": 資料與檔案
  "021": 資料模型與遷移
  "022": 資料表、欄位、關聯和遷移；SQLite、PostgreSQL、MySQL、SQL Server、Oracle
  "023": 其他資料庫
  "024": 達夢、人大金倉、OceanBase
  "025": 資料庫瀏覽
  "026": 瀏覽既有資料庫的連線、資料表和欄位
  "028": 上傳、儲存、預覽和下載，檔案與業務紀錄關聯
  "029": 範本列印
  "030": 依 Office 範本產生合約、報價單等文件
  "032": 紀錄生命週期
  "033": 狀態和流轉在程式碼裡宣告，保留完整的處理歷程
  "034": 流程管理
  "035": 流程圖和執行紀錄，管理員可以調整簽核人、金額門檻
  "036": 排程任務
  "037": 依時間規則執行，記錄每次執行
  "038": 簽核
  "039": 多級、會簽、或簽、加簽、轉交、退回
  "040": 任務中心
  "041": 彙整各業務來源的個人待辦
  "042": 訊息
  "044": 通知的傳送、投遞和日誌
  "045": 站內信
  "046": 站內信管道和收件匣
  "047": 通知管道
  "048": SMTP、Resend 郵件，飛書、釘釘群組機器人
  "049": 瀏覽器推播通知
  "051": 連結個人信箱，同步、回覆和傳送，往來郵件與業務紀錄關聯
  "052": AI 與 Agent
  "053": 業務 Agent
  "054": Agent 定義、模型服務、執行和對話
  "055": Agent 對話
  "056": 在瀏覽器裡和成員電腦上的開發工具對話
  "057": 知識庫
  "058": 帶版本的文件和檔案、全文檢索，供人和 Agent 使用
  "059": 介面與維運
  "060": 頁面與元件庫
  "061": 頁面框架和 UI 元件庫，表格、看板、流程圖等
  "062": 多語系與主題
  "063": 介面語言切換，淺色、深色和緊湊模式
  "064": 背景任務與佇列
  "065": 背景任務、佇列和快取
  "066": 金鑰管理
  "067": 金鑰加密儲存與輪替
  "068": 部署與升級
  "069": 命令列部署、升級與回復
  "070": 應用基礎平台
  "071": 查看應用用到了哪些 Core 能力
  "072": <b>20 多項基礎能力</b>，由 NocoBase 持續維護與升級。
  "073": 查看每項能力的文件
  "074": 架構和規範
  "075": 為 Agent 提供<span class="m">統一的架構與規範。</span>
  "076": 換人、換模型甚至換對話，AI 都可能隨意發揮，系統越來越難維護。Core 提供統一的專案結構與開發規範，系統在統一架構下長期穩定迭代。
  "077": 專案範本
  "078": 新建的應用自帶統一的目錄：頁面、介面、資料表結構變更、測試各有固定位置，Core 的基礎能力以套件的形式引入。
  "080": AGENTS.md 和技能寫明業務程式碼放在哪裡、哪些直接用現成能力、遷移和權限怎麼寫。
  "081": 開發技能
  "082": 技能隨 Core 的套件發布，安裝相依套件時同步到應用裡。Claude Code、Codex 等開發工具讀到的是同一套寫法，換人、換模型也不變。
  "083": 多人、多個 Agent 一起開發：NocoBase Studio
  "084": 開源與地端部署
  "085": 應用和資料<span class="m">歸企業私有。</span>
  "099": 開始使用
  "111": 了解 Studio
  "113": 查看 Core 文件
