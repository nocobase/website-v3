  "240":
    en: Core, Studio, and Solution each get commercial additions, all under one license. Professional adds production release approval, enterprise SSO, more apps such as NocoITAM, and official support. Enterprise adds org-wide governance across teams and environments, plus high availability.
    zh: Core、Studio 和 Solution 每一层都有商业增强，一份授权同时生效。Professional 增加生产环境上线审批、企业 SSO、NocoITAM 等更多应用和官方支持；Enterprise 增加跨团队、跨环境的组织级治理和高可用。
