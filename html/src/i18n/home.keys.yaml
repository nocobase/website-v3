    zh: 换人、换模型、换会话，AI 都可能随机发挥，架构逐渐漂移。
    where: faq
  "227":
    en: Core provides one project structure, development standards, and development skills, so the system evolves steadily for years on a consistent architecture.
    zh: Core 提供统一的项目结构、开发规范和开发技能，系统在统一架构下长期稳定迭代。
    where: faq
