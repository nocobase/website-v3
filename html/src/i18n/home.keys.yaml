  "041":
    en: <span class="ln">NocoBase is the open-source platform for building, running, and evolving business systems with AI.</span><span class="ln">Agents write the code and do the work, NocoBase provides the foundation and governance, and people make the decisions.</span>
    zh: <span class="ln">NocoBase 是用 AI 持续开发和运行业务系统的开源平台。</span><span class="ln"><span class="ph">Agent 写代码、做执行，</span><span class="ph">NocoBase 提供底座和治理能力，</span><span class="ph">人来做决策。</span></span>
    where: hero
