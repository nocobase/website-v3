  "236":
    en: NocoCRM, NocoReach, and NocoProject are free and open source. NocoITAM, NocoSupport, and NocoHR come with the commercial editions. Every app runs on your own servers and works with the model of your choice.
    zh: NocoCRM、NocoReach 和 NocoProject 开源免费，NocoITAM、NocoSupport 和 NocoHR 在商业版中提供。所有应用都部署在企业自己的服务器上，模型自由选择。
    where: solutions
    unused: true
  "237":
    en: Core, Studio, and Solution apps such as NocoCRM are free, open source, and ready for production. The commercial editions add team- and organization-level governance, enterprise integration, more Solution apps, and official support.
    zh: Core、Studio 和 NocoCRM 等 Solution 应用开源免费，可以直接用于生产；商业版增加团队和组织级的治理、企业集成、更多 Solution 应用与官方支持。
    where: open
    unused: true
  "238":
    en: Core, Studio, NocoCRM, NocoReach, and NocoProject are free, open source, and ready for production and client delivery. Without buying a license, your team can lead an agent team from request to release.
    zh: Core、Studio，以及 NocoCRM、NocoReach、NocoProject 开源免费，可以直接用于生产和商业交付。不用购买授权，团队就能带领 Agent 团队从需求做到上线。
