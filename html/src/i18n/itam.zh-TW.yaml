title: NocoITAM — Agent 主動跟進，IT 資產井井有條
description: NocoITAM 是基於 NocoBase 的開源 IT 資產管理系統。Agent 替 IT 核對 MDM 與資產清冊、為到職和離職備好清單、每筆採購先查庫存和閒置、續訂前收回閒置席位；IT 只做判斷。
strings:
  "000": IT 資產清冊與管理
  "001": Agent 主動跟進，<br><span class="m">IT 資產井井有條。</span>
  "002": 傳統資產系統靠人維護清冊。在 NocoITAM 裡，Agent 整理 MDM 差異、為新人備齊設備、採購前先查庫存和閒置。每台設備、每個席位、每筆支出都有據可查。
  "003": 線上體驗
  "004": 觀看介紹
  "005": 授權
  "006": 開源
  "007": 基於
  "008": 目前版本
  "009": 內建 Agent
  "010": MDM 串接
  "011": AI 模型
  "012": 自選
  "013": 線上體驗 NocoITAM
  "014": 已用展示帳號自動登入，資料都是虛構的，可以隨意操作。
  "015": 在新分頁完整開啟
  "016": 看得見的價值
  "017": 省下的每一筆錢，
  "018": 都說得清來龍去脈。
  "019": Agent 絕不擅自改帳：每項建議都經負責人確認後才執行。省了多少錢、省在哪張採購單或哪個軟體席位上，全都清清楚楚。
  "020": 採購
  "021": 每一筆採購前，
  "022": 先查庫存、閒置與歷史價格。
  "023": 採購單一送出，審批助手就自動算好細帳：有沒有庫存或閒置可用、歷史單價多少、同類申請以往怎麼批、申請說明是否完整，並直接給出審批建議與批註草稿。
  "024": 審批助手給出的，遠不只是「同意」或「駁回」。
  "025": 「建議有條件同意：庫存已有 3 台同型號螢幕可領用，只需採購差額 2 台。」
  "026": 「建議駁回：這台印表機僅使用 20 個月且沒有維修紀錄，建議先報修，而不是直接報廢。」
  "027": 「建議有條件同意：同型號沒有庫存，但庫內有 3 台替代機型可用；請先確認本季預算與到職名單。」
  "028": 到職與離職
  "029": 新人第一天就能上工，
  "030": 離職資產一件不漏收回。
  "031": 到職前，依職位標準算好所需設備與軟體席位，自動比對庫存與閒置，整批產生配置方案；你只需確認，缺口一鍵起草採購單。離職時反向逐項收回，設備、配件、席位，以及停用帳號、輪替金鑰等系統外事項逐一追蹤，不漏一項。
  "032": MDM 每次同步後，
  "033": 差異自動整理成處理方案。
  "034": 與 Intune、Jamf Pro 同步後，Agent 自動歸類差異並附上原因：使用人不符的指派給設備負責人，未入帳的新設備指派給資產管理員；失聯設備等棘手情況留給人判斷。在收件箱勾選確認，就能批次執行。
  "035": 告別每週匯出試算表手動比對
  "036": 每處差異都有明確的負責人與處理依據
  "037": 變更紀錄自動保存在設備時間軸中
  "038": 資產清冊
  "039": 硬體、軟體與耗材，
  "040": 一本清冊管清楚。
  "041": 設備
  "042": 使用中、庫存、維修、借出、報廢，全生命週期流轉都有紀錄，並與 Intune、Jamf Pro 持續對帳。
  "043": 配件、耗材與組件
  "044": 依數量管理領用、歸還與庫存，低於安全庫存自動提醒；組件可裝進設備，隨設備一起流轉。
  "045": 軟體授權
  "046": 清楚掌握訂閱與永久授權的總席位、已分配、閒置與超額情況，自動續訂前提前預警。
  "047": 採購、維修、報廢與盤點
  "048": 全流程環環相扣：到貨逾期自動提醒，維修費用歸入設備，盤點差異逐項跟進。
  "049": 照你的方式
  "050": 寫下你們的配置標準與審批規則，
  "051": Agent 照章執行。
  "052": 業務指導
  "053": 用自然語言寫明公司概況、各職位標準配置、預算與審批紅線，所有 Agent 每次執行都會讀取並遵循。
  "054": 技能
  "055": 內建採購審閱、型號建檔、MDM 對帳、到職、調動與離職等技能，隨時查看，或依內部流程修改。
  "056": 模型與原始碼
  "057": 依 Agent 指定模型並監控用量。需要改欄位、流程或報表？在 Studio 裡讓 Coding Agent 直接改原始碼。開源、地端部署，程式碼歸你所有。
  "058": IT 少對帳，資產始終清楚。
  "059": 線上體驗 NocoITAM，或到 GitHub 取得原始碼自行部署。連上 MDM、匯入資產表，Agent 立即開始對帳。
  "061": 專業版
  "062": 依 Agent 指定模型並監控用量。需要改欄位、流程或報表？在 Studio 裡讓 Coding Agent 直接改原始碼。隨專業版提供，地端部署，程式碼歸你所有。
