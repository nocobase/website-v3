title: NocoBase-Partnerprogramm — Mehr Kundenprojekte mit einem Agenten-Team liefern
description: "Werden Sie NocoBase-Partner: 15–40 % Vertriebsprovision und 100 % Ihres Serviceumsatzes. Mit Core, Studio und Solution konzentrieren sich Ihre Berater auf den Kundenbedarf, während ein Agenten-Team entwickelt. So laufen viele Kundenprojekte gleichzeitig."
strings:
  "001": KI hat die Softwarelieferung neu definiert. <span class="m">Machen Sie daraus Ihr Geschäft.</span>
  "002": Früher hing die Zahl der Projekte davon ab, wie viele Entwickler Sie hatten. Heute konzentrieren sich Ihre Berater auf Anforderungsanalyse, Schlüsselentscheidungen und Abnahme, während ein Agenten-Team programmiert, testet und deployt. So laufen viele Kundenprojekte parallel. NocoBase 3 liefert Core als Fundament, Studio und die Geschäftsanwendungen von Solution. Ihre Branchenerfahrung und Ihre Kundenbeziehungen machen den Unterschied.
  "005": Vertriebsprovision
  "006": Berechnung
  "007": Lebenslang, sinkt nie
  "008": Serviceumsatz
  "009": 100 % für Sie
  "010": Gelieferter Code
  "011": Gehört dem Kunden, wartbar
  "012": Lieferung im KI-Zeitalter
  "013": "Nicht mehr über Köpfe skalieren, "
  "014": sondern über Ihr Fachurteil.
  "015": KI hat das Schreiben von Code billig gemacht. Wofür Kunden heute bezahlen, ist jemand, der ihr Geschäft versteht, und ein produktionsreifes System, das sich über Jahre weiterentwickeln lässt. Genau das ist der Kernwert, den Partner liefern.
  "016": Klassische Lieferung
  "017": Skaliert über Köpfe
  "018": Mit NocoBase 3
  "019": Skaliert über Fachurteil
  "020": Kapazität
  "021": Projektzahl begrenzt durch die Zahl der Entwickler
  "022": Ein Agenten-Team treibt alle Kundenprojekte voran, rund um die Uhr
  "024": Abrechnung nach Personentagen, Marge an Stunden gebunden
  "025": "Preise nach Modul und Ergebnis: schnellere Lieferung, höhere Marge"
  "026": Was Sie übergeben
  "027": Undurchsichtige Konfigurationen oder Spezialcode, schwer zu übergeben
  "028": "Sauberer Quellcode auf einem Standardfundament: prüfbar, upgradefähig, mit KI weiterentwickelbar"
  "030": Wissen steckt in wenigen Köpfen
  "031": In Skills und Wissensdatenbanken festgehalten, wiederverwendbar beim nächsten Kunden
  "032": Nach dem Go-live
  "033": Feuerwehreinsätze nach dem Launch, kaum abrechenbar
  "034": Agenten-Teams übernehmen Upgrades und laufende Verbesserungen, daraus wird ein wiederkehrender Jahresvertrag
  "035": Ein Berater, vier Kundenprojekte parallel.
  "036": In NocoBase Studio hat jeder Kunde ein eigenes, isoliertes Projekt und Repository. Der Berater greift nur bei Schlüsselentscheidungen in My issues ein (Vorschauen prüfen, fachliche Fragen beantworten, Releases freigeben), während Agenten im Hintergrund entwickeln, testen und Deployments vorbereiten.
  "037": Ansprechpartner beim Kunden geben Feedback und nehmen Funktionen direkt in Live-Vorschauen ab
  "038": "Jede Änderung durchläuft automatische Prüfungen und menschliche Abnahme: Qualität ohne Überstunden"
  "039": Bei Projektabschluss vollständigen Quellcode, Skills und Wissensdatenbanken übergeben
  "040": Partnermodelle
  "041": "Weiterverkaufen, liefern oder Branchenlösungen bauen. "
  "042": Eins wählen oder kombinieren.
  "043": Vertrieb
  "044": Kommerzielle NocoBase-Lizenzen empfehlen und weiterverkaufen, mit gestaffelter Provision.
  "045": 15–40 % Provision je nach kumuliertem Umsatz
  "046": "Lebenslange Kumulierung: Ihre Stufe wird nie zurückgesetzt und sinkt nie"
  "047": Einmalige Dauerlizenz ohne Nutzerlimit erleichtert die Freigabe beim Kunden
  "048": Mit Vertriebsmaterial, Demo-Umgebungen und Battlecards
  "049": Service-Lieferung
  "050": Liefern Sie Deployment, Anpassung, Integration und Schulung in Studio mit Ihrem Agenten-Team.
  "051": 100 % des Serviceumsatzes bleiben bei Ihnen, ohne Anteil für NocoBase
  "052": "Preise nach Ihren Vorstellungen: Festpreis, pro Modul oder Jahresvertrag"
  "053": Mit jedem abgeschlossenen Projekt aufsteigen und bevorzugt Leads erhalten
  "054": Branchenlösungen
  "055": Bauen Sie vertikale Lösungen auf Core mit integrierten Fach-Agenten, wie NocoCRM.
  "056": Einmal bauen, dann bei allen Kunden Ihrer Branche ausrollen und pflegen
  "057": Branchenregeln in Skills und Leitfäden packen, damit Agenten die Branche ab Tag eins kennen
  "058": Listung im NocoBase-Solution-Katalog mit gemeinsamem Launch und Marketing
  "059": Technologie-Ökosystem
  "060": Bringen Sie Modelle, Agenten-Tools, Cloud-Infrastruktur oder Konnektoren in NocoBase-3-Installationen ein.
  "061": Skills, Konnektoren und UI-Komponenten für Entwickler und Agenten veröffentlichen
  "062": Lösungen, technische Dokumentation und Kundenfallstudien gemeinsam veröffentlichen
  "063": Frühzeitiger Zugang zu Core-Releases für Kompatibilitätsprüfungen
  "065": "Schneller und stabiler liefern. "
  "066": Zufriedenere Kunden.
  "067": 100 % Quellcode
  "068": Die Ergebnisse bestehen die technische Prüfung ohne Vendor-Lock-in und schaffen das Vertrauen, das zum Abschluss führt.
  "069": Enterprise-Grundfunktionen inklusive
  "070": Authentifizierung, Berechtigungen, Workflows, Freigaben und KI-Mitarbeiter sind Standard, sodass Agenten nur kundenspezifische Logik schreiben.
  "071": Skalierbare Lieferung mit Studio
  "072": Mehrere Kunden und Repositories in einem Arbeitsbereich verwalten, mit Tests und Review, isolierten Vorschauen und kontrollierten Releases.
  "073": Mit fertigen Solutions starten
  "075": Selbst gehostet, volle Datenhoheit
  "076": On-Premises mit beliebigem Modell betreiben und strenge Compliance-Anforderungen in Finanzwesen, Verwaltung und Industrie erfüllen.
  "077": Weltweit bewährt
  "078": Mit 24,6K GitHub-Sternen läuft NocoBase in Unternehmen, Behörden und Hochschulen weltweit, die jetzt ins KI-Zeitalter wechseln.
  "079": So unterstützen wir Sie
  "080": "Vom ersten Kunden an "
  "081": sind wir an Ihrer Seite.
  "082": Schulung und Zertifizierung
  "083": Bringen Sie eine echte Anforderung mit und lernen Sie, in Studio Agenten zu steuern, Vorschauen zu prüfen und sicher zu releasen.
  "084": Vertriebsunterstützung
  "085": Zugang zu Pitch-Decks, Fallstudien, Battlecards und Demo-Umgebungen sowie gemeinsame Termine bei wichtigen Deals.
  "086": Technischer Support
  "087": Eigene Supportkanäle mit bevorzugter Reaktion für höhere Stufen sowie frühzeitiger Zugang zu Core-Releases und Skills.
  "088": Lead-Vermittlung
  "089": Erhalten Sie qualifizierte Leads nach Region, Branche, Sprache und Service, und liefern Sie ihnen auf NocoBase gebaute Geschäftssysteme.
  "090": Marke und Co-Marketing
  "091": Offizielles Partner-Badge, Eintrag im Verzeichnis, gemeinsame Marketing-Events und gemeinsame Kundengeschichten.
  "092": Voraussetzungen
  "093": "Kostenlos starten. "
  "094": Mehr Engagement, mehr Unterstützung.
  "095": Vertriebspartner
  "096": Offizieller Partner
  "097": Kostenlos registrieren und den Vertriebsvertrag unterzeichnen
  "098": Professional-Lizenz besitzen und den Partnervertrag unterzeichnen
  "099": Vor allem öffentliche Dokumentation
  "100": Eigenes Schulungs- und Zertifizierungsprogramm
  "101": Provision
  "102": Aktiviert mit Ihrem ersten Lizenzverkauf
  "103": Gestaffelt nach kumuliertem Umsatz, von 15 % bis 40 %, sinkt nie
  "104": Partnerzertifikat
  "105": Eintrag im Verzeichnis
  "106": Community-Support
  "107": Eigener Kanal
  "108": Co-Marketing und Fallstudien
  "109": So werden Sie Partner
  "110": "Vier Schritte "
  "111": zu Ihrem ersten NocoBase-3-Projekt.
  "112": Bewerben
  "113": Erzählen Sie uns von Ihrem Team, Ihrer Region, Ihren Branchen und den gewünschten Partnermodellen.
  "114": Gespräch und Vertrag
  "115": Partnermodell, Zielkunden und Plan für das erste Jahr gemeinsam festlegen, dann unterzeichnen.
  "116": Schulung und Zertifizierung
  "117": Bringen Sie eine echte Anforderung mit und setzen Sie sie in Studio um (entwickelt, abgenommen, veröffentlicht), um Schulung und Zertifizierung abzuschließen.
  "118": Verkaufen und liefern
  "119": Treten Sie dem Partner-Ökosystem bei, erhalten Sie Empfehlungen, verkaufen Sie NocoBase-Lizenzen weiter und liefern Sie für Ihre Kunden.
  "120": FAQ
  "121": Brauchen wir zuerst ein großes Entwicklerteam?
  "122": Sie müssen Ihr Entwicklerteam nicht vergrößern. Berater leiten Anforderungsklärung und Abnahme in Studio. Wir empfehlen mindestens einen Tech Lead, der Umgebungen, Integrationen und Release-Freigaben verantwortet.
  "123": Können wir Partnermodelle kombinieren?
  "124": Ja. Viele Partner verkaufen Lizenzen weiter und übernehmen zugleich Implementierung und jährliche Betreuung, Branchenspezialisten bündeln oft eigene Lösungen.
  "125": Teilen wir Serviceumsatz mit NocoBase?
  "126": Nein. 100 % der Umsätze aus Deployment, Anpassung, Integration, Schulung und Wartung bleiben bei Ihnen, zu Preisen, die Sie festlegen.
  "127": Wie werden Modelle und Agenten-Tools abgerechnet?
  "128": Sie oder Ihr Kunde bezahlen die Anbieter direkt, ohne Aufschlag von NocoBase. Nutzen Sie Claude Code, Codex, OpenCode und jedes Cloud- oder lokale Modell.
  "129": Können wir weiterhin Projekte mit NocoBase 2 liefern?
  "130": Ja. NocoBase 2 wird parallel zu NocoBase 3 gepflegt. Nutzen Sie 2.x für visuell konfigurierte Apps und 3.x für komplexe, mit KI entwickelte Systeme.
  "131": Wem gehören die Branchenlösungen, die wir entwickeln?
  "132": Ihnen. Veröffentlichen Sie sie als Open Source oder lizenzieren Sie sie kommerziell zu Ihren Bedingungen; Katalogeintrag und Co-Marketing stimmen wir gemeinsam ab.
  "133": Werden Sie NocoBase-Partner
  "134": Erzählen Sie uns von Ihrem Team und Ihren Plänen, wir melden uns bald. Oder schreiben Sie an partner@nocobase.com.
