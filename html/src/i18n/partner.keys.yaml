    zh: 支持纯内网部署与本地模型接入，轻松满足政务、金融、制造等行业的严苛合规要求。
    where: sec
  "077":
    en: Proven global adoption
    zh: 成熟的全球社区与口碑
    where: sec
  "078":
    en: With 24.6K GitHub stars, NocoBase powers enterprises, governments, and universities worldwide, now upgrading to the AI era.
    zh: GitHub 24.6K Star，NocoBase 已服务全球众多企业、机构与高校，庞大存量客户正迈向 AI 时代。
    where: sec
  "079":
