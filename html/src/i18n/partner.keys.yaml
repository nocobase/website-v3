    zh: 开启你的第一个项目。
    where: sec
  "112":
    en: Apply
    zh: 提交申请
    where: sec
  "113":
    en: Tell us about your team, region, industries, and the models you want.
    zh: 介绍你的团队、所在地区、擅长的行业和想选的合作方式。
    where: sec
  "114":
    en: Talk &amp; sign
    zh: 沟通与签约
    where: sec
  "115":
    en: Agree on models, target clients, and a first-year plan, then sign.
    zh: 一起确认合作方式、目标客户和首年计划，签署伙伴协议。
    where: sec
  "116":
    en: Train &amp; certify
    zh: 培训与认证
    where: sec
  "117":
    en: Bring a real requirement and ship it in Studio (built, accepted, and released) to complete training and certification.
    zh: 带一个真实需求，在 Studio 里完成开发、验收和上线，完成培训认证。
    where: sec
  "118":
    en: Sell &amp; deliver
    zh: 开始销售与交付
    where: sec
  "119":
    en: Join the partner ecosystem, receive referrals, and resell NocoBase licenses and deliver for clients.
    zh: 加入伙伴生态，接收客户推荐，分销 NocoBase 授权并为客户交付。
    where: sec
  "120":
    en: FAQ
    zh: 常见问题
    where: sec
  "121":
    en: Do we need a large development team first?
    zh: 需要先组建一支开发团队吗？
    where: sec
  "122":
    en: No need to grow your dev team. Consultants lead scoping and acceptance in Studio. We recommend having at least one technical lead to oversee environments, integrations, and release sign-off.
    zh: 不需要扩充开发团队。实施顾问在 Studio 中主导需求与验收；建议至少配备一位技术负责人，把关环境、系统集成与上线发布。
    where: sec
  "123":
    en: Can we combine partnership models?
    zh: 多种合作方式可以同时选吗？
    where: sec
  "124":
    en: Yes. Many partners resell licenses while delivering implementation and annual care, and vertical specialists often package their own industry solutions.
    zh: 可以。许多伙伴既分销商业授权，又提供定制交付与年度维保；深耕垂直行业的伙伴还会将经验沉淀为自有行业方案。
    where: sec
  "125":
    en: Do we share service revenue with NocoBase?
    zh: 服务收入需要和 NocoBase 分成吗？
    where: sec
  "126":
    en: No. 100% of your revenue from deployment, customization, integration, training, and maintenance stays with you at whatever prices you set.
    zh: 不需要。部署、定制、集成、培训和运维收入 100% 归你，定价完全自主。
    where: sec
  "127":
    en: How are models and agent tools billed?
    zh: 模型和 Agent 工具的费用怎么算？
    where: sec
  "128":
    en: You or your client pay the providers directly with zero markup from NocoBase. Use Claude Code, Codex, OpenCode, and any cloud or local model.
    zh: 由你或客户直接向对应服务商采购，NocoBase 不加收任何差价。可自由接入 Claude Code、Codex、OpenCode 及各类云端或本地私有模型。
    where: sec
  "129":
    en: Can we still deliver projects on NocoBase 2?
    zh: 还能继续用 NocoBase 2 为客户交付吗？
    where: sec
  "130":
    en: Yes. NocoBase 2 is maintained alongside NocoBase 3. Use 2.x for UI-configured apps and 3.x for AI-built, complex systems.
    zh: 可以。NocoBase 2 与 NocoBase 3 长期并行维护：适合可视化配置的项目用 2.x，需要 AI 深度开发与复杂逻辑的项目用 3.x。
    where: sec
  "131":
    en: Who owns the industry solutions we build?
    zh: 我们开发的行业方案知识产权归谁？
    where: sec
  "132":
    en: You do. Open-source or license them commercially on your own terms; catalog listing and co-marketing are arranged together.
    zh: 完全归你。你可自行决定开源或商业授权方式；上架官方目录及联合推广事宜在合作中具体沟通约定。
    where: sec
