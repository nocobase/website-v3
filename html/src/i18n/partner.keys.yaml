    zh: 企业级能力开箱即用
    where: sec
  "070":
    en: Auth, permissions, workflows, approvals, and AI employees come standard, so agents only write client-specific logic.
    zh: 认证、权限、工作流、审批、通知与 AI 员工现成可用，Agent 只需专注编写客户特定业务逻辑。
    where: sec
  "071":
