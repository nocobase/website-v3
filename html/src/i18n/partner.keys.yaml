    zh: 培训与认证
    where: sec
  "083":
    en: Bring a real requirement to learn how to direct agents, verify previews, and ship safely in Studio.
    zh: 带着真实需求参加实战培训，掌握在 Studio 中调度 Agent、验收预览与受控发布的完整方法。
    where: sec
  "084":
    en: Sales enablement
    zh: 销售赋能
    where: sec
  "085":
    en: Access pitch decks, case studies, battlecards, and demo environments, plus joint calls on key deals.
    zh: 提供售前物料、客户案例、竞品分析与演示环境；重点项目提供原厂联合支持与演示。
    where: sec
  "086":
    en: Technical support
    zh: 原厂技术支持
    where: sec
  "087":
    en: Dedicated support channels with priority response for higher tiers, plus early access to Core releases and Skills.
    zh: 开通专属支持通道，高等级伙伴享优先响应；提前获取 Core 新版本、更新说明与配套技能包。
    where: sec
