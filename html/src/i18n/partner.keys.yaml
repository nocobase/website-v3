    zh: 官方商机推荐
    where: sec
  "089":
    en: Receive qualified client leads matched by region, industry, language, and service, and deliver NocoBase-built business systems to them.
    zh: 按地区、行业、语言与服务类型精准派发客户线索，为客户交付基于 NocoBase 搭建的业务系统。
    where: sec
