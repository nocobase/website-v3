meta:
  title:
    zh: NocoBase 合作伙伴计划 — 用 Agent 团队交付更多客户项目
    en: NocoBase Partner Program — Deliver More Client Projects with an Agent Team
  description:
    zh: 成为 NocoBase 合作伙伴：渠道分销佣金 15%–40%，服务收入 100% 归你。基于 Core、Studio 与 Solution，实施顾问专注客户需求，开发交给 Agent 团队，同时推进多个客户项目。
    en: "Become a NocoBase partner: 15–40% channel commission and 100% of your service revenue. With Core, Studio, and Solution, your consultants focus on client needs while an agent team builds, so many client projects move at once."
items:
  "000":
    en: Partner Program
    zh: 合作伙伴计划
    where: phero
  "001":
    en: AI reshaped software delivery. <span class="m">Turn it into your business.</span>
    zh: AI 改写了软件交付模式，<span class="m">把它变成你的生意。</span>
    where: phero
  "002":
    en: Project capacity used to be capped by developer headcount. Today, your consultants only need to focus on analyzing client needs, key decisions, and acceptance, while an agent team handles coding, testing, and deployment, so many client projects can move in parallel. NocoBase 3 provides Core as the foundation, Studio, and Solution business apps. Your domain expertise and client relationships are what set you apart.
    zh: 过去，能接多少项目取决于养多少开发人员。现在，你的实施顾问只需专注分析客户需求、方案拍板与交付验收，开发、测试与部署都交给 Agent 团队，多个客户项目可以并行推进。NocoBase 3 提供 Core 底座、Studio 与 Solution 业务应用，你的行业经验与客户关系，就是最核心的竞争力。
    where: phero
