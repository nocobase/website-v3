    where: phero
  "012":
    en: Delivery in the AI Era
    zh: AI 时代的交付
    where: tint
  "013":
    en: "Stop scaling by headcount. "
    zh: 项目规模不再取决于人数，
    where: tint
  "014":
    en: Scale by your domain judgment.
    zh: 而在于你的业务判断力。
    where: tint
  "015":
    en: AI made writing code cheap. What clients pay for now is someone who understands their business, along with a production-grade system that can keep evolving for years. That is the core value partners bring.
    zh: AI 让写代码变得廉价，客户真正愿意付费的，是懂业务的专家，以及一套上线后稳定可靠、未来还能持续演进的系统，这正是伙伴能带来的核心价值。
    where: tint
  "016":
