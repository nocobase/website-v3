    zh: 用 Studio 和 Agent 团队，为客户提供部署、定制、集成与培训服务。
    where: sec
  "051":
    en: Keep 100% of your service revenue, with zero cut to NocoBase
    zh: 服务收入 100% 归你，官方不抽成
    where: sec
  "052":
    en: "Price your way: fixed project, per module, or annual retainer"
    zh: 自主定价：支持按项目、按模块或按年维保收费
    where: sec
  "053":
    en: Move up tiers as you ship projects to get priority lead referrals
    zh: 按成功上线项目数晋升等级，高级别优先获得官方商机推荐
    where: sec
  "054":
    en: Industry Solutions
    zh: 行业方案
    where: sec
  "055":
