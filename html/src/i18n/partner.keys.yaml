  "034":
    en: Agent teams take on upgrades and everyday improvements, turning into recurring annual care
    zh: Agent 团队承接升级与日常改进，轻松转化为年度维保与迭代服务
    where: tint
  "035":
    en: One consultant, four client projects moving in parallel.
    zh: 一位实施顾问，并行推进四个客户项目。
    where: tint
  "036":
    en: In NocoBase Studio, each client gets an isolated project and repo. The consultant only steps in for key calls in My issues (verifying previews, answering business questions, and approving releases), while agents build, test, and prep deployments in the background.
    zh: 在 NocoBase Studio 中，每个客户拥有独立的项目与代码仓库。顾问只需在「我的任务」里处理关键节点：验收预览、解答业务疑问、批准发版；编码、测试与发版准备均由 Agent 团队在后台完成。
    where: tint
  "037":
    en: Client stakeholders can submit feedback and accept features directly in live previews
    zh: 客户业务方可在独立预览环境内直接提反馈、做验收
    where: tint
  "038":
    en: Every change passes automated checks and human sign-off, ensuring quality without burnout
    zh: 每次变更均经自动化测试与人工审批，交付质量不靠加班堆砌
    where: tint
  "039":
    en: Deliver complete source code, Skills, and knowledge bases at handover
    zh: 结项时将源码、技能与知识库完整移交客户
    where: tint
