title: Editionen und Preise — NocoBase 3
description: Core und alle Solution-Apps sind kostenlos und Open Source. Professional kostet einmalig 8.000 USD, mit Studio, 1 Jahr Upgrades und Support sowie einem Deployment. Enterprise auf Anfrage.
