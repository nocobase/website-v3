  "154": FAQ
  "155": Wie wähle ich zwischen Professional und Enterprise?
  "156": Wählen Sie Professional, wenn ein Team mit Studio entwickelt. Enthalten sind ein Deployment durch das NocoBase-Team und eine erste Antwort auf Supportanfragen innerhalb von 12&nbsp;Stunden.
  "157": Wählen Sie Enterprise für mehrere Teams oder wenn Sie Releases über mehrere Umgebungen, Hochverfügbarkeit, Audit-Logs oder Air-Gap-Bereitstellung brauchen. Enthalten sind 3 Tage Deployment, Schulung und Implementierung sowie eine erste Antwort innerhalb von 4&nbsp;Stunden.
  "158": Kann ich Community produktiv einsetzen?
  "159": Ja. Community enthält den gesamten Core sowie NocoCRM, NocoReach und NocoProject, kostenlos für den Produktivbetrieb und Kundenprojekte. Statten Sie Ihren Coding-Agenten mit den Entwicklungs-Skills von NocoBase aus und legen Sie los. Tests, Releases und Betrieb übernimmt Ihr Team.
  "160": Wie lange gilt eine kommerzielle Lizenz?
  "161": Sie läuft nie ab. Kommerzielle Editionen werden einmalig gekauft, ohne Jahresgebühren.
  "162": Was passiert, wenn das erste Jahr mit Upgrades und Support endet?
  "163": Alles läuft weiter. Für neue Versionen und Support können Sie Upgrades und Support separat kaufen, ohne jedes Jahr verlängern zu müssen.
  "164": Werden die kommerziellen Editionen selbst gehostet?
  "165": Ja. Studio, Ihre Agenten und Ihre Apps laufen alle auf Ihren eigenen Servern. Einmal veröffentlicht, laufen Ihre Apps eigenständig, und alltägliche Geschäftsanfragen gehen nie über Studio.
  "166": Kann ich Studio einzeln kaufen?
  "167": Nein. Studio ist in Professional und Enterprise enthalten.
  "168": Müssen Inhaber einer kommerziellen NocoBase-2-Lizenz neu kaufen?
  "169": Solange Ihre kommerzielle NocoBase-2-Lizenz noch im Upgrade-Zeitraum ist, können Sie NocoBase 3 ohne erneuten Kauf nutzen. 2.x und 3.x werden parallel gepflegt.
  "170": Nicht sicher, welche Edition passt?
  "171": Erzählen Sie uns von Ihrem Team und davon, was Sie bauen möchten. Wir helfen Ihnen, es zu durchdenken und das passende Setup zu entwerfen.
