title: Edisi dan harga — NocoBase 3
description: Core dan semua aplikasi Solution gratis dan open source. Professional seharga US$8.000 sekali bayar, dengan Studio, 1 tahun upgrade dan dukungan, serta satu kali deploy. Enterprise sesuai penawaran.
