  "154": FAQ
  "155": Bagaimana memilih antara Professional dan Enterprise?
  "156": Pilih Professional jika satu tim membangun dengan Studio. Termasuk satu kali deploy oleh tim NocoBase dan respons pertama atas permintaan dukungan dalam 12&nbsp;jam.
  "157": Pilih Enterprise untuk banyak tim, atau jika Anda butuh rilis multi-lingkungan, ketersediaan tinggi, log audit, atau pengiriman air-gapped. Termasuk 3 hari deploy, pelatihan, dan implementasi, serta respons pertama dalam 4&nbsp;jam.
  "158": Bisakah Community dipakai di produksi?
  "159": Bisa. Community mencakup seluruh Core serta NocoCRM, NocoReach, dan NocoProject, gratis untuk produksi dan pengerjaan proyek klien. Tambahkan skill pengembangan NocoBase ke agen coding Anda dan mulai membangun. Tim Anda menangani pengujian, rilis, dan operasional.
  "160": Berapa lama lisensi komersial berlaku?
  "161": Tidak pernah kedaluwarsa. Edisi komersial dibeli sekali, tanpa biaya tahunan.
  "162": Apa yang terjadi setelah tahun pertama upgrade dan dukungan berakhir?
  "163": Semuanya tetap berjalan. Untuk rilis baru dan dukungan, Anda bisa membeli upgrade dan dukungan secara terpisah, dan tidak wajib memperpanjang setiap tahun.
  "164": Apakah edisi komersial self-hosted?
  "165": Ya. Studio, agen, dan aplikasi Anda semuanya berjalan di server Anda sendiri. Setelah dirilis, aplikasi berjalan mandiri, dan permintaan bisnis sehari-hari tidak pernah melewati Studio.
  "166": Bisakah Studio dibeli terpisah?
  "167": Tidak. Studio sudah termasuk dalam Professional dan Enterprise.
  "168": Apakah pemegang lisensi komersial NocoBase 2 perlu membeli lagi?
  "169": Selama lisensi komersial NocoBase 2 Anda masih dalam masa upgrade, Anda bisa memakai NocoBase 3 tanpa membeli lagi. Versi 2.x dan 3.x dipelihara secara paralel.
  "170": Belum yakin edisi mana yang cocok?
  "171": Ceritakan tentang tim Anda dan apa yang ingin Anda bangun. Kami bantu menganalisis dan merancang pengaturan yang tepat.
