    where: sec
  "155":
    en: How do I choose between Professional and Enterprise?
    zh: Professional 和 Enterprise 如何选择？
    where: sec
  "156":
    en: Choose Professional if one team builds with Studio. It includes one deployment by the NocoBase team and a first response to support requests within 12&nbsp;hours.
    zh: 一个团队用 Studio 开发，选 Professional：包含一次部署服务，技术支持首次响应不超过 12&nbsp;小时。
    where: sec
  "157":
    en: Choose Enterprise for multiple teams, or if you need multi-environment release, high availability, audit logs, or air-gapped delivery. It includes 3 days of deployment, training, and implementation, and a first response within 4&nbsp;hours.
    zh: 多个团队协作，或需要跨环境发布、集群高可用、审计日志、离线交付，选 Enterprise：包含 3 天部署、培训和实施服务，技术支持首次响应不超过 4&nbsp;小时。
    where: sec
  "158":
    en: Can I use Community in production?
    zh: Community 可以用于生产环境吗？
    where: sec
  "159":
    en: Yes. Community includes all of Core plus NocoCRM, NocoReach, and NocoProject, free for production and client delivery. Add NocoBase’s development skills to your coding agent and start building. Your team handles testing, releases, and operations.
    zh: 可以。Community 包含完整的 Core 和 NocoCRM、NocoReach、NocoProject，可以用于生产和商业交付。你的 Coding Agent 装上 NocoBase 的开发技能就能开发，测试、发布和运维由团队自己负责。
    where: sec
    unused: true
  "160":
    en: How long does a commercial license last?
    zh: 商业版授权的有效期是多久？
    where: sec
  "161":
    en: It never expires. Commercial editions are a one-time purchase with no annual fees.
    zh: 永久有效。商业版一次付费，没有年费，已购版本可以一直使用。
    where: sec
  "162":
    en: What happens when the first year of upgrades and support ends?
    zh: 1 年升级与技术支持到期后怎么办？
    where: sec
  "163":
    en: Everything keeps running. For new releases and support, you can buy upgrades and support separately, and you don’t have to renew every year.
    zh: 系统照常运行。想继续获得新版本和技术支持，可以单独购买升级和支持服务，且无需连续购买。
    where: sec
  "164":
