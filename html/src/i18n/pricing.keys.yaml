meta:
  title:
    zh: 版本与价格 — NocoBase 3
    en: Editions &amp; Pricing — NocoBase 3
  description:
    zh: Core 和所有 Solution 应用开源免费。Professional 5 万元一次买断，含 Studio、1 年升级与技术支持和一次部署服务；Enterprise 按需报价。
    en: Core and every Solution app are free and open source. Professional is $8,000 one-time, with Studio, 1 year of upgrades and support, and one deployment. Enterprise is quoted to your needs.
