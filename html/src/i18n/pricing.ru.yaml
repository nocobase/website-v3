  "154": Частые вопросы
  "155": Как выбрать между Professional и Enterprise?
  "156": Выбирайте Professional, если со Studio работает одна команда. В редакцию входят одно развёртывание силами команды NocoBase и первый ответ на запросы в поддержку в течение 12&nbsp;часов.
  "157": Выбирайте Enterprise, если команд несколько или нужны релизы по нескольким средам, высокая доступность, журналы аудита или поставка для изолированных сетей. В редакцию входят 3 дня развёртывания, обучения и внедрения и первый ответ в течение 4&nbsp;часов.
  "158": Можно ли использовать Community в продакшене?
  "159": Да. Community включает весь Core, а также NocoCRM, NocoReach и NocoProject — бесплатно для продакшена и коммерческих проектов. Подключите к своему кодинг-агенту навыки разработки NocoBase и начинайте. Тестирование, релизы и эксплуатацию ваша команда берёт на себя.
  "160": Сколько действует коммерческая лицензия?
  "161": Бессрочно. Коммерческие редакции покупаются один раз, без ежегодных платежей.
  "162": Что будет, когда закончится первый год обновлений и поддержки?
  "163": Всё продолжает работать. Чтобы получать новые версии и поддержку, можно отдельно купить обновления и поддержку, продлевать каждый год не обязательно.
  "164": Коммерческие редакции размещаются на своих серверах?
  "165": Да. Studio, агенты и приложения работают на ваших серверах. После выпуска приложения работают самостоятельно, и повседневные бизнес-запросы никогда не проходят через Studio.
  "166": Можно ли купить Studio отдельно?
  "167": Нет. Studio входит в Professional и Enterprise.
  "168": Нужно ли владельцам коммерческой лицензии NocoBase 2 покупать заново?
  "169": Пока ваша коммерческая лицензия NocoBase 2 действует в период обновлений, вы можете пользоваться NocoBase 3 без повторной покупки. Версии 2.x и 3.x поддерживаются параллельно.
  "170": Не знаете, какую редакцию выбрать?
  "171": Расскажите о команде и о том, что хотите создать. Мы поможем всё продумать и подобрать подходящую конфигурацию.
  "173": Начать бесплатно
  "174": Расширенные согласования и корпоративный SSO
  "175": Все приложения Solution — NocoCRM, NocoITAM, NocoReach и другие — с их бизнес-агентами
  "176": Да. Community включает весь Core и все приложения Solution — бесплатно для продакшена и коммерческих проектов. Подключите к своему кодинг-агенту навыки разработки NocoBase и начинайте. Тестирование, релизы и эксплуатацию ваша команда берёт на себя.
