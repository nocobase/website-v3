notes: |-
  Русский（вы）
  术语：foundation = фундамент；building blocks = базовые модули；governance = контроль / управляемая разработка；
  agent team = команда агентов；coding agent = кодинг-агент；business logic = бизнес-логика；business systems = бизнес-системы；
  AI = ИИ；vibe coding = вайб-кодинг；open source = с открытым кодом；at a glance = как на ладони
  页面用语：版本名 Community、Professional、Enterprise 不译；价格用美元（8 000 $，不换行空格）；信创数据库只在中文版列出
title: Редакции и цены — NocoBase 3
description: Core и все приложения Solution бесплатны и с открытым кодом. Professional стоит 8 000 $ единоразово и включает Studio, 1 год обновлений и поддержки и одно развёртывание. Enterprise — по индивидуальному запросу.
