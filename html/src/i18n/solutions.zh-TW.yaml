notes: |-
  繁體中文（台灣用語，從簡體中文原文改寫，不從英文翻譯）
  用語：构建 = 打造；底座 = 基礎平台（標語用「地基已經打好」）；审批 = 簽核；私有部署 = 地端部署；项目 = 專案；
  代码 = 程式碼；数据 = 資料；文件 = 檔案；服务器 = 伺服器；视频 = 影片；默认 = 預設；支持 = 支援；Agent、Vibe Coding 不譯
  頁面用語（產品介面上的名稱，用簡體中文介面的說法、只轉繁體字）：业务指导 = 業務指導；技能 = 技能；线索 = 線索；商机 = 商機
title: NocoBase Solution — 開源業務應用，AI 驅動，開箱即用
description: NocoBase Solution 是由 Agent 驅動、以 Core 打造的一系列企業業務應用，Agent 做大部分執行工作，人只做關鍵決策。
strings:
  "000": 開源業務應用，<span class="m">AI 驅動，開箱即用。</span>
  "003": 部署在企業自己的伺服器上
  "004": 模型自由選擇
  "005": 銷售管理 · Beta
  "007": 了解 NocoCRM
  "008": IT 資產清冊與管理 · Beta
  "010": 了解 NocoITAM
  "011": 內容與成長 · Alpha
  "013": 了解 NocoReach
  "014": 客戶服務 · 即將推出
  "016": 專案協作 · 即將推出
  "018": 人資管理 · 即將推出
  "020": 業務 Agent
  "021": Agent <span class="m">主動工作。</span>
  "022": 傳統業務軟體靠人來記錄、流轉和操作。在 Solution 裡，每個應用都內建多個業務 Agent，會依照規則主動承擔大部分執行工作，例如核對退款、處理工單。
  "023": 每個 Agent 負責什麼、什麼時候工作、用什麼方法做，都寫得清清楚楚。
  "024": "事情發生就開始工作： "
  "025": 新線索進來、客戶來信、任務完成時，對應的 Agent 自動開始工作，也可以按時間定期執行。
  "026": "依照你的規則做事： "
  "027": 業務指導寫明企業的背景與準則，技能寫明做事的方法；修改之後，Agent 下次執行就照新的做。
  "028": "做了什麼都有紀錄： "
  "029": 每個 Agent 執行了多少次、哪些被採納、哪些被忽略，都記錄在案。
  "030": 人與 Agent 的分工
  "031": 人負責<span class="m">關鍵決策。</span>
  "033": 應用
  "034": 業務 Agent 負責
  "035": 人來拍板
  "036": 整理客戶與溝通紀錄、研究線索與公司、建議商機下一步、預審報價
  "037": 折扣、報價與合約承諾
  "038": 核對資產清冊與 MDM、準備到職和離職的配置方案、初審採購與報廢申請
  "039": 採購、報廢與重要資產異動
  "040": 每天分析資料、找出成長機會並附上依據，在儲存庫裡改好程式碼並提出 PR
  "041": 採納哪些機會、品牌把關與上線
  "043": 工單分類分派、檢索知識庫、起草回覆
  "044": 退款、客訴升級與特例處理
  "045": 執行研究與文件任務、追蹤進度、彙整風險
  "046": 目標、優先順序與成果驗收
  "047": 準備到職事項、整理員工資料、解答規章制度問題
  "048": 錄用、敘薪與人事特例
  "049": 附上依據
  "050": Agent 交出的每項結果都寫明依據：來自哪封郵件、哪筆紀錄、哪份資料。
  "051": 關鍵決策由人做
  "052": 折扣、採購、退款這類決定，Agent 只準備好方案和理由，由負責人拍板。
  "053": 繼承負責人的權限
  "054": Agent 能看到、能修改的資料，與它所服務的負責人一致，不會越權。
  "055": 客製
  "056": 方便<span class="m">客製開發。</span>
  "058": 部署即用
  "059": 每款應用都能獨立部署。寫好業務指導、接上模型，業務 Agent 就開始工作。
  "060": 修改技能、規則與程式碼
  "061": 做法變了，改技能；流程和欄位變了，讓 Coding Agent 改原始碼。
  "062": 依需要合併官方更新
  "063": 客製後的原始碼歸企業所有，需要的官方更新，驗證後再合併到自己的儲存庫。
  "064": Solution 建立在 NocoBase Core 之上
  "065": 團隊與 Agent 一起客製：NocoBase Studio
  "066": 開源與地端部署
  "067": 開源免費，<span class="m">開箱即用。</span>
  "074": 開始使用
  "079": 瀏覽應用
  "082": 了解 Core
  "086": 了解 Studio
  "087": NocoCRM 等應用開源免費
  "088": 銷售管理 · 開源 · Beta
  "089": IT 資產管理 · 專業版 · Beta
  "090": 內容與成長 · 開源 · Alpha
  "091": 客戶服務 · 專業版 · 即將推出
  "092": 專案協作 · 開源 · 即將推出
  "093": 人資管理 · 專業版 · 即將推出
  "094": 開源起步，<span class="m">開箱即用。</span>
  "098": 內容與成長 · Beta
  "100": 每天分析資料、找出值得做的事並附上依據，修改頁面、撰寫文章、草擬社群回覆
