notes: |-
  한국어（제목은 명사형·해라체, 본문은 합니다체）
  용어：foundation = 기반；building blocks = 기본 기능；governance = 거버넌스；agent team = 에이전트 팀；
  coding agent = 코딩 에이전트；business logic = 비즈니스 로직；business systems = 비즈니스 시스템；
  vibe coding = 바이브 코딩；self-hosted = 셀프 호스팅；at a glance = 한눈에
  페이지 용어：issue = 작업；coordinator agent = 코디네이터 에이전트；sign-off = 검수；My sessions 등 제품 화면 이름은 영어 그대로
title: NocoBase Studio — 에이전트는 스스로 추진하고, 팀은 전체를 장악한다
description: NocoBase Studio는 사람과 에이전트가 함께 개발하는 거버넌스 플랫폼입니다. Claude Code, Codex, OpenCode를 하나의 에이전트 팀으로 묶어 작업을 스스로 진행하고, 진행 상황은 한눈에 보이며, 중요한 결정은 사람이 내립니다.
strings:
  "000": 에이전트는 스스로 추진하고, <span class="m">팀은 전체를 장악한다.</span>
  "002": 온라인 체험
  "004": 기업의 자체 서버에 배포
  "005": Claude Code, Codex 등 수십 가지 코딩 도구 지원
  "006": 상용 에디션에서 제공
  "007": 에이전트 팀
  "008": 쉬지 않고 일을 진행하는 <span class="m">에이전트 팀.</span>
  "009": Studio는 여러 머신의 에이전트를 연결해 중앙에서 배정하고, 24시간 여러 프로젝트와 수많은 작업을 동시에 진행합니다.
  "010": 여러 머신의 에이전트 연결
  "011": 개인 컴퓨터와 팀 서버의 Claude Code, Codex 등을 연결하면 Studio가 로그인된 코딩 도구와 모델을 자동으로 인식합니다. 에이전트마다 잘하는 일을 적고 활성화하면 에이전트 팀에 합류합니다.
  "012": 코디네이터가 업무 배정
  "013": 코디네이터 에이전트가 에이전트별 강점에 따라 설계, 개발, 테스트, 리뷰를 배정합니다. 직접 코드를 작성하거나 병합하지 않으며, 검수는 항상 사람이 합니다.
  "014": 여러 작업을 동시에
  "015": 작업마다 자체 브랜치에서 개발하고, 실행할 때마다 독립된 worktree를 사용하므로 여러 작업이 서로 간섭 없이 동시에 진행됩니다. 머신이 많을수록 동시에 진행할 수 있는 작업도 늘어납니다.
  "016": My sessions
  "017": Studio에서 내 컴퓨터의 에이전트와 대화하며 요구사항을 논의하고 구체화하고, 작업을 기록하고, 진행 상황을 확인합니다. 작업이 시작되면 코디네이터 에이전트가 에이전트 팀에 개발을 맡깁니다.
  "018": 진행 상황
  "019": 모든 진행 상황을 <span class="m">한눈에.</span>
  "020": 프로젝트 진행 상황, 작업 진행 과정, 에이전트 작업량, 모델 사용량이 모두 선명하게 보입니다. 작업마다 어디까지 왔고 다음에 무엇을 할지 한눈에 알 수 있습니다.
  "021": 프로젝트 진행 상황
  "022": 프로젝트별 진행률과 함께 완료한 작업, 사이클 타임, 에이전트 완료 비율, 작업당 비용을 이전 기간과 비교합니다.
  "023": 작업 진행 과정
  "024": 각 작업의 맨 위에 지금 어느 단계인지, 어떤 에이전트가 맡고 있는지, 다음에 무엇을 할지 표시됩니다.
  "025": 에이전트 작업량과 모델 사용량
  "026": 머신별 에이전트가 어떤 작업을 진행 중인지, 모델별로 토큰을 얼마나 쓰고 비용이 얼마인지 언제든 확인할 수 있습니다.
  "027": 의사 결정
  "028": 근거를 보고 <span class="m">결정한다.</span>
  "030": 보고서와 체크리스트
  "031": 넘겨줄 때마다 무엇을 바꿨고 어떻게 검증했는지 적고, 항목별 검수 체크리스트를 첨부합니다.
  "032": 스크린샷과 미리보기
  "033": 시나리오마다 스크린샷을 첨부하고, 직접 해 보고 싶을 때는 독립된 미리보기 환경을 열 수 있습니다.
  "034": 통과 또는 반려
  "035": 근거를 보고 통과하거나 반려합니다. 반려할 때 이유를 적으면 에이전트가 이어서 수정합니다.
  "036": 업무 전문가
  "037": 코드를 모르는 업무 전문가도 바로 결정할 수 있다.
  "038": 업무 전문가는 업무 언어로 요구사항을 전달하고, 에이전트의 질문에 답하고, 실제 데이터로 미리보기에서 검수합니다. 환경, 브랜치, 테스트, 배포는 에이전트와 Studio가 맡습니다.
  "039": 기술 책임자는 규칙을 정하고 배포를 승인하며, 업무 전문가는 요구사항을 정하고 검수를 맡습니다.
  "040": 사람에게 넘어가기 전에 Studio가 검사와 리뷰를 진행한다.
  "041": 모든 변경은 같은 절차를 거칩니다. 테스트와 코드 리뷰를 통과해야 사람에게 검수가 넘어가고, 사람이 승인해야 프로덕션에 배포되며, 문제가 생기면 롤백할 수 있습니다.
  "042": 브랜치와 worktree
  "043": 작업마다 자체 브랜치가 있고, 실행할 때마다 독립된 worktree에서 진행합니다. 해당 브랜치의 PR은 작업에 자동으로 연결됩니다.
  "044": 테스트와 리뷰
  "045": CI가 검사와 테스트를 실행한 뒤, 다른 모델이 코드를 리뷰합니다. 가능하면 다른 업체의 모델을 씁니다.
  "046": 미리보기
  "047": 필요하면 PR마다 독립된 미리보기 환경을 띄워 사람이 써 보고 검수합니다.
  "048": 병합과 배포
  "049": 검수를 통과하면 병합되고, 작업의 PR이 모두 병합되면 작업이 자동으로 완료됩니다. 프로덕션 배포는 사람이 승인합니다.
  "050": 롤백
  "051": 문제가 생기면 이전 버전으로 되돌립니다.
  "053": 방법, 경험, 지식이 <span class="m">팀에 쌓인다.</span>
  "054": 요구사항 배경, 업무 자료, 프로젝트 경험이 여러 컴퓨터의 여러 대화에 흩어져 있어, 사람이나 에이전트가 바뀌면 찾기 어렵습니다. Studio는 스킬, 지식 베이스, 프로젝트 메모리에 방법과 경험을 쌓아, 사람이나 에이전트가 바뀌어도 막힘없이 인수인계할 수 있습니다.
  "055": 스킬
  "056": 스킬에는 일하는 방법을 담습니다. 요구사항 구체화, 개발, 리뷰, 배포 방식을 스킬로 작성해 전역, 프로젝트, 작업 디렉터리의 세 단계로 관리하고, 매 실행에 자동으로 적용합니다.
  "057": 지식 베이스
  "058": 지식 베이스에는 업무 자료를 담습니다. 요구사항 문서, 업무 규칙, 계약서 템플릿 등을 사람이 작성하거나 업로드하고, 에이전트는 일하면서 바로 참고합니다.
  "059": 프로젝트 메모리
  "060": 프로젝트 메모리에는 에이전트가 스스로 익힌 경험을 담습니다. 프로젝트 저장소에 보관되고, 작업의 PR과 함께 리뷰·병합되며, 다음 작업을 시작하기 전에 먼저 읽습니다.
  "061": 오픈소스와 셀프 호스팅
  "062": 셀프 호스팅. <span class="m">코드와 데이터는 기업의 소유.</span>
  "070": 에이전트가 작성하는 코드는 NocoBase Core 위에 구축
  "072": NocoBase Studio 온라인 체험
  "073": 새 탭에서 전체 화면으로 열기
  "074": 데모 계정으로 로그인되어 있습니다. 모든 데이터는 가상이니 마음껏 사용해 보세요.
