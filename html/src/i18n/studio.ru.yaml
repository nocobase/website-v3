title: NocoBase Studio — Агенты сами двигают работу вперёд. Команда держит всё под контролем.
description: NocoBase Studio — платформа управляемой разработки для совместной работы людей и агентов.
strings:
  "000": Агенты сами двигают работу вперёд. <span class="m">Команда держит всё под контролем.</span>
  "002": Попробовать онлайн
  "004": Работает на ваших серверах
  "005": Работает с Claude Code, Codex и десятками других инструментов разработки
  "006": Входит в коммерческие редакции
  "007": Команда агентов
  "008": Команда агентов, <span class="m">которая двигает работу вперёд.</span>
  "009": Studio подключает агентов на множестве машин и централизованно распределяет между ними работу. Они круглосуточно и параллельно двигают вперёд множество проектов и задач.
  "010": Агенты на многих машинах
  "011": Подключите Claude Code, Codex и других агентов на компьютерах и серверах команды — Studio сам найдёт инструменты разработки и модели, в которые выполнен вход. Опишите, в чём силён каждый агент, включите его, и он войдёт в команду агентов.
  "012": Координатор распределяет работу
  "013": Агент-координатор распределяет проектирование, разработку, тестирование и ревью с учётом сильных сторон каждого агента. Сам он не пишет и не сливает код; работу всегда принимает человек.
  "014": Много задач одновременно
  "015": У каждой задачи своя ветка, а каждый запуск работает в отдельном worktree, поэтому много задач продвигаются одновременно и не мешают друг другу. Больше машин — больше параллельной работы.
  "016": My sessions
  "017": "В Studio общайтесь с агентом на своём компьютере: обсуждайте и уточняйте требования, заводите задачи и следите за ходом работы. Когда задача запускается, агент-координатор подключает к ней команду агентов."
  "018": Прогресс
  "019": Весь прогресс <span class="m">как на ладони.</span>
  "020": Ход проектов, движение задач, загрузка агентов и расход моделей — всё на виду. Сразу понятно, на каком этапе каждая задача и что будет дальше.
  "021": Ход проектов
  "022": Ход каждого проекта, а также выполненные задачи, время цикла, доля работы агентов и стоимость задачи — в сравнении с прошлым периодом.
  "023": Ход задачи
  "024": Вверху каждой задачи видно, на каком она шаге, какой агент над ней работает и что будет дальше.
  "025": Загрузка агентов и расход моделей
  "026": Видно, какими задачами заняты агенты на каждой машине, сколько токенов израсходовала каждая модель и во что это обошлось.
  "027": Решения
  "028": Решения, <span class="m">подкреплённые фактами.</span>
  "030": Отчёт и чек-лист
  "031": К каждой сдаче работы прилагаются описание изменений, способ их проверки и чек-лист приёмки по пунктам.
  "032": Скриншоты и превью
  "033": Каждый сценарий сопровождается скриншотами, а если хотите проверить сами, наготове отдельная среда предпросмотра.
  "034": Принять или вернуть
  "035": Посмотрев материалы, примите работу или верните её. Укажите причину, и агенты продолжат с этого места.
  "036": Бизнес-эксперты
  "037": Решение могут принимать и бизнес-эксперты, которые не пишут код.
  "038": Бизнес-эксперты описывают задачу своими словами, отвечают на вопросы агентов и проверяют результат в превью на реальных данных. Средами, ветками, тестами и релизами занимаются агенты и Studio.
  "039": Техлиды задают правила и одобряют релизы. Бизнес-эксперты отвечают за требования и приёмку.
  "040": Прежде чем работа попадёт к человеку, Studio организует проверки и ревью.
  "041": "Каждое изменение проходит один и тот же путь: к человеку оно попадает только после тестов и код-ревью, а в продакшен — только после одобрения человеком. Если что-то пошло не так, изменение откатывается."
  "042": Ветка и worktree
  "043": У каждой задачи своя ветка, а каждый запуск работает в отдельном worktree. Pull request из этой ветки автоматически привязывается к задаче.
  "044": Тесты и ревью
  "045": CI запускает проверки и тесты, затем код ревьюит другая модель — по возможности от другого вендора.
  "046": Превью
  "047": При необходимости для pull request поднимается отдельная среда предпросмотра, где человек проверяет и принимает работу.
  "048": Слияние и релиз
  "049": Слияние — после приёмки; задача закрывается, когда слиты все её pull request. Релиз в продакшен требует одобрения человека.
  "050": Откат
  "051": Если что-то сломалось, вернитесь к предыдущему релизу.
  "053": Опыт и знания <span class="m">остаются в команде.</span>
  "054": Контекст требований, бизнес-документы и опыт проекта разбросаны по чатам на разных компьютерах. Когда меняются люди или агенты, их трудно найти. Studio сохраняет методы и опыт в навыках, базе знаний и памяти проекта, поэтому новый человек или агент продолжает с того места, где остановился предыдущий.
  "055": Навыки
  "056": Навыки хранят способы работы. Опишите, как вы уточняете требования, разрабатываете, проводите ревью и выпускаете релизы, на глобальном уровне, уровне проекта или рабочего каталога, и каждый запуск будет их учитывать.
  "057": База знаний
  "058": База знаний хранит бизнес-документы. Требования, бизнес-правила, шаблоны договоров и другие материалы пишут или загружают люди, а агенты обращаются к ним в работе.
  "059": Память проекта
  "060": Память проекта хранит то, чему агенты научились сами. Она лежит в репозитории проекта, проходит ревью и сливается вместе с pull request каждой задачи и читается перед началом следующей.
  "061": Открытый код и свои серверы
  "062": На ваших серверах. <span class="m">Код и данные принадлежат вам.</span>
  "070": Код, который пишут агенты, строится на NocoBase Core
  "072": Попробуйте NocoBase Studio онлайн
  "073": Открыть целиком в новой вкладке
